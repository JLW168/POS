    // ========================================================================
    const BankAutoSumModal = ({ show, onClose, currentShift, shop }) => {
        const [payments, setPayments] = useState([]);
        const [loading, setLoading] = useState(true);
        const isBypassDb = window.SolarisKHQREngine
            ? window.SolarisKHQREngine.shouldBypassFirebaseDb(shop?.id || '', shop?.khqrConfig?.paywayChatId || '')
            : true;

        useEffect(() => {
            if (!show || !currentShift) return;
            setLoading(true);

            // Strictly fetch transactions received AFTER the exact moment the shift was opened
            const shiftStartMs = currentShift.startTime?.toMillis
                ? currentShift.startTime.toMillis()
                : (safeToDate(currentShift.startTime || currentShift.createdAt)?.getTime() || Date.now());

            const targetChatId = (shop?.khqrConfig?.paywayChatId || '').trim();
            const normTargetIds = targetChatId
                ? targetChatId.split(/[\s,|;]+/).map(id => window.SolarisKHQREngine.normalizeChatId(id)).filter(Boolean)
                : [];

            const collectLocalAndRenderShiftPayments = () => {
                if (!window.SolarisPayWayVerifier) return [];
                window.SolarisPayWayVerifier.loadLocalAbaCache?.();

                // Build VLOOKUP maps of Trx IDs & APVs from Local Sales Ledger for 0ms Claimed status
                const localClaimedTrxMap = new Map();
                const localClaimedApvMap = new Map();
                if (window.SolarisLocalSalesStore) {
                    window.SolarisLocalSalesStore.getSales().forEach(s => {
                        if (!s || s.status === 'void') return;
                        if (s.abaTrxId) localClaimedTrxMap.set(String(s.abaTrxId).trim(), s);
                        if (s.abaApv) localClaimedApvMap.set(String(s.abaApv).trim().toUpperCase(), s);
                    });
                }

                const list = [];
                window.SolarisPayWayVerifier.inMemoryAbaPayments.forEach((entry, trxId) => {
                    if (!entry || !entry.parsedAba) return;
                    const recMs = Number(entry.date || entry.parsedAba.receivedAt || entry.parsedAba.paidTimestamp || 0);
                    if (recMs < shiftStartMs) return;
                    const msgChatNorm = window.SolarisKHQREngine.normalizeChatId(entry.chatId || entry.parsedAba.chatId || '');
                    if (normTargetIds.length > 0 && (!msgChatNorm || !normTargetIds.includes(msgChatNorm))) return;
                    const cleanTrx = String(trxId || entry.parsedAba.trxId || '').trim();
                    const cleanApv = String(entry.parsedAba.apv || '').trim().toUpperCase();
                    const matchedSale = localClaimedTrxMap.get(cleanTrx) || (cleanApv ? localClaimedApvMap.get(cleanApv) : null);

                    list.push({
                        id: trxId,
                        trxId,
                        ...entry.parsedAba,
                        receivedAt: recMs,
                        claimedByOrderId: entry.claimedByOrderId || matchedSale?.id || null,
                        claimedByInvoiceNo: entry.claimedByInvoiceNo || matchedSale?.receiptNo || null
                    });
                });
                return list.sort((a, b) => (Number(b.receivedAt) || 0) - (Number(a.receivedAt) || 0));
            };

            // Immediate hydration from Local Cache + Render SSE memory
            setPayments(collectLocalAndRenderShiftPayments());

            if (window.SolarisRenderBridge) {
                window.SolarisRenderBridge.ensureConnected();
                window.SolarisRenderBridge.pollRecentFromRender(true).then(() => {
                    setPayments(collectLocalAndRenderShiftPayments());
                    setLoading(false);
                }).catch(() => setLoading(false));
            } else {
                setLoading(false);
            }

            const unsubVerifier = window.SolarisPayWayVerifier
                ? window.SolarisPayWayVerifier.subscribe(() => {
                    setPayments(collectLocalAndRenderShiftPayments());
                })
                : () => {};

            // SMART BYPASS GUARD: When Bypass Firebase DB is ON (Default), skip Firestore `aba_payments` listener
            if (isBypassDb) {
                return () => {
                    if (typeof unsubVerifier === 'function') unsubVerifier();
                };
            }

            const unsubFirestore = db.collection('aba_payments')
                .where('receivedAt', '>=', shiftStartMs)
                .orderBy('receivedAt', 'desc')
                .onSnapshot(snap => {
                    let data = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    if (normTargetIds.length > 0) {
                        data = data.filter(d => normTargetIds.includes(window.SolarisKHQREngine.normalizeChatId(d.chatId)));
                    }
                    const mergedMap = new Map();
                    collectLocalAndRenderShiftPayments().forEach(p => mergedMap.set(String(p.id), p));
                    data.forEach(p => mergedMap.set(String(p.id), { ...(mergedMap.get(String(p.id)) || {}), ...p }));
                    setPayments(Array.from(mergedMap.values()).sort((a, b) => (Number(b.receivedAt) || 0) - (Number(a.receivedAt) || 0)));
                    setLoading(false);
                }, () => setLoading(false));

            return () => {
                if (typeof unsubVerifier === 'function') unsubVerifier();
                if (typeof unsubFirestore === 'function') unsubFirestore();
            };
        }, [show, currentShift, shop, isBypassDb]);

        if (!show || !currentShift) return null;

        const totalKHR = payments.filter(p => p.currency === 'KHR').reduce((sum, p) => sum + Number(p.amount || 0), 0);
        const totalUSD = payments.filter(p => p.currency === 'USD').reduce((sum, p) => sum + Number(p.amount || 0), 0);
        const verifiedCount = payments.filter(p => p.claimedByOrderId).length;

        return (
            <Modal show={show} onClose={onClose} maxWidth="max-w-3xl">
                <ModalHeader title="Bank AutoSum (Live Shift Feed)" onClose={onClose} />
                <ModalBody>
                    <div className="space-y-4">
                        <div className="bg-slate-900 p-4 rounded-xl border border-slate-700 flex flex-col sm:flex-row justify-between sm:items-center gap-3 shadow-inner">
                            <div>
                                <p className="text-xs font-bold uppercase tracking-wider text-slate-400">Shift Started</p>
                                <p className="text-sm text-slate-200 font-mono mt-1">
                                    {currentShift.startTime ? safeFormatDateTime(currentShift.startTime, 'Unknown') : 'Unknown'}
                                </p>
                            </div>
                            <div className="text-left sm:text-right">
                                <p className="text-xs font-bold uppercase tracking-wider text-slate-400">POS Verification Status</p>
                                <p className="text-sm text-slate-200 font-mono mt-1">
                                    <span className="text-emerald-400 font-bold">{verifiedCount} Claimed</span> / {payments.length} Total Detected
                                </p>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-4">
                            <div className="bg-slate-900/60 p-4 rounded-xl border border-slate-700 text-center shadow-sm">
                                <span className="text-xs text-slate-400 uppercase font-bold block mb-1">Total KHR (Shift)</span>
                                <span className="text-xl sm:text-2xl font-black text-emerald-400 block">៛{khrFormatter.format(totalKHR)}</span>
                            </div>
                            <div className="bg-slate-900/60 p-4 rounded-xl border border-slate-700 text-center shadow-sm">
                                <span className="text-xs text-slate-400 uppercase font-bold block mb-1">Total USD (Shift)</span>
                                <span className="text-xl sm:text-2xl font-black text-blue-400 block">{usdFormatter.format(totalUSD)}</span>
                            </div>
                        </div>

                        <div className="overflow-x-auto mt-4 border border-slate-700 rounded-lg">
                            <table className="min-w-full divide-y divide-slate-700">
                                <thead className="bg-slate-900/80">
                                    <tr>
                                        <th className="px-4 py-3 text-left text-xs font-semibold text-slate-400 uppercase">Time</th>
                                        <th className="px-4 py-3 text-left text-xs font-semibold text-slate-400 uppercase">Payer (ABA)</th>
                                        <th className="px-4 py-3 text-right text-xs font-semibold text-slate-400 uppercase">Amount</th>
                                        <th className="px-4 py-3 text-left text-xs font-semibold text-slate-400 uppercase">APV / Ref</th>
                                        <th className="px-4 py-3 text-center text-xs font-semibold text-slate-400 uppercase">Status</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-700 bg-slate-800/30">
                                    {loading ? (
                                        <tr><td colSpan="5" className="p-8 text-center"><div className="loader mx-auto"></div></td></tr>
                                    ) : payments.length === 0 ? (
                                        <tr>
                                            <td colSpan="5" className="p-8 text-center text-slate-400">
                                                <i className="fas fa-university text-3xl mb-2 opacity-50 block"></i>
                                                No Telegram bank payments detected during this shift yet.
                                            </td>
                                        </tr>
                                    ) : (
                                        payments.map(p => (
                                            <tr key={p.id} className="hover:bg-slate-700/50 transition-colors">
                                                <td className="px-4 py-3 text-xs sm:text-sm text-slate-300 font-mono whitespace-nowrap">
                                                    {safeFormatDateTime(p.receivedAt)}
                                                </td>
                                                <td className="px-4 py-3 text-xs sm:text-sm text-slate-200">
                                                    <span className="font-semibold">{p.payerName}</span> <span className="text-[11px] text-slate-400">({p.maskedAccount})</span>
                                                </td>
                                                <td className="px-4 py-3 text-xs sm:text-sm text-right font-bold text-emerald-400 whitespace-nowrap">
                                                    {p.currency === 'KHR' ? '៛' : '$'}{p.currency === 'KHR' ? khrFormatter.format(p.amount) : Number(p.amount).toFixed(2)}
                                                </td>
                                                <td className="px-4 py-3 text-xs sm:text-sm text-sky-400 font-mono">
                                                    {p.apv || p.trxId}
                                                </td>
                                                <td className="px-4 py-3 text-sm text-center">
                                                    {p.claimedByOrderId ? (
                                                        <span className="px-2.5 py-1 rounded bg-emerald-500/20 text-emerald-400 text-[10px] font-black uppercase border border-emerald-500/30">Claimed</span>
                                                    ) : (
                                                        <span className="px-2.5 py-1 rounded bg-amber-500/20 text-amber-400 text-[10px] font-black uppercase border border-amber-500/30">Unclaimed</span>
                                                    )}
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </ModalBody>
                <ModalFooter>
                    <button type="button" onClick={onClose} className="bg-slate-600 text-white font-bold py-2.5 px-6 rounded-xl hover:bg-slate-500 w-full sm:w-auto shadow-sm transition text-sm">
                        Close AutoSum
                    </button>
                </ModalFooter>
            </Modal>
        );
    };

    const ReceiptModal = ({ saleData, onClose }) => {
        const { shops, systemConfig } = useData();
        const receiptRef = useRef(null);
        const shopObj = useMemo(() => shops.find(s => s.id === saleData?.shopId), [shops, saleData?.shopId]);
        const tpl = useMemo(() => ({
            headerName: shopObj?.brandingName || saleData?.shopName || systemConfig?.appName || 'POS TERMINAL',
            shopAddress: shopObj?.location || '',
            footerText: systemConfig?.receiptTemplate?.footerText || 'Thank you for your visit!'

                const w = window.open('', '', 'width=380,height=640');
                w.document.write(`<html><body style="margin:0;display:flex;justify-content:center;"><img src="${canvas.toDataURL('image/png')}" style="width:100%;max-width:320px;" /></body></html>`);
                w.document.close();
                setTimeout(() => { w.print(); w.close(); }, 350);

                <ModalBody>
                    <div ref={receiptRef} className="bg-white text-black p-5 rounded-xl font-mono text-xs space-y-2.5">
                        <div className="text-center border-b border-dashed border-gray-400 pb-2">
                            <div className="text-lg font-black uppercase">{tpl.headerName}</div>
                            {tpl.shopAddress && <div className="text-[10px] text-gray-600">{tpl.shopAddress}</div>}

                                <div key={idx} className="flex justify-between gap-2">
                                    <span>{item.quantity}x {item.name}</span>
                                    <span className="font-bold whitespace-nowrap">{khrFormatter.format((Number(item.price) || 0) * (Number(item.quantity) || 1))} ៛</span>
                                </div>
                            ))}
                        </div>
                        <div className="space-y-1">
                            {Number(saleData?.discount) > 0 && (
                                <div className="flex justify-between text-rose-600 font-bold">
                                    <span>Discount</span>
                                    <span>-{khrFormatter.format(saleData.discount)} ៛</span>

                            )}
                            <div className="flex justify-between text-sm font-black">
                                <span>TOTAL</span>
                                <span>{khrFormatter.format(saleData?.grandTotal || 0)} ៛</span>
                            </div>
                            <div className="flex justify-between text-[11px] text-gray-700 pt-1">
                                <span>PAID BY: {saleData?.paymentMethod}</span>
                                {saleData?.changeDue > 0 && <span>Change: {khrFormatter.format(saleData.changeDue)} ៛</span>}

                        <div className="text-center text-[10px] text-gray-600 border-t border-dashed border-gray-400 pt-2">
                            <div>Inv: {saleData?.receiptNo} • Staff: {saleData?.cashierName}</div>

                        </div>

                <ModalFooter>
                    <button type="button" onClick={handlePrint} className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-5 rounded-xl text-sm flex items-center gap-1.5"><i className="fas fa-print"></i> Print</button>
                    <button type="button" onClick={onClose} className="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-6 rounded-xl text-sm">Done</button>
                </ModalFooter>
            </Modal>
        );
    };

    // --- Interactive Bill Counter Modal (KHR & USD Denominations) ---
    const BillCounterModal = ({ show, onClose, onApply, initialKhr = 0, initialUsd = 0 }) => {
        const khrDenoms = [100000, 50000, 20000, 10000, 5000, 2000, 1000, 500, 100];
        const usdDenoms = [100, 50, 20, 10, 5, 1];

        const [khrCounts, setKhrCounts] = useState({});
        const [usdCounts, setUsdCounts] = useState({});
        const [activeTab, setActiveTab] = useState('KHR');

        useEffect(() => {
            if (!show) return;
            setActiveTab('KHR');
        }, [show]);

        const khrTotal = useMemo(
            () => khrDenoms.reduce((sum, d) => sum + d * (parseInt(khrCounts[d], 10) || 0), 0),
            [khrCounts]
        );
        const usdTotal = useMemo(
            () => usdDenoms.reduce((sum, d) => sum + d * (parseInt(usdCounts[d], 10) || 0), 0),
            [usdCounts]
        );

        const updateCount = (currency, denom, deltaOrVal, isAbsolute = false) => {
            const setter = currency === 'KHR' ? setKhrCounts : setUsdCounts;
            setter(prev => {
                const cur = parseInt(prev[denom], 10) || 0;
                const next = isAbsolute ? Math.max(0, parseInt(deltaOrVal, 10) || 0) : Math.max(0, cur + deltaOrVal);
                return { ...prev, [denom]: next === 0 ? '' : next };
            });
        };

        const handleClearAll = () => {
            setKhrCounts({});
            setUsdCounts({});
        };

        if (!show) return null;

        return (
            <Modal show={show} onClose={onClose} maxWidth="max-w-lg">
                <ModalHeader title="Physical Bill Counter (KHR & USD)" onClose={onClose} />
                <ModalBody>
                    <div className="space-y-4">
                        {/* Live Summary Banner */}
                        <div className="grid grid-cols-2 gap-3">
                            <div
                                onClick={() => setActiveTab('KHR')}
                                className={`p-3 rounded-xl border cursor-pointer transition ${activeTab === 'KHR' ? 'bg-emerald-950/50 border-emerald-500/60 shadow' : 'bg-slate-900 border-slate-700 hover:border-slate-600'}`}
                            >
                                <div className="text-[10px] font-bold uppercase tracking-wider text-emerald-400">KHR Total</div>
                                <div className="text-lg sm:text-xl font-black text-white font-mono mt-0.5">៛{khrFormatter.format(khrTotal)}</div>
                            </div>
                            <div
                                onClick={() => setActiveTab('USD')}
                                className={`p-3 rounded-xl border cursor-pointer transition ${activeTab === 'USD' ? 'bg-sky-950/50 border-sky-500/60 shadow' : 'bg-slate-900 border-slate-700 hover:border-slate-600'}`}
                            >
                                <div className="text-[10px] font-bold uppercase tracking-wider text-sky-400">USD Total</div>
                                <div className="text-lg sm:text-xl font-black text-white font-mono mt-0.5">${usdTotal.toFixed(2)}</div>
                            </div>
                        </div>

                        {/* Denomination Rows */}
                        <div className="bg-slate-900/70 rounded-xl border border-slate-700 divide-y divide-slate-800 max-h-[45vh] overflow-y-auto">
                            {(activeTab === 'KHR' ? khrDenoms : usdDenoms).map(denom => {
                                const countVal = activeTab === 'KHR' ? (khrCounts[denom] ?? '') : (usdCounts[denom] ?? '');
                                const numericCount = parseInt(countVal, 10) || 0;
                                const lineTotal = denom * numericCount;
                                return (
                                    <div key={`${activeTab}_${denom}`} className="px-3.5 py-2.5 flex items-center justify-between gap-2">
                                        <div className="w-24 font-mono font-black text-sm text-slate-200">
                                            {activeTab === 'KHR' ? `៛${khrFormatter.format(denom)}` : `$${denom}`}
                                        </div>
                                        <div className="flex items-center gap-1.5">
                                            <button
                                                type="button"
                                                onClick={() => updateCount(activeTab, denom, -1)}
                                                className="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-black border border-slate-700"
                                            >
                                                -
                                            </button>
                                            <input
                                                type="number"
                                                min="0"
                                                value={countVal}
                                                onChange={e => updateCount(activeTab, denom, e.target.value, true)}
                                                placeholder="0"
                                                className="w-16 h-8 bg-slate-950 text-white text-center font-mono font-bold text-sm rounded-lg border border-slate-600 focus:border-blue-500 outline-none"
                                            />
                                            <button
                                                type="button"
                                                onClick={() => updateCount(activeTab, denom, 1)}
                                                className="w-8 h-8 rounded-lg bg-blue-600/20 hover:bg-blue-600 text-blue-300 hover:text-white font-black border border-blue-500/40"
                                            >
                                                +
                                            </button>
                                        </div>
                                        <div className="w-28 text-right font-mono font-bold text-xs sm:text-sm text-emerald-400">
                                            {activeTab === 'KHR' ? `៛${khrFormatter.format(lineTotal)}` : `$${lineTotal.toFixed(2)}`}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </ModalBody>
                <ModalFooter>
                    <button
                        type="button"
                        onClick={handleClearAll}
                        className="bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold py-2 px-4 rounded-xl text-xs sm:text-sm mr-auto"
                    >
                        Clear All
                    </button>
                    <button type="button" onClick={onClose} className="bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 px-4 rounded-xl text-xs sm:text-sm">
                        Cancel
                    </button>
                    <button
                        type="button"
                        onClick={() => {
                            onApply({ khrTotal, usdTotal });
                            onClose();
                        }}
                        className="bg-emerald-600 hover:bg-emerald-500 text-white font-black py-2 px-5 rounded-xl text-xs sm:text-sm flex items-center gap-1.5"
                    >
                        <i className="fas fa-check"></i>
                        <span>Apply Count</span>
                    </button>
                </ModalFooter>
            </Modal>
        );
    };

    // --- Complete Open / Close Shift & Cash Reconciliation Modal ---
    const ShiftManagementModal = ({ show, onClose, activeShift, activeShop, userProfile, currentDevice, onShiftChanged }) => {
        const [shiftName, setShiftName] = useState(() => (new Date().getHours() < 14 ? 'AM' : 'PM'));
        const [startCash, setStartCash] = useState('');
        const [openNote, setOpenNote] = useState('');

        // Close Shift & Reconciliation States
        const [exchangeRate, setExchangeRate] = useState(() => Number(activeShop?.khqrConfig?.exchangeRate) || 4000);
        const [actualFloatKHR, setActualFloatKHR] = useState('');
        const [cashDropKHR, setCashDropKHR] = useState('');
        const [cashDropUSD, setCashDropUSD] = useState('');
        const [bankDropKHR, setBankDropKHR] = useState('');
        const [bankDropUSD, setBankDropUSD] = useState('');
        const [closeNote, setCloseNote] = useState('');
        const [showBillCounter, setShowBillCounter] = useState(false);

        // Live Shift Sales & Handover Summary States
        const [shiftSales, setShiftSales] = useState([]);
        const [loadingSales, setLoadingSales] = useState(false);
        const [saving, setSaving] = useState(false);
        const [handoverSummary, setHandoverSummary] = useState(null);
        const [savingPng, setSavingPng] = useState(false);
        const handoverRef = useRef(null);

        const formatNumInput = (val) => {
            if (val === '' || val === null || val === undefined) return '';
            const clean = String(val).replace(/[^0-9.]/g, '');
            if (!clean) return '';
            const parts = clean.split('.');
            parts[0] = (parseInt(parts[0], 10) || 0).toLocaleString('en-US');
            return parts.length > 1 ? `${parts[0]}.${parts[1]}` : parts[0];
        };

        const parseNum = (val) => parseFloat(String(val || '').replace(/,/g, '')) || 0;

        // Reset modal fields when opened
        useEffect(() => {
            if (!show) {
                setHandoverSummary(null);
                return;
            }
            const defaultRate = Number(activeShop?.khqrConfig?.exchangeRate) || 4000;
            setExchangeRate(defaultRate);

            if (!activeShift) {
                setShiftName(new Date().getHours() < 14 ? 'AM' : 'PM');
                const defaultFloat = Number(activeShop?.floatCash) || 0;
                setStartCash(defaultFloat > 0 ? String(defaultFloat) : '0');
                setOpenNote('');
            } else {
                setActualFloatKHR('');
                setCashDropKHR('');
                setCashDropUSD('');
                setBankDropKHR('');
                setBankDropUSD('');
                setCloseNote('');
            }
        }, [show, activeShift?.id, activeShop?.id]);

        // Load live sales belonging to this active shift (Local Ledger + Firestore)
        useEffect(() => {
            if (!show || !activeShift?.id) {
                setShiftSales([]);
                return;
            }
            const shiftStartMs = safeToDate(activeShift.startTime || activeShift.createdAt)?.getTime() || 0;

            const collectLocal = () => {
                const localList = window.SolarisLocalSalesStore?.getSales() || [];
                return localList.filter(s => {
                    if (!s || s.shopId !== activeShift.shopId) return false;
                    if (s.shiftId) return s.shiftId === activeShift.id;
                    const ts = safeToDate(s.createdAt || s.timestamp)?.getTime() || 0;
                    return shiftStartMs > 0 && ts >= shiftStartMs;
                });
            };

            const initialLocal = collectLocal();
            setShiftSales(initialLocal);
            setLoadingSales(initialLocal.length === 0);

            const unsub = db.collection('sales')
                .where('shiftId', '==', activeShift.id)
                .onSnapshot(snap => {
                    const cloudDocs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    const merged = new Map();
                    collectLocal().forEach(s => { if (s?.id) merged.set(s.id, s); });
                    cloudDocs.forEach(s => { if (s?.id) merged.set(s.id, { ...(merged.get(s.id) || {}), ...s }); });
                    setShiftSales(Array.from(merged.values()));
                    setLoadingSales(false);
                }, () => {
                    setShiftSales(collectLocal());
                    setLoadingSales(false);
                });

            return () => unsub();
        }, [show, activeShift?.id, activeShift?.shopId]);

        // Compute 5-Column KPIs + Reconciliation Ledger Metrics
        const shiftStats = useMemo(() => {
            let grossSale = 0;
            let discounts = 0;
            let netSale = 0;
            let totalCost = 0;
            let voidedTotal = 0;
            let voidedCount = 0;
            let cashSales = 0;
            let bankSales = 0;
            let noRefundVoidCash = 0;
            let noRefundVoidBank = 0;
            let activeTxCount = 0;

            if (shiftSales.length > 0) {
                shiftSales.forEach(s => {
                    const grand = Number(s.grandTotal) || 0;
                    const disc = Number(s.discount) || (Number(s.manualDiscount || 0) + Number(s.redemptionAmount || 0));
                    const sub = Number(s.subtotal) || (grand + disc);
                    const cost = Number(s.totalCost) || 0;
                    const isCash = s.paymentMethod === 'Cash';

                    if (s.status === 'void') {
                        voidedCount += 1;
                        voidedTotal += grand;
                        if (s.voidNoRefund || s.noRefund) {
                            if (isCash) noRefundVoidCash += grand;
                            else noRefundVoidBank += grand;
                        }
                    } else {
                        activeTxCount += 1;
                        grossSale += sub;
                        discounts += disc;
                        netSale += grand;
                        totalCost += cost;
                        if (isCash) cashSales += grand;
                        else bankSales += grand;
                    }
                });
            } else if (activeShift) {
                // Fallback to running counters on activeShift if sales array is empty
                cashSales = Number(activeShift.totalCashSales) || 0;
                bankSales = Number(activeShift.totalKHQRSales) || 0;
                netSale = Number(activeShift.totalSales) || (cashSales + bankSales);
                grossSale = netSale;
                activeTxCount = Number(activeShift.transactionCount) || 0;
            }

            const saleMarginPct = netSale > 0 ? ((netSale - totalCost) / netSale) * 100 : 0;
            const expectedFloat = Number(activeShift?.startCash) || 0;
            const expectedCashDrop = cashSales + noRefundVoidCash;
            const expectedBankDrop = bankSales + noRefundVoidBank;

            const validRate = Math.max(100, Number(exchangeRate) || 4000);
            const enteredFloat = parseNum(actualFloatKHR);
            const cKhr = parseNum(cashDropKHR);
            const cUsd = parseNum(cashDropUSD);
            const bKhr = parseNum(bankDropKHR);
            const bUsd = parseNum(bankDropUSD);

            const actualCashDropTotal = cKhr + (cUsd * validRate);
            const actualBankDropTotal = bKhr + (bUsd * validRate);

            const diffFloat = enteredFloat - expectedFloat;
            const diffCash = actualCashDropTotal - expectedCashDrop;
            const diffBank = actualBankDropTotal - expectedBankDrop;
            const totalVariance = diffFloat + diffCash + diffBank;

            return {
                grossSale, discounts, netSale, totalCost, saleMarginPct,
                voidedTotal, voidedCount, activeTxCount,
                cashSales, bankSales, noRefundVoidCash, noRefundVoidBank,
                expectedFloat, enteredFloat, diffFloat,
                expectedCashDrop, actualCashDropTotal, diffCash,
                expectedBankDrop, actualBankDropTotal, diffBank,
                totalVariance, validRate, cKhr, cUsd, bKhr, bUsd
            };
        }, [shiftSales, activeShift, exchangeRate, actualFloatKHR, cashDropKHR, cashDropUSD, bankDropKHR, bankDropUSD]);

        const handleOpenShift = async () => {
            if (!activeShop?.id || saving) return;
            setSaving(true);
            const ref = db.collection('shifts').doc();
            const nowIso = new Date().toISOString();
            const numericStartCash = parseNum(startCash);
            const shiftObj = {
                id: ref.id,
                shopId: activeShop.id,
                shopName: activeShop.name || '',
                cashierId: userProfile.uid,
                cashierName: userProfile.name || 'Cashier',
                shiftName,
                deviceId: currentDevice?.id || '',
                deviceName: currentDevice?.name || 'POS-01',
                startCash: numericStartCash,
                openNote: openNote.trim(),
                totalSales: 0,
                totalCashSales: 0,
                totalKHQRSales: 0,
                transactionCount: 0,
                status: 'open',
                startTime: nowIso,
                createdAt: nowIso
            };
            try { localStorage.setItem(`solaris_active_shift_${activeShop.id}`, JSON.stringify(shiftObj)); } catch (e) {}
            onShiftChanged(shiftObj);
            ref.set({
                ...shiftObj,
                startTime: firebase.firestore.FieldValue.serverTimestamp(),
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(() => {});
            setSaving(false);
            onClose();
        };

        const handleCloseShift = async () => {
            if (!activeShift?.id || saving) return;
            setSaving(true);
            const closedAtIso = new Date().toISOString();

            const updatePayload = {
                status: 'closed',
                closedBy: userProfile.name || 'Cashier',
                closeExchangeRate: shiftStats.validRate,
                closeInputCashKHR: shiftStats.cKhr,
                closeInputCashUSD: shiftStats.cUsd,
                closeInputBankKHR: shiftStats.bKhr,
                closeInputBankUSD: shiftStats.bUsd,
                closeNote: closeNote.trim(),
                expectedFloat: shiftStats.expectedFloat,
                actualFloat: shiftStats.enteredFloat,
                differenceFloat: shiftStats.diffFloat,
                expectedCash: shiftStats.expectedCashDrop,
                actualCash: shiftStats.actualCashDropTotal,
                differenceCash: shiftStats.diffCash,
                expectedKHQR: shiftStats.expectedBankDrop,
                actualKHQR: shiftStats.actualBankDropTotal,
                differenceKHQR: shiftStats.diffBank,
                difference: shiftStats.totalVariance,
                statsGross: shiftStats.grossSale,
                statsDiscount: shiftStats.discounts,
                statsNet: shiftStats.netSale,
                statsMargin: Number(shiftStats.saleMarginPct.toFixed(2)),
                statsVoid: shiftStats.voidedTotal,
                statsVoidCount: shiftStats.voidedCount,
                totalSales: shiftStats.netSale,
                totalCashSales: shiftStats.cashSales,
                totalKHQRSales: shiftStats.bankSales,
                transactionCount: shiftStats.activeTxCount
            };

            try { localStorage.removeItem(`solaris_active_shift_${activeShop.id}`); } catch (e) {}
            onShiftChanged(null);

            db.collection('shifts').doc(activeShift.id).set({
                ...updatePayload,
                endTime: firebase.firestore.FieldValue.serverTimestamp(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).catch(() => {});

            setHandoverSummary({
                ...activeShift,
                ...updatePayload,
                endTime: closedAtIso,
                shopName: activeShop?.brandingName || activeShop?.name || 'POS Terminal',
                stats: shiftStats
            });
            setSaving(false);
        };

        const handleSaveHandoverPng = () => {
            if (!handoverRef.current || typeof html2canvas !== 'function' || savingPng) return;
            setSavingPng(true);
            html2canvas(handoverRef.current, { scale: 2.5, backgroundColor: '#0f172a', useCORS: true })
                .then(canvas => {
                    const link = document.createElement('a');
                    const safeShop = String(handoverSummary?.shopName || 'POS').replace(/[^a-zA-Z0-9]/g, '_');
                    const safeDate = new Date().toISOString().slice(0, 10);
                    link.download = `Shift-Handover-${safeShop}-${handoverSummary?.shiftName || 'Shift'}-${safeDate}.png`;
                    link.href = canvas.toDataURL('image/png');
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                })
                .catch(() => {})
                .finally(() => setSavingPng(false));
        };

        const formatVarianceBadge = (val) => {
            if (Math.abs(val) < 1) return <span className="text-emerald-400 font-black font-mono">៛0 (Matched)</span>;
            return (
                <span className={`font-black font-mono ${val > 0 ? 'text-sky-400' : 'text-rose-400'}`}>
                    {val > 0 ? `+៛${khrFormatter.format(Math.round(val))} (Over)` : `-៛${khrFormatter.format(Math.abs(Math.round(val)))} (Short)`}
                </span>
            );
        };

        return (
            <>
                <BillCounterModal
                    show={showBillCounter}
                    onClose={() => setShowBillCounter(false)}
                    onApply={({ khrTotal, usdTotal }) => {
                        setCashDropKHR(khrTotal > 0 ? String(khrTotal) : '');
                        setCashDropUSD(usdTotal > 0 ? String(usdTotal) : '');
                    }}
                />

                <Modal
                    show={show}
                    onClose={() => { setHandoverSummary(null); onClose(); }}
                    maxWidth={handoverSummary ? 'max-w-lg' : activeShift ? 'max-w-3xl' : 'max-w-md'}
                >
                    <ModalHeader
                        title={
                            handoverSummary
                                ? 'Shift Handover Complete'
                                : activeShift
                                    ? `Close Shift & Cash Reconciliation (${activeShift.shiftName || 'Open'})`
                                    : 'Open New Shift'
                        }
                        onClose={() => { setHandoverSummary(null); onClose(); }}
                    />

                    <ModalBody>
                        {handoverSummary ? (
                            /* STEP 3: SHIFT HANDOVER COMPLETE SUMMARY (WITH SAVE PNG) */
                            <div ref={handoverRef} className="bg-slate-900 border border-slate-700 rounded-2xl p-5 space-y-4 text-slate-200">
                                <div className="text-center border-b border-slate-800 pb-3">

    const buildDynamicKHQRPayload = ({
        bakongAccountId = 'merchant@aba',
        merchantName = 'PO SYSTEM POS',
        merchantCity = 'Phnom Penh',
        currency = 'KHR',
        amount = 0,
        billNumber = ''
    }) => {
        const formatTag = (id, val) => window.SolarisKHQREngine.formatTLV(id, val);
        const cleanAccount = (bakongAccountId || 'merchant@aba').trim();
        const cleanName = (merchantName || 'PO SYSTEM POS').replace(/[^a-zA-Z0-9 .-]/g, '').slice(0, 25).trim() || 'MERCHANT';
        const cleanCity = (merchantCity || 'Phnom Penh').replace(/[^a-zA-Z0-9 .-]/g, '').slice(0, 15).trim() || 'Phnom Penh';

        const tag00 = formatTag('00', '01');
        const tag01 = formatTag('01', '12');
        const tag29 = formatTag('29', formatTag('00', cleanAccount));
        const tag52 = formatTag('52', '5999');
        const isUSD = currency === 'USD';
        const tag53 = formatTag('53', isUSD ? '840' : '116');
        const formattedAmt = isUSD ? Number(amount || 0).toFixed(2) : String(Math.round(Number(amount || 0)));
        const tag54 = formatTag('54', formattedAmt);
        const tag58 = formatTag('58', 'KH');
        const tag59 = formatTag('59', cleanName);
        const tag60 = formatTag('60', cleanCity);

        const refBill = (billNumber || `POS${Date.now().toString().slice(-6)}`).slice(0, 20);
        const tag62 = formatTag('62', formatTag('01', refBill));

        const nowMs = Date.now();
        const expMs = nowMs + 10 * 60 * 1000;
        const tag99 = formatTag('99', formatTag('00', String(nowMs)) + formatTag('01', String(expMs)));

        const payloadWithoutCRC = `${tag00}${tag01}${tag29}${tag52}${tag53}${tag54}${tag58}${tag59}${tag60}${tag62}${tag99}6304`;
        const crcHex = window.SolarisKHQREngine.crc16(payloadWithoutCRC);
        return `${payloadWithoutCRC}${crcHex}`;
    };

    const ThankYouPaymentModal = ({ data, onClose, durationMs = 2000 }) => {
        useEffect(() => {
            if (!data) return;
            const timer = setTimeout(() => {
                if (typeof onClose === 'function') onClose();
            }, durationMs);
            return () => clearTimeout(timer);
        }, [data, onClose, durationMs]);

        if (!data) return null;
        return (
            <div
                onClick={onClose}
                className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[260] flex items-center justify-center p-4 animate-fade-in-up"
            >
