    };

    // ========================================================================
    // 9. MAIN STANDALONE POS TERMINAL COMPONENT
    // ========================================================================
    const POSTerminal = ({ userProfile }) => {
        const { products, shops, customers, loyaltyRules, devices, currentDeviceId, systemConfig } = useData();
        const currentDevice = useMemo(() => devices.find(d => d.id === currentDeviceId) || null, [devices, currentDeviceId]);

        const [selectedShopId, setSelectedShopId] = useState(() => currentDevice?.shopId || shops[0]?.id || '');
        const [currentShift, setCurrentShift] = useState(null);
        const [cart, setCart] = useState([]);
        const [searchTerm, setSearchTerm] = useState('');
        const [selectedVendor, setSelectedVendor] = useState('All');
        const [catalogViewMode, setCatalogViewMode] = useState('list'); // Default Line/List View
        const [activeMobileTab, setActiveMobileTab] = useState('products');
        const [highlightedIndex, setHighlightedIndex] = useState(0);
        const [selectedCustomerId, setSelectedCustomerId] = useState('');
        const [customerSearch, setCustomerSearch] = useState('');
        const [custFocus, setCustFocus] = useState(false);

        const [isProcessing, setIsProcessing] = useState(false);
        const [showPayment, setShowPayment] = useState(false);
        const [showReceipt, setShowReceipt] = useState(false);
        const [lastSale, setLastSale] = useState(null);
        const [showHistory, setShowHistory] = useState(false);
        const [showDaily, setShowDaily] = useState(false);
        const [showAutoSum, setShowAutoSum] = useState(false);
        const [showKhqrSim, setShowKhqrSim] = useState(false);
        const [showShift, setShowShift] = useState(false);
        const [showAddCust, setShowAddCust] = useState(false);
        const [showClearConfirm, setShowClearConfirm] = useState(false);
        const [alertMsg, setAlertMsg] = useState({ show: false, title: '', message: '', isError: false });
        const [todaySales, setTodaySales] = useState([]);
        const [isOnline, setIsOnline] = useState(() => navigator.onLine);
        const searchRef = useRef(null);

        useEffect(() => {
            if (currentDevice?.shopId) setSelectedShopId(currentDevice.shopId);
            else if (shops.length > 0 && !selectedShopId) setSelectedShopId(shops[0].id);
        }, [currentDevice, shops, selectedShopId]);

        useEffect(() => {
            const onOn = () => setIsOnline(true), onOff = () => setIsOnline(false);
            window.addEventListener('online', onOn); window.addEventListener('offline', onOff);
            return () => { window.removeEventListener('online', onOn); window.removeEventListener('offline', onOff); };
        }, []);

        const currentShopObj = useMemo(() => shops.find(s => s.id === selectedShopId) || null, [shops, selectedShopId]);
        const localShiftKey = selectedShopId && userProfile?.uid && currentDeviceId ? `solaris_active_shift_${selectedShopId}_${currentDeviceId}_${userProfile.uid}` : null;

        useEffect(() => {
            if (!selectedShopId) return;
            return window.SolarisInvoiceEngine.subscribeShopCounter(selectedShopId);
        }, [selectedShopId]);

        useEffect(() => {
            if (!selectedShopId || !userProfile?.uid || !currentDeviceId) return;
            if (localShiftKey) {
                try { const saved = JSON.parse(localStorage.getItem(localShiftKey) || 'null'); if (saved?.status === 'open') setCurrentShift(saved); } catch (e) {}
            }
            const unsub = db.collection('shifts').where('status', '==', 'open').onSnapshot(snap => {
                const match = snap.docs.map(d => ({ id: d.id, ...d.data() })).find(s => s.shopId === selectedShopId && s.deviceId === currentDeviceId && s.cashierId === userProfile.uid);
                if (match) {
                    setCurrentShift(match);
                    if (localShiftKey) try { localStorage.setItem(localShiftKey, JSON.stringify(match)); } catch (e) {}
                }
            }, () => {});
            return () => unsub();
        }, [selectedShopId, userProfile?.uid, currentDeviceId, localShiftKey]);

        useEffect(() => {
            if (!selectedShopId) return;
            const start = new Date(); start.setHours(0, 0, 0, 0);
            const unsub = db.collection('sales').where('timestamp', '>=', start).onSnapshot(snap => {
                setTodaySales(snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(s => s.shopId === selectedShopId).sort((a, b) => (safeToDate(b.timestamp || b.createdAt) || 0) - (safeToDate(a.timestamp || a.createdAt) || 0)));
            }, () => {});
            return () => unsub();
        }, [selectedShopId]);

        const vendorsList = useMemo(() => {
            const set = new Set();
            products.forEach(p => set.add((p.vendorName || '').trim() || 'Uncategorized'));
            return ['All', ...Array.from(set).sort()];
        }, [products]);

        const debouncedSearch = useDebounce(searchTerm, 70);
        const filteredProducts = useMemo(() => {
            let list = products;
            if (selectedVendor !== 'All') list = list.filter(p => ((p.vendorName || '').trim() || 'Uncategorized') === selectedVendor);
            if (debouncedSearch) {
                const q = debouncedSearch.toLowerCase();
                list = list.filter(p => (p.name || '').toLowerCase().includes(q) || (p.code || '').toLowerCase().includes(q) || String(p.barcode || '').toLowerCase().includes(q));
            }
            return list;
        }, [products, selectedVendor, debouncedSearch]);

        const cartQtyMap = useMemo(() => { const m = new Map(); cart.forEach(i => m.set(i.productId, Number(i.quantity) || 0)); return m; }, [cart]);
        const cartTotal = useMemo(() => cart.reduce((s, i) => s + ((Number(i.price) || 0) * (Number(i.quantity) || 0)), 0), [cart]);
        const cartItemCount = useMemo(() => cart.reduce((s, i) => s + (Number(i.quantity) || 0), 0), [cart]);
        const selectedCustomerObj = useMemo(() => customers.find(c => c.id === selectedCustomerId) || null, [customers, selectedCustomerId]);
        const activeLoyaltyRule = useMemo(() => loyaltyRules.find(r => r.shopId === selectedShopId && r.status !== 'Inactive') || loyaltyRules.find(r => r.shopId === 'All' && r.status !== 'Inactive') || null, [loyaltyRules, selectedShopId]);
        const loyaltyStatus = useMemo(() => evaluateCustomerLoyaltyStatus(selectedCustomerObj, activeLoyaltyRule), [selectedCustomerObj, activeLoyaltyRule]);

        // 0ms Live Broadcast to Customer Display (POS-KHRQ.html)
        React.useLayoutEffect(() => {
            if (!selectedShopId || showPayment || showReceipt) return;
            const rate = Math.max(100, Number(currentShopObj?.khqrConfig?.exchangeRate) || 4000);
            if (cart.length > 0) {
                window.SolarisPayWayVerifier.broadcastCustomerDisplaySession(selectedShopId, {
                    status: 'CART', shopId: selectedShopId, shopName: currentShopObj?.brandingName || currentShopObj?.name || 'POS Terminal',
                    items: cart, itemCount: cartItemCount, subtotalKhr: cartTotal, discountKhr: 0,
                    amountKhr: cartTotal, amountUsd: Number((cartTotal / rate).toFixed(2)), exchangeRate: rate,
                    customerName: selectedCustomerObj?.name || null, customerPoints: loyaltyStatus.effectivePoints
                });
            } else {
                window.SolarisPayWayVerifier.broadcastCustomerDisplaySession(selectedShopId, {
                    status: 'IDLE', shopId: selectedShopId, shopName: currentShopObj?.brandingName || currentShopObj?.name || 'POS Terminal',
                    exchangeRate: rate, items: [], itemCount: 0, subtotalKhr: 0, discountKhr: 0, amountKhr: 0, amountUsd: 0
                });
            }
        }, [cart, cartTotal, cartItemCount, selectedShopId, currentShopObj, selectedCustomerObj, loyaltyStatus.effectivePoints, showPayment, showReceipt]);

        const addToCart = useCallback((prod) => {
            if (!currentShift) { setShowShift(true); return; }
            const price = getEffectiveShopPrice(prod, selectedShopId);
            setCart(prev => {
                const ex = prev.find(i => i.productId === prod.id);
                if (ex) return prev.map(i => i.productId === prod.id ? { ...i, quantity: i.quantity + 1 } : i);
                return [...prev, { productId: prod.id, name: prod.name, code: prod.code, price, originalPrice: price, cost: Number(prod.cost) || 0, quantity: 1 }];
            });
        }, [currentShift, selectedShopId]);

        const handleSearchKeyDown = (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const q = searchTerm.trim().toLowerCase();
                const exact = products.find(p => String(p.barcode || '').toLowerCase() === q || String(p.code || '').toLowerCase() === q);
                const target = exact || filteredProducts[highlightedIndex] || filteredProducts[0];
                if (target) { addToCart(target); setSearchTerm(''); setHighlightedIndex(0); }
            }
        };

        const handleProcessSale = async (details) => {
            if (!selectedShopId || cart.length === 0 || !currentShift) return;
            setIsProcessing(true);
            try {
                const receiptNo = window.SolarisInvoiceEngine.allocateInvoiceNumber(currentShopObj);
                const batch = db.batch();
                const saleRef = db.collection('sales').doc();
                const verifiedAba = details.verifiedAba || null;
                const isAba = !!(verifiedAba?.isValid && verifiedAba?.trxId);

                const saleData = {
                    receiptNo, shopId: selectedShopId, shopName: currentShopObj?.name || 'Shop',
                    cashierId: userProfile.uid, cashierName: userProfile.name, shiftId: currentShift.id,
                    deviceId: currentDeviceId, deviceName: currentDevice?.name || 'POS',
                    customerId: selectedCustomerId || null, customerName: selectedCustomerObj?.name || 'Walk-in',
                    items: cart, subtotal: cartTotal, discount: details.discount || 0,
                    manualDiscount: details.manualDiscount || 0, manualDiscountPct: details.manualDiscountPct || 0,
                    grandTotal: Math.max(0, cartTotal - (details.discount || 0)),
                    totalCost: cart.reduce((s, i) => s + ((Number(i.cost) || 0) * (Number(i.quantity) || 1)), 0),
                    paymentMethod: details.method, amountTendered: details.tendered,
                    tenderedUSD: details.tenderedUSD || 0, tenderedKHR: details.tenderedKHR || 0,
                    exchangeRate: details.exchangeRate || 4000, changeDue: details.change || 0,
                    abaVerified: isAba, abaTrxId: isAba ? verifiedAba.trxId : null, abaApv: isAba ? verifiedAba.apv : (details.apvRef || null),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(), createdAt: new Date().toISOString()
                };

                batch.set(saleRef, saleData);
                if (isAba) window.SolarisPayWayVerifier.claimAbaPaymentForSale(verifiedAba.trxId, saleRef.id, receiptNo);

                if (currentShopObj?.manageStock !== false) {
                    cart.forEach(item => {
                        batch.update(db.collection('products').doc(item.productId), {
                            [`stockByShop.${selectedShopId}`]: firebase.firestore.FieldValue.increment(-item.quantity),
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        window.SolarisSmartProductEngine.applyLocalStockDelta(item.productId, selectedShopId, -item.quantity);
                    });
                }

                const isCash = details.method === 'Cash';
                batch.set(db.collection('shifts').doc(currentShift.id), {
                    totalSales: firebase.firestore.FieldValue.increment(saleData.grandTotal),
                    transactionCount: firebase.firestore.FieldValue.increment(1),
                    totalCashSales: firebase.firestore.FieldValue.increment(isCash ? saleData.grandTotal : 0),
                    totalKHQRSales: firebase.firestore.FieldValue.increment(!isCash ? saleData.grandTotal : 0)
                }, { merge: true });

                const completed = { ...saleData, id: saleRef.id };
                window.SolarisLocalSalesStore.recordSale(completed);
                setLastSale(completed);
                setCart([]); setSelectedCustomerId(''); setShowPayment(false); setShowReceipt(true); setIsProcessing(false);
                batch.commit().catch(() => {});
            } catch (err) {
                setIsProcessing(false);
                setAlertMsg({ show: true, title: 'Sale Error', message: err.message, isError: true });
            }
        };

        if (!currentDeviceId) return <DeviceSetup userProfile={userProfile} />;

        return (
            <div className="flex flex-col h-[calc(100dvh-56px)] p-2 sm:p-3 select-none">
                <MessageModal {...alertMsg} onClose={() => setAlertMsg(p => ({ ...p, show: false }))} />
                <ConfirmationModal show={showClearConfirm} title="Clear Cart?" message="Remove all items from the current ticket?" onConfirm={() => {
                    window.SolarisLocalSalesStore.recordClearedCart({ id: `clr_${Date.now()}`, actionType: 'clear_cart', shopId: selectedShopId, shopName: currentShopObj?.name, cashierName: userProfile.name, items: cart, totalAmount: cartTotal, totalQty: cartItemCount, createdAt: new Date().toISOString() });
                    setCart([]); setShowClearConfirm(false);
                }} onCancel={() => setShowClearConfirm(false)} />

                {showPayment && <PaymentModal total={cartTotal} cart={cart} customer={selectedCustomerObj} shop={currentShopObj} loyaltyRule={activeLoyaltyRule} systemConfig={systemConfig} onConfirm={handleProcessSale} onCancel={() => setShowPayment(false)} isProcessing={isProcessing} />}
                {showReceipt && lastSale && <ReceiptModal saleData={lastSale} onClose={() => setShowReceipt(false)} />}
                {showHistory && <SalesHistoryModal sales={todaySales} onClose={() => setShowHistory(false)} onReprint={s => { setLastSale(s); setShowReceipt(true); }} />}
                {showDaily && <DailyReportModal sales={todaySales} onClose={() => setShowDaily(false)} />}
                <BankAutoSumModal show={showAutoSum} onClose={() => setShowAutoSum(false)} currentShift={currentShift} shop={currentShopObj} />
                <LiveDynamicKhqrSimulatorModal show={showKhqrSim} onClose={() => setShowKhqrSim(false)} shop={currentShopObj} systemConfig={systemConfig} />
                {showShift && <ShiftManagementModal currentShift={currentShift} shopId={selectedShopId} userProfile={userProfile} onClose={() => setShowShift(false)} deviceId={currentDeviceId} todaySales={todaySales} onShiftStateChange={(s) => { setCurrentShift(s); if (localShiftKey) { if (s) localStorage.setItem(localShiftKey, JSON.stringify(s)); else localStorage.removeItem(localShiftKey); } }} />}
                {showAddCust && <AddCustomerModal onClose={() => setShowAddCust(false)} onSave={c => { setSelectedCustomerId(c.id); setShowAddCust(false); }} shops={shops} defaultShopId={selectedShopId} initialSearchTerm={customerSearch} />}

                <div className="flex-1 flex gap-2.5 overflow-hidden min-h-0">
                    {/* LEFT: PRODUCT CATALOG */}
                    <div className={`flex-1 flex flex-col bg-slate-800 rounded-xl border border-slate-700 overflow-hidden min-w-0 ${activeMobileTab === 'products' ? 'flex' : 'hidden md:flex'}`}>
                        <div className="p-2.5 bg-slate-900/70 border-b border-slate-700 flex flex-col lg:flex-row gap-2 justify-between">
                            <div className="flex gap-2 flex-1 min-w-0">
                                <div className="flex-1 relative">
                                    <input ref={searchRef} type="text" placeholder="Search or Scan Barcode..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} onKeyDown={handleSearchKeyDown} className="w-full bg-slate-800 text-white pl-9 pr-8 py-2 rounded-xl border border-slate-600 focus:border-blue-500 outline-none text-sm" autoFocus />
                                    <i className="fas fa-barcode absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                    {searchTerm && <button type="button" onClick={() => setSearchTerm('')} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400"><i className="fas fa-times-circle"></i></button>}
                                </div>
                                <select value={selectedVendor} onChange={e => setSelectedVendor(e.target.value)} className="bg-slate-800 text-slate-200 px-2.5 py-2 rounded-xl border border-slate-600 text-xs font-bold max-w-[130px] truncate">
                                    {vendorsList.map(v => <option key={v} value={v}>{v === 'All' ? 'All Vendors' : v}</option>)}
                                </select>
                            </div>

                            <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar shrink-0">
                                <button type="button" onClick={() => {
                                    const url = `./POS-KHRQ.html?shopId=${encodeURIComponent(selectedShopId)}&shopName=${encodeURIComponent(currentShopObj?.name || 'POS')}`;
                                    const w = window.open(url, 'solaris_customer_display');
                                    if (w) { try { w.focus(); } catch (e) {} window.SolarisPayWayVerifier.registerCustomerDisplayWindow(w, selectedShopId); }
                                }} className="w-9 h-9 rounded-xl bg-indigo-600/20 hover:bg-indigo-600 text-indigo-300 hover:text-white border border-indigo-500/40 flex items-center justify-center" title="Open Customer Display (0ms Sync)">
                                    <i className="fas fa-tv"></i>
                                </button>
                                <div className={`w-9 h-9 rounded-xl border flex items-center justify-center ${isOnline ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' : 'bg-amber-500/20 text-amber-300 border-amber-500/40 animate-pulse'}`} title={isOnline ? 'Online' : 'Offline Mode'}>
                                    <i className={`fas ${isOnline ? 'fa-wifi' : 'fa-wifi-slash'} text-xs`}></i>
                                </div>
                                <button type="button" onClick={() => setShowShift(true)} className={`w-9 h-9 rounded-xl flex items-center justify-center ${currentShift ? 'bg-green-600/20 text-green-400 border border-green-500/40' : 'bg-red-600 text-white animate-pulse'}`} title="Shift Management"><i className="fas fa-clock"></i></button>
                                <button type="button" onClick={() => setShowHistory(true)} className="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-blue-400 border border-slate-600 flex items-center justify-center" title="Today's History"><i className="fas fa-history"></i></button>
                                <button type="button" onClick={() => setShowDaily(true)} className="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-600 flex items-center justify-center" title="Daily Summary"><i className="fas fa-chart-pie"></i></button>
                                <button type="button" onClick={() => currentShift ? setShowAutoSum(true) : setShowShift(true)} className="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-600 flex items-center justify-center" title="Bank AutoSum"><i className="fas fa-university"></i></button>
                                <button type="button" onClick={() => setShowKhqrSim(true)} className="relative w-9 h-9 rounded-xl bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white border border-rose-500/40 flex items-center justify-center" title="Live KHQR Simulator (PIN)">
                                    <i className="fas fa-qrcode"></i><i className="fas fa-lock text-[7px] absolute bottom-1 right-1 text-amber-300"></i>
                                </button>
                                <div className="flex bg-slate-900 p-0.5 rounded-xl border border-slate-700">
                                    <button type="button" onClick={() => setCatalogViewMode('list')} className={`px-2.5 py-1.5 rounded-lg text-xs font-bold ${catalogViewMode === 'list' ? 'bg-blue-600 text-white' : 'text-slate-400'}`} title="Line View"><i className="fas fa-list"></i></button>
                                    <button type="button" onClick={() => setCatalogViewMode('grid')} className={`px-2.5 py-1.5 rounded-lg text-xs font-bold ${catalogViewMode === 'grid' ? 'bg-blue-600 text-white' : 'text-slate-400'}`} title="1:1 Photo Grid"><i className="fas fa-th-large"></i></button>
                                </div>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-2.5 min-h-0">
                            {filteredProducts.length === 0 ? (
                                <div className="h-full flex flex-col items-center justify-center text-slate-500"><i className="fas fa-box-open text-4xl mb-2 opacity-40"></i><p className="text-sm font-bold">No products found</p></div>
                            ) : catalogViewMode === 'list' ? (
                                <div className="space-y-1.5">
                                    {filteredProducts.slice(0, 80).map((prod, idx) => {
                                        const stock = prod.stockByShop?.[selectedShopId] || 0;
                                        const manageStock = currentShopObj?.manageStock !== false;
                                        const inCart = cartQtyMap.get(prod.id) || 0;
                                        const price = getEffectiveShopPrice(prod, selectedShopId);
                                        return (
                                            <div key={prod.id} onClick={() => addToCart(prod)} onMouseEnter={() => setHighlightedIndex(idx)} className={`p-2.5 rounded-xl border flex items-center justify-between gap-3 cursor-pointer transition active:scale-[0.99] ${inCart > 0 ? 'bg-emerald-950/25 border-emerald-500/40' : 'bg-slate-900/60 border-slate-700/80 hover:bg-slate-700/60'}`}>
                                                <div className="flex items-center gap-3 min-w-0 flex-1">
                                                    {prod.imageUrl ? <img src={prod.imageUrl} alt={prod.name} loading="lazy" className="w-10 h-10 rounded-lg object-cover aspect-square border border-slate-700 shrink-0" /> : <div className="w-10 h-10 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-400 font-black text-xs shrink-0 uppercase">{(prod.name || '?').slice(0, 2)}</div>}
                                                    <div className="min-w-0 flex-1">
                                                        <div className="flex items-center gap-2">
                                                            <span className="font-bold text-sm text-slate-100 truncate">{prod.name}</span>
                                                            {inCart > 0 && <span className="px-1.5 py-0.5 rounded-full bg-emerald-500 text-slate-950 font-black text-[10px] shrink-0">{inCart}</span>}
                                                        </div>
                                                        <div className="flex items-center gap-1.5 text-[11px] text-slate-400 font-mono mt-0.5 truncate">
                                                            <span className="text-blue-300 font-semibold">{prod.code}</span>
                                                            {prod.barcode && <><span className="text-slate-600">•</span><span className="truncate">{prod.barcode}</span></>}
                                                            {manageStock && <><span className="text-slate-600">•</span><span className={`font-bold ${stock <= 0 ? 'text-red-400' : (prod.minStock > 0 && stock <= prod.minStock) ? 'text-amber-300' : 'text-slate-200'}`}>{stock}</span></>}
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="text-sm sm:text-base font-black text-emerald-400 font-mono shrink-0">៛{khrFormatter.format(price)}</div>
                                            </div>
                                        );
                                    })}
                                </div>
                            ) : (
                                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-2.5">
                                    {filteredProducts.slice(0, 80).map(prod => {
                                        const stock = prod.stockByShop?.[selectedShopId] || 0;
                                        const inCart = cartQtyMap.get(prod.id) || 0;
                                        const price = getEffectiveShopPrice(prod, selectedShopId);
                                        return (
                                            <div key={prod.id} onClick={() => addToCart(prod)} className={`rounded-2xl border overflow-hidden flex flex-col cursor-pointer transition active:scale-[0.98] ${inCart > 0 ? 'bg-slate-900 border-emerald-500/60' : 'bg-slate-900/80 border-slate-700/80 hover:border-slate-500'}`}>
                                                <div className="relative w-full aspect-square bg-slate-950 flex items-center justify-center overflow-hidden">
                                                    {prod.imageUrl ? <img src={prod.imageUrl} alt={prod.name} loading="lazy" className="w-full h-full object-cover" /> : <span className="text-2xl font-black text-slate-500 uppercase">{(prod.name || 'PR').slice(0, 2)}</span>}
                                                    <span className="absolute top-1.5 left-1.5 px-1.5 py-0.5 rounded bg-slate-950/80 text-[9px] font-mono text-slate-200">{prod.code}</span>
                                                    {inCart > 0 && <span className="absolute top-1.5 right-1.5 min-w-[22px] h-[22px] px-1.5 rounded-full bg-emerald-500 text-slate-950 font-black text-[11px] flex items-center justify-center">{inCart}</span>}
                                                    <span className={`absolute bottom-1.5 left-1.5 px-1.5 py-0.5 rounded text-[9px] font-black ${stock <= 0 ? 'bg-red-600 text-white' : 'bg-slate-950/80 text-slate-200'}`}>{stock}</span>
                                                </div>
                                                <div className="p-2 flex flex-col justify-between flex-1 gap-1">
                                                    <div className="text-xs font-bold text-slate-100 line-clamp-2">{prod.name}</div>
                                                    <div className="text-sm font-black text-emerald-400 font-mono">៛{khrFormatter.format(price)}</div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* RIGHT: POS CART */}
                    <div className={`w-full md:w-[340px] lg:w-[390px] shrink-0 flex flex-col bg-slate-800 rounded-xl border border-slate-700 overflow-hidden ${activeMobileTab === 'cart' ? 'flex' : 'hidden md:flex'}`}>
                        <div className="p-2.5 bg-slate-900/70 border-b border-slate-700 space-y-2 shrink-0">
                            <div className="flex items-center justify-between">
                                <h3 className="text-sm font-black text-white flex items-center gap-2">
                                    <i className="fas fa-shopping-cart text-blue-400"></i>
                                    <span>Ticket</span>
                                    <span className="px-2 py-0.5 rounded-full bg-blue-600/25 text-blue-300 text-xs font-mono">{cartItemCount}</span>
                                </h3>
                                <button type="button" disabled={cart.length === 0} onClick={() => setShowClearConfirm(true)} className="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-red-600 text-red-400 hover:text-white border border-slate-600 text-xs font-bold disabled:opacity-40"><i className="fas fa-trash-alt"></i></button>
                            </div>

                            <div className="relative flex items-center gap-1.5">
                                {selectedCustomerObj ? (
                                    <div className="flex-1 bg-amber-500/10 border border-amber-500/40 rounded-xl px-3 py-1.5 flex items-center justify-between text-xs">
                                        <span className="font-bold text-amber-300 truncate">{selectedCustomerObj.name} ({loyaltyStatus.effectivePoints} Pts)</span>
                                        <button type="button" onClick={() => setSelectedCustomerId('')} className="text-slate-400 hover:text-red-400"><i className="fas fa-times-circle"></i></button>
                                    </div>
                                ) : (
                                    <div className="relative flex-1">
                                        <input type="text" value={customerSearch} onFocus={() => setCustFocus(true)} onBlur={() => setTimeout(() => setCustFocus(false), 180)} onChange={e => setCustomerSearch(e.target.value)} placeholder="Search customer..." className="w-full bg-slate-800 text-slate-100 pl-8 pr-3 py-1.5 rounded-xl border border-slate-600 text-xs outline-none" />
                                        <i className="fas fa-user absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                                        {custFocus && customers.length > 0 && (
                                            <div className="absolute z-40 left-0 right-0 mt-1 bg-slate-800 border border-slate-600 rounded-xl shadow-2xl max-h-44 overflow-y-auto divide-y divide-slate-700">
                                                {customers.filter(c => !customerSearch || (c.name || '').toLowerCase().includes(customerSearch.toLowerCase()) || String(c.phone || '').includes(customerSearch)).slice(0, 10).map(c => (
                                                    <div key={c.id} onMouseDown={() => { setSelectedCustomerId(c.id); setCustomerSearch(''); }} className="px-3 py-2 hover:bg-slate-700 cursor-pointer flex justify-between text-xs">
                                                        <span className="font-bold text-white">{c.name}</span><span className="text-amber-400">{c.points || 0} Pts</span>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                )}
                                <button type="button" onClick={() => setShowAddCust(true)} className="w-8 h-8 rounded-xl bg-blue-600/20 hover:bg-blue-600 text-blue-300 hover:text-white border border-blue-500/40 flex items-center justify-center shrink-0"><i className="fas fa-user-plus text-xs"></i></button>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-2.5 space-y-2 min-h-0">
                            {cart.length === 0 ? (
                                <div className="h-full flex flex-col items-center justify-center text-slate-500 text-center p-6">
                                    <i className="fas fa-shopping-basket text-4xl mb-2 opacity-30"></i>
                                    <p className="text-sm font-bold text-slate-400">Cart is Empty</p>
                                </div>
                            ) : cart.map(item => (
                                <div key={item.productId} className="bg-slate-900/70 p-2.5 rounded-xl border border-slate-700 flex flex-col gap-2">
                                    <div className="flex justify-between gap-2">
                                        <div className="min-w-0">
                                            <div className="text-xs sm:text-sm font-bold text-slate-100 truncate">{item.name}</div>
                                            <div className="text-[11px] font-mono text-emerald-400">៛{khrFormatter.format(item.price)}</div>
                                        </div>
                                        <button type="button" onClick={() => setCart(prev => prev.filter(i => i.productId !== item.productId))} className="w-7 h-7 rounded-lg bg-red-500/10 hover:bg-red-600 text-red-400 hover:text-white flex items-center justify-center shrink-0"><i className="fas fa-times text-xs"></i></button>
                                    </div>
                                    <div className="flex items-center justify-between pt-1 border-t border-slate-800">
                                        <div className="flex items-center gap-1">
                                            <button type="button" onClick={() => setCart(prev => prev.map(i => i.productId === item.productId ? { ...i, quantity: Math.max(1, i.quantity - 1) } : i))} className="w-7 h-7 rounded-lg bg-slate-800 text-slate-200 border border-slate-600 text-xs font-bold">-</button>
                                            <span className="min-w-[32px] text-center font-mono text-xs font-black text-white">{item.quantity}</span>
                                            <button type="button" onClick={() => setCart(prev => prev.map(i => i.productId === item.productId ? { ...i, quantity: i.quantity + 1 } : i))} className="w-7 h-7 rounded-lg bg-slate-800 text-slate-200 border border-slate-600 text-xs font-bold">+</button>
                                        </div>
                                        <div className="font-mono font-black text-sm text-emerald-400">៛{khrFormatter.format(item.price * item.quantity)}</div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="p-3 bg-slate-900/90 border-t border-slate-700 space-y-2.5 shrink-0">
                            <div className="flex items-baseline justify-between">
                                <span className="text-xs font-bold uppercase text-slate-400">Total</span>
                                <span className="text-2xl font-black text-emerald-400 font-mono">៛{khrFormatter.format(cartTotal)}</span>
                            </div>
                            {!currentShift ? (
                                <button type="button" onClick={() => setShowShift(true)} className="w-full py-3.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-sm">
                                    <i className="fas fa-play-circle mr-1.5"></i>Open Shift to Sell
                                </button>
                            ) : (
                                <button type="button" disabled={cart.length === 0 || isProcessing} onClick={() => setShowPayment(true)} className="w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 disabled:from-slate-700 disabled:to-slate-700 text-white font-black text-sm">
                                    <i className="fas fa-cash-register mr-1.5"></i>Checkout • ៛{khrFormatter.format(cartTotal)}
                                </button>
                            )}
                        </div>
                    </div>
                </div>

                {/* MOBILE BOTTOM BAR */}
                <div className="md:hidden h-13 bg-slate-900 border-t border-slate-700 grid grid-cols-2 items-center px-2 shrink-0 mt-2 rounded-xl gap-2">
                    <button type="button" onClick={() => setActiveMobileTab('products')} className={`h-9 rounded-lg text-xs font-bold ${activeMobileTab === 'products' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}`}>
                        <i className="fas fa-th-large mr-1.5"></i>Catalog
                    </button>
                    <button type="button" onClick={() => setActiveMobileTab('cart')} className={`h-9 rounded-lg text-xs font-bold ${activeMobileTab === 'cart' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}`}>
                        <i className="fas fa-shopping-basket mr-1.5"></i>Ticket ({cartItemCount})
                    </button>
                </div>
            </div>
        );
    };

    // ========================================================================
    // 10. ROOT STANDALONE POS TERMINAL APP
    // ========================================================================
    function StandalonePOSApp() {
        const [authState, setAuthState] = useState(() => {
            try {
                const cached = JSON.parse(localStorage.getItem('solaris_pos_standalone_profile_v1') || 'null');
                if (cached?.uid) return { loading: false, userProfile: cached };
            } catch (e) {}
            return { loading: true, userProfile: null };
        });
        const [showInstall, setShowInstall] = useState(false);

        useEffect(() => {
            window.SolarisKeepAwakeManager.start();
            return auth.onAuthStateChanged(async (user) => {
                if (!user) {
                    localStorage.removeItem('solaris_pos_standalone_profile_v1');
                    setAuthState({ loading: false, userProfile: null });
                    return;
                }
                try {
                    const snap = await db.collection('users').where('uid', '==', user.uid).limit(1).get();
                    const profile = !snap.empty
                        ? { id: snap.docs[0].id, ...snap.docs[0].data(), uid: user.uid }
                        : { id: user.uid, uid: user.uid, name: user.displayName || user.email?.split('@')[0] || 'Cashier', email: user.email || '', role: 'Staff', permissions: ['pos-terminal'] };
                    try { localStorage.setItem('solaris_pos_standalone_profile_v1', JSON.stringify(profile)); } catch (e) {}
                    setAuthState({ loading: false, userProfile: profile });
                } catch (e) {
                    setAuthState(prev => prev.userProfile ? prev : { loading: false, userProfile: { id: user.uid, uid: user.uid, name: user.email?.split('@')[0] || 'Cashier', role: 'Staff', permissions: ['pos-terminal'] } });
                }
            });
        }, []);

        if (authState.loading) {
            return <div className="h-screen bg-slate-900 flex items-center justify-center"><div className="loader w-10 h-10"></div></div>;
        }
        if (!authState.userProfile) return <LoginPage />;

        return (
            <DataProvider>
                <div className="h-screen h-[100dvh] bg-slate-900 text-slate-200 flex flex-col overflow-hidden">
                    <InstallAppModal show={showInstall} onClose={() => setShowInstall(false)} />
                    <POSHeader userProfile={authState.userProfile} onOpenInstallModal={() => setShowInstall(true)} />
                    <POSTerminal userProfile={authState.userProfile} />
                </div>
            </DataProvider>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StandalonePOSApp />);
    </script>
</body>
