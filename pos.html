                                    manualDiscount: parsedManualDiscount,
                                    manualDiscountPct: parsedManualDiscountPct,
                                    apvRef: apvRefInput.trim(),
                                    verifiedAba: verifiedAbaPayload,
                                    khqrCurrency
                                })}
                                disabled={!canPay || isProcessing}
                                className="flex-[2] py-3 font-bold text-white bg-green-600 rounded-lg hover:bg-green-700 disabled:bg-slate-600 disabled:cursor-not-allowed flex items-center justify-center gap-2 transition"
                            >
                                {isProcessing ? <div className="loader w-4 h-4"></div> : <i className="fas fa-check"></i>}
                                Complete Sale
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    // ========================================================================
    // 10. STANDALONE POS TERMINAL WORKSPACE
    // ========================================================================
    const POSTerminal = ({ userProfile, activeShopId, setActiveShopId, activeShift, setActiveShift, showShiftModal, setShowShiftModal, showHistoryModal, setShowHistoryModal, showBankAutoSumModal, setShowBankAutoSumModal }) => {
        const { products, shops, devices, customers, loyaltyRules, systemConfig, currentDeviceId } = useData();
        const [searchTerm, setSearchTerm] = useState('');
        const [selectedCategory, setSelectedCategory] = useState('All');
        const [viewMode, setViewMode] = useState('list'); // 'list' (Default inline Code • Barcode • QTY) | 'grid' (1:1 photo grid)
        const [cart, setCart] = useState([]);
        const [heldTickets, setHeldTickets] = useState(() => {
            try { return JSON.parse(localStorage.getItem('solaris_pos_held_tickets_v1') || '[]'); } catch (e) { return []; }
        });
        const [showHeldModal, setShowHeldModal] = useState(false);
        const [selectedCustomerId, setSelectedCustomerId] = useState('');
        const [discountPct, setDiscountPct] = useState(0);
        const [showPaymentModal, setShowPaymentModal] = useState(false);
        const [isProcessing, setIsProcessing] = useState(false);
        const [completedReceipt, setCompletedReceipt] = useState(null);
        const [thankYouModalData, setThankYouModalData] = useState(null);
        const [modalMsg, setModalMsg] = useState({ show: false, title: '', message: '', isError: false });
        const [todaySales, setTodaySales] = useState([]);

        const debouncedSearch = useDebounce(searchTerm, 120);
        const searchInputRef = useRef(null);

        const availableShops = useMemo(() => {
            if (userProfile?.role === 'Admin') return shops;
            const assigned = userProfile?.assignedShops || [];
            return shops.filter(s => assigned.includes(s.id));
        }, [shops, userProfile]);

        const activeShop = useMemo(() => availableShops.find(s => s.id === activeShopId) || availableShops[0] || null, [availableShops, activeShopId]);
        const currentDevice = useMemo(() => devices.find(d => d.id === currentDeviceId) || null, [devices, currentDeviceId]);
        const selectedCustomer = useMemo(() => customers.find(c => c.id === selectedCustomerId) || null, [customers, selectedCustomerId]);
        const activeLoyaltyRule = useMemo(() => {
            if (!loyaltyRules || loyaltyRules.length === 0) return null;
            const branchRule = loyaltyRules.find(r => r.shopId === activeShop?.id && r.status !== 'Inactive');
            return branchRule || loyaltyRules.find(r => r.shopId === 'All' && r.status !== 'Inactive') || null;
        }, [loyaltyRules, activeShop?.id]);

        useEffect(() => {
            if (!showBankAutoSumModal) return;
            if (!activeShift) {
                setShowBankAutoSumModal(false);
                setModalMsg({
                    show: true,
                    title: 'Shift Required',
                    message: 'Please open a shift to view the Bank AutoSum for your current session.',
                    isError: true
                });
            }
        }, [showBankAutoSumModal, activeShift, setShowBankAutoSumModal]);

        // Load Today's Sales for History Modal
        useEffect(() => {
            if (!showHistoryModal || !activeShop?.id) return;
            const startOfDay = new Date();
            startOfDay.setHours(0, 0, 0, 0);
            const list = window.SolarisLocalSalesStore.getSales().filter(s =>
                s && s.shopId === activeShop.id && (safeToDate(s.createdAt)?.getTime() || 0) >= startOfDay.getTime()
            );
            setTodaySales(list);
        }, [showHistoryModal, activeShop?.id, completedReceipt]);

        const categoriesList = useMemo(() => {
            const set = new Set(['All']);
            products.forEach(p => {
                const cat = (p.category || p.categoryName || '').trim();
                if (cat) set.add(cat);
            });
            return Array.from(set);
        }, [products]);

        const filteredProducts = useMemo(() => {
            const q = debouncedSearch.trim().toLowerCase();
            return products.filter(p => {
                if (selectedCategory !== 'All') {
                    const cat = (p.category || p.categoryName || '').trim();
                    if (cat !== selectedCategory) return false;
                }
                if (!q) return true;
                return (
                    (p.name || '').toLowerCase().includes(q) ||
                    (p.code || '').toLowerCase().includes(q) ||
                    String(p.barcode || '').toLowerCase().includes(q)
                );
            }).slice(0, 120);
        }, [products, selectedCategory, debouncedSearch]);

        const subtotal = useMemo(() => cart.reduce((sum, item) => sum + ((Number(item.price) || 0) * (Number(item.quantity) || 1)), 0), [cart]);
        const discountAmount = useMemo(() => Math.round(subtotal * (Math.max(0, Math.min(100, Number(discountPct) || 0)) / 100)), [subtotal, discountPct]);
        const grandTotal = Math.max(0, subtotal - discountAmount);
        const exchangeRate = Math.max(100, Number(activeShop?.khqrConfig?.exchangeRate) || 4000);

        // 0ms Pre-Paint Synchronous Broadcast of Live Cart to Customer Display (`POS-KHRQ.html`)
        React.useLayoutEffect(() => {
            if (!activeShop?.id || showPaymentModal) return;
            if (cart.length === 0) {
                window.SolarisPayWayVerifier.broadcastCustomerDisplaySession(activeShop.id, {
                    status: 'IDLE',
                    shopName: activeShop.brandingName || activeShop.name,
                    exchangeRate
                });
            } else {
                window.SolarisPayWayVerifier.broadcastCustomerDisplaySession(activeShop.id, {
                    status: 'CART',
                    shopName: activeShop.brandingName || activeShop.name,
                    items: cart,
                    itemCount: cart.reduce((s, i) => s + (Number(i.quantity) || 1), 0),
                    subtotalKhr: subtotal,
                    discountKhr: discountAmount,
                    amountKhr: grandTotal,
                    amountUsd: (grandTotal / exchangeRate).toFixed(2),
                    exchangeRate,
                    customerName: selectedCustomer?.name || '',
                    customerPoints: Number(selectedCustomer?.points) || 0
                });
            }
        }, [cart, subtotal, discountAmount, grandTotal, activeShop, exchangeRate, selectedCustomer, showPaymentModal]);

        // Audited Cart Log (Syncs Delete Item & Clear Cart to Sale Report -> Cleared Carts Log)
        const logCartAuditAction = useCallback((actionType, targetItems = []) => {
            if (!Array.isArray(targetItems) || targetItems.length === 0) return;
            const totalQty = targetItems.reduce((sum, i) => sum + (Number(i.quantity) || 1), 0);
            const totalAmount = targetItems.reduce((sum, i) => sum + ((Number(i.price) || 0) * (Number(i.quantity) || 1)), 0);
            const logRef = db.collection('clearedCarts').doc();
            const nowIso = new Date().toISOString();

            const auditPayload = {
                id: logRef.id,
                actionType, // 'delete_item' | 'clear_cart'
                shopId: activeShop?.id || '',
                shopName: activeShop?.name || 'Unknown Shop',
                cashierId: userProfile?.uid || '',
                cashierName: userProfile?.name || 'Cashier',
                deviceId: currentDevice?.id || '',
                deviceName: currentDevice?.name || 'POS-01',
                shiftId: activeShift?.id || '',
                items: targetItems.map(i => ({
                    productId: i.productId || '',
                    code: i.code || '',
                    name: i.name || '',
                    price: Number(i.price) || 0,
                    quantity: Number(i.quantity) || 1
                })),
                totalQty,
                totalAmount,
                createdAt: nowIso
            };

            window.SolarisLocalSalesStore.recordClearedCart(auditPayload);
            logRef.set({
                ...auditPayload,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(() => {});
        }, [activeShop, userProfile, currentDevice, activeShift]);

        const addToCart = useCallback((product) => {
            const effectivePrice = getEffectiveShopPrice(product, activeShop?.id);
            setCart(prev => {
                const idx = prev.findIndex(i => i.productId === product.id);
                if (idx !== -1) {
                    const next = [...prev];
                    next[idx] = { ...next[idx], quantity: next[idx].quantity + 1 };
                    return next;
                }
                return [...prev, {
                    productId: product.id,
                    code: product.code || '',
                    name: product.name || 'Item',
                    price: effectivePrice,
                    originalPrice: effectivePrice,
                    cost: Number(product.cost) || 0,
                    quantity: 1,
                    note: ''
                }];
            });
        }, [activeShop?.id]);

        const updateCartQty = (idx, delta) => {
            setCart(prev => {
                const next = [...prev];
                const nextQty = (Number(next[idx].quantity) || 1) + delta;
                if (nextQty <= 0) {
                    logCartAuditAction('delete_item', [next[idx]]);
                    next.splice(idx, 1);
                } else {
                    next[idx] = { ...next[idx], quantity: nextQty };
                }
                return next;
            });
        };

        const handleRemoveCartItem = (idx) => {
            setCart(prev => {
                const target = prev[idx];
                if (target) logCartAuditAction('delete_item', [target]);
                return prev.filter((_, i) => i !== idx);
            });
        };

        const handleClearCart = () => {
            if (cart.length === 0) return;
            logCartAuditAction('clear_cart', cart);
            setCart([]);
            setDiscountPct(0);
            setSelectedCustomerId('');
        };

        const handleHoldTicket = () => {
            if (cart.length === 0) return;
            const ticket = {
                id: `HOLD-${Date.now()}`,
                savedAt: new Date().toISOString(),
                items: cart,
                customerId: selectedCustomerId,
                discountPct,
                total: grandTotal
            };
            const next = [ticket, ...heldTickets].slice(0, 30);
            setHeldTickets(next);
            try { localStorage.setItem('solaris_pos_held_tickets_v1', JSON.stringify(next)); } catch (e) {}
            setCart([]);
            setDiscountPct(0);
            setSelectedCustomerId('');
        };

        const handleRecallTicket = (ticket) => {
            setCart(ticket.items || []);
            setSelectedCustomerId(ticket.customerId || '');
            setDiscountPct(ticket.discountPct || 0);
            const next = heldTickets.filter(t => t.id !== ticket.id);
            setHeldTickets(next);
            try { localStorage.setItem('solaris_pos_held_tickets_v1', JSON.stringify(next)); } catch (e) {}
            setShowHeldModal(false);
        };

        const handleSearchKeyDown = (e) => {
            if (e.key === 'Enter' && searchTerm.trim()) {
                const q = searchTerm.trim().toLowerCase();
                const exact = products.find(p => String(p.barcode || '').toLowerCase() === q || String(p.code || '').toLowerCase() === q) || filteredProducts[0];
                if (exact) {
                    addToCart(exact);
                    setSearchTerm('');
                }
            }
        };

        const handleProcessSale = async (paymentDetails) => {
            if (!activeShop?.id || cart.length === 0 || isProcessing) return;
            setIsProcessing(true);

            try {
                const workingCart = [...cart];
                if (paymentDetails.addedRewardProduct?.id) {
                    const rp = paymentDetails.addedRewardProduct;
                    const rpShopPrice = getEffectiveShopPrice(rp, activeShop.id);
                    workingCart.push({
                        productId: rp.id,
                        name: rp.name,
                        price: rpShopPrice,
                        originalPrice: rpShopPrice,
                        cost: Number(rp.cost) || 0,
                        quantity: 1,
                        code: rp.code || '',
                        note: 'Loyalty Free Reward Claim'
                    });
                }

                const effectiveSubtotal = workingCart.reduce((sum, i) => sum + ((Number(i.price) || 0) * (Number(i.quantity) || 1)), 0);
                const effectiveTotalCost = workingCart.reduce((sum, i) => sum + ((Number(i.cost) || 0) * (Number(i.quantity) || 1)), 0);
                const redemptionAmount = Math.max(0, parseFloat(paymentDetails.redemptionAmount) || 0);
                const pointsRedeemed = Math.max(0, parseInt(paymentDetails.pointsRedeemed ?? redemptionAmount, 10) || 0);
                const manualDiscount = Math.max(0, parseFloat(paymentDetails.manualDiscount) || 0);
                const totalDiscount = Math.min(effectiveSubtotal, redemptionAmount + manualDiscount);
                const finalGrandTotal = Math.max(0, effectiveSubtotal - totalDiscount);

                const rate = parseFloat(systemConfig?.loyaltyRate) || 0;
                const pointsEarned = selectedCustomer?.id
                    ? (activeLoyaltyRule && Number(activeLoyaltyRule.spendAmountKhr) > 0 && Number(activeLoyaltyRule.earnPoints) > 0
                        ? Math.floor(finalGrandTotal / Number(activeLoyaltyRule.spendAmountKhr)) * Number(activeLoyaltyRule.earnPoints)
                        : (rate > 0 ? Math.floor(finalGrandTotal * (rate / 100)) : 0))
                    : 0;

                const loyaltyEval = evaluateCustomerLoyaltyStatus(selectedCustomer, activeLoyaltyRule);
                const updatedPointsBalance = Math.max(0, loyaltyEval.effectivePoints - pointsRedeemed + pointsEarned);

                const receiptNo = window.SolarisInvoiceEngine.allocateInvoiceNumber(activeShop);
                const saleRef = db.collection('sales').doc();
                const nowIso = new Date().toISOString();
                const verifiedAba = paymentDetails.verifiedAba || null;
                const isAbaVerified = !!(verifiedAba && verifiedAba.isValid && verifiedAba.trxId);
                const abaChannelBadge = isAbaVerified && verifiedAba.paymentChannel && verifiedAba.paymentChannel !== 'ABA PAY'
                    ? ` via ${verifiedAba.paymentChannel}`
                    : '';
                const abaPayerDisplay = isAbaVerified
                    ? `${verifiedAba.payerName || 'ABA Customer'} (${verifiedAba.maskedAccount || '*ABA'})${abaChannelBadge}`
                    : (paymentDetails.apvRef ? 'Verified by Cashier' : null);
                const abaAmountDisplay = isAbaVerified
                    ? (verifiedAba.currency === 'KHR' ? `៛${Number(verifiedAba.amount).toLocaleString()}` : `$${Number(verifiedAba.amount).toFixed(2)}`)
                    : null;

                const saleObj = {
                    id: saleRef.id,
                    receiptNo,
                    shopId: activeShop.id,
                    shopName: activeShop.name || '',
                    deviceId: currentDevice?.id || '',
                    deviceName: currentDevice?.name || 'POS-01',
                    shiftId: activeShift?.id || '',
                    cashierId: userProfile.uid,
                    cashierName: userProfile.name || 'Cashier',
                    customerId: selectedCustomer?.id || null,
                    customerName: selectedCustomer?.name || 'Walk-in',
                    items: workingCart,
                    subtotal: effectiveSubtotal,
                    totalCost: effectiveTotalCost,
                    discount: totalDiscount,
                    manualDiscount,
                    manualDiscountPct: parseFloat(paymentDetails.manualDiscountPct) || 0,
                    redemptionAmount,
                    pointsRedeemed,
                    rewardProductClaimed: paymentDetails.rewardProductClaimed || null,
                    grandTotal: finalGrandTotal,
                    paymentMethod: paymentDetails.method,
                    amountTendered: paymentDetails.tendered,
                    tenderedUSD: paymentDetails.tenderedUSD || 0,
                    tenderedKHR: paymentDetails.tenderedKHR || 0,
                    exchangeRate: paymentDetails.exchangeRate || exchangeRate,
                    changeDue: paymentDetails.change || 0,
                    changeBreakdown: paymentDetails.changeBreakdown || null,
                    pointsEarned,
                    customerPointsBefore: loyaltyEval.effectivePoints,
                    customerPointsAfter: selectedCustomer?.id ? updatedPointsBalance : 0,
                    status: 'paid',
                    abaVerified: isAbaVerified || !!(paymentDetails.method === 'KHQR' && paymentDetails.apvRef),
                    abaTrxId: isAbaVerified ? String(verifiedAba.trxId).trim() : null,
                    abaApv: isAbaVerified ? String(verifiedAba.apv || '') : (paymentDetails.apvRef || null),
                    abaPayer: abaPayerDisplay,
                    abaPaymentChannel: isAbaVerified ? (verifiedAba.paymentChannel || 'ABA PAY') : null,
                    abaSourceBank: isAbaVerified ? (verifiedAba.sourceBank || 'ABA Bank') : null,
                    abaPaidAmountStr: abaAmountDisplay,
                    abaCurrency: isAbaVerified ? verifiedAba.currency : (paymentDetails.khqrCurrency || 'KHR'),
                    abaAmountUsd: isAbaVerified && verifiedAba.currency === 'USD' ? Number(verifiedAba.amount) : 0,
                    createdAt: nowIso
                };

                // 1. 0ms Local Ledger + Broadcast PAID to Customer Display (triggers Khmer/English Voice Announcement!)
                window.SolarisLocalSalesStore.recordSale(saleObj);
                if (isAbaVerified && verifiedAba.trxId) {
                    window.SolarisPayWayVerifier.claimAbaPaymentForSale(verifiedAba.trxId, saleRef.id, receiptNo);
                }
                window.SolarisPayWayVerifier.broadcastCustomerDisplaySession(activeShop.id, {
                    status: 'PAID',
                    shopName: activeShop.brandingName || activeShop.name,
                    invoiceNo: receiptNo,
                    amountKhr: finalGrandTotal,
                    amountUsd: (finalGrandTotal / (paymentDetails.exchangeRate || exchangeRate)).toFixed(2),
                    amountDisplay: abaAmountDisplay || `៛${khrFormatter.format(finalGrandTotal)}`,
                    payerDisplay: abaPayerDisplay || saleObj.customerName,
                    apv: saleObj.abaApv,
                    trxId: saleObj.abaTrxId,
                    verifiedAbaPayload: verifiedAba,
                    paidAt: Date.now()
                });

                // 2. Update Local Shift Totals immediately
                const isCash = paymentDetails.method === 'Cash';
                if (activeShift) {
                    const nextShift = {
                        ...activeShift,
                        totalSales: (Number(activeShift.totalSales) || 0) + finalGrandTotal,
                        totalCashSales: (Number(activeShift.totalCashSales) || 0) + (isCash ? finalGrandTotal : 0),
                        totalKHQRSales: (Number(activeShift.totalKHQRSales) || 0) + (!isCash ? finalGrandTotal : 0),
                        transactionCount: (Number(activeShift.transactionCount) || 0) + 1
                    };
                    setActiveShift(nextShift);
                    try { localStorage.setItem(`solaris_active_shift_${activeShop.id}`, JSON.stringify(nextShift)); } catch (e) {}
                }

                // 3. Background Firestore Batch Commit (Sale + Stock Deduction + Customer Points + Shift Increment)
                const batch = db.batch();
                batch.set(saleRef, { ...saleObj, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                if (activeShop.manageStock !== false) {
                    workingCart.forEach(item => {
                        if (!item.productId) return;
                        window.SolarisSmartProductEngine.applyLocalStockDelta(item.productId, activeShop.id, -item.quantity);
                        batch.update(db.collection('products').doc(item.productId), {
                            [`stockByShop.${activeShop.id}`]: firebase.firestore.FieldValue.increment(-item.quantity),
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    });
                }
                if (selectedCustomer?.id) {
                    const custUpdate = {
                        visitCount: firebase.firestore.FieldValue.increment(1),
                        totalSpent: firebase.firestore.FieldValue.increment(finalGrandTotal),
                        lastVisit: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    if (loyaltyEval.isExpired) custUpdate.points = updatedPointsBalance;
                    else if (pointsEarned - pointsRedeemed !== 0) custUpdate.points = firebase.firestore.FieldValue.increment(pointsEarned - pointsRedeemed);
                    batch.update(db.collection('customers').doc(selectedCustomer.id), custUpdate);
                }
                if (activeShift?.id) {
                    batch.set(db.collection('shifts').doc(activeShift.id), {
                        totalSales: firebase.firestore.FieldValue.increment(finalGrandTotal),
                        totalCashSales: firebase.firestore.FieldValue.increment(isCash ? finalGrandTotal : 0),
                        totalKHQRSales: firebase.firestore.FieldValue.increment(!isCash ? finalGrandTotal : 0),
                        transactionCount: firebase.firestore.FieldValue.increment(1)
                    }, { merge: true });
                }
                batch.commit().catch(() => {});

                setShowPaymentModal(false);
                setCart([]);
                setDiscountPct(0);
                setSelectedCustomerId('');
                setCompletedReceipt(saleObj);

                if (isAbaVerified || (paymentDetails.method === 'KHQR' && paymentDetails.apvRef)) {
                    setThankYouModalData({
                        sourceLabel: isAbaVerified
                            ? (verifiedAba.paymentCategory === 'OUTDOOR_KHQR'
                                ? `KHQR Interbank Verified (${verifiedAba.sourceBank || verifiedAba.paymentChannel})`
                                : 'Indoor ABA PAY Auto-Verified')
                            : 'KHQR Reference Confirmed',
                        shopName: activeShop.brandingName || activeShop.name || systemConfig?.appName || 'POS Terminal',
                        amountDisplay: abaAmountDisplay || `៛${khrFormatter.format(finalGrandTotal)}`,
                        payerDisplay: abaPayerDisplay || selectedCustomer?.name || 'Valued Guest',
                        paymentChannel: isAbaVerified ? (verifiedAba.paymentChannel || 'ABA PAY') : 'KHQR',
                        customerName: selectedCustomer?.name || null,
                        invoiceNo: receiptNo,
                        apv: saleObj.abaApv || 'VERIFIED'
                    });
                }
            } finally {
                setIsProcessing(false);
            }
        };

        return (
            <div className="flex-1 flex flex-col lg:flex-row overflow-hidden bg-slate-950 text-slate-200 min-h-0">
                <MessageModal {...modalMsg} onClose={() => setModalMsg({ show: false })} />
                {completedReceipt && <ReceiptModal saleData={completedReceipt} onClose={() => setCompletedReceipt(null)} />}
                {thankYouModalData && <ThankYouPaymentModal data={thankYouModalData} onClose={() => setThankYouModalData(null)} />}
                <ShiftManagementModal
                    show={showShiftModal}
                    onClose={() => setShowShiftModal(false)}
                    activeShift={activeShift}
                    activeShop={activeShop}
                    userProfile={userProfile}
                    currentDevice={currentDevice}
                    onShiftChanged={setActiveShift}
                />
                <BankAutoSumModal
                    show={showBankAutoSumModal && !!activeShift}
                    onClose={() => setShowBankAutoSumModal(false)}
                    currentShift={activeShift}
                    shop={activeShop}
                />
                {showPaymentModal && (
                    <PaymentModal
                        total={subtotal}
                        cart={cart}
                        products={products}
                        loyaltyRule={activeLoyaltyRule}
                        customer={selectedCustomer}
                        shop={activeShop}
                        systemConfig={systemConfig}
                        onConfirm={handleProcessSale}
                        onCancel={() => setShowPaymentModal(false)}
                        isProcessing={isProcessing}
                    />
                )}

                {/* Held Tickets Modal */}
                <Modal show={showHeldModal} onClose={() => setShowHeldModal(false)} maxWidth="max-w-md">
                    <ModalHeader title={`Held Tickets (${heldTickets.length})`} onClose={() => setShowHeldModal(false)} />
                    <ModalBody>
                        {heldTickets.length === 0 ? (
                            <p className="text-center text-slate-400 text-sm py-6">No held tickets saved.</p>
                        ) : (
                            <div className="space-y-2">
                                {heldTickets.map(t => (
                                    <div key={t.id} className="bg-slate-900 p-3 rounded-xl border border-slate-700 flex items-center justify-between gap-2">
                                        <div>
                                            <div className="text-xs font-bold text-white">{t.items?.length || 0} items • ៛{khrFormatter.format(t.total || 0)}</div>
                                            <div className="text-[10px] text-slate-400">{safeFormatDateTime(t.savedAt)}</div>
                                        </div>
                                        <button type="button" onClick={() => handleRecallTicket(t)} className="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold">Recall</button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </ModalBody>
                </Modal>

                {/* Today's History Modal */}
                <Modal show={showHistoryModal} onClose={() => setShowHistoryModal(false)} maxWidth="max-w-2xl">
                    <ModalHeader title={`Today's Sales (${todaySales.length})`} onClose={() => setShowHistoryModal(false)} />
                    <ModalBody>
                        {todaySales.length === 0 ? (
                            <p className="text-center text-slate-400 text-sm py-8">No sales recorded today on this terminal.</p>
                        ) : (
                            <div className="divide-y divide-slate-700">
                                {todaySales.map(s => (
                                    <div key={s.id} className="py-3 flex items-center justify-between gap-3">
                                        <div>
                                            <div className="font-mono font-bold text-sm text-white">{s.receiptNo}</div>
                                            <div className="text-xs text-slate-400">{safeFormatDateTime(s.createdAt)} • {s.paymentMethod}</div>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            <span className="font-mono font-black text-emerald-400">៛{khrFormatter.format(s.grandTotal)}</span>
                                            <button type="button" onClick={() => { setShowHistoryModal(false); setCompletedReceipt(s); }} className="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-blue-600 text-white text-xs font-bold">
                                                <i className="fas fa-print"></i>
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </ModalBody>
                </Modal>

                {/* LEFT: PRODUCT CATALOG */}
                <div className="flex-1 flex flex-col min-w-0 min-h-0 p-2.5 sm:p-3 gap-2.5 overflow-hidden">
                    {/* Top Search, Shop Selector & View Switcher */}
                    <div className="flex flex-wrap items-center gap-2 shrink-0">
                        {availableShops.length > 1 && (
                            <select
                                value={activeShop?.id || ''}
                                onChange={e => setActiveShopId(e.target.value)}
                                className="h-10 bg-slate-900 text-white px-3 rounded-xl border border-slate-700 text-xs font-bold outline-none focus:border-blue-500"
                            >
                                {availableShops.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                            </select>
                        )}
                        <div className="relative flex-1 min-w-[180px]">
                            <input
                                ref={searchInputRef}
                                type="text"
                                value={searchTerm}
                                onChange={e => setSearchTerm(e.target.value)}
                                onKeyDown={handleSearchKeyDown}
                                placeholder="Scan barcode or search product..."
                                className="w-full h-10 bg-slate-900 text-white pl-9 pr-8 rounded-xl border border-slate-700 focus:border-blue-500 outline-none text-sm"
                            />
                            <i className="fas fa-barcode absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            {searchTerm && (
                                <button type="button" onClick={() => setSearchTerm('')} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
                                    <i className="fas fa-times-circle"></i>
                                </button>
                            )}
                        </div>
                        <div className="flex bg-slate-900 p-1 rounded-xl border border-slate-700 shrink-0">
                            <button type="button" onClick={() => setViewMode('list')} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${viewMode === 'list' ? 'bg-blue-600 text-white' : 'text-slate-400'}`} title="List View">
                                <i className="fas fa-list"></i>
                            </button>
                            <button type="button" onClick={() => setViewMode('grid')} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${viewMode === 'grid' ? 'bg-blue-600 text-white' : 'text-slate-400'}`} title="1:1 Photo Grid View">
                                <i className="fas fa-th-large"></i>
                            </button>
                        </div>
                    </div>

                    {/* Category Filter Pills */}
                    <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar shrink-0 pb-0.5">
                        {categoriesList.map(cat => (
                            <button
                                key={cat}
                                type="button"
                                onClick={() => setSelectedCategory(cat)}
                                className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap border transition ${
                                    selectedCategory === cat
                                        ? 'bg-blue-600 text-white border-blue-400'
                                        : 'bg-slate-900 text-slate-400 border-slate-800 hover:text-white'
                                }`}
                            >
                                {cat}
                            </button>
                        ))}
                    </div>

                    {/* Product Catalog List / Grid */}
                    <div className="flex-1 overflow-y-auto min-h-0 pr-0.5">
                        {filteredProducts.length === 0 ? (
                            <div className="h-full flex flex-col items-center justify-center text-slate-500 py-12">
                                <i className="fas fa-box-open text-4xl mb-2 opacity-40"></i>
                                <p className="text-sm font-semibold">No products found</p>
                            </div>
                        ) : viewMode === 'list' ? (
                            <div className="space-y-1.5">
                                {filteredProducts.map(p => {
                                    const price = getEffectiveShopPrice(p, activeShop?.id);
                                    const stockQty = Number(p.stockByShop?.[activeShop?.id]) || 0;
                                    const minStock = Number(p.minStock) || 0;
                                    const stockColor = stockQty <= 0 ? 'text-red-400' : (minStock > 0 && stockQty < minStock ? 'text-amber-400' : 'text-slate-300');
                                    return (
                                        <button
                                            key={p.id}
                                            type="button"
                                            onClick={() => addToCart(p)}
                                            className="w-full bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-blue-500/50 rounded-xl px-3.5 py-2.5 flex items-center justify-between gap-3 text-left transition active:scale-[0.99]"
                                        >
                                            <div className="min-w-0 flex-1">
                                                <div className="text-sm font-bold text-white truncate">{p.name}</div>
                                                <div className="text-xs font-mono text-slate-400 truncate mt-0.5">
                                                    <span>{p.code || '-'}</span>
                                                    {p.barcode && <span> • {p.barcode}</span>}
                                                    <span className={`font-bold ${stockColor}`}> • {stockQty}</span>
                                                </div>
                                            </div>
                                            <div className="text-right shrink-0">
                                                <div className="text-sm font-black text-emerald-400 font-mono">៛{khrFormatter.format(price)}</div>
                                            </div>
                                        </button>
                                    );
                                })}
                            </div>
                        ) : (
                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 gap-2.5">
                                {filteredProducts.map(p => {
                                    const price = getEffectiveShopPrice(p, activeShop?.id);
                                    const stockQty = Number(p.stockByShop?.[activeShop?.id]) || 0;
                                    return (
                                        <button
                                            key={p.id}
                                            type="button"
                                            onClick={() => addToCart(p)}
                                            className="bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-blue-500/60 rounded-2xl p-2 flex flex-col text-left transition active:scale-95"
                                        >
                                            <div className="w-full aspect-square rounded-xl bg-slate-800 overflow-hidden mb-2 flex items-center justify-center relative">
                                                {p.imageUrl ? (
                                                    <img src={p.imageUrl} alt={p.name} className="w-full h-full object-cover" />
                                                ) : (
                                                    <i className="fas fa-box text-2xl text-slate-600"></i>
                                                )}
                                                <span className={`absolute top-1.5 right-1.5 px-1.5 py-0.5 rounded-md text-[10px] font-mono font-black bg-slate-950/80 ${stockQty <= 0 ? 'text-red-400' : 'text-emerald-300'}`}>
                                                    {stockQty}
                                                </span>
                                            </div>
                                            <div className="text-xs font-bold text-white line-clamp-2 leading-snug flex-1">{p.name}</div>
                                            <div className="text-xs font-black text-emerald-400 font-mono mt-1">៛{khrFormatter.format(price)}</div>
                                        </button>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                </div>

                {/* RIGHT: LIVE CART & CHECKOUT PANEL */}
                <div className="w-full lg:w-[370px] xl:w-[410px] bg-slate-900 border-t lg:border-t-0 lg:border-l border-slate-800 flex flex-col shrink-0 max-h-[48dvh] lg:max-h-none">
                    {/* Cart Header */}
                    <div className="px-3.5 py-2.5 border-b border-slate-800 flex items-center justify-between gap-2 shrink-0">
                        <div className="flex items-center gap-2">
                            <i className="fas fa-shopping-cart text-blue-400"></i>
                            <span className="font-black text-sm text-white">Cart ({cart.reduce((s, i) => s + i.quantity, 0)})</span>
                        </div>
                        <div className="flex items-center gap-1.5">
                            <button type="button" onClick={handleHoldTicket} disabled={cart.length === 0} className="px-2.5 py-1 rounded-lg bg-amber-500/15 hover:bg-amber-500 text-amber-300 hover:text-slate-950 text-xs font-bold border border-amber-500/30 disabled:opacity-40 transition" title="Hold Ticket">
                                <i className="fas fa-pause mr-1"></i>Hold
                            </button>
                            <button type="button" onClick={() => setShowHeldModal(true)} className="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold border border-slate-700 transition">
                                Recall ({heldTickets.length})
                            </button>
                            <button type="button" onClick={handleClearCart} disabled={cart.length === 0} className="w-7 h-7 rounded-lg bg-rose-500/15 hover:bg-rose-600 text-rose-400 hover:text-white border border-rose-500/30 flex items-center justify-center disabled:opacity-40 transition" title="Clear Cart">
                                <i className="fas fa-trash-alt text-xs"></i>
                            </button>
                        </div>
                    </div>

                    {/* Customer & Discount Row */}
                    <div className="px-3.5 py-2 border-b border-slate-800 grid grid-cols-12 gap-2 shrink-0">
                        <select
                            value={selectedCustomerId}
                            onChange={e => setSelectedCustomerId(e.target.value)}
                            className="col-span-8 bg-slate-950 text-slate-200 px-2.5 py-1.5 rounded-lg border border-slate-700 text-xs font-semibold outline-none"
                        >
                            <option value="">Walk-in Customer</option>
                            {customers.map(c => <option key={c.id} value={c.id}>{c.name} ({c.phone})</option>)}
                        </select>
                        <div className="col-span-4 relative">
                            <input
                                type="number"
                                min="0"
                                max="100"
                                value={discountPct || ''}
                                onChange={e => setDiscountPct(e.target.value)}
                                placeholder="Disc %"
                                className="w-full bg-slate-950 text-rose-400 font-bold pl-2.5 pr-6 py-1.5 rounded-lg border border-slate-700 text-xs outline-none text-right"
                            />
                            <span className="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] text-slate-500 font-bold">%</span>
                        </div>
                    </div>

                    {/* Cart Items */}
                    <div className="flex-1 overflow-y-auto p-3 space-y-2 min-h-0">
                        {cart.length === 0 ? (
                            <div className="h-full flex flex-col items-center justify-center text-slate-500 py-8">
                                <i className="fas fa-basket-shopping text-3xl mb-2 opacity-30"></i>
                                <p className="text-xs font-semibold">Tap any product to start ringing</p>
                            </div>
                        ) : (
                            cart.map((item, idx) => (
                                <div key={`${item.productId}_${idx}`} className="bg-slate-800/70 border border-slate-700/80 rounded-xl p-2.5 flex items-center justify-between gap-2">
                                    <div className="min-w-0 flex-1">
                                        <div className="text-xs font-bold text-white truncate">{item.name}</div>
                                        <div className="text-[11px] font-mono text-emerald-400">៛{khrFormatter.format(item.price)}</div>
                                    </div>
                                    <div className="flex items-center gap-1.5 shrink-0">
                                        <button type="button" onClick={() => updateCartQty(idx, -1)} className="w-7 h-7 rounded-lg bg-slate-700 hover:bg-slate-600 text-white font-black text-xs">-</button>
                                        <span className="w-6 text-center font-mono font-black text-xs text-white">{item.quantity}</span>
                                        <button type="button" onClick={() => updateCartQty(idx, 1)} className="w-7 h-7 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-black text-xs">+</button>
                                        <button type="button" onClick={() => handleRemoveCartItem(idx)} className="w-7 h-7 rounded-lg bg-rose-500/15 hover:bg-rose-600 text-rose-400 hover:text-white flex items-center justify-center ml-0.5" title="Remove Item">
                                            <i className="fas fa-times text-xs"></i>
                                        </button>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>

                    {/* Totals & Pay Button */}
                    <div className="p-3.5 border-t border-slate-800 bg-slate-950/60 space-y-2.5 shrink-0">
                        <div className="flex justify-between items-baseline">
                            <span className="text-xs font-bold uppercase text-slate-400">Total Due</span>
                            <div className="text-right">
                                <div className="text-2xl font-black text-emerald-400 font-mono leading-none">៛{khrFormatter.format(grandTotal)}</div>
                                <div className="text-[11px] font-mono text-sky-400 mt-0.5">≈ ${(grandTotal / exchangeRate).toFixed(2)} USD</div>
                            </div>
                        </div>
                        <button
                            type="button"
                            disabled={cart.length === 0}
                            onClick={() => setShowPaymentModal(true)}
                            className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-600 to-blue-600 hover:from-emerald-500 hover:to-blue-500 disabled:opacity-40 text-white font-black text-base shadow-lg transition active:scale-[0.98] flex items-center justify-center gap-2"
                        >
                            <i className="fas fa-cash-register"></i>
                            <span>Pay Now</span>
                        </button>
                    </div>
                </div>
            </div>
        );
    };

    // ========================================================================
    // 11. ROOT STANDALONE POS APP
    // ========================================================================
    function POSApp() {
        const [authState, setAuthState] = useState(() => {
            try {
                const cached = JSON.parse(localStorage.getItem('solaris_pos_standalone_profile_v1') || 'null');
                if (cached && cached.uid) return { loading: false, userProfile: cached };
            } catch (e) {}
            return { loading: true, userProfile: null };
        });

        useEffect(() => {
            if (window.SolarisKeepAwakeManager) window.SolarisKeepAwakeManager.start();
            const unsub = auth.onAuthStateChanged(async (fbUser) => {
                if (!fbUser) {
                    setAuthState({ loading: false, userProfile: null });
                    return;
                }
                try {
                    const doc = await db.collection('users').doc(fbUser.uid).get();
                    const profile = doc.exists
                        ? { id: doc.id, ...doc.data(), uid: fbUser.uid }
                        : { id: fbUser.uid, uid: fbUser.uid, name: fbUser.email?.split('@')[0] || 'Cashier', email: fbUser.email || '', role: 'Staff', assignedShops: [], permissions: ['pos-terminal'] };
                    try { localStorage.setItem('solaris_pos_standalone_profile_v1', JSON.stringify(profile)); } catch (e) {}
                    setAuthState({ loading: false, userProfile: profile });
                } catch (e) {
                    setAuthState(prev => prev.userProfile ? prev : {
                        loading: false,
                        userProfile: { id: fbUser.uid, uid: fbUser.uid, name: fbUser.email?.split('@')[0] || 'Cashier', email: fbUser.email || '', role: 'Staff', assignedShops: [], permissions: ['pos-terminal'] }
                    });
                }
            });
            return () => unsub();
        }, []);

        if (authState.loading) {
            return (
                <div className="h-screen w-screen bg-slate-950 flex flex-col items-center justify-center text-white gap-3">
                    <div className="loader w-8 h-8"></div>
                    <p className="text-xs font-bold text-slate-400">Starting POS Terminal...</p>
                </div>
            );
        }

        if (!authState.userProfile) return <LoginPage />;

        return (
            <DataProvider>
                <POSWorkspaceShell userProfile={authState.userProfile} />
            </DataProvider>
        );
    }

    const POSWorkspaceShell = ({ userProfile }) => {
        const { shops, systemConfig } = useData();
        const [activeShopId, setActiveShopId] = useState('');
        const [activeShift, setActiveShift] = useState(null);
        const [showInstallModal, setShowInstallModal] = useState(false);
        const [showShiftModal, setShowShiftModal] = useState(false);
        const [showHistoryModal, setShowHistoryModal] = useState(false);
        const [showBankAutoSumModal, setShowBankAutoSumModal] = useState(false);

        const availableShops = useMemo(() => {
            if (!shops || shops.length === 0) return [];
            if (userProfile?.role === 'Admin') return shops;
            const assigned = userProfile?.assignedShops || [];
            return assigned.length > 0 ? shops.filter(s => assigned.includes(s.id)) : shops;
        }, [shops, userProfile]);

        useEffect(() => {
            if (!activeShopId && availableShops.length > 0) {
                setActiveShopId(availableShops[0].id);
            }
        }, [activeShopId, availableShops]);

        const activeShop = useMemo(
            () => availableShops.find(s => s.id === activeShopId) || availableShops[0] || null,
            [availableShops, activeShopId]
        );

        // Subscribe to Invoice Counter & Recover Active Open Shift (0ms Local Cache + Live Firestore Sync)
        useEffect(() => {
            if (!activeShop?.id) {
                setActiveShift(null);
                return;
            }

            const unsubInv = window.SolarisInvoiceEngine?.subscribeShopCounter(activeShop.id) || (() => {});

            // 1. 0ms Local Cache Recovery
            try {
                const cachedShift = JSON.parse(localStorage.getItem(`solaris_active_shift_${activeShop.id}`) || 'null');
                if (cachedShift && cachedShift.id && cachedShift.status === 'open') {
                    setActiveShift(cachedShift);
                } else {
                    setActiveShift(null);
                }
            } catch (e) {
                setActiveShift(null);
            }

            // 2. Live Firestore Open-Shift Sync
            const unsubShift = db.collection('shifts')
                .where('shopId', '==', activeShop.id)
                .where('status', '==', 'open')
                .onSnapshot(snap => {
                    if (!snap.empty) {
                        const openDocs = snap.docs
                            .map(d => ({ id: d.id, ...d.data() }))
                            .sort((a, b) => (safeToDate(b.startTime || b.createdAt)?.getTime() || 0) - (safeToDate(a.startTime || a.createdAt)?.getTime() || 0));
                        const latestOpen = openDocs[0];
                        setActiveShift(latestOpen);
                        try {
                            localStorage.setItem(`solaris_active_shift_${activeShop.id}`, JSON.stringify({
                                ...latestOpen,
                                startTime: safeToDate(latestOpen.startTime)?.toISOString() || latestOpen.startTime,
                                createdAt: safeToDate(latestOpen.createdAt)?.toISOString() || latestOpen.createdAt
                            }));
                        } catch (e) {}
                    }
                }, () => {});

            return () => {
                unsubInv();
                unsubShift();
            };
        }, [activeShop?.id]);

        return (
            <div className="h-screen h-[100dvh] w-screen bg-slate-950 flex flex-col overflow-hidden">
                <InstallAppModal show={showInstallModal} onClose={() => setShowInstallModal(false)} appName={systemConfig?.appName || 'POS Terminal'} />
                <POSHeader
                    userProfile={userProfile}
                    activeShop={activeShop}
                    activeShift={activeShift}
                    onOpenInstallModal={() => setShowInstallModal(true)}
                    onOpenShiftModal={() => setShowShiftModal(true)}
                    onOpenHistoryModal={() => setShowHistoryModal(true)}
                    onOpenBankAutoSumModal={() => setShowBankAutoSumModal(true)}
                />
                <POSTerminal
                    userProfile={userProfile}
                    activeShopId={activeShopId}
                    setActiveShopId={setActiveShopId}
                    activeShift={activeShift}
                    setActiveShift={setActiveShift}
                    showShiftModal={showShiftModal}
                    setShowShiftModal={setShowShiftModal}
                    showHistoryModal={showHistoryModal}
                    setShowHistoryModal={setShowHistoryModal}
                    showBankAutoSumModal={showBankAutoSumModal}
                    setShowBankAutoSumModal={setShowBankAutoSumModal}
                />
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<POSApp />);
    </script>
</body>
</html>
