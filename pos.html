    <!-- Dynamic PWA Manifest + Always-On Keep-Awake Engine -->
    <script>
        window.SolarisPWAManager = {
            deferredPrompt: null,
            isInstalled: false,
            listeners: new Set(),
            subscribe(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
            notify() { this.listeners.forEach(fn => { try { fn(this.getState()); } catch (e) {} }); },
            getState() {
                const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true || document.referrer.includes('android-app://');
                const ua = window.navigator.userAgent || '';
                const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
                return { canInstallPrompt: !!this.deferredPrompt, isInstalled: isStandalone || this.isInstalled, isIOS };
            },
            generateAppIcon(size = 512) {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = size; canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    const grad = ctx.createLinearGradient(0, 0, size, size);
                    grad.addColorStop(0, '#1e3a8a'); grad.addColorStop(0.5, '#1d4ed8'); grad.addColorStop(1, '#0f172a');
                    ctx.fillStyle = grad; ctx.fillRect(0, 0, size, size);
                    ctx.fillStyle = '#ffffff'; ctx.font = `900 ${Math.round(size * 0.28)}px Arial, sans-serif`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('POS', size / 2, size * 0.43);
                    const pillW = size * 0.56, pillH = size * 0.14;
                    ctx.fillStyle = '#10b981';
                    ctx.beginPath();
                    ctx.roundRect((size - pillW) / 2, size * 0.64, pillW, pillH, pillH / 2);
                    ctx.fill();
                    ctx.fillStyle = '#052e16'; ctx.font = `900 ${Math.round(size * 0.075)}px Arial, sans-serif`;
                    ctx.fillText('TERMINAL', size / 2, size * 0.64 + pillH / 2 + 2);
                    return canvas.toDataURL('image/png');
                } catch (e) { return ''; }
            },
            enterKioskFullscreen() {
                try {
                    const docEl = document.documentElement;
                    if (document.fullscreenElement || document.webkitFullscreenElement) return true;
                    const req = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen;
                    if (req) { req.call(docEl).catch(() => {}); return true; }
                } catch (e) {}
                return false;
            },
            exitKioskFullscreen() {
                try {
                    if (document.fullscreenElement || document.webkitFullscreenElement) {
                        const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
                        if (exit) exit.call(document).catch(() => {});
                    }
                } catch (e) {}
            },
            init(appName = 'POS Terminal') {
                const icon192 = this.generateAppIcon(192);
                const icon512 = this.generateAppIcon(512);
                if (icon192) {
                    let appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
                    if (!appleIcon) { appleIcon = document.createElement('link'); appleIcon.rel = 'apple-touch-icon'; document.head.appendChild(appleIcon); }
                    appleIcon.href = icon192;
                }
                const manifestObj = {
                    name: appName, short_name: 'POS Terminal', start_url: window.location.href.split('#')[0],
                    display: 'standalone', background_color: '#0f172a', theme_color: '#0f172a',
                    icons: [
                        { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
                        { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
                    ]
                };
                try {
                    const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
                    let manifestLink = document.querySelector('link[rel="manifest"]');
                    if (!manifestLink) { manifestLink = document.createElement('link'); manifestLink.rel = 'manifest'; document.head.appendChild(manifestLink); }
                    manifestLink.href = URL.createObjectURL(blob);
                } catch (e) {}
            }
        };
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); window.SolarisPWAManager.deferredPrompt = e; window.SolarisPWAManager.notify(); });
        window.addEventListener('appinstalled', () => { window.SolarisPWAManager.deferredPrompt = null; window.SolarisPWAManager.isInstalled = true; window.SolarisPWAManager.notify(); });
        window.addEventListener('DOMContentLoaded', () => window.SolarisPWAManager.init('POS Terminal'));

        // Always-On Keep-Awake Engine (POS Terminal Never Sleeps or Locks While Open)
        window.SolarisKeepAwakeManager = {
            wakeLock: null, noSleepVideo: null, noSleepCanvas: null, noSleepDrawTimer: null, watchdogTimer: null,
            isActive: false, started: false, listeners: new Set(),
            subscribe(fn) { this.listeners.add(fn); try { fn(this.getState()); } catch (e) {} return () => this.listeners.delete(fn); },
            notify() { const st = this.getState(); this.listeners.forEach(fn => { try { fn(st); } catch (e) {} }); },
            getState() {
                const hasNativeLock = !!(this.wakeLock && !this.wakeLock.released);
                const hasVideoLock = !!(this.noSleepVideo && !this.noSleepVideo.paused);
                return { isActive: hasNativeLock || hasVideoLock || this.isActive, mode: hasNativeLock ? 'WakeLock' : (hasVideoLock ? 'NoSleep' : 'Standby') };
            },
            async requestNativeWakeLock() {
                if (typeof navigator === 'undefined' || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return false;
                if (this.wakeLock && !this.wakeLock.released) { this.isActive = true; return true; }
                try {
                    const sentinel = await navigator.wakeLock.request('screen');
                    this.wakeLock = sentinel; this.isActive = true;
                    sentinel.addEventListener('release', () => {
                        this.wakeLock = null; this.notify();
                        if (document.visibilityState === 'visible') setTimeout(() => this.requestNativeWakeLock(), 500);
                    });
                    this.notify(); return true;
                } catch (e) { this.notify(); return false; }
            },
            startNoSleepVideoFallback() {
                try {
                    if (this.noSleepVideo && !this.noSleepVideo.paused) { this.isActive = true; this.notify(); return true; }
                    if (!this.noSleepCanvas) {
                        const c = document.createElement('canvas'); c.width = 2; c.height = 2;
                        const ctx = c.getContext('2d'); if (ctx) { ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, 2, 2); }
                        this.noSleepCanvas = c;
                    }
                    if (!this.noSleepDrawTimer && this.noSleepCanvas) {
                        let toggle = false;
                        this.noSleepDrawTimer = setInterval(() => {
                            const ctx = this.noSleepCanvas.getContext('2d');
                            if (ctx) { toggle = !toggle; ctx.fillStyle = toggle ? '#0f172a' : '#111827'; ctx.fillRect(0, 0, 2, 2); }
                        }, 10000);
                    }
                    if (typeof this.noSleepCanvas.captureStream !== 'function') return false;
                    if (!this.noSleepVideo) {
                        const v = document.createElement('video');
                        v.muted = true; v.loop = true; v.playsInline = true;
                        v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
                        v.style.cssText = 'position:fixed;bottom:0;left:0;width:1px;height:1px;opacity:0.001;pointer-events:none;z-index:-1;';
                        v.srcObject = this.noSleepCanvas.captureStream(1);
                        document.body.appendChild(v); this.noSleepVideo = v;
                    }
                    const p = this.noSleepVideo.play();
                    if (p && typeof p.then === 'function') p.then(() => { this.isActive = true; this.notify(); }).catch(() => {});
                    return true;
                } catch (e) { return false; }
            },
            async engage(fromGesture = false) {
                const ok = await this.requestNativeWakeLock();
                if (!ok || fromGesture) this.startNoSleepVideoFallback();
                this.notify();
            },
            start() {
                if (this.started) { this.engage(false); return; }
                this.started = true; this.engage(false);
                const onGesture = () => this.engage(true);
                const onVis = () => { if (document.visibilityState === 'visible') this.engage(false); };
                window.addEventListener('pointerdown', onGesture, { passive: true });
                window.addEventListener('touchstart', onGesture, { passive: true });
                window.addEventListener('keydown', onGesture, { passive: true });
                document.addEventListener('visibilitychange', onVis);
                window.addEventListener('focus', onVis);
                window.addEventListener('pageshow', onVis);
                this.watchdogTimer = setInterval(() => {
                    if (document.visibilityState === 'visible' && !this.getState().isActive) this.engage(false);
                }, 30000);
            }
        };
    </script>

    <script type="text/babel">
    // ========================================================================
    // 1. FIREBASE & CORE ENGINES (SHARED WITH BACK-OFFICE & CUSTOMER DISPLAY)
    // ========================================================================
    const _k1 = "AIzaSyByG5K";
    const _k2 = "8qZnNNvEOes5m";
    const _k3 = "SOHfM6WqhuoZQM4";
    const firebaseConfig = {
        apiKey: _k1 + _k2 + _k3,
        authDomain: "pos-inv-141126.firebaseapp.com",
        projectId: "pos-inv-141126",
        storageBucket: "pos-inv-141126.firebasestorage.app",
        messagingSenderId: "255649906447",
        appId: "1:255649906447:web:4994fab6b2639ed1ce087a",
        measurementId: "G-L6JEP3RLQW"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    try { if (typeof firebase.firestore.setLogLevel === 'function') firebase.firestore.setLogLevel('silent'); } catch (e) {}

    db.settings({ experimentalAutoDetectLongPolling: true, merge: true });
    db.enablePersistence({ synchronizeTabs: true }).catch(() => {});

    // Persist cashier login locally on dedicated counter devices (can Sign Out anytime)
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});

    window.SolarisQuotaGuard = {
        isTripped: false,
        _retryTimer: null,
        trip() {
            if (window.SolarisPayWayVerifier) window.SolarisPayWayVerifier.isQuotaExceeded = true;
            if (this.isTripped) return;
            this.isTripped = true;
            window.SolarisPayWayVerifier?.stopSharedListeners();
            if (this._retryTimer) clearTimeout(this._retryTimer);
            this._retryTimer = setTimeout(() => this.resetAndReconnect(), 60000);
        },
        resetAndReconnect() {
            this.isTripped = false;
            if (window.SolarisPayWayVerifier) window.SolarisPayWayVerifier.isQuotaExceeded = false;
            if (db && typeof db.enableNetwork === 'function') db.enableNetwork().catch(() => {});
        }
    };

    // Shared Local Sales & Cleared Carts Store (Syncs in 0ms with index.html Sale Report)
    window.SolarisLocalSalesStore = {
        SALES_KEY: 'solaris_local_sales_ledger_v1',
        CLEARED_KEY: 'solaris_local_cleared_carts_v1',
        notify() {
            try {
                if (typeof BroadcastChannel !== 'undefined') {
                    if (!this._bc) this._bc = new BroadcastChannel('solaris_sales_report_bus');
                    this._bc.postMessage({ type: 'SALES_UPDATED', ts: Date.now() });
                }
            } catch (e) {}
        },
        getSales() {
            try { const r = JSON.parse(localStorage.getItem(this.SALES_KEY) || '[]'); return Array.isArray(r) ? r : []; } catch (e) { return []; }
        },
        recordSale(saleObj) {
            if (!saleObj?.id) return;
            try {
                const list = this.getSales().filter(s => s && s.id !== saleObj.id);
                list.unshift({ ...saleObj, timestamp: saleObj.createdAt || new Date().toISOString(), createdAt: saleObj.createdAt || new Date().toISOString() });
                localStorage.setItem(this.SALES_KEY, JSON.stringify(list.slice(0, 600)));
                this.notify();
            } catch (e) {}
        },
        markSaleVoid(saleId, voidMeta = {}) {
            if (!saleId) return;
            try {
                const next = this.getSales().map(s => (s && s.id === saleId) ? { ...s, status: 'void', ...voidMeta } : s);
                localStorage.setItem(this.SALES_KEY, JSON.stringify(next));
                this.notify();
            } catch (e) {}
        },
        recordClearedCart(cartLogObj) {
            if (!cartLogObj?.id) return;
            try {
                const raw = JSON.parse(localStorage.getItem(this.CLEARED_KEY) || '[]');
                const list = (Array.isArray(raw) ? raw : []).filter(c => c && c.id !== cartLogObj.id);
                list.unshift({ ...cartLogObj, timestamp: cartLogObj.createdAt || new Date().toISOString() });
                localStorage.setItem(this.CLEARED_KEY, JSON.stringify(list.slice(0, 300)));
                this.notify();
            } catch (e) {}
        }
    };

    window.safeSignOut = async () => {
        try {
            localStorage.removeItem('solaris_pos_standalone_profile_v1');
            window.SolarisPayWayVerifier?.stopSharedListeners();
            await auth.signOut();
        } catch (e) {}
    };

    const { useState, useEffect, useCallback, useMemo, useRef, createContext, useContext, memo } = React;

    // --- Utilities ---
    const khrFormatter = new Intl.NumberFormat('en-US');
    const usdFormatter = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });

    const safeToDate = (ts) => {
        if (!ts) return null;
        if (ts instanceof Date) return isNaN(ts) ? null : ts;
        if (typeof ts.toDate === 'function') return ts.toDate();
        if (typeof ts === 'number') { const d = new Date(ts); return isNaN(d) ? null : d; }
        if (typeof ts === 'string') { const d = new Date(ts); return isNaN(d) ? null : d; }
        if (typeof ts.seconds === 'number') return new Date(ts.seconds * 1000);
        if (typeof ts._seconds === 'number') return new Date(ts._seconds * 1000);
        if (typeof ts === 'object' && (ts._methodName === 'FieldValue.serverTimestamp' || ts._methodName === 'serverTimestamp')) return new Date();
        return null;
    };

    const safeFormatDateTime = (ts, fallback = '-') => {
        const d = safeToDate(ts);
        if (!d) return fallback;
        const pad = (n) => String(n).padStart(2, '0');
        let h = d.getHours();
        const ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        return `${pad(d.getDate())}-${pad(d.getMonth() + 1)}-${String(d.getFullYear()).slice(-2)} | ${pad(h)}:${pad(d.getMinutes())}:${pad(d.getSeconds())} ${ampm}`;
    };
    const safeFormatTime = (ts, fallback = 'Just now') => safeFormatDateTime(ts, fallback);

    const getEffectiveShopPrice = (product, shopId) => {
        const basePrice = Number(product?.price) || 0;
        if (!shopId || shopId === 'ALL' || shopId === 'All') return basePrice;
        const custom = Number(product?.priceByShop?.[shopId]);
        return custom > 0 ? custom : basePrice;
    };

    const evaluateCustomerLoyaltyStatus = (customer, loyaltyRule) => {
        if (!customer) return { rawPoints: 0, effectivePoints: 0, isExpired: false, expiresAtDate: null };
        const rawPoints = Math.max(0, parseInt(customer.points, 10) || 0);
        if (!loyaltyRule || !loyaltyRule.expirationPeriod || loyaltyRule.expirationPeriod === 'Never' || rawPoints <= 0) {
            return { rawPoints, effectivePoints: rawPoints, isExpired: false, expiresAtDate: null };
        }
        const refDate = safeToDate(customer.lastVisit || customer.updatedAt || customer.createdAt);
        if (!refDate) return { rawPoints, effectivePoints: rawPoints, isExpired: false, expiresAtDate: null };
        const expDate = new Date(refDate.getTime());
        const p = String(loyaltyRule.expirationPeriod).trim();
        if (p === '1 Week') expDate.setDate(expDate.getDate() + 7);
        else if (p === '1 Month') expDate.setMonth(expDate.getMonth() + 1);
        else if (p === '3 Month') expDate.setMonth(expDate.getMonth() + 3);
        else if (p === '6 Month') expDate.setMonth(expDate.getMonth() + 6);
        else if (p === '1 Year') expDate.setFullYear(expDate.getFullYear() + 1);
        const isExpired = Date.now() > expDate.getTime();
        return { rawPoints, effectivePoints: isExpired ? 0 : rawPoints, isExpired, expiresAtDate: expDate };
    };

    const useDebounce = (value, delay) => {
        const [dv, setDv] = useState(value);
        useEffect(() => { const h = setTimeout(() => setDv(value), delay); return () => clearTimeout(h); }, [value, delay]);
        return dv;
    };

    // ========================================================================
    // 2. KHQR, RENDER BRIDGE, PAYWAY VERIFIER & INVOICE ENGINE
    // ========================================================================
    window.SolarisKHQREngine = {
        _qrCache: new Map(),
        _allowedChatIdsSet: new Set(),
        _bypassDbByShopIdMap: new Map(),
        _bypassDbByChatIdMap: new Map(),

        normalizeChatId(rawId) { return String(rawId || '').trim().replace(/^-100/, '').replace(/^-/, '').trim(); },

        syncAllowedShops(shopsList = []) {
            const nextSet = new Set();
            const nextShopBypass = new Map();
            const nextChatBypass = new Map();
            (shopsList || []).forEach(shop => {
                const cfg = shop?.khqrConfig;
                const bypassDb = cfg?.bypassFirebaseDb !== undefined ? cfg.bypassFirebaseDb !== false : true;
                if (shop?.id) nextShopBypass.set(String(shop.id), bypassDb);
                if (cfg && cfg.paywayVerifyEnabled !== false && cfg.paywayChatId) {
                    String(cfg.paywayChatId).split(/[\s,|;]+/).map(id => this.normalizeChatId(id)).filter(Boolean).forEach(id => {
                        nextSet.add(id);
                        nextChatBypass.set(id, bypassDb);
                    });
                }
            });
            this._allowedChatIdsSet = nextSet;
            this._bypassDbByShopIdMap = nextShopBypass;
            this._bypassDbByChatIdMap = nextChatBypass;
            return nextSet;
        },

        shouldBypassFirebaseDb(shopId = '', chatId = '') {
            if (shopId && this._bypassDbByShopIdMap.has(String(shopId))) return this._bypassDbByShopIdMap.get(String(shopId));
            const nc = this.normalizeChatId(chatId);
            if (nc && this._bypassDbByChatIdMap.has(nc)) return this._bypassDbByChatIdMap.get(nc);
            return true;
        },

        isChatIdAllowed(chatIdStr, explicitTarget = '') {
            const incoming = this.normalizeChatId(chatIdStr);
            if (!incoming) return false;
            if (explicitTarget) {
                const list = String(explicitTarget).split(/[\s,|;]+/).map(id => this.normalizeChatId(id)).filter(Boolean);
                if (list.length > 0) return list.includes(incoming);
            }
            return this._allowedChatIdsSet.size > 0 && this._allowedChatIdsSet.has(incoming);
        },

        crc16(str) {
            let crc = 0xFFFF;
            for (let i = 0; i < str.length; i++) {
                crc ^= (str.charCodeAt(i) & 0xFF) << 8;
                for (let j = 0; j < 8; j++) crc = ((crc & 0x8000) !== 0) ? (((crc << 1) ^ 0x1021) & 0xFFFF) : ((crc << 1) & 0xFFFF);
            }
            return crc.toString(16).toUpperCase().padStart(4, '0');
        },

        parseTLV(payload) {
            const res = [];
            if (!payload || typeof payload !== 'string') return res;
            let i = 0;
            while (i + 4 <= payload.length) {
                const tag = payload.slice(i, i + 2);
                const len = parseInt(payload.slice(i + 2, i + 4), 10);
                if (isNaN(len) || len < 0 || i + 4 + len > payload.length) break;
                res.push({ tag, length: len, value: payload.slice(i + 4, i + 4 + len) });
                i += 4 + len;
            }
            return res;
        },

        formatTLV(tag, value) { const s = String(value ?? ''); return `${tag}${String(s.length).padStart(2, '0')}${s}`; },

        extractMerchantInfoFromEMV(emvPayload) {
            if (!emvPayload || typeof emvPayload !== 'string' || !emvPayload.startsWith('000201')) return { merchantName: null, merchantCity: null, mid: null };
            const parsed = this.parseTLV(emvPayload);
            const t29 = parsed.find(t => t.tag === '30' || t.tag === '29');
            let mid = null;
            if (t29?.value) {
                const subs = this.parseTLV(t29.value);
                const raw = subs.find(s => s.tag === '02')?.value || subs.find(s => s.tag === '01')?.value;
                if (raw) { const d = String(raw).replace(/\D/g, ''); mid = d.length >= 9 ? d : String(raw).trim(); }
            }
            return {
                merchantName: parsed.find(t => t.tag === '59')?.value?.trim() || null,
                merchantCity: parsed.find(t => t.tag === '60')?.value?.trim() || null,
                mid
            };
        },

        generateDynamicKHQR(basePayload, amountValue, invoiceNo = '', currency = 'KHR', expMins = 15, customTs = null) {
            if (!basePayload || typeof basePayload !== 'string' || !basePayload.startsWith('000201')) return null;
            const parsed = this.parseTLV(basePayload);
            if (parsed.length < 4) return null;
            const isUsd = String(currency || 'KHR').toUpperCase() === 'USD';
            const curCode = isUsd ? '840' : '116';
            const rawNum = Number(amountValue) || 0;
            const amtStr = isUsd ? (rawNum > 0 ? rawNum.toFixed(2) : '') : (Math.round(rawNum) > 0 ? String(Math.round(rawNum)) : '');
            const hasAmt = rawNum > 0 && amtStr.length > 0;
            const cleanInv = String(invoiceNo || '').replace(/[^a-zA-Z0-9\-_]/g, '').slice(0, 25);
            const nowMs = customTs?.createdAtMs > 0 ? Math.floor(Number(customTs.createdAtMs)) : Date.now();
            const expMs = customTs?.expiresAtMs > nowMs ? Math.floor(Number(customTs.expiresAtMs)) : (nowMs + Math.max(2, Number(expMins) || 15) * 60000);
            const tag99 = this.formatTLV('00', String(nowMs)) + this.formatTLV('01', String(expMs));

            const filtered = parsed.filter(t => t.tag !== '63' && t.tag !== '99');
            const out = [];
            let has01 = false, has53 = false, has54 = false, has62 = false;
            filtered.forEach(item => {
                if (item.tag === '01') { has01 = true; out.push({ tag: '01', value: hasAmt ? '12' : item.value }); }
                else if (item.tag === '53') { has53 = true; out.push({ tag: '53', value: curCode }); }
                else if (item.tag === '54') { has54 = true; if (hasAmt) out.push({ tag: '54', value: amtStr }); }
                else if (item.tag === '62') {
                    has62 = true;
                    if (cleanInv) {
                        const subs = this.parseTLV(item.value).filter(st => st.tag !== '01');
                        subs.unshift({ tag: '01', value: cleanInv });
                        out.push({ tag: '62', value: subs.map(st => this.formatTLV(st.tag, st.value)).join('') });
                    } else out.push(item);
                } else out.push(item);
            });
            if (!has01) out.splice(1, 0, { tag: '01', value: hasAmt ? '12' : '11' });
            if (!has53) { const idx = out.findIndex(t => t.tag === '52'); out.splice(idx !== -1 ? idx + 1 : out.length, 0, { tag: '53', value: curCode }); }
            if (!has54 && hasAmt) { const idx = out.findIndex(t => t.tag === '53'); out.splice(idx !== -1 ? idx + 1 : out.length, 0, { tag: '54', value: amtStr }); }
            if (!has62 && cleanInv) out.push({ tag: '62', value: this.formatTLV('01', cleanInv) });
            if (hasAmt) out.push({ tag: '99', value: tag99 });
            const body = out.map(t => this.formatTLV(t.tag, t.value)).join('') + '6304';
            return body + this.crc16(body);
        },

        renderInstantQRDataURL(payloadText, sizePx = 360, margin = 1, ec = 'H') {
            const clean = String(payloadText || '').trim();
            if (!clean) return '';
            const key = `${clean}__${sizePx}__${margin}__${ec}`;
            if (this._qrCache.has(key)) return this._qrCache.get(key);
            try {
                if (typeof window.qrcode === 'function') {
                    const qr = window.qrcode(0, ec);
                    qr.addData(clean); qr.make();
                    const count = qr.getModuleCount();
                    const total = count + margin * 2;
                    const canvas = document.createElement('canvas');
                    canvas.width = sizePx; canvas.height = sizePx;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, sizePx, sizePx);
                    const scale = sizePx / total;
                    ctx.fillStyle = '#000000';
                    for (let r = 0; r < count; r++) {
                        for (let c = 0; c < count; c++) {
                            if (qr.isDark(r, c)) {
                                const x = Math.floor((c + margin) * scale), y = Math.floor((r + margin) * scale);
                                ctx.fillRect(x, y, Math.ceil((c + margin + 1) * scale) - x, Math.ceil((r + margin + 1) * scale) - y);
                            }
                        }
                    }
                    const url = canvas.toDataURL('image/png');
                    if (this._qrCache.size > 120) this._qrCache.delete(this._qrCache.keys().next().value);
                    this._qrCache.set(key, url);
                    return url;
                }
            } catch (e) {}
            return '';
        },

        parseABAPayWayMessage(rawText) {
            if (!rawText || typeof rawText !== 'string') return { isValid: false };
            const cleanText = rawText.replace(/[\r\n\t]+/g, ' ').replace(/\s+/g, ' ').trim();
            const amtMatch = cleanText.match(/(?:(៛|\$|KHR|USD)\s*([0-9,]+(?:\.[0-9]{1,2})?))\s*(?:paid by|received from)/i);
            const trxMatch = cleanText.match(/Trx\.?\s*ID\s*[:#]?\s*([0-9A-Za-z]+)/i);
            const apvMatch = cleanText.match(/APV\s*[:#]?\s*([0-9A-Za-z]+)/i);
            if (!amtMatch || (!trxMatch && !apvMatch)) return { isValid: false };
            const sym = amtMatch[1].toUpperCase();
            const currency = (sym === '៛' || sym === 'KHR') ? 'KHR' : 'USD';
            const amount = parseFloat(amtMatch[2].replace(/,/g, ''));
            const payerMatch = cleanText.match(/(?:paid by|received from)\s+([^(]+?)(?:\s*\(\s*\*\s*([0-9A-Za-z]+)\s*\)|\s+on\s+|\s+via\s+)/i);
            const viaMatch = cleanText.match(/\bvia\s+(.+?)\s+at\s+/i);
            const atMatch = cleanText.match(/\bat\s+(.+?)(?:\.\s*Trx|\s+Trx)/i);
            const trxId = trxMatch ? trxMatch[1].trim() : `APV-${apvMatch[1].trim()}`;
            const paymentChannel = viaMatch ? viaMatch[1].trim() : 'ABA PAY';
            const isOutdoor = /ABA\s*KHQR/i.test(paymentChannel);
            return {
                isValid: !isNaN(amount) && amount > 0,
                currency, amount,
                payerName: payerMatch ? payerMatch[1].trim() : 'ABA Customer',
                maskedAccount: payerMatch?.[2] ? `*${payerMatch[2].trim()}` : '*ABA',
                paymentChannel,
                paymentCategory: isOutdoor ? 'OUTDOOR_KHQR' : 'INDOOR_ABA',
                sourceBank: isOutdoor ? paymentChannel : 'ABA Bank',
                merchantName: atMatch ? atMatch[1].replace(/\.$/, '').trim() : '',
                trxId,
                apv: apvMatch ? apvMatch[1].trim().replace(/\.$/, '') : trxId.slice(-6),
                rawText: cleanText
            };
        },

        broadcastDetectedAbaPayment(parsed, chatId = '', sourceLabel = 'Render Live SSE', messageDateMs = null) {
            if (!parsed?.isValid || !parsed?.trxId) return;
            const resolvedChatId = String(chatId || parsed.chatId || '').trim();
            if (!this.isChatIdAllowed(resolvedChatId)) return;
            const trxId = String(parsed.trxId).trim();
            if (window.SolarisPayWayVerifier.inMemoryAbaPayments.has(trxId)) {
                const ex = window.SolarisPayWayVerifier.inMemoryAbaPayments.get(trxId);
                if (ex && !ex.claimedByOrderId) window.SolarisPayWayVerifier.notifySubscribers(ex);
                return;
            }
            const recMs = Number(messageDateMs) > 0 ? Number(messageDateMs) : Date.now();
            const entry = {
                updateId: trxId, messageId: trxId, chatId: resolvedChatId, chatTitle: sourceLabel, date: recMs,
                parsedAba: { ...parsed, chatId: resolvedChatId, receivedAt: recMs, paidTimestamp: recMs }
            };
            window.SolarisPayWayVerifier.inMemoryAbaPayments.set(trxId, entry);
            window.SolarisPayWayVerifier.notifySubscribers(entry);
        }
    };

        ensureConnected() {

                es.onmessage = (ev) => {
                    if (!ev.data) return;
                    try {
                        const d = JSON.parse(ev.data);
                        const arr = Array.isArray(d) ? d : (d.payments || d.recentPayments || null);
                        if (Array.isArray(arr)) arr.forEach(item => this.ingestRenderPayload(item));
                        else if (d.type !== 'CONNECTED') this.ingestRenderPayload(d);
                    } catch (e) {}

                es.onerror = () => {

                    try { es.close(); } catch (e) {}
                    this.eventSource = null;
                    setTimeout(() => this.ensureConnected(), 8000);

        },

        async pollRecentFromRender(forceWake = false) {
            if (!this.baseUrl || this._pollInFlight) return { count: 0 };

            try {
                const ctrl = new AbortController();
                const tid = setTimeout(() => ctrl.abort(), 4000);
                const r = await fetch(`${this.baseUrl}${forceWake ? '/recent?scan=1&limit=200' : '/recent?limit=150'}`, { signal: ctrl.signal, cache: 'no-store', mode: 'cors' });
                clearTimeout(tid);
                if (r.ok) {
                    this.isConnected = true;
                    const d = await r.json();
                    const arr = d.payments || d.recentPayments || (Array.isArray(d) ? d : []);
                    let count = 0;
                    arr.forEach(item => { if (this.ingestRenderPayload(item, 'Render (/recent)')) count++; });
                    return { count };

            return { count: 0 };
        }

        broadcastCustomerDisplaySession(shopId, sessionPayload = null) {

            // 1. 0ms Direct postMessage

                if (!win || win.closed) { this._displayWindows.delete(win); continue; }
                try { win.postMessage({ type: 'POS_DISPLAY_SESSION', shopId, payload: fullPayload }, '*'); } catch (e) {}
            }
            // 2. 0ms Same-Origin BroadcastChannel

                };
                req.onsuccess = (e) => resolve(e.target.result);
                req.onerror = (e) => { this._dbPromise = null; reject(e.target.error); };
            });
            return this._dbPromise;
        },
        async getAll(storeName) {
            try {
                const idb = await this.open();
                return await new Promise((res, rej) => {
                    const req = idb.transaction(storeName, 'readonly').objectStore(storeName).getAll();
                    req.onsuccess = () => res(Array.isArray(req.result) ? req.result : []);
                    req.onerror = () => rej(req.error);
                });
            } catch (e) { return []; }
        },
        async putBatch(storeName, items = [], replaceAll = false) {
            try {
                const idb = await this.open();
                await new Promise((res, rej) => {
                    const tx = idb.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    if (replaceAll) store.clear();
                    items.forEach(it => { if (it?.id) store.put(it); });
                    tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error);
                });
            } catch (e) {}
        },
        async getMeta(key) {
            try {
                const idb = await this.open();
                return await new Promise(res => {
                    const req = idb.transaction('meta', 'readonly').objectStore('meta').get(key);
                    req.onsuccess = () => res(req.result ? req.result.value : null);
                    req.onerror = () => res(null);
                });
            } catch (e) { return null; }
        },
        async setMeta(key, value) {
            try {
                const idb = await this.open();
                await new Promise(res => {
                    const tx = idb.transaction('meta', 'readwrite');
                    tx.objectStore('meta').put({ id: key, value, updatedAt: Date.now() });
                    tx.oncomplete = () => res(true); tx.onerror = () => res(false);
                });
            } catch (e) {}
        }
    };

    window.SolarisSmartProductEngine = {
        productsMap: new Map(),
        listeners: new Set(),
        isInitialized: false,
        unsubDelta: null,
        subscribeProducts(fn) {
            this.listeners.add(fn);
            if (this.productsMap.size > 0) try { fn(Array.from(this.productsMap.values())); } catch (e) {}
            return () => this.listeners.delete(fn);
        },
        notifyProducts() {
            const arr = Array.from(this.productsMap.values());
            this.listeners.forEach(fn => { try { fn(arr); } catch (e) {} });
        },
        applyLocalStockDelta(productId, shopId, qtyDelta) {
            const ex = this.productsMap.get(productId);
            if (!ex || !shopId) return;
            const nextStock = { ...(ex.stockByShop || {}), [shopId]: (Number(ex.stockByShop?.[shopId]) || 0) + (Number(qtyDelta) || 0) };
            const merged = { ...ex, stockByShop: nextStock, updatedAt: new Date().toISOString() };
            this.productsMap.set(productId, merged);
            window.SolarisCatalogDB.putBatch('products', [merged], false);
            this.notifyProducts();
        },
        async init() {
            if (this.isInitialized) return;
            this.isInitialized = true;
            const idbProducts = await window.SolarisCatalogDB.getAll('products');
            const lastSyncMs = Number(await window.SolarisCatalogDB.getMeta('products_last_sync_ms')) || 0;
            if (idbProducts.length > 0) {
                idbProducts.forEach(p => { if (p?.id) this.productsMap.set(p.id, p); });
                this.notifyProducts();
                this.startDeltaListener(lastSyncMs || (Date.now() - 300000));
            } else {
                await this.runFullCatalogSync();
            }
        },
        startDeltaListener(sinceMs) {
            if (this.unsubDelta) try { this.unsubDelta(); } catch (e) {}
            const safeDate = new Date(Math.max(0, Number(sinceMs) - 120000));
            this.unsubDelta = db.collection('products').where('updatedAt', '>', safeDate).onSnapshot(snap => {
                const changed = [];
                snap.docChanges().forEach(ch => {
                    if (ch.type === 'removed') { this.productsMap.delete(ch.doc.id); }
                    else { const d = { id: ch.doc.id, ...ch.doc.data() }; this.productsMap.set(ch.doc.id, d); changed.push(d); }
                });
                if (changed.length > 0) {
                    window.SolarisCatalogDB.putBatch('products', changed, false);
                    window.SolarisCatalogDB.setMeta('products_last_sync_ms', Date.now());
                    this.notifyProducts();
                }
            }, () => {});
        },
        async runFullCatalogSync() {
            try {
                const snap = await db.collection('products').get();
                const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                if (all.length > 0) {
                    this.productsMap.clear();
                    all.forEach(p => this.productsMap.set(p.id, p));
                    await window.SolarisCatalogDB.putBatch('products', all, true);
                    const now = Date.now();
                    await window.SolarisCatalogDB.setMeta('products_last_sync_ms', now);
                    this.notifyProducts();
                    this.startDeltaListener(now);
                }
                return { ok: true, count: all.length };
            } catch (e) { return { ok: false, count: this.productsMap.size }; }
        }
    };

    const useLightCollection = (name) => {
        const key = `solaris_col_cache_${name}_[]`;
        const [data, setData] = useState(() => {
            try { const c = JSON.parse(localStorage.getItem(key) || '[]'); return Array.isArray(c) ? c : []; } catch (e) { return []; }
        });
        useEffect(() => {
            const unsub = db.collection(name).onSnapshot(snap => {
                const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                setData(list);
                if (list.length > 0 && list.length <= 500) { try { localStorage.setItem(key, JSON.stringify(list)); } catch (e) {} }
            }, () => {});
            return () => unsub();
        }, [name, key]);
        return data;
    };

        const [systemConfig, setSystemConfig] = useState(() => ({ appName: localStorage.getItem('solaris_cached_app_name') || 'POS Terminal' }));
        const [currentDeviceId, setCurrentDeviceId] = useState(() => localStorage.getItem('pos_deviceId') || '');

        const setLocalDevice = (id) => { localStorage.setItem('pos_deviceId', id); setCurrentDeviceId(id); };

        useEffect(() => {

            window.SolarisSmartProductEngine.init();
            return unsub;
        }, []);

        useEffect(() => {
            const unsub = db.collection('system').doc('config').onSnapshot(doc => {
                if (doc.exists) {
                    const d = doc.data() || {};
                    setSystemConfig(prev => ({ ...prev, ...d }));

            return () => unsub();
        }, []);

        useEffect(() => {
            if (!shops.length) return;
            window.SolarisKHQREngine.syncAllowedShops(shops);

                const light = shops.map(s => ({ id: s.id, name: s.name, brandingName: s.brandingName || '', location: s.location || '', khqrConfig: s.khqrConfig || null }));

        }, [shops]);

        const forceFullProductSync = useCallback(() => window.SolarisSmartProductEngine.runFullCatalogSync(), []);

        return (

    const BankAutoSumModal = ({ show, onClose, currentShift, shop }) => {
        const [payments, setPayments] = useState([]);
        useEffect(() => {
            if (!show || !currentShift) return;
            const shiftStartMs = safeToDate(currentShift.startTime)?.getTime() || Date.now();
            const targetIds = String(shop?.khqrConfig?.paywayChatId || '').split(/[\s,|;]+/).map(id => window.SolarisKHQREngine.normalizeChatId(id)).filter(Boolean);
            const collect = () => {
                const list = [];
                window.SolarisPayWayVerifier.inMemoryAbaPayments.forEach((entry, trxId) => {
                    if (!entry?.parsedAba) return;
                    const recMs = Number(entry.date || entry.parsedAba.receivedAt || 0);
                    if (recMs < shiftStartMs) return;
                    const cid = window.SolarisKHQREngine.normalizeChatId(entry.chatId || entry.parsedAba.chatId);
                    if (targetIds.length > 0 && !targetIds.includes(cid)) return;
                    list.push({ id: trxId, ...entry.parsedAba, receivedAt: recMs, claimed: !!entry.claimedByOrderId });
                });
                setPayments(list.sort((a, b) => b.receivedAt - a.receivedAt));
            };
            collect();
            window.SolarisRenderBridge.pollRecentFromRender(true).then(collect);
            return window.SolarisPayWayVerifier.subscribe(collect);
        }, [show, currentShift, shop]);

        if (!show) return null;
        const totalKHR = payments.filter(p => p.currency === 'KHR').reduce((s, p) => s + Number(p.amount || 0), 0);
        const totalUSD = payments.filter(p => p.currency === 'USD').reduce((s, p) => s + Number(p.amount || 0), 0);

        return (
            <Modal show={show} onClose={onClose} maxWidth="max-w-2xl">
                <ModalHeader title="Bank AutoSum (Live Shift Feed)" onClose={onClose} />
                <ModalBody>
                    <div className="space-y-4">

                                <span className="text-[11px] text-slate-400 uppercase font-bold block">Total KHR</span>
                                <span className="text-xl font-black text-emerald-400">៛{khrFormatter.format(totalKHR)}</span>
                            </div>
                            <div className="bg-slate-900 p-4 rounded-xl border border-slate-700 text-center">
                                <span className="text-[11px] text-slate-400 uppercase font-bold block">Total USD</span>
                                <span className="text-xl font-black text-blue-400">{usdFormatter.format(totalUSD)}</span>
                            </div>
                        </div>
                        <div className="border border-slate-700 rounded-xl overflow-x-auto">
                            <table className="min-w-full divide-y divide-slate-700 text-xs">
                                <thead className="bg-slate-900 text-slate-400 uppercase">
                                    <tr><th className="px-3 py-2.5 text-left">Time</th><th className="px-3 py-2.5 text-left">Payer</th><th className="px-3 py-2.5 text-right">Amount</th><th className="px-3 py-2.5 text-left">APV</th></tr>
                                </thead>
                                <tbody className="divide-y divide-slate-700">
                                    {payments.length === 0 ? <tr><td colSpan="4" className="p-6 text-center text-slate-500">No bank payments detected in this shift yet.</td></tr> : payments.map(p => (
                                        <tr key={p.id}>
                                            <td className="px-3 py-2 font-mono text-slate-300">{safeFormatDateTime(p.receivedAt)}</td>
                                            <td className="px-3 py-2 text-slate-200 font-semibold">{p.payerName}</td>
                                            <td className="px-3 py-2 text-right font-bold text-emerald-400">{p.currency === 'KHR' ? `៛${khrFormatter.format(p.amount)}` : `$${Number(p.amount).toFixed(2)}`}</td>

    const PaymentModal = ({ total, cart = [], customer, shop, loyaltyRule, systemConfig, onConfirm, onCancel, isProcessing }) => {
        const cfg = shop?.khqrConfig || {};
        const [method, setMethod] = useState('Cash');
        const [exchangeRate, setExchangeRate] = useState(() => Math.max(100, Number(cfg.exchangeRate) || 4000));
        const [tenderedKHR, setTenderedKHR] = useState(String(total));
        const [tenderedUSD, setTenderedUSD] = useState('');
        const [manualDiscount, setManualDiscount] = useState('');
        const [discountPin, setDiscountPin] = useState('');
        const [khqrCurrency, setKhqrCurrency] = useState('KHR');
        const [apvRef, setApvRef] = useState('');
        const [verifiedAba, setVerifiedAba] = useState(null);
        const [billRef] = useState(() => window.SolarisInvoiceEngine.peekNextInvoiceNumber(shop));
        const [initiatedAt] = useState(() => Date.now());
        const [expiresAt] = useState(() => Date.now() + 120000);
        const hasAutoRef = useRef(false);

        const reqPin = String(shop?.discountPin || '').replace(/\D/g, '');
        const pinUnlocked = reqPin.length !== 6 || discountPin === reqPin;
        const discPct = Math.max(0, Math.min(100, parseFloat(manualDiscount) || 0));
        const discAmt = Math.min(total, Math.round(total * (discPct / 100)));
        const netTotal = Math.max(0, total - discAmt);
        const usdEquiv = (netTotal / exchangeRate).toFixed(2);
        const totalTendered = (parseFloat(tenderedKHR) || 0) + ((parseFloat(tenderedUSD) || 0) * exchangeRate);
        const change = Math.max(0, totalTendered - netTotal);
        const canPay = method === 'KHQR' || totalTendered >= netTotal;

        const dynamicPayload = useMemo(() => {
            if (!cfg.baseEmvPayload) return '';
            return window.SolarisKHQREngine.generateDynamicKHQR(cfg.baseEmvPayload, khqrCurrency === 'USD' ? Number(usdEquiv) : netTotal, billRef, khqrCurrency, 15, { createdAtMs: initiatedAt, expiresAtMs: expiresAt }) || '';
        }, [cfg.baseEmvPayload, khqrCurrency, usdEquiv, netTotal, billRef, initiatedAt, expiresAt]);
        const qrImg = useMemo(() => dynamicPayload ? window.SolarisKHQREngine.renderInstantQRDataURL(dynamicPayload, 420, 1, 'H') : (cfg.staticQrImage || ''), [dynamicPayload, cfg.staticQrImage]);

        // Broadcast ACTIVE KHQR or CART to Customer Display in 0ms
        useEffect(() => {
            if (!shop?.id) return;
            if (method === 'KHQR') {
                window.SolarisPayWayVerifier.broadcastCustomerDisplaySession(shop.id, {
                    status: 'ACTIVE', shopId: shop.id, shopName: shop.brandingName || shop.name,
                    accountName: cfg.accountName || shop.name, khrAccount: cfg.khrAccount || '', usdAccount: cfg.usdAccount || '',
                    exchangeRate, baseEmvPayload: cfg.baseEmvPayload || '', items: cart,
                    subtotalKhr: total, discountKhr: discAmt, amountKhr: netTotal, amountUsd: Number(usdEquiv),
                    selectedCurrency: khqrCurrency, invoiceNo: billRef, initiatedAt, expiresAt
                });
            }
        }, [method, shop, cfg, exchangeRate, cart, total, discAmt, netTotal, usdEquiv, khqrCurrency, billRef, initiatedAt, expiresAt]);

        // Live ABA PayWay Auto-Verify Listener
        useEffect(() => {
            if (method !== 'KHQR' || cfg.paywayVerifyEnabled === false) return;
            const tryMatch = () => {
                if (hasAutoRef.current) return;
                const order = { khqrExpectedKhr: netTotal, khqrExpectedUsd: Number(usdEquiv), khqrInitiatedAt: initiatedAt };
                for (const [, entry] of window.SolarisPayWayVerifier.inMemoryAbaPayments.entries()) {
                    if (entry?.claimedByOrderId || !entry?.parsedAba?.isValid) continue;
                    if (window.SolarisPayWayVerifier.processedTrxIdsMemory.has(String(entry.parsedAba.trxId))) continue;
                    if (window.SolarisPayWayVerifier.doesMessageMatchOrder(entry.parsedAba, order, shop)) {
                        hasAutoRef.current = true;
                        setVerifiedAba(entry.parsedAba);
                        window.SolarisPayWayVerifier.broadcastCustomerDisplaySession(shop.id, {
                            status: 'PAID', invoiceNo: billRef, amountKhr: netTotal, amountUsd: Number(usdEquiv),
                            payerDisplay: `${entry.parsedAba.payerName} (${entry.parsedAba.maskedAccount})`,
                            amountDisplay: entry.parsedAba.currency === 'KHR' ? `៛${Number(entry.parsedAba.amount).toLocaleString()}` : `$${Number(entry.parsedAba.amount).toFixed(2)}`,
                            apv: entry.parsedAba.apv, trxId: entry.parsedAba.trxId, verifiedAbaPayload: entry.parsedAba, paidAt: Date.now()
                        });
                        onConfirm({
                            method: 'KHQR', invoiceNo: billRef, tendered: netTotal, tenderedUSD: 0, tenderedKHR: 0, exchangeRate, change: 0,
                            discount: discAmt, manualDiscount: discAmt, manualDiscountPct: discPct, apvRef: entry.parsedAba.apv, verifiedAba: entry.parsedAba, khqrCurrency
                        });
                        return;
                    }
                }
            };
            tryMatch();
            const unsub = window.SolarisPayWayVerifier.subscribe(tryMatch);
            const t = setInterval(() => { window.SolarisRenderBridge.pollRecentFromRender(true).then(tryMatch); }, 1500);
            return () => { unsub(); clearInterval(t); };
        }, [method, cfg.paywayVerifyEnabled, netTotal, usdEquiv, initiatedAt, shop, billRef, discAmt, discPct, exchangeRate, khqrCurrency, onConfirm]);

        return (
            <Modal show={true} onClose={onCancel} maxWidth="max-w-md">
                <ModalHeader title={`Checkout — ${billRef}`} onClose={onCancel} />
                <ModalBody>
                    <div className="space-y-3.5">
                        <div className="text-center bg-slate-900 p-4 rounded-2xl border border-slate-700">

                            <div className="text-3xl font-black text-emerald-400 font-mono">៛{khrFormatter.format(netTotal)}</div>
                            <div className="text-xs text-sky-400 font-mono">≈ ${usdEquiv} USD</div>
                        </div>

                        <div className="grid grid-cols-2 gap-2">
                            <button type="button" onClick={() => setMethod('Cash')} className={`py-2.5 rounded-xl font-black text-xs border ${method === 'Cash' ? 'bg-blue-600 text-white border-blue-400' : 'bg-slate-900 text-slate-400 border-slate-700'}`}><i className="fas fa-money-bill-wave mr-1.5"></i>Cash</button>
                            <button type="button" onClick={() => setMethod('KHQR')} className={`py-2.5 rounded-xl font-black text-xs border ${method === 'KHQR' ? 'bg-[#E1232E] text-white border-red-400' : 'bg-slate-900 text-slate-400 border-slate-700'}`}><i className="fas fa-qrcode mr-1.5"></i>ABA KHQR</button>
                        </div>

                        {method === 'Cash' ? (
                            <div className="space-y-3 bg-slate-900/70 p-3.5 rounded-xl border border-slate-700">
                                <div className="grid grid-cols-2 gap-2.5">
                                    <div>
                                        <label className="text-[11px] font-bold text-emerald-400 block mb-1">Received USD ($)</label>
                                        <input type="number" step="0.01" value={tenderedUSD} onChange={e => { setTenderedUSD(e.target.value); setTenderedKHR(''); }} placeholder="0.00" className="w-full bg-slate-800 text-white text-lg font-bold px-3 py-2 rounded-lg border border-slate-600 text-right font-mono" />
                                    </div>
                                    <div>
                                        <label className="text-[11px] font-bold text-blue-400 block mb-1">Received KHR (៛)</label>
                                        <input type="number" value={tenderedKHR} onChange={e => { setTenderedKHR(e.target.value); setTenderedUSD(''); }} placeholder="0" className="w-full bg-slate-800 text-white text-lg font-bold px-3 py-2 rounded-lg border border-slate-600 text-right font-mono" />
                                    </div>
                                </div>
                                <div className="grid grid-cols-5 gap-1.5">
                                    {[5, 10, 20, 50].map(u => <button key={u} type="button" onClick={() => { setTenderedUSD(String(u)); setTenderedKHR(''); }} className="py-1.5 rounded-lg bg-emerald-900/30 text-emerald-300 border border-emerald-700/50 text-xs font-bold">${u}</button>)}
                                    <button type="button" onClick={() => { setTenderedKHR(String(netTotal)); setTenderedUSD(''); }} className="py-1.5 rounded-lg bg-slate-700 text-white text-xs font-bold">Exact</button>
                                </div>
                                <div className="flex justify-between items-center pt-2 border-t border-slate-800 text-sm">
                                    <span className="text-slate-400 font-bold">Change Due:</span>
                                    <span className="text-xl font-black text-sky-400 font-mono">៛{khrFormatter.format(change)}</span>
                                </div>
                            </div>
                        ) : (
                            <div className="bg-white rounded-2xl p-4 text-center text-slate-900 border-4 border-[#004459] space-y-2">
                                <div className="flex justify-center gap-2">
                                    <button type="button" onClick={() => setKhqrCurrency('KHR')} className={`px-3 py-1 rounded-lg text-xs font-black ${khqrCurrency === 'KHR' ? 'bg-[#004459] text-white' : 'bg-stone-100 text-stone-600'}`}>KHR (៛)</button>
                                    <button type="button" onClick={() => setKhqrCurrency('USD')} className={`px-3 py-1 rounded-lg text-xs font-black ${khqrCurrency === 'USD' ? 'bg-[#26A9C8] text-white' : 'bg-stone-100 text-stone-600'}`}>USD ($)</button>

                                <div className="text-xs font-bold text-emerald-700 flex items-center justify-center gap-1.5">
                                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                                    <span>{verifiedAba ? `Verified APV: ${verifiedAba.apv}` : 'Listening for ABA PayWay...'}</span>
                                </div>
                                <input type="text" value={apvRef} onChange={e => setApvRef(e.target.value)} placeholder="Optional Manual APV Ref #" className="w-full bg-stone-100 px-3 py-1.5 rounded-lg border border-stone-300 text-xs font-mono text-center" />
                            </div>

                        <div className="flex items-center gap-2 pt-1">
                            {reqPin.length === 6 && <input type="password" inputMode="numeric" maxLength={6} value={discountPin} onChange={e => setDiscountPin(e.target.value.replace(/\D/g, ''))} placeholder="PIN" className="w-20 bg-slate-900 text-center font-mono text-xs py-2 rounded-lg border border-slate-600 text-white" />}

                        </div>
                    </div>
                </ModalBody>
                <ModalFooter>
                    <button type="button" onClick={onCancel} className="bg-slate-600 text-white font-bold py-2.5 px-5 rounded-xl">Cancel</button>
                    <button type="button" disabled={!canPay || isProcessing} onClick={() => onConfirm({
                        method, invoiceNo: billRef, tendered: method === 'Cash' ? totalTendered : netTotal,
                        tenderedUSD: method === 'Cash' ? (parseFloat(tenderedUSD) || 0) : 0, tenderedKHR: method === 'Cash' ? (parseFloat(tenderedKHR) || 0) : 0,

    const ShiftManagementModal = ({ currentShift, shopId, userProfile, onClose, deviceId, todaySales = [], onShiftStateChange }) => {
        const { shops, devices } = useData();
        const shopObj = shops.find(s => s.id === shopId);
        const deviceName = devices.find(d => d.id === deviceId)?.name || 'POS Terminal';
        const rate = Math.max(100, Number(shopObj?.khqrConfig?.exchangeRate) || 4000);
        const [startCash, setStartCash] = useState('');
        const [shiftName, setShiftName] = useState('AM');
        const [actualCashKHR, setActualCashKHR] = useState('');
        const [actualCashUSD, setActualCashUSD] = useState('');
        const [actualBankKHR, setActualBankKHR] = useState('');
        const [actualBankUSD, setActualBankUSD] = useState('');
        const [closingFloat, setClosingFloat] = useState('');
        const [note, setNote] = useState('');
        const [error, setError] = useState('');

        const shiftSales = useMemo(() => todaySales.filter(s => s.shiftId === currentShift?.id && s.status !== 'void'), [todaySales, currentShift?.id]);
        const sysCash = shiftSales.filter(s => s.paymentMethod === 'Cash').reduce((a, b) => a + (Number(b.grandTotal) || 0), 0);
        const sysBank = shiftSales.filter(s => s.paymentMethod !== 'Cash').reduce((a, b) => a + (Number(b.grandTotal) || 0), 0);

        const handleOpen = () => {
            const ref = db.collection('shifts').doc();
            const nowIso = new Date().toISOString();
            const opt = {
                id: ref.id, shopId, cashierId: userProfile.uid, cashierName: userProfile.name, shiftName, deviceId, deviceName,
                startTime: nowIso, startCash: Number(startCash) || 0, totalSales: 0, totalCashSales: 0, totalKHQRSales: 0, transactionCount: 0, status: 'open', createdAt: nowIso
            };
            onShiftStateChange(opt);
            ref.set({ ...opt, startTime: firebase.firestore.FieldValue.serverTimestamp(), createdAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }).catch(() => {});
            onClose();
        };

        const handleClose = () => {
            if ((Number(closingFloat) || 0) !== (Number(currentShift.startCash) || 0)) {
                setError(`Closing float must match starting float (៛${khrFormatter.format(currentShift.startCash || 0)}).`);
                return;
            }
            const actCash = (Number(actualCashKHR) || 0) + ((Number(actualCashUSD) || 0) * rate);
            const actBank = (Number(actualBankKHR) || 0) + ((Number(actualBankUSD) || 0) * rate);
            const diffCash = actCash - sysCash;
            const diffBank = actBank - sysBank;
            const upd = {
                status: 'closed', endTime: firebase.firestore.FieldValue.serverTimestamp(), closedBy: userProfile.name,
                closeInputCashKHR: Number(actualCashKHR) || 0, closeInputCashUSD: Number(actualCashUSD) || 0,
                closeInputBankKHR: Number(actualBankKHR) || 0, closeInputBankUSD: Number(actualBankUSD) || 0,
                closeExchangeRate: rate, closeFloatingCash: Number(closingFloat) || 0, closeNote: note,
                actualCash: actCash, expectedCash: sysCash, differenceCash: diffCash,
                actualKHQR: actBank, expectedKHQR: sysBank, differenceKHQR: diffBank, difference: diffCash + diffBank,
                totalSales: sysCash + sysBank, totalCashSales: sysCash, totalKHQRSales: sysBank, transactionCount: shiftSales.length
            };
            db.collection('shifts').doc(currentShift.id).set(upd, { merge: true }).catch(() => {});
            onShiftStateChange(null);
            onClose();
        };

        if (!currentShift) {
            return (
                <Modal show={true} onClose={onClose} maxWidth="max-w-sm">
                    <ModalHeader title="Open New Shift" onClose={onClose} />
                    <ModalBody>
                        <div className="space-y-4">
                            <div className="grid grid-cols-2 gap-2">
                                {['AM', 'PM'].map(s => <button key={s} type="button" onClick={() => setShiftName(s)} className={`py-2.5 rounded-xl font-bold text-sm border ${shiftName === s ? 'bg-blue-600 text-white border-blue-400' : 'bg-slate-900 text-slate-400 border-slate-700'}`}>{s} Shift</button>)}
                            </div>
                            <div>
                                <label className="text-xs font-bold text-slate-300 block mb-1">Starting Float Cash (KHR)</label>
                                <input type="number" value={startCash} onChange={e => setStartCash(e.target.value)} placeholder="0" autoFocus className="w-full bg-slate-900 text-white text-2xl font-black px-4 py-3 rounded-xl border border-slate-600 text-right font-mono" />
                            </div>
                        </div>
                    </ModalBody>
                    <ModalFooter>
                        <button type="button" onClick={onClose} className="bg-slate-600 text-white font-bold py-2 px-5 rounded-xl">Cancel</button>
                        <button type="button" onClick={handleOpen} className="bg-emerald-600 hover:bg-emerald-500 text-white font-black py-2 px-6 rounded-xl">Start Shift</button>
                    </ModalFooter>
                </Modal>
            );
        }

        return (
            <Modal show={true} onClose={onClose} maxWidth="max-w-lg">
                <ModalHeader title={`Close Shift (${currentShift.shiftName || 'AM'})`} onClose={onClose} />
                <ModalBody>
                    <div className="space-y-3.5 text-sm">
                        {error && <div className="p-2.5 rounded-xl bg-red-500/20 border border-red-500/40 text-red-300 text-xs font-bold">{error}</div>}
                        <div className="grid grid-cols-2 gap-2.5 bg-slate-900 p-3 rounded-xl border border-slate-700 text-xs">
                            <div>System Cash: <strong className="text-emerald-400 font-mono">៛{khrFormatter.format(sysCash)}</strong></div>
                            <div>System Bank: <strong className="text-sky-400 font-mono">៛{khrFormatter.format(sysBank)}</strong></div>
                        </div>
                        <div className="flex items-center gap-2">
                            <input type="number" value={closingFloat} onChange={e => setClosingFloat(e.target.value)} placeholder={`Float Cash (Match ៛${khrFormatter.format(currentShift.startCash || 0)})`} className="flex-1 bg-slate-900 text-white px-3 py-2 rounded-xl border border-slate-600 font-mono" />
                            <button type="button" onClick={() => setClosingFloat(String(currentShift.startCash || 0))} className="px-3 py-2 rounded-xl bg-blue-600/20 text-blue-300 border border-blue-500/40 text-xs font-bold">Match</button>
                        </div>
                        <div className="grid grid-cols-2 gap-2.5">
                            <input type="number" value={actualCashKHR} onChange={e => setActualCashKHR(e.target.value)} placeholder="Cash Drop (KHR)" className="bg-slate-900 text-white px-3 py-2 rounded-xl border border-slate-600 font-mono" />
                            <input type="number" step="0.01" value={actualCashUSD} onChange={e => setActualCashUSD(e.target.value)} placeholder="Cash Drop (USD)" className="bg-slate-900 text-white px-3 py-2 rounded-xl border border-slate-600 font-mono" />
                            <input type="number" value={actualBankKHR} onChange={e => setActualBankKHR(e.target.value)} placeholder="Bank Drop (KHR)" className="bg-slate-900 text-white px-3 py-2 rounded-xl border border-slate-600 font-mono" />
                            <input type="number" step="0.01" value={actualBankUSD} onChange={e => setActualBankUSD(e.target.value)} placeholder="Bank Drop (USD)" className="bg-slate-900 text-white px-3 py-2 rounded-xl border border-slate-600 font-mono" />
                        </div>
                        <textarea rows="2" value={note} onChange={e => setNote(e.target.value)} placeholder="Handover note (optional)" className="w-full bg-slate-900 text-white px-3 py-2 rounded-xl border border-slate-600 text-xs" />
                    </div>
                </ModalBody>
                <ModalFooter>
                    <button type="button" onClick={onClose} className="bg-slate-600 text-white font-bold py-2 px-5 rounded-xl">Cancel</button>
                    <button type="button" onClick={handleClose} className="bg-blue-600 hover:bg-blue-500 text-white font-black py-2 px-6 rounded-xl">Submit &amp; Close Shift</button>
                </ModalFooter>
            </Modal>
        );
    };

    const SalesHistoryModal = ({ sales = [], onClose, onReprint }) => (
        <Modal show={true} onClose={onClose} maxWidth="max-w-3xl">
