    <!-- Dynamic PWA Manifest + Always-On Keep-Awake Engine -->
    <script>
        window.SolarisPWAManager = {
            deferredPrompt: null,
            isInstalled: false,
            listeners: new Set(),
            subscribe(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
            notify() { this.listeners.forEach(fn => { try { fn(this.getState()); } catch (e) {} }); },
            getState() {
                const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true || document.referrer.includes('android-app://');
                const ua = window.navigator.userAgent || '';
                const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
                return { canInstallPrompt: !!this.deferredPrompt, isInstalled: isStandalone || this.isInstalled, isIOS };
            },
            generateAppIcon(size = 512) {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = size; canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    const grad = ctx.createLinearGradient(0, 0, size, size);
                    grad.addColorStop(0, '#1e3a8a'); grad.addColorStop(0.5, '#1d4ed8'); grad.addColorStop(1, '#0f172a');
                    ctx.fillStyle = grad; ctx.fillRect(0, 0, size, size);
                    ctx.fillStyle = '#ffffff'; ctx.font = `900 ${Math.round(size * 0.28)}px Arial, sans-serif`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('POS', size / 2, size * 0.43);
                    const pillW = size * 0.56, pillH = size * 0.14;
                    ctx.fillStyle = '#10b981';
                    ctx.beginPath();
                    ctx.roundRect((size - pillW) / 2, size * 0.64, pillW, pillH, pillH / 2);
                    ctx.fill();
                    ctx.fillStyle = '#052e16'; ctx.font = `900 ${Math.round(size * 0.075)}px Arial, sans-serif`;
                    ctx.fillText('TERMINAL', size / 2, size * 0.64 + pillH / 2 + 2);
                    return canvas.toDataURL('image/png');
                } catch (e) { return ''; }
            },
            enterKioskFullscreen() {
                try {
                    const docEl = document.documentElement;
                    if (document.fullscreenElement || document.webkitFullscreenElement) return true;
                    const req = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen;
                    if (req) { req.call(docEl).catch(() => {}); return true; }
                } catch (e) {}
                return false;
            },
            exitKioskFullscreen() {
                try {
                    if (document.fullscreenElement || document.webkitFullscreenElement) {
                        const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
                        if (exit) exit.call(document).catch(() => {});
                    }
                } catch (e) {}
            },
            init(appName = 'POS Terminal') {
                const icon192 = this.generateAppIcon(192);
                const icon512 = this.generateAppIcon(512);
                if (icon192) {
                    let appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
                    if (!appleIcon) { appleIcon = document.createElement('link'); appleIcon.rel = 'apple-touch-icon'; document.head.appendChild(appleIcon); }
                    appleIcon.href = icon192;
                }
                const manifestObj = {
                    name: appName, short_name: 'POS Terminal', start_url: window.location.href.split('#')[0],
                    display: 'standalone', background_color: '#0f172a', theme_color: '#0f172a',
                    icons: [
                        { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
                        { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
                    ]
                };
                try {
                    const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
                    let manifestLink = document.querySelector('link[rel="manifest"]');
                    if (!manifestLink) { manifestLink = document.createElement('link'); manifestLink.rel = 'manifest'; document.head.appendChild(manifestLink); }
                    manifestLink.href = URL.createObjectURL(blob);
                } catch (e) {}
            }
        };
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); window.SolarisPWAManager.deferredPrompt = e; window.SolarisPWAManager.notify(); });
        window.addEventListener('appinstalled', () => { window.SolarisPWAManager.deferredPrompt = null; window.SolarisPWAManager.isInstalled = true; window.SolarisPWAManager.notify(); });
        window.addEventListener('DOMContentLoaded', () => window.SolarisPWAManager.init('POS Terminal'));

        // Always-On Keep-Awake Engine (POS Terminal Never Sleeps or Locks While Open)
        window.SolarisKeepAwakeManager = {
            wakeLock: null, noSleepVideo: null, noSleepCanvas: null, noSleepDrawTimer: null, watchdogTimer: null,
            isActive: false, started: false, listeners: new Set(),
            subscribe(fn) { this.listeners.add(fn); try { fn(this.getState()); } catch (e) {} return () => this.listeners.delete(fn); },
            notify() { const st = this.getState(); this.listeners.forEach(fn => { try { fn(st); } catch (e) {} }); },
            getState() {
                const hasNativeLock = !!(this.wakeLock && !this.wakeLock.released);
                const hasVideoLock = !!(this.noSleepVideo && !this.noSleepVideo.paused);
                return { isActive: hasNativeLock || hasVideoLock || this.isActive, mode: hasNativeLock ? 'WakeLock' : (hasVideoLock ? 'NoSleep' : 'Standby') };
            },
            async requestNativeWakeLock() {
                if (typeof navigator === 'undefined' || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return false;
                if (this.wakeLock && !this.wakeLock.released) { this.isActive = true; return true; }
                try {
                    const sentinel = await navigator.wakeLock.request('screen');
                    this.wakeLock = sentinel; this.isActive = true;
                    sentinel.addEventListener('release', () => {
                        this.wakeLock = null; this.notify();
                        if (document.visibilityState === 'visible') setTimeout(() => this.requestNativeWakeLock(), 500);
                    });
                    this.notify(); return true;
                } catch (e) { this.notify(); return false; }
            },
            startNoSleepVideoFallback() {
                try {
                    if (this.noSleepVideo && !this.noSleepVideo.paused) { this.isActive = true; this.notify(); return true; }
                    if (!this.noSleepCanvas) {
                        const c = document.createElement('canvas'); c.width = 2; c.height = 2;
                        const ctx = c.getContext('2d'); if (ctx) { ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, 2, 2); }
                        this.noSleepCanvas = c;
                    }
                    if (!this.noSleepDrawTimer && this.noSleepCanvas) {
                        let toggle = false;
                        this.noSleepDrawTimer = setInterval(() => {
                            const ctx = this.noSleepCanvas.getContext('2d');
                            if (ctx) { toggle = !toggle; ctx.fillStyle = toggle ? '#0f172a' : '#111827'; ctx.fillRect(0, 0, 2, 2); }
                        }, 10000);
                    }
                    if (typeof this.noSleepCanvas.captureStream !== 'function') return false;
                    if (!this.noSleepVideo) {
                        const v = document.createElement('video');
                        v.muted = true; v.loop = true; v.playsInline = true;
                        v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
                        v.style.cssText = 'position:fixed;bottom:0;left:0;width:1px;height:1px;opacity:0.001;pointer-events:none;z-index:-1;';
                        v.srcObject = this.noSleepCanvas.captureStream(1);
                        document.body.appendChild(v); this.noSleepVideo = v;
                    }
                    const p = this.noSleepVideo.play();
                    if (p && typeof p.then === 'function') p.then(() => { this.isActive = true; this.notify(); }).catch(() => {});
                    return true;
                } catch (e) { return false; }
            },
            async engage(fromGesture = false) {
                const ok = await this.requestNativeWakeLock();
                if (!ok || fromGesture) this.startNoSleepVideoFallback();
                this.notify();
            },
            start() {
                if (this.started) { this.engage(false); return; }
                this.started = true; this.engage(false);
                const onGesture = () => this.engage(true);
                const onVis = () => { if (document.visibilityState === 'visible') this.engage(false); };
                window.addEventListener('pointerdown', onGesture, { passive: true });
                window.addEventListener('touchstart', onGesture, { passive: true });
                window.addEventListener('keydown', onGesture, { passive: true });
                document.addEventListener('visibilitychange', onVis);
                window.addEventListener('focus', onVis);
                window.addEventListener('pageshow', onVis);
                this.watchdogTimer = setInterval(() => {
                    if (document.visibilityState === 'visible' && !this.getState().isActive) this.engage(false);
                }, 30000);
            }
        };
    </script>

    // Shared Local Sales & Cleared Carts Store (Syncs in 0ms with index.html Sale Report)
    window.SolarisLocalSalesStore = {
        SALES_KEY: 'solaris_local_sales_ledger_v1',

        notify() {
            try {
                if (typeof BroadcastChannel !== 'undefined') {

                    this._bc.postMessage({ type: 'SALES_UPDATED', ts: Date.now() });

        getSales() {

        recordSale(saleObj) {

    const { useState, useEffect, useCallback, useMemo, useRef, createContext, useContext, memo } = React;

    // --- Utilities ---
    const khrFormatter = new Intl.NumberFormat('en-US');
    const usdFormatter = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });

    const safeToDate = (ts) => {
        if (!ts) return null;
        if (ts instanceof Date) return isNaN(ts) ? null : ts;
        if (typeof ts.toDate === 'function') return ts.toDate();
        if (typeof ts === 'number') { const d = new Date(ts); return isNaN(d) ? null : d; }
        if (typeof ts === 'string') { const d = new Date(ts); return isNaN(d) ? null : d; }
        if (typeof ts.seconds === 'number') return new Date(ts.seconds * 1000);
        if (typeof ts._seconds === 'number') return new Date(ts._seconds * 1000);
        if (typeof ts === 'object' && (ts._methodName === 'FieldValue.serverTimestamp' || ts._methodName === 'serverTimestamp')) return new Date();
        return null;
    };

    const safeFormatDateTime = (ts, fallback = '-') => {
        const d = safeToDate(ts);
        if (!d) return fallback;
        const pad = (n) => String(n).padStart(2, '0');
        let h = d.getHours();
        const ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        return `${pad(d.getDate())}-${pad(d.getMonth() + 1)}-${String(d.getFullYear()).slice(-2)} | ${pad(h)}:${pad(d.getMinutes())}:${pad(d.getSeconds())} ${ampm}`;
    };
    const safeFormatTime = (ts, fallback = 'Just now') => safeFormatDateTime(ts, fallback);

    const getEffectiveShopPrice = (product, shopId) => {
        const basePrice = Number(product?.price) || 0;
        if (!shopId || shopId === 'ALL' || shopId === 'All') return basePrice;
        const custom = Number(product?.priceByShop?.[shopId]);
        return custom > 0 ? custom : basePrice;
    };

    const evaluateCustomerLoyaltyStatus = (customer, loyaltyRule) => {
        if (!customer) return { rawPoints: 0, effectivePoints: 0, isExpired: false, expiresAtDate: null };
        const rawPoints = Math.max(0, parseInt(customer.points, 10) || 0);
        if (!loyaltyRule || !loyaltyRule.expirationPeriod || loyaltyRule.expirationPeriod === 'Never' || rawPoints <= 0) {
            return { rawPoints, effectivePoints: rawPoints, isExpired: false, expiresAtDate: null };
        }
        const refDate = safeToDate(customer.lastVisit || customer.updatedAt || customer.createdAt);
        if (!refDate) return { rawPoints, effectivePoints: rawPoints, isExpired: false, expiresAtDate: null };
        const expDate = new Date(refDate.getTime());
        const p = String(loyaltyRule.expirationPeriod).trim();
        if (p === '1 Week') {
            expDate.setDate(expDate.getDate() + 7);
        } else if (p === '1 Month') {
            expDate.setMonth(expDate.getMonth() + 1);
        } else if (p === '3 Month') {
            expDate.setMonth(expDate.getMonth() + 3);
        } else if (p === '6 Month') {
            expDate.setMonth(expDate.getMonth() + 6);
        } else if (p === '1 Year') {
            expDate.setFullYear(expDate.getFullYear() + 1);
        }
        const isExpired = Date.now() > expDate.getTime();
        return { rawPoints, effectivePoints: isExpired ? 0 : rawPoints, isExpired, expiresAtDate: expDate };
    };

    const useDebounce = (value, delay) => {
        const [dv, setDv] = useState(value);
        useEffect(() => { const h = setTimeout(() => setDv(value), delay); return () => clearTimeout(h); }, [value, delay]);
        return dv;
    };

    // ========================================================================
    // 2. KHQR, RENDER BRIDGE, PAYWAY VERIFIER & INVOICE ENGINE
    // ========================================================================
    window.SolarisKHQREngine = {
        _qrCache: new Map(),
        _secretsCache: new Map(),
        _allowedChatIdsSet: new Set(),
        _bypassDbByShopIdMap: new Map(),
        _bypassDbByChatIdMap: new Map(),

        normalizeChatId(rawId) { return String(rawId || '').trim().replace(/^-100/, '').replace(/^-/, '').trim(); },

        syncAllowedShops(shopsList = []) {
            const nextSet = new Set();
            const nextShopBypass = new Map();
            const nextChatBypass = new Map();
            (shopsList || []).forEach(shop => {
                const cfg = shop?.khqrConfig;
                const bypassDb = cfg?.bypassFirebaseDb !== undefined ? cfg.bypassFirebaseDb !== false : true;
                if (shop?.id) nextShopBypass.set(String(shop.id), bypassDb);
                if (cfg && cfg.paywayVerifyEnabled !== false && cfg.paywayChatId) {
                    String(cfg.paywayChatId).split(/[\s,|;]+/).map(id => this.normalizeChatId(id)).filter(Boolean).forEach(id => {
                        nextSet.add(id);
                        nextChatBypass.set(id, bypassDb);
                    });
                }
            });
            this._allowedChatIdsSet = nextSet;
            this._bypassDbByShopIdMap = nextShopBypass;
            this._bypassDbByChatIdMap = nextChatBypass;
            return nextSet;
        },

        shouldBypassFirebaseDb(shopId = '', chatId = '') {
            if (shopId && this._bypassDbByShopIdMap.has(String(shopId))) return this._bypassDbByShopIdMap.get(String(shopId));
            const nc = this.normalizeChatId(chatId);
            if (nc && this._bypassDbByChatIdMap.has(nc)) return this._bypassDbByChatIdMap.get(nc);
            return true;
        },

        isChatIdAllowed(chatIdStr, explicitTarget = '') {
            const incoming = this.normalizeChatId(chatIdStr);
            if (!incoming) return false;
            if (explicitTarget) {
                const list = String(explicitTarget).split(/[\s,|;]+/).map(id => this.normalizeChatId(id)).filter(Boolean);
                if (list.length > 0) return list.includes(incoming);
            }
            return this._allowedChatIdsSet.size > 0 && this._allowedChatIdsSet.has(incoming);
        },

        crc16(str) {
            let crc = 0xFFFF;
            for (let i = 0; i < str.length; i++) {
                crc ^= (str.charCodeAt(i) & 0xFF) << 8;
                for (let j = 0; j < 8; j++) crc = ((crc & 0x8000) !== 0) ? (((crc << 1) ^ 0x1021) & 0xFFFF) : ((crc << 1) & 0xFFFF);
            }
            return crc.toString(16).toUpperCase().padStart(4, '0');
        },

        parseTLV(payload) {
            const res = [];
            if (!payload || typeof payload !== 'string') return res;
            let i = 0;
            while (i + 4 <= payload.length) {
                const tag = payload.slice(i, i + 2);
                const len = parseInt(payload.slice(i + 2, i + 4), 10);
                if (isNaN(len) || len < 0 || i + 4 + len > payload.length) break;
                res.push({ tag, length: len, value: payload.slice(i + 4, i + 4 + len) });
                i += 4 + len;
            }
            return res;
        },

        formatTLV(tag, value) { const s = String(value ?? ''); return `${tag}${String(s.length).padStart(2, '0')}${s}`; },

        extractMerchantInfoFromEMV(emvPayload) {
            if (!emvPayload || typeof emvPayload !== 'string' || !emvPayload.startsWith('000201')) return { merchantName: null, merchantCity: null, mid: null };
            const parsed = this.parseTLV(emvPayload);
            const t29 = parsed.find(t => t.tag === '30' || t.tag === '29');
            let mid = null;
            if (t29?.value) {
                const subs = this.parseTLV(t29.value);
                const raw = subs.find(s => s.tag === '02')?.value || subs.find(s => s.tag === '01')?.value;
                if (raw) { const d = String(raw).replace(/\D/g, ''); mid = d.length >= 9 ? d : String(raw).trim(); }
            }
            return {
                merchantName: parsed.find(t => t.tag === '59')?.value?.trim() || null,
                merchantCity: parsed.find(t => t.tag === '60')?.value?.trim() || null,
                mid
            };
        },

        generateDynamicKHQR(basePayload, amountValue, invoiceNo = '', currency = 'KHR', expMins = 15, customTs = null) {
            if (!basePayload || typeof basePayload !== 'string' || !basePayload.startsWith('000201')) return null;
            const parsed = this.parseTLV(basePayload);
            if (parsed.length < 4) return null;
            const isUsd = String(currency || 'KHR').toUpperCase() === 'USD';
            const curCode = isUsd ? '840' : '116';
            const rawNum = Number(amountValue) || 0;
            const amtStr = isUsd ? (rawNum > 0 ? rawNum.toFixed(2) : '') : (Math.round(rawNum) > 0 ? String(Math.round(rawNum)) : '');
            const hasAmt = rawNum > 0 && amtStr.length > 0;
            const cleanInv = String(invoiceNo || '').replace(/[^a-zA-Z0-9\-_]/g, '').slice(0, 25);
            const nowMs = customTs?.createdAtMs > 0 ? Math.floor(Number(customTs.createdAtMs)) : Date.now();
            const expMs = customTs?.expiresAtMs > nowMs ? Math.floor(Number(customTs.expiresAtMs)) : (nowMs + Math.max(2, Number(expMins) || 15) * 60000);
            const tag99 = this.formatTLV('00', String(nowMs)) + this.formatTLV('01', String(expMs));

            const filtered = parsed.filter(t => t.tag !== '63' && t.tag !== '99');
            const out = [];
            let has01 = false, has53 = false, has54 = false, has62 = false;
            filtered.forEach(item => {
                if (item.tag === '01') { has01 = true; out.push({ tag: '01', value: hasAmt ? '12' : item.value }); }
                else if (item.tag === '53') { has53 = true; out.push({ tag: '53', value: curCode }); }
                else if (item.tag === '54') { has54 = true; if (hasAmt) out.push({ tag: '54', value: amtStr }); }
                else if (item.tag === '62') {
                    has62 = true;
                    if (cleanInv) {
                        const subs = this.parseTLV(item.value).filter(st => st.tag !== '01');
                        subs.unshift({ tag: '01', value: cleanInv });
                        out.push({ tag: '62', value: subs.map(st => this.formatTLV(st.tag, st.value)).join('') });
                    } else out.push(item);
                } else out.push(item);
            });
            if (!has01) out.splice(1, 0, { tag: '01', value: hasAmt ? '12' : '11' });
            if (!has53) { const idx = out.findIndex(t => t.tag === '52'); out.splice(idx !== -1 ? idx + 1 : out.length, 0, { tag: '53', value: curCode }); }
            if (!has54 && hasAmt) { const idx = out.findIndex(t => t.tag === '53'); out.splice(idx !== -1 ? idx + 1 : out.length, 0, { tag: '54', value: amtStr }); }
            if (!has62 && cleanInv) out.push({ tag: '62', value: this.formatTLV('01', cleanInv) });
            if (hasAmt) out.push({ tag: '99', value: tag99 });
            const body = out.map(t => this.formatTLV(t.tag, t.value)).join('') + '6304';
            return body + this.crc16(body);
        },

        renderInstantQRDataURL(payloadText, sizePx = 360, margin = 1, ec = 'H') {
            const clean = String(payloadText || '').trim();
            if (!clean) return '';
            const key = `${clean}__${sizePx}__${margin}__${ec}`;
            if (this._qrCache.has(key)) return this._qrCache.get(key);
            try {
                if (typeof window.qrcode === 'function') {
                    const qr = window.qrcode(0, ec);
                    qr.addData(clean); qr.make();
                    const count = qr.getModuleCount();
                    const total = count + margin * 2;
                    const canvas = document.createElement('canvas');
                    canvas.width = sizePx; canvas.height = sizePx;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, sizePx, sizePx);
                    const scale = sizePx / total;
                    ctx.fillStyle = '#000000';
                    for (let r = 0; r < count; r++) {
                        for (let c = 0; c < count; c++) {
                            if (qr.isDark(r, c)) {
                                const x = Math.floor((c + margin) * scale), y = Math.floor((r + margin) * scale);
                                ctx.fillRect(x, y, Math.ceil((c + margin + 1) * scale) - x, Math.ceil((r + margin + 1) * scale) - y);
                            }
                        }
                    }
                    const url = canvas.toDataURL('image/png');
                    if (this._qrCache.size > 120) this._qrCache.delete(this._qrCache.keys().next().value);
                    this._qrCache.set(key, url);
                    return url;
                }
            } catch (e) {}
            return '';
        },

        parseABAPayWayMessage(rawText) {
            if (!rawText || typeof rawText !== 'string') return { isValid: false };
            const cleanText = rawText.replace(/[\r\n\t]+/g, ' ').replace(/\s+/g, ' ').trim();
            const amtMatch = cleanText.match(/(?:(៛|\$|KHR|USD)\s*([0-9,]+(?:\.[0-9]{1,2})?))\s*(?:paid by|received from)/i);
            const trxMatch = cleanText.match(/Trx\.?\s*ID\s*[:#]?\s*([0-9A-Za-z]+)/i);
            const apvMatch = cleanText.match(/APV\s*[:#]?\s*([0-9A-Za-z]+)/i);
            if (!amtMatch || (!trxMatch && !apvMatch)) return { isValid: false };
            const sym = amtMatch[1].toUpperCase();
            const currency = (sym === '៛' || sym === 'KHR') ? 'KHR' : 'USD';
            const amount = parseFloat(amtMatch[2].replace(/,/g, ''));
            const payerMatch = cleanText.match(/(?:paid by|received from)\s+([^(]+?)(?:\s*\(\s*\*\s*([0-9A-Za-z]+)\s*\)|\s+on\s+|\s+via\s+)/i);
            const onMatch = cleanText.match(/\bon\s+(.+?)\s+via\s+/i);
            const viaMatch = cleanText.match(/\bvia\s+(.+?)\s+at\s+/i);
            const atMatch = cleanText.match(/\bat\s+(.+?)(?:\.\s*Trx|\s+Trx)/i);
            const trxId = trxMatch ? trxMatch[1].trim() : `APV-${apvMatch[1].trim()}`;
            const paidAtStr = onMatch ? onMatch[1].trim() : new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const paymentChannel = viaMatch ? viaMatch[1].trim() : 'ABA PAY';
            const bankParenMatch = paymentChannel.match(/ABA\s*KHQR\s*\(\s*([^)]+)\s*\)/i);
            const isOutdoor = /ABA\s*KHQR/i.test(paymentChannel) || !!bankParenMatch;
            const sourceBank = bankParenMatch
                ? bankParenMatch[1].trim()
                : (isOutdoor ? paymentChannel.replace(/^ABA\s*KHQR\s*/i, '').replace(/[()]/g, '').trim() || 'External Bank' : 'ABA Bank');
            return {
                isValid: !isNaN(amount) && amount > 0,
                currency, amount,
                payerName: payerMatch ? payerMatch[1].trim() : 'ABA Customer',
                maskedAccount: payerMatch?.[2] ? `*${payerMatch[2].trim()}` : '*ABA',
                paidAtStr,
                paidTimestamp: this.parseAbaPaidAtToMs(paidAtStr),
                paymentChannel,
                paymentCategory: isOutdoor ? 'OUTDOOR_KHQR' : 'INDOOR_ABA',
                sourceBank,
                merchantName: atMatch ? atMatch[1].replace(/\.$/, '').trim() : '',
                trxId,
                apv: apvMatch ? apvMatch[1].trim().replace(/\.$/, '') : trxId.slice(-6),
                rawText: cleanText
            };
        },

        parseAbaPaidAtToMs(paidAtStr, fallbackMs = null) {
            const baseFallback = Number(fallbackMs) > 0 ? Number(fallbackMs) : Date.now();
            if (!paidAtStr || typeof paidAtStr !== 'string') return baseFallback;
            const clean = paidAtStr.trim();
            const refDate = new Date(baseFallback);
            const currentYear = refDate.getFullYear();

            const alignMinuteGranularity = (constructedDate, hasExplicitSeconds) => {
                if (hasExplicitSeconds) return constructedDate.getTime();
                const diffMs = baseFallback - constructedDate.getTime();
                if (diffMs >= 0 && diffMs < 60000) return baseFallback;
                return constructedDate.getTime() + 59000;
            };

            const monthDayTimeMatch = clean.match(/^([A-Za-z]{3,9})\s+(\d{1,2})(?:,\s*(\d{4}))?,?\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?$/i);
            if (monthDayTimeMatch) {
                const monthNames = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
                const mIdx = monthNames.indexOf(monthDayTimeMatch[1].slice(0, 3).toLowerCase());
                if (mIdx !== -1) {
                    const day = parseInt(monthDayTimeMatch[2], 10);
                    const year = monthDayTimeMatch[3] ? parseInt(monthDayTimeMatch[3], 10) : currentYear;
                    let hours = parseInt(monthDayTimeMatch[4], 10);
                    const mins = parseInt(monthDayTimeMatch[5], 10);
                    const hasSecs = !!monthDayTimeMatch[6];
                    const secs = hasSecs ? parseInt(monthDayTimeMatch[6], 10) : 0;
                    const ampm = (monthDayTimeMatch[7] || '').toUpperCase();
                    if (ampm === 'PM' && hours < 12) hours += 12;
                    if (ampm === 'AM' && hours === 12) hours = 0;
                    const constructed = new Date(year, mIdx, day, hours, mins, secs, 0);
                    if (!isNaN(constructed.getTime())) {
                        if (!monthDayTimeMatch[3] && constructed.getTime() - baseFallback > 60 * 24 * 60 * 60 * 1000) {
                            constructed.setFullYear(year - 1);
                        }
                        return alignMinuteGranularity(constructed, hasSecs);
                    }
                }
            }

            const timeOnlyMatch = clean.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?$/i);
            if (timeOnlyMatch) {
                let hours = parseInt(timeOnlyMatch[1], 10);
                const mins = parseInt(timeOnlyMatch[2], 10);
                const hasSecs = !!timeOnlyMatch[3];
                const secs = hasSecs ? parseInt(timeOnlyMatch[3], 10) : 0;
                const ampm = (timeOnlyMatch[4] || '').toUpperCase();
                if (ampm === 'PM' && hours < 12) hours += 12;
                if (ampm === 'AM' && hours === 12) hours = 0;
                const constructed = new Date(refDate.getFullYear(), refDate.getMonth(), refDate.getDate(), hours, mins, secs, 0);
                if (!isNaN(constructed.getTime())) return alignMinuteGranularity(constructed, hasSecs);
            }

            const nativeParsed = Date.parse(`${clean} ${currentYear}`);
            return !isNaN(nativeParsed) ? nativeParsed : baseFallback;
        },

        async getStaffPaywaySecrets(shopId, forceRefresh = false) {
            const cacheKey = shopId && shopId !== 'All' ? String(shopId) : '__global__';
            const now = Date.now();
            if (!forceRefresh && this._secretsCache.has(cacheKey)) {
                const cached = this._secretsCache.get(cacheKey);
                if (now - cached.fetchedAt < 5 * 60 * 1000) return cached.data;
            }
            let secrets = null;
            if (shopId && shopId !== 'All') {
                try {
                    const localCached = localStorage.getItem(`solaris_payway_secrets_${shopId}`);
                    if (localCached) secrets = JSON.parse(localCached);
                } catch (e) {}
                if ((!secrets || forceRefresh) && !window.SolarisPayWayVerifier?.isQuotaExceeded) {
                    try {
                        const snap = await db.collection('payway_secrets').doc(shopId).get();
                        if (snap.exists) {
                            secrets = snap.data();
                            try { localStorage.setItem(`solaris_payway_secrets_${shopId}`, JSON.stringify(secrets)); } catch (e) {}
                        }
                    } catch (e) {}
                }
            }
            this._secretsCache.set(cacheKey, { data: secrets, fetchedAt: now });
            return secrets;
        },

        async fetchRecentAbaPaymentsFromFirestore(filterChatId = '', shopId = '', includeClaimed = false, forceCloudRead = false, isActiveCheckout = false) {
            try {
                const cleanFilterId = String(filterChatId || '').trim();
                const mergedByTrxId = new Map();
                const nowMs = Date.now();

                // SOURCE 1: In-Memory Live Payments
                if (window.SolarisPayWayVerifier?.inMemoryAbaPayments) {
                    window.SolarisPayWayVerifier.inMemoryAbaPayments.forEach((entry, trxId) => {
                        const isClaimed = entry.claimedByOrderId || window.SolarisPayWayVerifier.processedTrxIdsMemory.has(trxId);
                        if (includeClaimed || !isClaimed) mergedByTrxId.set(trxId, entry);
                    });
                }

                // SOURCE 2: Direct Render Listener Bridge
                if (window.SolarisRenderBridge) {
                    window.SolarisRenderBridge.ensureConnected();
                    if (isActiveCheckout || forceCloudRead || !this._lastRenderPollMs || (nowMs - this._lastRenderPollMs > 1800)) {
                        this._lastRenderPollMs = nowMs;
                        const pollStart = performance.now();
                        const renderRes = await window.SolarisRenderBridge.pollRecentFromRender(forceCloudRead || isActiveCheckout).catch(() => ({ count: 0 }));
                        if (window.SolarisPayWayVerifier) {
                            window.SolarisPayWayVerifier.lastPollTelemetry = {
                                source: 'Render Live SSE',
                                latencyMs: Math.round(performance.now() - pollStart),
                                updatesCount: renderRes?.count || 0,
                                polledAtMs: Date.now()
                            };
                        }
                        window.SolarisPayWayVerifier?.inMemoryAbaPayments?.forEach((entry, trxId) => {
                            const isClaimed = entry.claimedByOrderId || window.SolarisPayWayVerifier.processedTrxIdsMemory.has(trxId);
                            if (includeClaimed || !isClaimed) mergedByTrxId.set(trxId, entry);
                        });
                    }
                }

                // SOURCE 3: Firestore Cloud Feed (ONLY when Bypass Firebase DB is explicitly OFF)
                const isBypassDbActive = this.shouldBypassFirebaseDb(shopId, cleanFilterId);
                if (!isBypassDbActive && !window.SolarisPayWayVerifier?.isQuotaExceeded && (forceCloudRead || !this._lastFirestoreFetchMs || (nowMs - this._lastFirestoreFetchMs > 2500))) {
                    this._lastFirestoreFetchMs = nowMs;
                    try {
                        const snap = await db.collection('aba_payments').orderBy('receivedAt', 'desc').limit(35).get();
                        snap.forEach(docSnap => {
                            const d = docSnap.data() || {};
                            const trxId = String(d.trxId || docSnap.id).trim();
                            const amount = Number(d.amount || 0);
                            if (!trxId || isNaN(amount) || amount <= 0) return;
                            const docChatId = String(d.chatId || '').trim();
                            if (!this.isChatIdAllowed(docChatId, cleanFilterId)) return;
                            if (d.claimedByOrderId) window.SolarisPayWayVerifier?.processedTrxIdsMemory?.add(trxId);
                            if (!includeClaimed && (d.claimedByOrderId || window.SolarisPayWayVerifier?.processedTrxIdsMemory?.has(trxId))) return;
                            const recMs = Number(d.receivedAt?.toMillis ? d.receivedAt.toMillis() : d.receivedAt) || Date.now();
                            const parsedAba = {
                                isValid: true,
                                currency: d.currency || 'KHR',
                                amount,
                                payerName: d.payerName || 'ABA Customer',
                                maskedAccount: d.maskedAccount || '*ABA',
                                paidAtStr: d.paidAtStr || '',
                                paidTimestamp: Number(d.paidTimestamp) || this.parseAbaPaidAtToMs(d.paidAtStr, recMs),
                                receivedAt: recMs,
                                chatId: docChatId,
                                paymentChannel: d.paymentChannel || 'ABA PAY',
                                paymentCategory: d.paymentCategory || (/ABA\s*KHQR/i.test(d.paymentChannel || '') ? 'OUTDOOR_KHQR' : 'INDOOR_ABA'),
                                sourceBank: d.sourceBank || 'ABA Bank',
                                merchantName: d.merchantName || '',
                                trxId,
                                apv: String(d.apv || '').trim(),
                                rawText: d.rawText || ''
                            };
                            const entryObj = { updateId: trxId, messageId: trxId, chatId: docChatId || cleanFilterId, date: recMs, claimedByOrderId: d.claimedByOrderId || null, parsedAba, fromFirestore: true };
                            mergedByTrxId.set(trxId, entryObj);
                            window.SolarisPayWayVerifier?.inMemoryAbaPayments?.set(trxId, entryObj);
                        });
                    } catch (e) {}
                }

                const allMessages = Array.from(mergedByTrxId.values()).sort((a, b) => (Number(b.date) || 0) - (Number(a.date) || 0));
                const filterIdsList = cleanFilterId ? cleanFilterId.split(',').map(s => this.normalizeChatId(s)).filter(Boolean) : [];
                const filteredMessages = allMessages.filter(entry => {
                    if (!entry.chatId) return false;
                    if (!this.isChatIdAllowed(entry.chatId, cleanFilterId)) return false;
                    if (filterIdsList.length === 0) return true;
                    return filterIdsList.includes(this.normalizeChatId(entry.chatId)) || entry.chatId === cleanFilterId;
                });

                return { ok: true, messages: filteredMessages, allAbaMessages: allMessages };
            } catch (err) {
                return { ok: false, messages: [], allAbaMessages: [], error: err.message };
            }
        },

        ingestRenderPayload(rawItem, sourceTag = 'Render Live SSE') {
            const parsed = this.normalizeRenderItem(rawItem);
            if (parsed?.isValid && parsed?.trxId) {
                const cid = String(rawItem.chatId || parsed.chatId || '').trim();
                if (!window.SolarisKHQREngine.isChatIdAllowed(cid)) return false;
                const dateMs = Number(rawItem.receivedAt || rawItem.date || parsed.receivedAt || parsed.paidTimestamp) || Date.now();
                window.SolarisKHQREngine.broadcastDetectedAbaPayment(parsed, cid, sourceTag, dateMs);
                return true;
            }
            return false;
        },

        // Dedicated non-blocking fetch for Bank AutoSum (strictly scoped to Shop Chat ID + Opening Shift startMs)
        async fetchShiftPaymentsFromRender({ chatId = '', startMs = 0, endMs = Date.now(), includeHistory = false, signal = null } = {}) {
            if (!this.baseUrl) return [];
            const resultsMap = new Map();

            const fetchEndpoint = async (path, paramsObj, timeoutMs) => {
                const ctrl = new AbortController();
                const onAbort = () => ctrl.abort();
                if (signal) {
                    if (signal.aborted) return;
                    signal.addEventListener('abort', onAbort, { once: true });
                }
                const tid = setTimeout(() => ctrl.abort(), timeoutMs);
                try {
                    const params = new URLSearchParams();
                    Object.entries(paramsObj).forEach(([k, v]) => {
                        if (v !== undefined && v !== null && String(v) !== '') params.set(k, String(v));
                    });
                    const r = await fetch(`${this.baseUrl}${path}?${params.toString()}`, {
                        signal: ctrl.signal,
                        cache: 'no-store',
                        mode: 'cors'
                    });
                    if (!r.ok) return;
                    this.isConnected = true;
                    const d = await r.json();
                    const arr = d.payments || d.recentPayments || d.items || (Array.isArray(d) ? d : []);
                    arr.forEach(item => {
                        const norm = this.normalizeRenderItem(item);
                        if (norm?.trxId) {
                            resultsMap.set(norm.trxId, norm);
                            this.ingestRenderPayload(item, `Render (${path})`);
                        }
                    });
                } catch (e) {
                } finally {
                    clearTimeout(tid);
                    if (signal) signal.removeEventListener('abort', onAbort);
                }
            };

            // 1. Always fetch live /recent with scan=1, chatId, and startMs
            await fetchEndpoint('/recent', {
                scan: '1',
                limit: '300',
                chatId: String(chatId || '').trim(),
                startMs: Number(startMs) > 0 ? Math.floor(Number(startMs)) : '',
                endMs: Number(endMs) > 0 ? Math.floor(Number(endMs)) : ''
            }, 5000);

            // 2. Also fetch /history when requested or if shift started > 30 mins ago (handles Render cold restarts)
            const shiftAgeMs = Number(startMs) > 0 ? (Date.now() - Number(startMs)) : 0;
            if (includeHistory || (resultsMap.size === 0 && shiftAgeMs > 5 * 60 * 1000)) {
                await fetchEndpoint('/history', {
                    limit: '500',
                    chatId: String(chatId || '').trim(),
                    startMs: Number(startMs) > 0 ? Math.floor(Number(startMs)) : '',
                    endMs: Number(endMs) > 0 ? Math.floor(Number(endMs)) : ''
                }, 9000);
            }

            return Array.from(resultsMap.values());
        },

        ensureConnected() {
            if (!this.baseUrl || typeof EventSource === 'undefined' || this.eventSource) return;
            try {
                const es = new EventSource(`${this.baseUrl}/events`);
                this.eventSource = es;
                es.onopen = () => { this.isConnected = true; this.pollRecentFromRender(false).catch(() => {}); };
                es.onmessage = (ev) => {
                    if (!ev.data) return;
                    try {
                        const d = JSON.parse(ev.data);
                        const arr = Array.isArray(d) ? d : (d.payments || d.recentPayments || null);
                        if (Array.isArray(arr)) arr.forEach(item => this.ingestRenderPayload(item));
                        else if (d.type !== 'CONNECTED') this.ingestRenderPayload(d);
                    } catch (e) {}
                };
                es.onerror = () => {
                    this.isConnected = false;
                    try { es.close(); } catch (e) {}
                    this.eventSource = null;
                    setTimeout(() => this.ensureConnected(), 8000);
                };
            } catch (e) {}
        },

        async pollRecentFromRender(forceWake = false, filterOpts = {}) {
            if (!this.baseUrl || this._pollInFlight) return { count: 0 };
            this._pollInFlight = true;
            try {
                const ctrl = new AbortController();
                const tid = setTimeout(() => ctrl.abort(), 4000);
                const params = new URLSearchParams();
                if (forceWake) params.set('scan', '1');
                params.set('limit', forceWake ? '200' : '150');
                if (filterOpts?.chatId) params.set('chatId', String(filterOpts.chatId).trim());
                if (Number(filterOpts?.startMs) > 0) params.set('startMs', String(Math.floor(Number(filterOpts.startMs))));
                if (Number(filterOpts?.endMs) > 0) params.set('endMs', String(Math.floor(Number(filterOpts.endMs))));
                const r = await fetch(`${this.baseUrl}/recent?${params.toString()}`, { signal: ctrl.signal, cache: 'no-store', mode: 'cors' });
                clearTimeout(tid);
                if (r.ok) {
                    this.isConnected = true;
                    const d = await r.json();
                    const arr = d.payments || d.recentPayments || (Array.isArray(d) ? d : []);
                    let count = 0;
                    arr.forEach(item => { if (this.ingestRenderPayload(item, 'Render (/recent)')) count++; });
                    return { count };
                }
            } catch (e) {} finally { this._pollInFlight = false; }
            return { count: 0 };
        }
    };

        hasSimultaneousAmountCollision(expectedKhr, currentOrderOrIntentId, shopId = '') {
            const now = Date.now();

            if (targetKhr <= 0) return false;
            const selfId = String(currentOrderOrIntentId || '');
            for (const [id, intent] of this.activeKhqrIntents.entries()) {
                if (now > intent.expiresAt + 60000) { this.activeKhqrIntents.delete(id); continue; }
                if (id !== selfId && intent.tempInvoiceNo !== selfId) {
                    if (!shopId || !intent.shopId || intent.shopId === shopId) {

        _ensureDisplayWindowListener() {
            if (this._windowMsgBound) return;
            this._windowMsgBound = true;
            window.addEventListener('message', (ev) => {
                const msg = ev?.data;
                if (!msg || msg.type !== 'REQUEST_POS_SYNC' || !ev.source) return;
                try {
                    this._displayWindows.add(ev.source);
                    const cachedShops = JSON.parse(localStorage.getItem('solaris_cached_shops_list') || '[]');
                    if (Array.isArray(cachedShops) && cachedShops.length > 0) ev.source.postMessage({ type: 'POS_SHOPS_SYNC', shops: cachedShops }, '*');
                    const targetShopId = msg.shopId;
                    if (targetShopId && this._lastSessionPayloadByShop[targetShopId]) {
                        ev.source.postMessage({ type: 'POS_DISPLAY_SESSION', shopId: targetShopId, payload: { ...this._lastSessionPayloadByShop[targetShopId], sentAt: Date.now() } }, '*');
                    }
                } catch (e) {}
            });

        registerCustomerDisplayWindow(win, shopId = '') {
            this._ensureDisplayWindowListener();
            if (!win || win.closed) return;
            this._displayWindows.add(win);
            const push = () => {
                if (!win || win.closed) { this._displayWindows.delete(win); return; }
                try {
                    const cachedShops = JSON.parse(localStorage.getItem('solaris_cached_shops_list') || '[]');
                    if (cachedShops.length) win.postMessage({ type: 'POS_SHOPS_SYNC', shops: cachedShops }, '*');
                    if (shopId && this._lastSessionPayloadByShop[shopId]) {
                        win.postMessage({ type: 'POS_DISPLAY_SESSION', shopId, payload: { ...this._lastSessionPayloadByShop[shopId], sentAt: Date.now() } }, '*');
                    }
                } catch (e) {}
            };
            push(); setTimeout(push, 350); setTimeout(push, 900);
        },

        broadcastCustomerDisplaySession(shopId, sessionPayload = null) {
            if (!shopId || shopId === 'All') return;
            this._ensureDisplayWindowListener();
            const nowTs = Date.now();
            const fullPayload = !sessionPayload
                ? { status: 'IDLE', shopId, updatedAt: nowTs, sentAt: nowTs }
                : { ...sessionPayload, shopId, updatedAt: nowTs, sentAt: nowTs };
            this._lastSessionPayloadByShop[shopId] = fullPayload;

            // 1. 0ms Direct postMessage
            for (const win of Array.from(this._displayWindows)) {
                if (!win || win.closed) { this._displayWindows.delete(win); continue; }
                try { win.postMessage({ type: 'POS_DISPLAY_SESSION', shopId, payload: fullPayload }, '*'); } catch (e) {}
            }
            // 2. 0ms Same-Origin BroadcastChannel
            try {
                if (typeof BroadcastChannel !== 'undefined') {
                    if (!this._khqrDisplayBus) {
                        this._khqrDisplayBus = new BroadcastChannel('solaris_khqr_display_bus');
                        this._khqrDisplayBus.onmessage = (ev) => {
                            if (ev?.data?.type === 'REQUEST_POS_SYNC') {
                                const sid = ev.data.shopId;
                                if (sid && this._lastSessionPayloadByShop[sid]) {
                                    this._khqrDisplayBus.postMessage({ type: 'POS_DISPLAY_SESSION', shopId: sid, payload: { ...this._lastSessionPayloadByShop[sid], sentAt: Date.now() } });
                                }
                            }
                        };
                    }
                    this._khqrDisplayBus.postMessage({ type: 'POS_DISPLAY_SESSION', shopId, payload: fullPayload });
                }
            } catch (e) {}
            // 3. Deferred localStorage write
            const persist = () => { try { localStorage.setItem(`solaris_khqr_display_session_${shopId}`, JSON.stringify(fullPayload)); } catch (e) {} };
            if (typeof queueMicrotask === 'function') queueMicrotask(persist); else setTimeout(persist, 0);

            // 4. Lightweight Cross-Device Firestore sync
            if (this.isQuotaExceeded) return;
            const status = fullPayload.status || 'IDLE';
            const prevStatus = this._lastCloudDisplayStatusByShop[shopId];
            const cloudPayload = { ...fullPayload };
            delete cloudPayload.sentAt;
            if (typeof cloudPayload.staticQrImage === 'string' && cloudPayload.staticQrImage.length > 2048) delete cloudPayload.staticQrImage;
            const fp = { ...cloudPayload }; delete fp.updatedAt;
            const hash = JSON.stringify(fp);
            if (this._lastCloudPayloadHashByShop[shopId] === hash) return;
            if (status === 'IDLE' && (!prevStatus || prevStatus === 'IDLE')) return;
            this._lastCloudDisplayStatusByShop[shopId] = status;
            this._lastCloudPayloadHashByShop[shopId] = hash;
            db.collection('system_settings').doc(`khqr_display_${shopId}`).set(cloudPayload, { merge: true }).catch(() => {});
        },

        doesMessageMatchOrder(parsedAba, order, shop) {
            if (!parsedAba || !parsedAba.isValid || !order) return false;
            if (order.paymentStatus === 'Paid' || order.status === 'Cancelled') return false;

            const isKhqrOrder = order.paymentMethod === 'KHQR (ABA)' || order.paymentMethod === 'KHQR' || order.khqrExpectedKhr > 0;
            if (!isKhqrOrder) return false;

            const shopChatId = String(shop?.khqrConfig?.paywayChatId || '').replace(/^-100/, '').replace(/^-/, '').trim();
            const msgChatId = String(parsedAba.chatId || '').replace(/^-100/, '').replace(/^-/, '').trim();
            const hasMultipleChatIds = shopChatId.includes(',') || msgChatId.includes(',');
            if (shopChatId && msgChatId && !hasMultipleChatIds && shopChatId !== msgChatId) {
                if (/^\d+$/.test(shopChatId) && /^\d+$/.test(msgChatId)) return false;
            }

            if (!order.bypassRecencyGate) {
                const now = Date.now();
                const maxRecencyMinutes = Math.max(1, Number(shop?.khqrConfig?.autoVerifyWindowMinutes) || 5);
                const maxAgeMs = maxRecencyMinutes * 60 * 1000;
                const rawReceivedAt = Number(parsedAba.receivedAt?.toMillis ? parsedAba.receivedAt.toMillis() : parsedAba.receivedAt) || 0;
                const parsedPaidAt = Number(parsedAba.paidTimestamp) || window.SolarisKHQREngine.parseAbaPaidAtToMs(parsedAba.paidAtStr, rawReceivedAt || now);
                const effectivePaymentMs = rawReceivedAt > 0 ? rawReceivedAt : parsedPaidAt;

                if (effectivePaymentMs > 0 && (now - effectivePaymentMs) > maxAgeMs) return false;

                const qrInitiatedAt = Number(order.khqrInitiatedAt || order.createdAt || 0);
                if (qrInitiatedAt > 0 && effectivePaymentMs > 0 && effectivePaymentMs < (qrInitiatedAt - 95000)) return false;

                const qrExpiresAt = Number(order.khqrExpiresAt || 0);
                if (qrExpiresAt > 0 && effectivePaymentMs > (qrExpiresAt + 120000) && !order.khqrCustomerRef) return false;
            }

            if (order.khqrCustomerRef && String(order.khqrCustomerRef).trim().length >= 3) {
                const refClean = String(order.khqrCustomerRef).trim().toUpperCase();
                const apvMatch = String(parsedAba.apv || '').toUpperCase().includes(refClean);
                const trxMatch = String(parsedAba.trxId || '').toUpperCase().includes(refClean);
                if (!apvMatch && !trxMatch) return false;
            }

            const configuredMerchant = String(shop?.khqrConfig?.accountName || '').trim();
            const incomingMerchant = String(parsedAba.merchantName || '').trim();
            if (configuredMerchant && incomingMerchant) {
                const aliases = configuredMerchant.split(',').map(s => s.trim().toUpperCase()).filter(Boolean);
                const msgMerchUpper = incomingMerchant.toUpperCase();
                if (aliases.length > 0 && !aliases.some(alias => msgMerchUpper.includes(alias) || alias.includes(msgMerchUpper))) return false;
            }

            const expectedKhr = Math.round(Number(order.khqrExpectedKhr || order.totalAmount || 0));
            const rate = Math.max(100, Number(shop?.khqrConfig?.exchangeRate) || 4000);
            const expectedUsd = Number(order.khqrExpectedUsd || (expectedKhr / rate));

            if (parsedAba.currency === 'KHR') {
                return Math.round(Number(parsedAba.amount)) === expectedKhr;
            } else if (parsedAba.currency === 'USD') {
                const usdDiff = Math.abs(Number(parsedAba.amount) - expectedUsd);
                const khrEquivDiff = Math.abs(Math.round(Number(parsedAba.amount) * rate) - expectedKhr);
                return usdDiff <= 0.03 || khrEquivDiff <= 100;
            }
            return false;
        },

        claimAbaPaymentForSale(trxId, saleId, invoiceNo = '') {

        }

    window.SolarisInvoiceEngine = {
        _unsubs: new Map(),

        getShopPrefix(shop) {
            const clean = String(shop?.name || shop?.mappedShop || 'POS').replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
            return clean.length >= 3 ? clean.slice(-3) : clean.padStart(3, 'X');

        formatInvoiceNumber(shop, seq) { return `${this.getShopPrefix(shop)}-${String(Math.max(1, parseInt(seq, 10) || 1)).padStart(9, '0')}`; },
        getLocalSeq(shopId) {
            const k = String(shopId || 'default');
            if (this._seqCache.has(k)) return this._seqCache.get(k);
            const v = parseInt(localStorage.getItem(`solaris_inv_seq_${k}`) || '0', 10) || 0;
            this._seqCache.set(k, v); return v;
        },
        setLocalSeq(shopId, seq) {
            const k = String(shopId || 'default');
            const next = Math.max(this.getLocalSeq(k), parseInt(seq, 10) || 0);
            this._seqCache.set(k, next);
            try { localStorage.setItem(`solaris_inv_seq_${k}`, String(next)); } catch (e) {}

        subscribeShopCounter(shopId) {
            if (!shopId || shopId === 'All') return () => {};
            const k = String(shopId);
            if (this._unsubs.has(k)) return this._unsubs.get(k);
            const unsub = db.collection('invoice_counters').doc(k).onSnapshot(doc => {
                if (doc.exists && Number(doc.data()?.lastSeq) > 0) this.setLocalSeq(k, doc.data().lastSeq);
            }, () => {});
            const cleanup = () => { unsub(); this._unsubs.delete(k); };
            this._unsubs.set(k, cleanup);
            return cleanup;
        },
        peekNextInvoiceNumber(shop) { return this.formatInvoiceNumber(shop, this.getLocalSeq(shop?.id) + 1); },
        allocateInvoiceNumber(shop) {
            const sid = shop?.id || 'default';
            const nextSeq = this.getLocalSeq(sid) + 1;
            this.setLocalSeq(sid, nextSeq);
            const inv = this.formatInvoiceNumber(shop, nextSeq);

                db.collection('invoice_counters').doc(String(shop.id)).set({
                    shopId: String(shop.id), shopName: shop.name || '', prefix: this.getShopPrefix(shop),
                    lastSeq: firebase.firestore.FieldValue.increment(1), lastInvoiceNo: inv,

    window.SolarisCatalogDB = {
        DB_NAME: 'SolarisCatalogVault_v2',
        DB_VERSION: 1,
        _dbPromise: null,
        open() {
            if (this._dbPromise) return this._dbPromise;
            this._dbPromise = new Promise((resolve, reject) => {
                if (typeof indexedDB === 'undefined') { reject(new Error('No IDB')); return; }
                const req = indexedDB.open(this.DB_NAME, this.DB_VERSION);
                req.onupgradeneeded = (e) => {
                    const idb = e.target.result;
                    ['products', 'vendors', 'categories', 'meta'].forEach(s => {
                        if (!idb.objectStoreNames.contains(s)) idb.createObjectStore(s, { keyPath: 'id' });
                    });
                };
                req.onsuccess = (e) => resolve(e.target.result);
                req.onerror = (e) => { this._dbPromise = null; reject(e.target.error); };
            });
            return this._dbPromise;
        },
        async getAll(storeName) {
            try {
                const idb = await this.open();
                return await new Promise((resolve, reject) => {
                    const req = idb.transaction(storeName, 'readonly').objectStore(storeName).getAll();
                    req.onsuccess = () => resolve(Array.isArray(req.result) ? req.result : []);
                    req.onerror = () => reject(req.error);
                });
            } catch (e) { return []; }
        },
        async putBatch(storeName, items = [], replaceAll = false) {
            if (!Array.isArray(items)) return;
            try {
                const idb = await this.open();
                await new Promise((resolve, reject) => {
                    const tx = idb.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    if (replaceAll) store.clear();
                    items.forEach(item => { if (item && item.id) store.put(item); });
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => reject(tx.error);
                });
            } catch (e) {}
        },
        async deleteOne(storeName, id) {
            if (!id) return;
            try {
                const idb = await this.open();
                await new Promise((resolve) => {
                    const tx = idb.transaction(storeName, 'readwrite');
                    tx.objectStore(storeName).delete(id);
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => resolve(false);
                });
            } catch (e) {}
        },
        async getMeta(key) {
            try {
                const idb = await this.open();
                return await new Promise((resolve) => {
                    const req = idb.transaction('meta', 'readonly').objectStore('meta').get(key);
                    req.onsuccess = () => resolve(req.result ? req.result.value : null);
                    req.onerror = () => resolve(null);
                });
            } catch (e) { return null; }
        },
        async setMeta(key, value) {
            try {
                const idb = await this.open();
                await new Promise((resolve) => {
                    const tx = idb.transaction('meta', 'readwrite');
                    tx.objectStore('meta').put({ id: key, value, updatedAt: Date.now() });
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => resolve(false);
                });
            } catch (e) {}
        }
    };

            if (!ex) return;
            const stockMap = { ...(ex.stockByShop || {}) };
            stockMap[shopId] = (Number(stockMap[shopId]) || 0) + (Number(qtyDelta) || 0);
            const merged = { ...ex, stockByShop: stockMap, updatedAt: new Date().toISOString() };
            this.productsMap.set(productId, merged);
            window.SolarisCatalogDB.putBatch('products', [merged], false);
            this.notify();
        },
        async init() {
            if (this.isInitialized) return;
            this.isInitialized = true;
            const cached = await window.SolarisCatalogDB.getAll('products');
            const lastSyncMs = Number(await window.SolarisCatalogDB.getMeta('products_last_sync_ms')) || 0;
            if (cached.length > 0) {
                cached.forEach(p => { if (p?.id) this.productsMap.set(p.id, p); });
                this.notify();
                this.startDeltaListener(lastSyncMs || (Date.now() - 300000));
            } else {
                await this.runFullSync();
            }
        },
        startDeltaListener(sinceMs) {
            if (this.unsubDelta) { try { this.unsubDelta(); } catch (e) {} }
            const safeSince = new Date(Math.max(0, Number(sinceMs) - 120000));
            this.unsubDelta = db.collection('products').where('updatedAt', '>', safeSince).onSnapshot(snap => {
                const changed = [];
                snap.docChanges().forEach(ch => {
                    if (ch.type === 'removed') {
                        this.productsMap.delete(ch.doc.id);
                        window.SolarisCatalogDB.deleteOne('products', ch.doc.id);
                    } else {
                        const d = { id: ch.doc.id, ...ch.doc.data() };
                        this.productsMap.set(ch.doc.id, d);
                        changed.push(d);
                    }
                });
                if (changed.length > 0) {
                    window.SolarisCatalogDB.putBatch('products', changed, false);
                    window.SolarisCatalogDB.setMeta('products_last_sync_ms', Date.now());
                    this.notify();
                }
            }, () => {});
        },
        async runFullSync() {
            if (this.isSyncing) return { ok: false, count: this.productsMap.size };
            this.isSyncing = true;
            try {
                const snap = await db.collection('products').get();
                const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                if (all.length > 0) {
                    this.productsMap.clear();
                    all.forEach(p => this.productsMap.set(p.id, p));
                    await window.SolarisCatalogDB.putBatch('products', all, true);
                }
                const nowMs = Date.now();
                await window.SolarisCatalogDB.setMeta('products_last_sync_ms', nowMs);
                this.notify();
                this.startDeltaListener(nowMs);
                return { ok: true, count: all.length };
            } catch (e) {
                return { ok: false, count: this.productsMap.size };
            } finally {
                this.isSyncing = false;
            }
        }
    };

    const LineItemEditModal = ({ item, userProfile, shop, availableStock, manageStock, onSave, onClose }) => {
        const [activeField, setActiveField] = useState('quantity');
        const [qtyStr, setQtyStr] = useState(String(item.quantity || 1));
        const [priceStr, setPriceStr] = useState(String(item.price || 0));
        const [note, setNote] = useState(item.note || '');
        const [freshStart, setFreshStart] = useState(true);

        const requiredPin = useMemo(() => {
            const rawPin = String(shop?.discountPin || '').replace(/\D/g, '');
            return rawPin.length === 6 ? rawPin : '';
        }, [shop?.discountPin]);
        const [pinInput, setPinInput] = useState('');
        const pinInputRef = useRef(null);

        const isRoleAuthorized = userProfile?.role === 'Admin' ||
                                 userProfile?.role === 'Shop Manager' ||
                                 userProfile?.role === 'Shop Supervisor' ||
                                 (userProfile?.permissions || []).includes('inventory') ||
                                 (userProfile?.permissions || []).includes('settings');

        const isPinUnlocked = requiredPin ? (pinInput === requiredPin) : isRoleAuthorized;
        const isPinInvalid = requiredPin && pinInput.length === 6 && pinInput !== requiredPin;
        const canOverridePrice = isPinUnlocked;
        const originalPrice = item.originalPrice ?? item.price;

        const handlePinChange = (e) => {
            const digits = e.target.value.replace(/\D/g, '').slice(0, 6);
            setPinInput(digits);
            if (requiredPin && digits !== requiredPin && activeField === 'price') {
                setActiveField('quantity');
            }
        };

        const handleSelectField = (field) => {
            if (field === 'price' && !canOverridePrice) {
                if (requiredPin && pinInputRef.current) pinInputRef.current.focus();
                return;
            }
            setActiveField(field);
            setFreshStart(true);
        };

        const handleDigit = (digit) => {
            if (activeField === 'quantity') {
                setQtyStr(prev => {
                    const next = (freshStart || prev === '0') ? String(digit) : prev + String(digit);
                    return next.slice(0, 6);
                });
            } else if (activeField === 'price' && canOverridePrice) {
                setPriceStr(prev => {
                    const next = (freshStart || prev === '0') ? String(digit) : prev + String(digit);
                    return next.slice(0, 9);
                });
            }
            setFreshStart(false);
        };

        const handleBackspace = () => {
            if (activeField === 'quantity') setQtyStr(prev => (prev.length > 1 ? prev.slice(0, -1) : '0'));
            else if (activeField === 'price' && canOverridePrice) setPriceStr(prev => (prev.length > 1 ? prev.slice(0, -1) : '0'));
            setFreshStart(false);
        };

        const handleClear = () => {
            if (activeField === 'quantity') setQtyStr('0');
            else if (activeField === 'price' && canOverridePrice) setPriceStr('0');
            setFreshStart(true);
        };

        const handleQuickQty = (preset) => {
            setActiveField('quantity');
            setQtyStr(String(preset));
            setFreshStart(true);
        };

        const handleSubmit = (e) => {
            if (e) e.preventDefault();
            const finalQty = Math.max(1, parseInt(qtyStr, 10) || 1);
            const finalPrice = canOverridePrice ? Math.max(0, parseFloat(priceStr) || 0) : item.price;
            onSave({ quantity: finalQty, price: finalPrice, note: note.trim() });
        };

        const parsedQty = Math.max(1, parseInt(qtyStr, 10) || 0);
        const parsedPrice = Math.max(0, parseFloat(priceStr) || 0);
        const isOverStock = manageStock && parsedQty > availableStock;

                                    isPinUnlocked
                                        ? 'bg-emerald-950/30 border-emerald-500/40'

                                            ? 'bg-rose-950/30 border-rose-500/50'
                                            : 'bg-slate-900/80 border-amber-500/30'

                                                        : 'border-slate-600 text-white focus:border-amber-400'

                                    </div>
                                </div>
                            ) : !isRoleAuthorized ? (
                                <div className="px-3 py-2 rounded-xl bg-slate-900/60 border border-slate-700 text-[11px] text-slate-400 flex items-center gap-2">

                            <div className="grid grid-cols-2 gap-3">
                                <div
                                    onClick={() => handleSelectField('quantity')}
                                    className={`p-3 rounded-xl border-2 cursor-pointer transition-all ${
                                        activeField === 'quantity'

                                            : 'bg-slate-900/50 border-slate-700 hover:border-slate-600'
                                    }`}
                                >
                                    <div className="flex justify-between items-center mb-1">
                                        <span className="text-[11px] font-bold uppercase tracking-wider text-blue-400">Quantity</span>
                                        <i className="fas fa-cubes text-xs text-blue-400"></i>

                                    <input

                                        min="1"
                                        value={qtyStr}
                                        onFocus={() => handleSelectField('quantity')}
                                        onChange={(e) => { setQtyStr(e.target.value); setFreshStart(false); }}
                                        className="w-full bg-transparent text-2xl font-black text-white outline-none"
                                        autoFocus
                                    />
                                </div>

                                <div
                                    onClick={() => handleSelectField('price')}
                                    className={`p-3 rounded-xl border-2 transition-all relative ${
                                        !canOverridePrice

                                            : activeField === 'price'
                                                ? 'bg-emerald-600/20 border-emerald-500 shadow-lg shadow-emerald-900/20 cursor-pointer'
                                                : 'bg-slate-900/50 border-slate-700 hover:border-slate-600 cursor-pointer'

                                    title={!canOverridePrice ? (requiredPin ? 'Enter 6-digit Shop PIN above to unlock price override' : 'Authorized role required for price override') : 'Tap to override unit price'}
                                >
                                    <div className="flex justify-between items-center mb-1">

                                    {canOverridePrice && parsedPrice !== originalPrice && (

                                            className="text-[10px] text-amber-400 hover:underline mt-0.5 block"

    const ReceiptModal = ({ saleData, onClose }) => {
        const { shops, systemConfig } = useData();
        const receiptRef = useRef(null);
        const [isSaving, setIsSaving] = useState(false);

        if (!saleData) return null;
        const shopObj = (shops || []).find(s => s.id === saleData.shopId);
        const headerName = shopObj?.brandingName || saleData.shopName || systemConfig?.appName || 'POS TERMINAL';
        const formattedDate = safeFormatDateTime(saleData.createdAt || saleData.timestamp, safeFormatDateTime(new Date()));

        const handleSavePng = () => {
            if (!receiptRef.current || !window.html2canvas || isSaving) return;
            setIsSaving(true);
            window.html2canvas(receiptRef.current, { scale: 3, backgroundColor: '#ffffff', useCORS: true })
                .then(canvas => {
                    const link = document.createElement('a');
                    link.download = `Receipt-${saleData.receiptNo || Date.now()}.png`;
                    link.href = canvas.toDataURL('image/png');
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                })
                .catch(() => {})
                .finally(() => setIsSaving(false));
        };

        const handlePrint = () => {
            if (!receiptRef.current || !window.html2canvas) return;
            window.html2canvas(receiptRef.current, { scale: 3, backgroundColor: '#ffffff', useCORS: true }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const win = window.open('', '', 'width=380,height=620');
                if (!win) return;

    // --- PHASE 3: Sales History & Void Logic (100% Copycat from index.html) ---

        const [saleToVoid, setSaleToVoid] = useState(null);
        const [voidReason, setVoidReason] = useState('');

        const toggleExpand = (saleId) => {
            setExpandedSaleId(prev => prev === saleId ? null : saleId);

        const executeVoid = async () => {
            if (!saleToVoid) return;
            if (!voidReason.trim()) {
                setErrorModal({ show: true, message: "Please provide a reason for voiding." });
                return;
            }

            const sale = saleToVoid;
            const reason = voidReason.trim();

            setSaleToVoid(null);
            setVoidReason('');
            setVoidingId(sale.id);

            try {
                const batch = db.batch();

                // 1. Update Sale Status
                const saleRef = db.collection('sales').doc(sale.id);
                batch.update(saleRef, {
                    status: 'void',
                    voidedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    voidedBy: userProfile?.name || 'Unknown',
                    voidReason: reason
                });

                // 2. Restore Stock
                const targetShopId = sale.shopId || shopId;
                (sale.items || []).forEach(item => {
                    const productRef = db.collection('products').doc(item.productId);
                    batch.update(productRef, {
                        [`stockByShop.${targetShopId}`]: firebase.firestore.FieldValue.increment(item.quantity),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    if (window.SolarisSmartProductEngine) {
                        window.SolarisSmartProductEngine.applyLocalStockDelta(item.productId, targetShopId, item.quantity);
                    }

                    // 3. Log Negative Movement (Return)
                    const moveRef = db.collection("productMovement").doc();
                    batch.set(moveRef, {
                        productId: item.productId,
                        productCode: item.code,
                        productName: item.name,
                        type: 'Void/Return',
                        quantityChange: item.quantity,
                        from: 'Customer',
                        to: sale.shopName || 'Shop',
                        referenceNo: `${sale.receiptNo} (VOID)`,
                        note: `Void Reason: ${reason}`,
                        performedBy: userProfile?.name || 'Unknown',
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                });

                // 4. Reverse Customer Points & Redemptions (if applicable)
                if (sale.customerId) {
                    const pointsEarnedToRevert = sale.pointsEarned || 0;
                    const pointsRedeemedToRestore = sale.pointsRedeemed ?? sale.redemptionAmount ?? 0;
                    const netPointsReversal = pointsRedeemedToRestore - pointsEarnedToRevert;

                    const custRef = db.collection("customers").doc(sale.customerId);
                    const custUpdate = {
                        totalSpent: firebase.firestore.FieldValue.increment(-sale.grandTotal),
                        visitCount: firebase.firestore.FieldValue.increment(-1)
                    };

                    if (netPointsReversal !== 0) {
                        custUpdate.points = firebase.firestore.FieldValue.increment(netPointsReversal);
                    }

                    batch.update(custRef, custUpdate);
                }

                // 5. Reverse Shift Totals (if shiftId is recorded on the sale)
                if (sale.shiftId) {
                    const shiftRef = db.collection("shifts").doc(sale.shiftId);
                    const isCash = sale.paymentMethod === 'Cash';
                    const isKHQR = !isCash;
                    const grandTotal = parseFloat(sale.grandTotal) || 0;

                    const shiftUpdate = {
                        totalSales: firebase.firestore.FieldValue.increment(-grandTotal),
                        transactionCount: firebase.firestore.FieldValue.increment(-1)
                    };

                    if (isCash) {
                        shiftUpdate.totalCashSales = firebase.firestore.FieldValue.increment(-grandTotal);
                    } else if (isKHQR) {
                        shiftUpdate.totalKHQRSales = firebase.firestore.FieldValue.increment(-grandTotal);
                    }

                    batch.set(shiftRef, shiftUpdate, { merge: true });
                }

                // Immediately mark void in local sales store & parent shift state so Close Shift & Sale Report update in 0ms
                if (window.SolarisLocalSalesStore) {
                    window.SolarisLocalSalesStore.markSaleVoid(sale.id, {
                        voidedAt: new Date().toISOString(),
                        voidedBy: userProfile?.name || 'Unknown',
                        voidReason: reason
                    });
                }
                if (typeof onSaleVoided === 'function') {
                    onSaleVoided(sale);
                }

                await batch.commit();
            } catch (err) {
                console.error(err);
                setErrorModal({ show: true, message: "Failed to void sale. Please try again." });
            } finally {
                setVoidingId(null);
            }
        };

        return (
            <Modal show={true} onClose={onClose} maxWidth="max-w-4xl">
                {saleToVoid && (
                    <Modal show={true} onClose={() => { setSaleToVoid(null); setVoidReason(''); }} maxWidth="max-w-md">
                        <ModalHeader title="Void Transaction" onClose={() => { setSaleToVoid(null); setVoidReason(''); }} />
                        <ModalBody>

                                </p>
                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-1">Reason for Voiding <span className="text-red-400">*</span></label>
                                    <input
                                        type="text"

                                        className="w-full bg-slate-700 text-white px-3 py-2 rounded-lg border border-slate-600 focus:border-red-500 outline-none"

                <MessageModal
                    show={errorModal.show}
                    title="Void Error"
                    message={errorModal.message}
                    isError={true}
                    onClose={() => setErrorModal({ show: false, message: '' })}
                />
                <ModalHeader title="Today's Transactions" onClose={onClose} />
                <ModalBody>
                    {loading ? <div className="text-center p-8"><div className="loader mx-auto"></div></div> : (
                        <div className="overflow-x-auto">
                            <table className="min-w-full text-sm text-left">
                                <thead className="bg-slate-900/50 text-slate-400">
                                    <tr>
                                        <th className="px-4 py-3 w-10"></th>
                                        <th className="px-4 py-3">Time</th>
                                        <th className="px-4 py-3">Receipt</th>
                                        <th className="px-4 py-3">Payment Method</th>
                                        <th className="px-4 py-3 text-right">Discount</th>
                                        <th className="px-4 py-3 text-right">Total</th>

                                <tbody className="divide-y divide-slate-700">
                                    {sales.length === 0 ? (
                                        <tr><td colSpan="8" className="p-4 text-center text-slate-500">No sales found today.</td></tr>
                                    ) : sales.map(sale => {
                                        const discountAmt = Number(sale.discount) || (Number(sale.manualDiscount || 0) + Number(sale.redemptionAmount || 0));
                                        const isBank = sale.paymentMethod === 'KHQR' || sale.paymentMethod === 'Bank' || sale.paymentMethod === 'KHQR (ABA)';
                                        const isExpanded = expandedSaleId === sale.id;
                                        return (

                                                <tr
