                    </div>

                    <div className="p-4 bg-slate-900/60 border-t border-slate-700 space-y-3 shrink-0">
                        {/* Manual Dis (%), Inline PIN Code Field & Payment Method Selector in Footer */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 items-end">
                            <div>
                                <div className="flex items-center justify-between gap-1 mb-1">

                                    {requiredDiscountPin && (
                                        <input
                                            type="password"
                                            inputMode="numeric"
                                            maxLength={6}
                                            value={discountPinInput}
                                            onChange={e => {
                                                const digits = e.target.value.replace(/\D/g, '').slice(0, 6);
                                                setDiscountPinInput(digits);
                                                if (digits !== requiredDiscountPin && manualDiscount) handleDiscountChange('');

                                            placeholder="PIN"
                                            className={`w-20 bg-slate-800 text-center font-mono text-xs font-bold px-2 py-2 rounded-lg border outline-none h-[40px] transition ${
                                                isDiscountUnlocked ? 'border-emerald-500 text-emerald-300' : 'border-slate-600 text-white focus:border-amber-500'

                                            min="0"

                            <div>

                        {!isBranchKhqrEnabled && method === 'KHQR' && (

                        <div className="flex gap-3 pt-1">

                                onClick={() => onConfirm({

                                    change,
                                    changeBreakdown: method === 'Cash' && change > 0 ? {
                                        mode: changeMode,
                                        usd: changeMode === 'dual' ? smartChange.usdBills : 0,
                                        khr: changeMode === 'dual' ? smartChange.roundedKhrRemainder : Math.round(change / 100) * 100
                                    } : null,
                                    discount: totalDiscount,
                                    redemptionAmount: parsedRedemption,
                                    pointsRedeemed: effectivePointsUsed,
                                    rewardProductClaimed: claimFreeProduct && resolvedRewardSelection ? resolvedRewardSelection.name : null,
                                    addedRewardProduct: (claimFreeProduct && resolvedRewardSelection?.source === 'catalog') ? resolvedRewardSelection.product : null,

    };

    // ========================================================================
    // 10. STANDALONE POS TERMINAL WORKSPACE
    // ========================================================================
    const POSTerminal = ({ userProfile, activeShopId, setActiveShopId, activeShift, setActiveShift, showShiftModal, setShowShiftModal, showHistoryModal, setShowHistoryModal, showDailyReportModal, setShowDailyReportModal, showBankAutoSumModal, setShowBankAutoSumModal, showKhqrSimulatorModal, setShowKhqrSimulatorModal }) => {
        const { products, shops, devices, customers, loyaltyRules, systemConfig, currentDeviceId } = useData();
        const [searchTerm, setSearchTerm] = useState('');
        const [selectedCategory, setSelectedCategory] = useState('All');
        const [viewMode, setViewMode] = useState('list'); // 'list' (Default inline Code • Barcode • QTY) | 'grid' (1:1 photo grid)
        const [activeMobileTab, setActiveMobileTab] = useState('products');
        const [cart, setCart] = useState([]);

        // Held Tickets (Firestore real-time listener matching index.html)
        const [heldTickets, setHeldTickets] = useState([]);
        const [heldTicketsLoading, setHeldTicketsLoading] = useState(false);
        const heldTicketsCount = heldTickets.length;

        // Customer Search & Selection State (100% Copycat from index.html)
        const [selectedCustomerId, setSelectedCustomerId] = useState('');
        const [customerSearchTerm, setCustomerSearchTerm] = useState('');
        const [isCustomerSearchFocused, setIsCustomerSearchFocused] = useState(false);

        // Cart Ticket Modals State (100% Copycat from index.html)
        const [showPaymentModal, setShowPaymentModal] = useState(false);
        const [showAddCustomerModal, setShowAddCustomerModal] = useState(false);
        const [showSaveTicketModal, setShowSaveTicketModal] = useState(false);
        const [showHeldTicketsModal, setShowHeldTicketsModal] = useState(false);
        const [showClearConfirm, setShowClearConfirm] = useState(false);
        const [pendingRestoreTicket, setPendingRestoreTicket] = useState(null);
        const [editingCartItem, setEditingCartItem] = useState(null);
        const canEditLineItem = true;

        const [isProcessing, setIsProcessing] = useState(false);
        const [completedReceipt, setCompletedReceipt] = useState(null);
        const [thankYouModalData, setThankYouModalData] = useState(null);
        const [modalMsg, setModalMsg] = useState({ show: false, title: '', message: '', isError: false });
        const [todaySales, setTodaySales] = useState([]);
        const [todaySalesLoading, setTodaySalesLoading] = useState(false);

        const debouncedSearch = useDebounce(searchTerm, 120);
        const searchInputRef = useRef(null);
        const [isVirtualKeyboardEnabled, setIsVirtualKeyboardEnabled] = useState(false);

        const isAnyModalOpen = Boolean(
            showPaymentModal ||
            showAddCustomerModal ||
            showSaveTicketModal ||
            showHeldTicketsModal ||
            showClearConfirm ||
            pendingRestoreTicket ||
            editingCartItem ||
            completedReceipt ||
            thankYouModalData ||
            showShiftModal ||
            showHistoryModal ||
            showDailyReportModal ||
            showBankAutoSumModal ||
            showKhqrSimulatorModal
        );

        const isAnyModalOpenRef = useRef(isAnyModalOpen);
        useEffect(() => {
            isAnyModalOpenRef.current = isAnyModalOpen;
        }, [isAnyModalOpen]);

        const refocusSearchInput = useCallback((force = false) => {
            setTimeout(() => {
                if (!searchInputRef.current || isAnyModalOpenRef.current) return;
                const activeEl = document.activeElement;
                const isTypingElsewhere = activeEl &&
                    activeEl !== document.body &&
                    activeEl !== searchInputRef.current &&
                    ['INPUT', 'TEXTAREA', 'SELECT'].includes(activeEl.tagName);
                if (!isTypingElsewhere || force) {
                    try {
                        searchInputRef.current.focus({ preventScroll: true });
                    } catch (e) {
                        searchInputRef.current.focus();
                    }
                }
            }, 30);
        }, []);

        // Keep barcode scanner cursor continuously active across Desktop & Tablet whenever no modal or other input is focused
        useEffect(() => {
            if (!isAnyModalOpen) {
                refocusSearchInput(true);
            }
        }, [isAnyModalOpen, activeMobileTab, selectedCategory, viewMode, refocusSearchInput]);

        useEffect(() => {
            const handleGlobalReclaimFocus = (e) => {
                if (isAnyModalOpenRef.current) return;
                const target = e.target;
                if (target && target.closest && target.closest('input, textarea, select, [contenteditable="true"]')) {
                    return;
                }
                refocusSearchInput(false);
            };
            const handleVisibilityOrFocus = () => {
                if (!document.hidden && !isAnyModalOpenRef.current) {
                    refocusSearchInput(false);
                }
            };
            document.addEventListener('pointerup', handleGlobalReclaimFocus, true);
            window.addEventListener('focus', handleVisibilityOrFocus);
            document.addEventListener('visibilitychange', handleVisibilityOrFocus);
            return () => {
                document.removeEventListener('pointerup', handleGlobalReclaimFocus, true);
                window.removeEventListener('focus', handleVisibilityOrFocus);
                document.removeEventListener('visibilitychange', handleVisibilityOrFocus);
            };
        }, [refocusSearchInput]);

        const availableShops = useMemo(() => {
            if (userProfile?.role === 'Admin') return shops;
            const assigned = userProfile?.assignedShops || [];
            return shops.filter(s => assigned.includes(s.id));
        }, [shops, userProfile]);

        const activeShop = useMemo(() => availableShops.find(s => s.id === activeShopId) || availableShops[0] || null, [availableShops, activeShopId]);
        const currentDevice = useMemo(() => devices.find(d => d.id === currentDeviceId) || null, [devices, currentDeviceId]);
        const selectedCustomerObj = useMemo(() => customers.find(c => c.id === selectedCustomerId) || null, [customers, selectedCustomerId]);

        const filteredCustomers = useMemo(() => {
            if (!customers || customers.length === 0) return [];
            const q = customerSearchTerm.trim().toLowerCase();
            if (!q) return customers.slice(0, 15);
            return customers.filter(c =>
                (c.name || '').toLowerCase().includes(q) ||
                String(c.phone || '').toLowerCase().includes(q)
            ).slice(0, 15);
        }, [customers, customerSearchTerm]);

        const activeLoyaltyRule = useMemo(() => {
            if (!loyaltyRules || loyaltyRules.length === 0) return null;
            const branchRule = loyaltyRules.find(r => r.shopId === activeShop?.id && r.status !== 'Inactive');
            return branchRule || loyaltyRules.find(r => r.shopId === 'All' && r.status !== 'Inactive') || null;
        }, [loyaltyRules, activeShop?.id]);

        const customerLoyaltyStatus = useMemo(
            () => evaluateCustomerLoyaltyStatus(selectedCustomerObj, activeLoyaltyRule),
            [selectedCustomerObj, activeLoyaltyRule]
        );

        const getAvailableStock = useCallback((productId) => {
            const prod = products.find(p => p.id === productId);
            if (!prod) return 0;
            return prod.stockByShop?.[activeShop?.id] || 0;
        }, [products, activeShop?.id]);

        // Held Tickets Real-Time Listener (100% Copycat from index.html)
        useEffect(() => {
            if (!activeShop?.id) {
                setHeldTickets([]);
                return;
            }
            setHeldTicketsLoading(true);
            const unsub = db.collection('heldTickets')
                .where('shopId', '==', activeShop.id)
                .onSnapshot(snap => {
                    const list = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                        .sort((a, b) => (safeToDate(b.savedAt) || 0) - (safeToDate(a.savedAt) || 0));
                    setHeldTickets(list);
                    setHeldTicketsLoading(false);
                }, () => setHeldTicketsLoading(false));
            return () => unsub();
        }, [activeShop?.id]);

        // Today's Sales Real-Time Listener (100% Copycat — Shared by SalesHistoryModal, DailyReportModal & ShiftManagementModal)
        useEffect(() => {
            if (!activeShop?.id) {
                setTodaySales([]);
                return;
            }
            const startOfDay = new Date();
            startOfDay.setHours(0, 0, 0, 0);

            if (window.SolarisLocalSalesStore) {
                const localToday = window.SolarisLocalSalesStore.getSales().filter(s => {
                    const d = safeToDate(s.timestamp || s.createdAt);
                    return s.shopId === activeShop.id && d && d >= startOfDay;
                });
                if (localToday.length > 0) setTodaySales(localToday);
            }

            setTodaySalesLoading(true);
            const unsub = db.collection('sales')
                .where('timestamp', '>=', startOfDay)
                .onSnapshot({ includeMetadataChanges: true }, snap => {
                    const cloudToday = snap.docs
                        .map(d => ({ id: d.id, ...d.data() }))
                        .filter(s => s.shopId === activeShop.id)
                        .sort((a, b) => (safeToDate(b.timestamp || b.createdAt) || 0) - (safeToDate(a.timestamp || a.createdAt) || 0));
                    setTodaySales(cloudToday);
                    setTodaySalesLoading(false);
                }, () => setTodaySalesLoading(false));
            return () => unsub();
        }, [activeShop?.id]);

        const categoriesList = useMemo(() => {
            const set = new Set(['All']);
            products.forEach(p => {
                const cat = (p.category || p.categoryName || '').trim();
                if (cat) set.add(cat);
            });
            return Array.from(set);
        }, [products]);

        const filteredProducts = useMemo(() => {
            const q = debouncedSearch.trim().toLowerCase();
            return products.filter(p => {
                if (selectedCategory !== 'All') {
                    const cat = (p.category || p.categoryName || '').trim();
                    if (cat !== selectedCategory) return false;
                }
                if (!q) return true;
                return (
                    (p.name || '').toLowerCase().includes(q) ||
                    (p.code || '').toLowerCase().includes(q) ||
                    String(p.barcode || '').toLowerCase().includes(q)
                );
            }).slice(0, 120);
        }, [products, selectedCategory, debouncedSearch]);

        const cartTotal = useMemo(() => cart.reduce((sum, item) => sum + ((Number(item.price) || 0) * (Number(item.quantity) || 0)), 0), [cart]);
        const cartItemCount = useMemo(() => cart.reduce((sum, item) => sum + (Number(item.quantity) || 0), 0), [cart]);
        const exchangeRate = Math.max(100, Number(activeShop?.khqrConfig?.exchangeRate) || 4000);

        const loyaltyRate = parseFloat(systemConfig?.loyaltyRate) || 0;
        const estimatedPoints = useMemo(() => {
            if (!selectedCustomerId || cartTotal <= 0) return 0;
            if (activeLoyaltyRule && Number(activeLoyaltyRule.spendAmountKhr) > 0 && Number(activeLoyaltyRule.earnPoints) > 0) {
                return Math.floor(cartTotal / Number(activeLoyaltyRule.spendAmountKhr)) * Number(activeLoyaltyRule.earnPoints);
            }
            return loyaltyRate > 0 ? Math.floor(cartTotal * (loyaltyRate / 100)) : 0;
        }, [selectedCustomerId, cartTotal, activeLoyaltyRule, loyaltyRate]);

        // 0ms Pre-Paint Synchronous Broadcast of Live Cart to Customer Display (`POS-KHRQ.html`)
        React.useLayoutEffect(() => {
            if (!activeShop?.id || showPaymentModal || completedReceipt || thankYouModalData || showKhqrSimulatorModal) return;
            if (cart.length === 0) {
                window.SolarisPayWayVerifier.broadcastCustomerDisplaySession(activeShop.id, {
                    status: 'IDLE',
                    shopId: activeShop.id,
                    shopName: activeShop.brandingName || activeShop.name || systemConfig?.appName || 'POS Terminal',
                    exchangeRate,
                    items: [],
                    itemCount: 0,
                    subtotalKhr: 0,
                    discountKhr: 0,
                    rewardProductClaimed: null,
                    amountKhr: 0,
                    amountUsd: 0,
                    customerName: null,
                    customerPoints: 0,
                    estimatedPointsEarned: 0,
                    loyaltyRule: activeLoyaltyRule,
                    invoiceNo: ''
                });
            } else {
                const sanitizedItems = cart.map(item => ({
                    productId: item.productId,
                    code: item.code || '',
                    name: item.name || 'Item',
                    price: Number(item.price) || 0,
                    originalPrice: Number(item.originalPrice ?? item.price) || 0,
                    quantity: Math.max(1, parseInt(item.quantity, 10) || 1),
                    note: item.note || ''
                }));
                window.SolarisPayWayVerifier.broadcastCustomerDisplaySession(activeShop.id, {
                    status: 'CART',
                    shopId: activeShop.id,
                    shopName: activeShop.brandingName || activeShop.name || systemConfig?.appName || 'POS Terminal',
                    deviceId: currentDeviceId || '',
                    deviceName: currentDevice?.name || 'Counter Terminal',
                    cashierName: userProfile?.name || 'Cashier',
                    items: sanitizedItems,
                    itemCount: cartItemCount,
                    subtotalKhr: cartTotal,
                    discountKhr: 0,
                    rewardProductClaimed: null,
                    amountKhr: cartTotal,
                    amountUsd: Number((cartTotal / exchangeRate).toFixed(2)),
                    exchangeRate,
                    customerName: selectedCustomerObj ? selectedCustomerObj.name : null,
                    customerPhone: selectedCustomerObj ? selectedCustomerObj.phone : null,
                    customerPoints: selectedCustomerObj ? customerLoyaltyStatus.effectivePoints : 0,
                    estimatedPointsEarned: estimatedPoints,
                    loyaltyRule: activeLoyaltyRule,
                    invoiceNo: ''
                });
            }
        }, [
            activeShop?.id, activeShop?.brandingName, activeShop?.name, systemConfig?.appName,
            showPaymentModal, completedReceipt, thankYouModalData, showKhqrSimulatorModal,
            cart, cartItemCount, cartTotal, exchangeRate,
            currentDeviceId, currentDevice?.name, userProfile?.name,
            selectedCustomerObj, customerLoyaltyStatus.effectivePoints, estimatedPoints, activeLoyaltyRule
        ]);

        // Audited Cart Log (Syncs Delete Item, Clear Cart & Delete Recall to Sale Report -> Cleared Carts Log)
        const logCartAuditAction = useCallback((actionType, targetItems = [], extraMeta = {}) => {
            if (!Array.isArray(targetItems) || targetItems.length === 0) return;
            const totalQty = targetItems.reduce((sum, i) => sum + (Number(i.quantity) || 1), 0);
            const totalAmount = targetItems.reduce((sum, i) => sum + ((Number(i.price) || 0) * (Number(i.quantity) || 1)), 0);
            const logRef = db.collection('clearedCarts').doc();
            const nowIso = new Date().toISOString();
            const statusLabel = actionType === 'delete_item'
                ? 'Delete Item'
                : (actionType === 'delete_recall' || actionType === 'delete_saved_bill')
                    ? 'Delete Recall'
                    : 'Clear Cart';

            const auditPayload = {
                id: logRef.id,
                actionType, // 'delete_item' | 'clear_cart' | 'delete_recall'
                status: statusLabel,
                shopId: activeShop?.id || '',
                shopName: activeShop?.name || 'Unknown Shop',
                cashierId: userProfile?.uid || '',
                cashierName: userProfile?.name || 'Cashier',
                deviceId: currentDevice?.id || '',
                deviceName: currentDevice?.name || 'POS-01',
                shiftId: activeShift?.id || '',
                ...extraMeta,
                items: targetItems.map(i => ({
                    productId: i.productId || '',
                    code: i.code || '',
                    name: i.name || '',
                    price: Number(i.price) || 0,
                    quantity: Number(i.quantity) || 1
                })),
                totalQty,
                totalAmount,
                createdAt: nowIso
            };

            window.SolarisLocalSalesStore.recordClearedCart(auditPayload);
            logRef.set({
                ...auditPayload,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(() => {});
        }, [activeShop, userProfile, currentDevice, activeShift]);

        const addToCart = useCallback((product) => {
            if (!activeShift || activeShift.status !== 'open') {
                setShowShiftModal(true);
                return;
            }
            const effectivePrice = getEffectiveShopPrice(product, activeShop?.id);
            setCart(prev => {
                const idx = prev.findIndex(i => i.productId === product.id);
                if (idx !== -1) {
                    const next = [...prev];
                    next[idx] = { ...next[idx], quantity: (parseInt(next[idx].quantity, 10) || 0) + 1 };
                    return next;
                }
                return [...prev, {
                    productId: product.id,
                    code: product.code || '',
                    name: product.name || 'Item',
                    price: effectivePrice,
                    originalPrice: effectivePrice,
                    cost: Number(product.cost) || 0,
                    quantity: 1,
                    note: ''
                }];
            });
            refocusSearchInput();
        }, [activeShift, setShowShiftModal, activeShop?.id, refocusSearchInput]);

        const handleApplyLineItemEdit = (productId, updates) => {
            setCart(prev => prev.map(item => {
                if (item.productId === productId) {
                    const newQty = Math.max(1, parseInt(updates.quantity, 10) || 1);
                    return {
                        ...item,
                        quantity: newQty,
                        price: updates.price !== undefined ? Math.max(0, parseFloat(updates.price) || 0) : item.price,
                        originalPrice: item.originalPrice ?? item.price,
                        note: updates.note !== undefined ? updates.note : (item.note || '')
                    };
                }
                return item;
            }));
            setEditingCartItem(null);
            refocusSearchInput();
        };

        const removeFromCart = (productId) => {
            const removedItem = cart.find(item => item.productId === productId);
            if (removedItem) logCartAuditAction('delete_item', [removedItem]);
            setCart(prev => prev.filter(item => item.productId !== productId));
            refocusSearchInput();
        };

        const updateQty = (productId, delta) => {
            setCart(prev => prev.map(item => {
                if (item.productId === productId) {
                    const currentQty = parseInt(item.quantity, 10) || 0;
                    const newQty = Math.max(1, currentQty + delta);
                    return { ...item, quantity: newQty };
                }
                return item;
            }));
            refocusSearchInput();
        };

        // Hold / Save Bill Logic (100% Copycat from index.html)
        const handleOpenSaveTicket = () => {
            if (cart.length === 0) {
                setModalMsg({ show: true, title: 'Empty Cart', message: 'Cart is empty. Nothing to save.', isError: true });
                return;
            }
            if (!activeShop?.id) return;
            setShowSaveTicketModal(true);
        };

        const processSaveTicket = async (note) => {
            setIsProcessing(true);
            try {
                const referenceName = note || (selectedCustomerObj ? selectedCustomerObj.name : 'Walk-in Customer');
                await db.collection('heldTickets').add({
                    shopId: activeShop.id,
                    items: cart,
                    customerId: selectedCustomerId,
                    customerName: selectedCustomerObj ? selectedCustomerObj.name : 'Walk-in Customer',
                    referenceNote: referenceName,
                    savedBy: userProfile.name,
                    savedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    totalAmount: cartTotal
                });
                setCart([]);
                setSelectedCustomerId('');
                setCustomerSearchTerm('');
                setSearchTerm('');
                setShowSaveTicketModal(false);
                refocusSearchInput();
            } catch (err) {
                console.error('Error saving ticket:', err);
                setModalMsg({ show: true, title: 'Save Error', message: 'Failed to save ticket. Please try again.', isError: true });
            } finally {
                setIsProcessing(false);
            }
        };

        const executeRestoreTicket = async (ticket) => {
            if (!ticket) return;
            try {
                setCart(ticket.items || []);
                setSelectedCustomerId(ticket.customerId || '');
                await db.collection('heldTickets').doc(ticket.id).delete();
                setPendingRestoreTicket(null);
                setShowHeldTicketsModal(false);
                refocusSearchInput();
            } catch (err) {
                console.error('Error restoring ticket:', err);
                setModalMsg({ show: true, title: 'Restore Error', message: 'Failed to restore saved bill.', isError: true });
            }
        };

        const handleRestoreTicket = (ticket) => {
            if (!ticket) return;
            if (cart.length > 0) {
                setShowHeldTicketsModal(false);
                setPendingRestoreTicket(ticket);
            } else {
                executeRestoreTicket(ticket);
            }
        };

        const handleNewCustomerSaved = (newCustomer) => {
            setShowAddCustomerModal(false);
            setSelectedCustomerId(newCustomer.id);
            setCustomerSearchTerm('');
        };

        const handleSearchKeyDown = (e) => {
            if (e.key === 'Enter' && searchTerm.trim()) {
                const q = searchTerm.trim().toLowerCase();
                const exact = products.find(p => String(p.barcode || '').toLowerCase() === q || String(p.code || '').toLowerCase() === q) || filteredProducts[0];
                if (exact) {
                    addToCart(exact);
                    setSearchTerm('');
                }
            }
        };

        const handleProcessSale = async (paymentDetails) => {
            if (!activeShop?.id || cart.length === 0 || isProcessing) return;
            if (!activeShift || activeShift.status !== 'open') {
                setShowPaymentModal(false);
                setShowShiftModal(true);
                setModalMsg({
                    show: true,
                    title: 'Shift Required',
                    message: 'Please open a shift first before processing sales.',
                    isError: true
                });
                return;
            }
            setIsProcessing(true);

            try {
                const workingCart = [...cart];
                if (paymentDetails.addedRewardProduct?.id) {
                    const rp = paymentDetails.addedRewardProduct;
                    const rpShopPrice = getEffectiveShopPrice(rp, activeShop.id);
                    workingCart.push({
                        productId: rp.id,
                        name: rp.name,
                        price: rpShopPrice,
                        originalPrice: rpShopPrice,
                        cost: Number(rp.cost) || 0,
                        quantity: 1,
                        code: rp.code || '',
                        note: 'Loyalty Free Reward Claim'
                    });
                }

                const effectiveSubtotal = workingCart.reduce((sum, i) => sum + ((Number(i.price) || 0) * (Number(i.quantity) || 1)), 0);
                const effectiveTotalCost = workingCart.reduce((sum, i) => sum + ((Number(i.cost) || 0) * (Number(i.quantity) || 1)), 0);
                const redemptionAmount = Math.max(0, parseFloat(paymentDetails.redemptionAmount) || 0);
                const pointsRedeemed = Math.max(0, parseInt(paymentDetails.pointsRedeemed ?? redemptionAmount, 10) || 0);
                const manualDiscount = Math.max(0, parseFloat(paymentDetails.manualDiscount) || 0);
                const totalDiscount = Math.min(effectiveSubtotal, redemptionAmount + manualDiscount);
                const finalGrandTotal = Math.max(0, effectiveSubtotal - totalDiscount);

                const rate = parseFloat(systemConfig?.loyaltyRate) || 0;
                const pointsEarned = selectedCustomerObj?.id
                    ? (activeLoyaltyRule && Number(activeLoyaltyRule.spendAmountKhr) > 0 && Number(activeLoyaltyRule.earnPoints) > 0
                        ? Math.floor(finalGrandTotal / Number(activeLoyaltyRule.spendAmountKhr)) * Number(activeLoyaltyRule.earnPoints)
                        : (rate > 0 ? Math.floor(finalGrandTotal * (rate / 100)) : 0))
                    : 0;

                const loyaltyEval = evaluateCustomerLoyaltyStatus(selectedCustomerObj, activeLoyaltyRule);
                const updatedPointsBalance = Math.max(0, loyaltyEval.effectivePoints - pointsRedeemed + pointsEarned);

                const receiptNo = window.SolarisInvoiceEngine.allocateInvoiceNumber(activeShop);
                const saleRef = db.collection('sales').doc();
                const nowIso = new Date().toISOString();
                const verifiedAba = paymentDetails.verifiedAba || null;
                const isAbaVerified = !!(verifiedAba && verifiedAba.isValid && verifiedAba.trxId);
                const abaChannelBadge = isAbaVerified && verifiedAba.paymentChannel && verifiedAba.paymentChannel !== 'ABA PAY'
                    ? ` via ${verifiedAba.paymentChannel}`
                    : '';
                const abaPayerDisplay = isAbaVerified
                    ? `${verifiedAba.payerName || 'ABA Customer'} (${verifiedAba.maskedAccount || '*ABA'})${abaChannelBadge}`
                    : (paymentDetails.apvRef ? 'Verified by Cashier' : null);
                const abaAmountDisplay = isAbaVerified
                    ? (verifiedAba.currency === 'KHR' ? `៛${Number(verifiedAba.amount).toLocaleString()}` : `$${Number(verifiedAba.amount).toFixed(2)}`)
                    : null;

                const saleObj = {
                    id: saleRef.id,
                    receiptNo,
                    shopId: activeShop.id,
                    shopName: activeShop.name || '',
                    deviceId: currentDevice?.id || '',
                    deviceName: currentDevice?.name || 'POS-01',
                    shiftId: activeShift?.id || '',
                    cashierId: userProfile.uid,
                    cashierName: userProfile.name || 'Cashier',
                    customerId: selectedCustomerObj?.id || null,
                    customerName: selectedCustomerObj?.name || 'Walk-in',
                    items: workingCart,
                    subtotal: effectiveSubtotal,
                    totalCost: effectiveTotalCost,
                    discount: totalDiscount,
                    manualDiscount,
                    manualDiscountPct: parseFloat(paymentDetails.manualDiscountPct) || 0,
                    redemptionAmount,
                    pointsRedeemed,
                    rewardProductClaimed: paymentDetails.rewardProductClaimed || null,
                    grandTotal: finalGrandTotal,
                    paymentMethod: paymentDetails.method,
                    amountTendered: paymentDetails.tendered,
                    tenderedUSD: paymentDetails.tenderedUSD || 0,
                    tenderedKHR: paymentDetails.tenderedKHR || 0,
                    exchangeRate: paymentDetails.exchangeRate || exchangeRate,
                    changeDue: paymentDetails.change || 0,
                    changeBreakdown: paymentDetails.changeBreakdown || null,
                    pointsEarned,
                    customerPointsBefore: loyaltyEval.effectivePoints,
                    customerPointsAfter: selectedCustomerObj?.id ? updatedPointsBalance : 0,
                    status: 'paid',
                    abaVerified: isAbaVerified || !!(paymentDetails.method === 'KHQR' && paymentDetails.apvRef),
                    abaTrxId: isAbaVerified ? String(verifiedAba.trxId).trim() : null,
                    abaApv: isAbaVerified ? String(verifiedAba.apv || '') : (paymentDetails.apvRef || null),
                    abaPayer: abaPayerDisplay,
                    abaPaymentChannel: isAbaVerified ? (verifiedAba.paymentChannel || 'ABA PAY') : null,
                    abaSourceBank: isAbaVerified ? (verifiedAba.sourceBank || 'ABA Bank') : null,
                    abaPaidAmountStr: abaAmountDisplay,
                    abaCurrency: isAbaVerified ? verifiedAba.currency : (paymentDetails.khqrCurrency || 'KHR'),
                    abaAmountUsd: isAbaVerified && verifiedAba.currency === 'USD' ? Number(verifiedAba.amount) : 0,
                    createdAt: nowIso
                };

                // 1. 0ms Local Ledger + Broadcast PAID to Customer Display
                window.SolarisLocalSalesStore.recordSale(saleObj);
                setTodaySales(prev => prev.some(s => s.id === saleObj.id) ? prev : [saleObj, ...prev]);
                if (isAbaVerified && verifiedAba.trxId) {
                    window.SolarisPayWayVerifier.claimAbaPaymentForSale(verifiedAba.trxId, saleRef.id, receiptNo);
                }
                window.SolarisPayWayVerifier.broadcastCustomerDisplaySession(activeShop.id, {
                    status: 'PAID',
                    shopName: activeShop.brandingName || activeShop.name,
                    invoiceNo: receiptNo,
                    amountKhr: finalGrandTotal,
                    amountUsd: (finalGrandTotal / (paymentDetails.exchangeRate || exchangeRate)).toFixed(2),
                    amountDisplay: abaAmountDisplay || `៛${khrFormatter.format(finalGrandTotal)}`,
                    payerDisplay: abaPayerDisplay || saleObj.customerName,
                    apv: saleObj.abaApv,
                    trxId: saleObj.abaTrxId,
                    verifiedAbaPayload: verifiedAba,
                    paidAt: Date.now()
                });

                // 2. Update Local Shift Totals immediately
                const isCash = paymentDetails.method === 'Cash';
                if (activeShift) {
                    const nextShift = {
                        ...activeShift,
                        totalSales: (Number(activeShift.totalSales) || 0) + finalGrandTotal,
                        totalCashSales: (Number(activeShift.totalCashSales) || 0) + (isCash ? finalGrandTotal : 0),
                        totalKHQRSales: (Number(activeShift.totalKHQRSales) || 0) + (!isCash ? finalGrandTotal : 0),
                        transactionCount: (Number(activeShift.transactionCount) || 0) + 1
                    };
                    setActiveShift(nextShift);
                    try { localStorage.setItem(`solaris_active_shift_${activeShop.id}`, JSON.stringify(nextShift)); } catch (e) {}
                }

                // 3. Background Firestore Batch Commit
                const batch = db.batch();
                batch.set(saleRef, { ...saleObj, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                if (activeShop.manageStock !== false) {
                    workingCart.forEach(item => {
                        if (!item.productId) return;
                        window.SolarisSmartProductEngine.applyLocalStockDelta(item.productId, activeShop.id, -item.quantity);
                        batch.update(db.collection('products').doc(item.productId), {
                            [`stockByShop.${activeShop.id}`]: firebase.firestore.FieldValue.increment(-item.quantity),
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    });
                }
                if (selectedCustomerObj?.id) {
                    const custUpdate = {
                        visitCount: firebase.firestore.FieldValue.increment(1),
                        totalSpent: firebase.firestore.FieldValue.increment(finalGrandTotal),
                        lastVisit: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    if (loyaltyEval.isExpired) custUpdate.points = updatedPointsBalance;
                    else if (pointsEarned - pointsRedeemed !== 0) custUpdate.points = firebase.firestore.FieldValue.increment(pointsEarned - pointsRedeemed);
                    batch.update(db.collection('customers').doc(selectedCustomerObj.id), custUpdate);
                }
                if (activeShift?.id) {
                    batch.set(db.collection('shifts').doc(activeShift.id), {
                        totalSales: firebase.firestore.FieldValue.increment(finalGrandTotal),
                        totalCashSales: firebase.firestore.FieldValue.increment(isCash ? finalGrandTotal : 0),
                        totalKHQRSales: firebase.firestore.FieldValue.increment(!isCash ? finalGrandTotal : 0),
                        transactionCount: firebase.firestore.FieldValue.increment(1)
                    }, { merge: true });
                }
                batch.commit().catch(() => {});

                setShowPaymentModal(false);
                setCart([]);
                setSelectedCustomerId('');
                setCustomerSearchTerm('');
                setCompletedReceipt(saleObj);

                if (isAbaVerified || (paymentDetails.method === 'KHQR' && paymentDetails.apvRef)) {
                    setThankYouModalData({
                        sourceLabel: isAbaVerified
                            ? (verifiedAba.paymentCategory === 'OUTDOOR_KHQR'
                                ? `KHQR Interbank Verified (${verifiedAba.sourceBank || verifiedAba.paymentChannel})`
                                : 'Indoor ABA PAY Auto-Verified')
                            : 'KHQR Reference Confirmed',
                        shopName: activeShop.brandingName || activeShop.name || systemConfig?.appName || 'POS Terminal',
                        amountDisplay: abaAmountDisplay || `៛${khrFormatter.format(finalGrandTotal)}`,
                        payerDisplay: abaPayerDisplay || selectedCustomerObj?.name || 'Valued Guest',
                        paymentChannel: isAbaVerified ? (verifiedAba.paymentChannel || 'ABA PAY') : 'KHQR',
                        customerName: selectedCustomerObj?.name || null,
                        invoiceNo: receiptNo,
                        apv: saleObj.abaApv || 'VERIFIED'
                    });
                }
            } finally {
                setIsProcessing(false);
            }
        };

        return (
            <div className="flex-1 flex flex-col overflow-hidden bg-slate-950 text-slate-200 min-h-0 p-2 sm:p-3 select-none">
                <MessageModal {...modalMsg} onClose={() => setModalMsg({ show: false })} />
                <ConfirmationModal
                    show={!!pendingRestoreTicket}
                    title="Overwrite Current Cart?"
                    message="Current cart is not empty. Do you want to overwrite it with the saved bill?"
                    onConfirm={() => executeRestoreTicket(pendingRestoreTicket)}
                    onCancel={() => {
                        setPendingRestoreTicket(null);
                        refocusSearchInput();
                    }}
                />
                <ConfirmationModal
                    show={showClearConfirm}
                    title="Clear Cart?"
                    message="Are you sure you want to remove all items from the current ticket?"
                    onConfirm={() => {
                        if (cart.length > 0) logCartAuditAction('clear_cart', cart);
                        setCart([]);
                        setShowClearConfirm(false);
                        refocusSearchInput();
                    }}
                    onCancel={() => {
                        setShowClearConfirm(false);
                        refocusSearchInput();
                    }}
                />

                {completedReceipt && <ReceiptModal saleData={completedReceipt} onClose={() => { setCompletedReceipt(null); refocusSearchInput(); }} />}
                {thankYouModalData && <ThankYouPaymentModal data={thankYouModalData} onClose={() => setThankYouModalData(null)} />}
                {showShiftModal && (
                    <ShiftManagementModal
                        currentShift={activeShift}
                        shopId={activeShop?.id || ''}
                        userProfile={userProfile}
                        onClose={() => setShowShiftModal(false)}
                        deviceId={currentDeviceId}
                        todaySales={todaySales}
                        onShiftStateChange={(nextShift) => {
                            setActiveShift(nextShift);
                            if (activeShop?.id) {
                                try {
                                    if (nextShift) localStorage.setItem(`solaris_active_shift_${activeShop.id}`, JSON.stringify(nextShift));
                                    else localStorage.removeItem(`solaris_active_shift_${activeShop.id}`);
                                } catch (e) {}
                            }
                        }}
                    />
                )}
                <BankAutoSumModal
                    show={showBankAutoSumModal && !!activeShift}
                    onClose={() => setShowBankAutoSumModal(false)}
                    currentShift={activeShift}
                    shop={activeShop}
                />
                <LiveDynamicKhqrSimulatorModal
                    show={showKhqrSimulatorModal}
                    onClose={() => {
                        setShowKhqrSimulatorModal(false);
                        refocusSearchInput();
                    }}
                    shop={activeShop}
                    systemConfig={systemConfig}
                />
                {showPaymentModal && (
                    <PaymentModal
                        total={cartTotal}
                        cart={cart}
                        products={products}
                        loyaltyRule={activeLoyaltyRule}
                        customer={selectedCustomerObj}
                        shop={activeShop}
                        systemConfig={systemConfig}
                        onConfirm={handleProcessSale}
                        onCancel={() => { setShowPaymentModal(false); refocusSearchInput(); }}
                        isProcessing={isProcessing}
                    />
                )}
                {showAddCustomerModal && (
                    <AddCustomerModal
                        onClose={() => setShowAddCustomerModal(false)}
                        onSave={handleNewCustomerSaved}
                        shops={shops}
                        defaultShopId={activeShop?.id || ''}
                        initialSearchTerm={customerSearchTerm}
                    />
                )}
                {showSaveTicketModal && (
                    <SaveTicketModal
                        onConfirm={processSaveTicket}
                        onCancel={() => setShowSaveTicketModal(false)}
                    />
                )}
                {showHeldTicketsModal && (
                    <HeldTicketsModal
                        tickets={heldTickets}
                        loading={heldTicketsLoading}
                        onClose={() => setShowHeldTicketsModal(false)}
                        onRestore={handleRestoreTicket}
                        onDiscard={(ticket) => {
                            if (ticket && Array.isArray(ticket.items) && ticket.items.length > 0) {
                                logCartAuditAction('delete_recall', ticket.items, {
                                    referenceNote: ticket.referenceNote || ticket.customerName || 'Saved Bill',
                                    savedBy: ticket.savedBy || ''
                                });
                            }
                        }}
                        onError={(msg) => setModalMsg({ show: true, title: 'Error', message: msg, isError: true })}
                    />
                )}
                {editingCartItem && (
                    <LineItemEditModal
                        item={editingCartItem}
                        userProfile={userProfile}
                        shop={activeShop}
                        availableStock={getAvailableStock(editingCartItem.productId)}
                        manageStock={activeShop?.manageStock !== false}
                        onSave={(updates) => handleApplyLineItemEdit(editingCartItem.productId, updates)}
                        onClose={() => { setEditingCartItem(null); refocusSearchInput(); }}
                    />
                )}

                {/* Today's Transactions & Void Modal (100% Copycat) */}
                {showHistoryModal && (
                    <SalesHistoryModal
                        shopId={activeShop?.id || ''}
                        sales={todaySales}
                        loading={todaySalesLoading}
                        onClose={() => setShowHistoryModal(false)}
                        onReprint={(sale) => { setShowHistoryModal(false); setCompletedReceipt(sale); }}
                        userProfile={userProfile}
                        onSaleVoided={(voidedSale) => {
                            if (!voidedSale) return;
                            const grandTotal = Number(voidedSale.grandTotal) || 0;
                            const isCash = voidedSale.paymentMethod === 'Cash';
                            setTodaySales(prev => prev.map(s => s.id === voidedSale.id ? { ...s, status: 'void' } : s));
                            setActiveShift(prev => {
                                if (!prev || (voidedSale.shiftId && prev.id !== voidedSale.shiftId)) return prev;
                                const updatedShift = {
                                    ...prev,
                                    totalSales: Math.max(0, (Number(prev.totalSales) || 0) - grandTotal),
                                    transactionCount: Math.max(0, (Number(prev.transactionCount) || 0) - 1),
                                    totalCashSales: isCash ? Math.max(0, (Number(prev.totalCashSales) || 0) - grandTotal) : (Number(prev.totalCashSales) || 0),
                                    totalKHQRSales: !isCash ? Math.max(0, (Number(prev.totalKHQRSales) || 0) - grandTotal) : (Number(prev.totalKHQRSales) || 0)
                                };
                                if (activeShop?.id) {
                                    try { localStorage.setItem(`solaris_active_shift_${activeShop.id}`, JSON.stringify(updatedShift)); } catch (e) {}
                                }
                                try {
                                    const cachedShifts = JSON.parse(localStorage.getItem('solaris_shifts_report_cache_v1') || '[]');
                                    const nextCached = [
                                        updatedShift,
                                        ...(Array.isArray(cachedShifts) ? cachedShifts.filter(s => s.id !== updatedShift.id) : [])
                                    ].slice(0, 200);
                                    localStorage.setItem('solaris_shifts_report_cache_v1', JSON.stringify(nextCached));
                                } catch (e) {}
                                return updatedShift;
                            });
                        }}
                    />

                        type="button"
                        onClick={() => setActiveMobileTab('products')}
                        className={`flex items-center justify-center gap-2 h-10 rounded-xl transition-all ${activeMobileTab === 'products' ? 'text-white bg-blue-600 font-bold shadow-md shadow-blue-900/40' : 'text-slate-400 hover:text-slate-200 bg-slate-800/60'}`}
                    >
                        <i className="fas fa-th-large text-sm"></i>
                        <span className="text-xs font-bold">Catalog</span>
                    </button>

                    <button
                        type="button"
                        onClick={() => setActiveMobileTab('cart')}
                        className={`flex items-center justify-center gap-2 h-10 rounded-xl transition-all relative ${activeMobileTab === 'cart' ? 'text-white bg-blue-600 font-bold shadow-md shadow-blue-900/40' : 'text-slate-400 hover:text-slate-200 bg-slate-800/60'}`}
                    >
                        <div className="relative">
                            <i className="fas fa-shopping-basket text-sm"></i>
                            {cartItemCount > 0 && (
                                <span className={`absolute -top-2 -right-3 text-[10px] font-black px-1.5 min-w-[18px] h-[18px] rounded-full flex items-center justify-center shadow ${activeMobileTab === 'cart' ? 'bg-amber-400 text-slate-950' : 'bg-red-500 text-white animate-bounce'}`}>
                                    {cartItemCount}
                                </span>
                            )}
                        </div>
                        <span className="text-xs font-bold ml-1">
                            Ticket {cartTotal > 0 ? `(៛${new Intl.NumberFormat('en-US', { notation: 'compact' }).format(cartTotal)})` : ''}
                        </span>
                    </button>
                </div>
            </div>
        );
    };

    // ========================================================================
    // 11. ROOT STANDALONE POS APP
    // ========================================================================
    function POSApp() {
        const [authState, setAuthState] = useState(() => {
            try {
                const cached = JSON.parse(localStorage.getItem('solaris_pos_standalone_profile_v1') || 'null');
                if (cached && cached.uid) return { loading: false, userProfile: cached };
            } catch (e) {}
            return { loading: true, userProfile: null };
        });

        useEffect(() => {
            if (window.SolarisKeepAwakeManager) window.SolarisKeepAwakeManager.start();
            const unsub = auth.onAuthStateChanged(async (fbUser) => {
                if (!fbUser) {
                    setAuthState({ loading: false, userProfile: null });
                    return;
                }
                try {
                    const doc = await db.collection('users').doc(fbUser.uid).get();
                    const profile = doc.exists
                        ? { id: doc.id, ...doc.data(), uid: fbUser.uid }
                        : { id: fbUser.uid, uid: fbUser.uid, name: fbUser.email?.split('@')[0] || 'Cashier', email: fbUser.email || '', role: 'Staff', assignedShops: [], permissions: ['pos-terminal'] };
                    try { localStorage.setItem('solaris_pos_standalone_profile_v1', JSON.stringify(profile)); } catch (e) {}
                    setAuthState({ loading: false, userProfile: profile });
                } catch (e) {
                    setAuthState(prev => prev.userProfile ? prev : {
                        loading: false,
                        userProfile: { id: fbUser.uid, uid: fbUser.uid, name: fbUser.email?.split('@')[0] || 'Cashier', email: fbUser.email || '', role: 'Staff', assignedShops: [], permissions: ['pos-terminal'] }
                    });
                }
            });
            return () => unsub();
        }, []);

        if (authState.loading) {
            return (
                <div className="h-screen w-screen bg-slate-950 flex flex-col items-center justify-center text-white gap-3">
                    <div className="loader w-8 h-8"></div>
                    <p className="text-xs font-bold text-slate-400">Starting POS Terminal...</p>
                </div>
            );
        }

        if (!authState.userProfile) return <LoginPage />;

        return (
            <DataProvider>
                <POSWorkspaceShell userProfile={authState.userProfile} />
            </DataProvider>
        );
    }

    const POSWorkspaceShell = ({ userProfile }) => {
        const { shops, systemConfig } = useData();
        const [activeShopId, setActiveShopId] = useState('');
        const [activeShift, setActiveShift] = useState(null);
        const [showInstallModal, setShowInstallModal] = useState(false);
        const [showShiftModal, setShowShiftModal] = useState(false);
        const [showHistoryModal, setShowHistoryModal] = useState(false);
        const [showDailyReportModal, setShowDailyReportModal] = useState(false);
        const [showBankAutoSumModal, setShowBankAutoSumModal] = useState(false);
        const [showKhqrSimulatorModal, setShowKhqrSimulatorModal] = useState(false);

        const availableShops = useMemo(() => {
            if (!shops || shops.length === 0) return [];
            if (userProfile?.role === 'Admin') return shops;
            const assigned = userProfile?.assignedShops || [];
            return assigned.length > 0 ? shops.filter(s => assigned.includes(s.id)) : shops;
        }, [shops, userProfile]);

        useEffect(() => {
            if (!activeShopId && availableShops.length > 0) {
                setActiveShopId(availableShops[0].id);
            }
        }, [activeShopId, availableShops]);

        const activeShop = useMemo(
            () => availableShops.find(s => s.id === activeShopId) || availableShops[0] || null,
            [availableShops, activeShopId]
        );

        // Subscribe to Invoice Counter & Recover Active Open Shift (0ms Local Cache + Live Firestore Sync)
        useEffect(() => {
            if (!activeShop?.id) {
                setActiveShift(null);
                return;
            }

            const unsubInv = window.SolarisInvoiceEngine?.subscribeShopCounter(activeShop.id) || (() => {});

            // 1. 0ms Local Cache Recovery
            try {
                const cachedShift = JSON.parse(localStorage.getItem(`solaris_active_shift_${activeShop.id}`) || 'null');
                if (cachedShift && cachedShift.id && cachedShift.status === 'open') {
                    setActiveShift(cachedShift);
                } else {
                    setActiveShift(null);
                }
            } catch (e) {
                setActiveShift(null);
            }

            // 2. Live Firestore Open-Shift Sync
            const unsubShift = db.collection('shifts')
                .where('shopId', '==', activeShop.id)
                .where('status', '==', 'open')
                .onSnapshot(snap => {
                    if (!snap.empty) {
                        const openDocs = snap.docs
                            .map(d => ({ id: d.id, ...d.data() }))
                            .sort((a, b) => (safeToDate(b.startTime || b.createdAt)?.getTime() || 0) - (safeToDate(a.startTime || a.createdAt)?.getTime() || 0));
                        const latestOpen = openDocs[0];
                        setActiveShift(latestOpen);
                        try {
                            localStorage.setItem(`solaris_active_shift_${activeShop.id}`, JSON.stringify({
                                ...latestOpen,
                                startTime: safeToDate(latestOpen.startTime)?.toISOString() || latestOpen.startTime,
                                createdAt: safeToDate(latestOpen.createdAt)?.toISOString() || latestOpen.createdAt
                            }));
                        } catch (e) {}
                    } else if (!snap.metadata?.fromCache) {
                        // Shift was closed on another device or Back-Office — clear stale local cache
                        setActiveShift(null);
                        try { localStorage.removeItem(`solaris_active_shift_${activeShop.id}`); } catch (e) {}
                    }
                }, () => {});

            return () => {
                unsubInv();
                unsubShift();
            };
        }, [activeShop?.id]);

        return (
            <div className="h-screen h-[100dvh] w-screen bg-slate-950 flex flex-col overflow-hidden">
                <InstallAppModal show={showInstallModal} onClose={() => setShowInstallModal(false)} appName={systemConfig?.appName || 'POS Terminal'} />
                <POSHeader
                    userProfile={userProfile}
                    activeShop={activeShop}
                    activeShift={activeShift}
                    onOpenInstallModal={() => setShowInstallModal(true)}
                    onOpenShiftModal={() => setShowShiftModal(true)}
                    onOpenHistoryModal={() => setShowHistoryModal(true)}
                    onOpenDailyReportModal={() => setShowDailyReportModal(true)}
                    onOpenBankAutoSumModal={() => setShowBankAutoSumModal(true)}
                    onOpenKhqrSimulatorModal={() => setShowKhqrSimulatorModal(true)}
                />
                <POSTerminal
                    userProfile={userProfile}
                    activeShopId={activeShopId}
                    setActiveShopId={setActiveShopId}
                    activeShift={activeShift}
                    setActiveShift={setActiveShift}
                    showShiftModal={showShiftModal}
                    setShowShiftModal={setShowShiftModal}
                    showHistoryModal={showHistoryModal}
                    setShowHistoryModal={setShowHistoryModal}
                    showDailyReportModal={showDailyReportModal}
                    setShowDailyReportModal={setShowDailyReportModal}
                    showBankAutoSumModal={showBankAutoSumModal}
                    setShowBankAutoSumModal={setShowBankAutoSumModal}
                    showKhqrSimulatorModal={showKhqrSimulatorModal}
                    setShowKhqrSimulatorModal={setShowKhqrSimulatorModal}
                />
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<POSApp />);
    </script>
</body>
</html>
