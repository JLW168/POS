    const BankAutoSumModal = ({ show, onClose, currentShift, shop }) => {
        const { shops } = useData();
        const [payments, setPayments] = useState([]);
        const [loading, setLoading] = useState(true);
        const [refreshTick, setRefreshTick] = useState(0);
        const [fetchedSecrets, setFetchedSecrets] = useState(null);

        // Fetch shop-specific payway_secrets if shop.khqrConfig lacks paywayChatId
        useEffect(() => {
            if (!show || !shop?.id) {
                setFetchedSecrets(null);
                return;
            }
            let cancelled = false;
            window.SolarisKHQREngine?.getStaffPaywaySecrets(shop.id)
                .then(sec => { if (!cancelled) setFetchedSecrets(sec || null); })
                .catch(() => { if (!cancelled) setFetchedSecrets(null); });
            return () => { cancelled = true; };
        }, [show, shop?.id]);

        // Resolve strict Shop Filter scope (PayWay Chat IDs, Merchant Aliases, and Shared-Group Detection)
        const shopScopeMeta = useMemo(() => {
            if (!shop) return { targetChatId: '', normTargetIds: [], configuredAliases: [], fallbackAliases: [], isSharedChatGroup: false };
            let localSec = null;
            try {
                localSec = JSON.parse(localStorage.getItem(`solaris_payway_secrets_${shop.id}`) || 'null');
            } catch (e) {}

            const sec = fetchedSecrets || localSec || {};
            const secretChatId = sec?.paywayChatId || sec?.khqrConfigBackup?.paywayChatId || '';
            const secretAccountName = sec?.khqrConfigBackup?.accountName || '';

            const targetChatId = String(shop?.khqrConfig?.paywayChatId || secretChatId || '').trim();
            const normTargetIds = targetChatId
                ? Array.from(new Set(
                    targetChatId
                        .split(/[\s,|;]+/)
                        .map(id => window.SolarisKHQREngine.normalizeChatId(id))
                        .filter(Boolean)
                ))
                : [];

            // Detect if another shop shares any of this shop's Telegram PayWay Chat IDs
            const isSharedChatGroup = normTargetIds.length > 0 && (shops || []).some(other => {
                if (!other || other.id === shop.id) return false;
                const otherRaw = String(other?.khqrConfig?.paywayChatId || '').trim();
                if (!otherRaw) return false;
                const otherNorms = otherRaw.split(/[\s,|;]+/).map(id => window.SolarisKHQREngine.normalizeChatId(id)).filter(Boolean);
                return otherNorms.some(oid => normTargetIds.includes(oid));
            });

            const emvMeta = shop?.khqrConfig?.baseEmvPayload && window.SolarisKHQREngine
                ? window.SolarisKHQREngine.extractMerchantInfoFromEMV(shop.khqrConfig.baseEmvPayload)
                : { merchantName: null };

            const configuredAccountStr = String(shop?.khqrConfig?.accountName || secretAccountName || '').trim();
            const configuredAliases = configuredAccountStr
                ? configuredAccountStr.split(',').map(s => s.trim().toUpperCase()).filter(Boolean)
                : [];

            const fallbackAliases = Array.from(new Set(
                [
                    ...configuredAliases,
                    emvMeta.merchantName,
                    shop?.brandingName,
                    shop?.name
                ]
                    .map(s => String(s || '').trim().toUpperCase())
                    .filter(s => s.length >= 2)
            ));

            return { targetChatId, normTargetIds, configuredAliases, fallbackAliases, isSharedChatGroup };
        }, [shop, shops, fetchedSecrets]);

        const isBypassDb = window.SolarisKHQREngine
            ? window.SolarisKHQREngine.shouldBypassFirebaseDb(shop?.id || '', shopScopeMeta.targetChatId)
            : true;

        useEffect(() => {
            if (!show || !currentShift || !shop) {
                setPayments([]);
                return;
            }

            // Strict Opening Shift Guard: Shift must be open and belong to the active Shop Filter
            if (currentShift.status !== 'open' || currentShift.shopId !== shop.id) {
                setPayments([]);
                setLoading(false);
                return;
            }

            // Strictly fetch transactions received AFTER the exact moment this shift was opened
            const shiftStartDate = safeToDate(currentShift.startTime || currentShift.createdAt);
            const shiftStartMs = shiftStartDate ? shiftStartDate.getTime() : 0;
            if (!shiftStartMs) {
                setPayments([]);
                setLoading(false);
                return;
            }

            // Clear stale items immediately when switching Shop or Shift
            setPayments([]);
            setLoading(true);

            const abortController = new AbortController();
            const { targetChatId, normTargetIds, configuredAliases, fallbackAliases, isSharedChatGroup } = shopScopeMeta;

            // Strict Shop Filter + Opening Shift Eligibility Matcher (Fail-Closed)
            const matchesShopAndShift = (itemChatId, itemMerchantName, itemRecMs, itemPaidMs = 0) => {
                const effectiveRecMs = Number(itemRecMs) || 0;
                const effectivePaidMs = Number(itemPaidMs) || 0;
                const primaryMs = effectiveRecMs || effectivePaidMs;

                // 1. Opening Shift Time Window Gate (Rejects pre-shift payments even if re-polled later)
                if (!primaryMs || primaryMs < shiftStartMs) return false;
                if (effectivePaidMs > 0 && effectivePaidMs < (shiftStartMs - 60000)) return false;

                const msgChatNorm = window.SolarisKHQREngine.normalizeChatId(itemChatId || '');
                const msgMerchUpper = String(itemMerchantName || '').trim().toUpperCase();

                // 2. Shop Filter Gate (Chat ID + Merchant Alias)
                if (normTargetIds.length > 0) {
                    if (!msgChatNorm || !normTargetIds.includes(msgChatNorm)) return false;
                    // If this Telegram group is shared across shops OR merchant aliases are configured
                    const activeAliases = configuredAliases.length > 0 ? configuredAliases : (isSharedChatGroup ? fallbackAliases : []);
                    if (activeAliases.length > 0) {
                        if (!msgMerchUpper) return !isSharedChatGroup;
                        const merchMatches = activeAliases.some(
                            alias => msgMerchUpper.includes(alias) || alias.includes(msgMerchUpper)
                        );
                        if (!merchMatches) return false;
                    }
                    return true;
                }

                // 3. Fallback when Shop has no PayWay Chat ID configured: strict Merchant/Shop Name match (Fail-Closed)
                if (fallbackAliases.length > 0 && msgMerchUpper) {
                    return fallbackAliases.some(
                        alias => msgMerchUpper.includes(alias) || alias.includes(msgMerchUpper)
                    );
                }
                return false;
            };

            const buildShiftClaimMaps = () => {
                const localClaimedTrxMap = new Map();
                const localClaimedApvMap = new Map();
                if (window.SolarisLocalSalesStore) {
                    window.SolarisLocalSalesStore.getSales().forEach(s => {
                        if (!s || s.status === 'void') return;
                        if (s.shopId !== shop.id) return;
                        const saleMs = safeToDate(s.createdAt || s.timestamp)?.getTime() || 0;
                        const belongsToShift = s.shiftId ? (s.shiftId === currentShift.id) : (saleMs >= shiftStartMs);
                        if (!belongsToShift) return;
                        if (s.abaTrxId) localClaimedTrxMap.set(String(s.abaTrxId).trim(), s);
                        if (s.abaApv) localClaimedApvMap.set(String(s.abaApv).trim().toUpperCase(), s);
                    });
                }
                return { localClaimedTrxMap, localClaimedApvMap };
            };

            const collectFilteredPayments = (extraItems = []) => {
                const { localClaimedTrxMap, localClaimedApvMap } = buildShiftClaimMaps();
                const mergedByTrx = new Map();

                const considerRecord = (rec) => {
                    if (!rec) return;
                    const cleanTrx = String(rec.trxId || rec.id || '').trim();
                    if (!cleanTrx) return;
                    const recMs = Number(rec.receivedAt || rec.date || 0);
                    const paidMs = Number(rec.paidTimestamp || 0);
                    const rawChatId = rec.chatId || '';
                    const rawMerchant = rec.merchantName || '';

                    if (!matchesShopAndShift(rawChatId, rawMerchant, recMs, paidMs)) return;

                    const cleanApv = String(rec.apv || '').trim().toUpperCase();
                    const matchedSale = localClaimedTrxMap.get(cleanTrx) || (cleanApv ? localClaimedApvMap.get(cleanApv) : null);

                    const prev = mergedByTrx.get(cleanTrx) || {};
                    mergedByTrx.set(cleanTrx, {
                        ...prev,
                        ...rec,
                        id: cleanTrx,
                        trxId: cleanTrx,
                        receivedAt: recMs || paidMs,
                        paidTimestamp: paidMs || recMs,
                        claimedByOrderId: matchedSale?.id || rec.claimedByOrderId || prev.claimedByOrderId || null,
                        claimedByInvoiceNo: matchedSale?.receiptNo || rec.claimedByInvoiceNo || prev.claimedByInvoiceNo || null
                    });
                };

                if (window.SolarisPayWayVerifier) {
                    window.SolarisPayWayVerifier.loadLocalAbaCache?.();
                    window.SolarisPayWayVerifier.inMemoryAbaPayments.forEach((entry, trxId) => {
                        if (!entry?.parsedAba) return;
                        considerRecord({
                            ...entry.parsedAba,
                            trxId: String(trxId || entry.parsedAba.trxId || '').trim(),
                            chatId: entry.chatId || entry.parsedAba.chatId || '',
                            receivedAt: Number(entry.date || entry.parsedAba.receivedAt || 0),
                            paidTimestamp: Number(entry.parsedAba.paidTimestamp || 0),
                            claimedByOrderId: entry.claimedByOrderId || null,
                            claimedByInvoiceNo: entry.claimedByInvoiceNo || null
                        });
                    });
                }

                (extraItems || []).forEach(considerRecord);

                return Array.from(mergedByTrx.values()).sort(
                    (a, b) => (Number(b.receivedAt || b.paidTimestamp) || 0) - (Number(a.receivedAt || a.paidTimestamp) || 0)
                );
            };

            let directRenderItems = [];
            let firestoreItems = [];

            // 1. Immediate hydration from strictly filtered in-memory cache
            setPayments(collectFilteredPayments());

            // 2. Dedicated Render Bridge fetch strictly scoped to active Shop Chat ID + Opening Shift startMs
            if (window.SolarisRenderBridge) {
                window.SolarisRenderBridge.ensureConnected();
                window.SolarisRenderBridge.fetchShiftPaymentsFromRender({
                    chatId: targetChatId,
                    startMs: shiftStartMs,
                    endMs: Date.now(),
                    includeHistory: refreshTick > 0,
                    signal: abortController.signal
                }).then(fetched => {
                    if (abortController.signal.aborted) return;
                    directRenderItems = fetched || [];
                    setPayments(collectFilteredPayments([...directRenderItems, ...firestoreItems]));
                    setLoading(false);
                }).catch(() => {
                    if (!abortController.signal.aborted) setLoading(false);
                });
            } else {
                setLoading(false);
            }

            // 3. Live SSE subscription updates (re-filtered strictly through matchesShopAndShift)
            const unsubVerifier = window.SolarisPayWayVerifier
                ? window.SolarisPayWayVerifier.subscribe(() => {
                    if (!abortController.signal.aborted) {
                        setPayments(collectFilteredPayments([...directRenderItems, ...firestoreItems]));
                    }
                })
                : () => {};

            // 4. Optional Firestore feed (ONLY when Bypass Firebase DB is explicitly OFF)
            let unsubFirestore = () => {};
            if (!isBypassDb) {
                unsubFirestore = db.collection('aba_payments')
                    .where('receivedAt', '>=', shiftStartMs)
                    .orderBy('receivedAt', 'desc')
                    .onSnapshot(snap => {
                        if (abortController.signal.aborted) return;
                        firestoreItems = snap.docs.map(doc => {
                            const d = doc.data() || {};
                            const recMs = Number(d.receivedAt?.toMillis ? d.receivedAt.toMillis() : d.receivedAt) || 0;
                            return { ...d, id: doc.id, trxId: String(d.trxId || doc.id).trim(), receivedAt: recMs };
                        });
                        setPayments(collectFilteredPayments([...directRenderItems, ...firestoreItems]));
                        setLoading(false);
                    }, () => {
                        if (!abortController.signal.aborted) setLoading(false);
                    });
            }

            return () => {
                abortController.abort();
                if (typeof unsubVerifier === 'function') unsubVerifier();
                if (typeof unsubFirestore === 'function') unsubFirestore();
            };
        }, [show, currentShift?.id, currentShift?.status, currentShift?.shopId, currentShift?.startTime, shop?.id, shopScopeMeta, isBypassDb, refreshTick]);

        if (!show || !currentShift || !shop) return null;

        const totalKHR = payments.filter(p => p.currency === 'KHR').reduce((sum, p) => sum + Number(p.amount || 0), 0);
        const totalUSD = payments.filter(p => p.currency === 'USD').reduce((sum, p) => sum + Number(p.amount || 0), 0);
        const verifiedCount = payments.filter(p => p.claimedByOrderId).length;

        return (
            <Modal show={show} onClose={onClose} maxWidth="max-w-3xl">
                <ModalHeader title={`Bank AutoSum — ${shop.brandingName || shop.name} (${currentShift.shiftName || 'Open'} Shift)`} onClose={onClose} />
                <ModalBody>
                    <div className="space-y-4">
                        <div className="bg-slate-900 p-4 rounded-xl border border-slate-700 grid grid-cols-1 sm:grid-cols-3 gap-3 shadow-inner">
                            <div>
                                <p className="text-[10px] font-bold uppercase tracking-wider text-slate-400">Active Shop &amp; Shift</p>
                                <p className="text-sm text-white font-bold mt-0.5 truncate">
                                    {shop.brandingName || shop.name}
                                </p>
                                <p className="text-[11px] text-blue-400 font-semibold">
                                    Shift {currentShift.shiftName || 'Open'} • {currentShift.cashierName || 'Cashier'}
                                </p>
                            </div>
                            <div>
                                <p className="text-[10px] font-bold uppercase tracking-wider text-slate-400">Shift Opened At</p>
                                <p className="text-xs sm:text-sm text-slate-200 font-mono mt-1">
                                    {currentShift.startTime ? safeFormatDateTime(currentShift.startTime, 'Unknown') : 'Unknown'}
                                </p>
                            </div>
                            <div className="text-left sm:text-right">
                                <p className="text-[10px] font-bold uppercase tracking-wider text-slate-400">POS Verification Status</p>
                                <p className="text-sm text-slate-200 font-mono mt-1">
                                    <span className="text-emerald-400 font-bold">{verifiedCount} Claimed</span> / {payments.length} Total
                                </p>
                            </div>
                        </div>

                        {shopScopeMeta.normTargetIds.length === 0 && (
                            <div className="bg-amber-500/15 border border-amber-500/40 text-amber-200 text-xs px-3.5 py-2.5 rounded-xl flex items-center gap-2">
                                <i className="fas fa-exclamation-triangle text-amber-400 shrink-0"></i>
                                <span>
                                    No Telegram PayWay Chat ID configured for <strong>{shop.name}</strong>. Filtering strictly by Merchant Name ({shopScopeMeta.fallbackAliases.join(', ') || 'None'}).
                                </span>
                            </div>
                        )}

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div className="bg-slate-900/90 p-4 rounded-xl border border-emerald-500/30 flex items-center justify-between">
                                <div>
                                    <div className="text-[11px] font-bold uppercase text-slate-400">Shift Total KHR (៛)</div>
                                    <div className="text-2xl font-black text-emerald-400 font-mono mt-1">៛{khrFormatter.format(totalKHR)}</div>
                                </div>
                                <i className="fas fa-coins text-2xl text-emerald-500/40"></i>
                            </div>
                            <div className="bg-slate-900/90 p-4 rounded-xl border border-sky-500/30 flex items-center justify-between">
                                <div>
                                    <div className="text-[11px] font-bold uppercase text-slate-400">Shift Total USD ($)</div>
                                    <div className="text-2xl font-black text-sky-400 font-mono mt-1">{usdFormatter.format(totalUSD)}</div>
                                </div>
                                <i className="fas fa-dollar-sign text-2xl text-sky-500/40"></i>
                            </div>
                        </div>

                        <div className="bg-slate-900/60 rounded-xl border border-slate-700 overflow-hidden">
                            {loading ? (
                                <div className="p-8 flex flex-col items-center justify-center gap-2 text-slate-400 text-xs">
                                    <div className="loader"></div>
                                    <span>Loading live shift bank transactions...</span>
                                </div>
                            ) : payments.length === 0 ? (
                                <div className="p-8 text-center text-slate-400 text-sm">
                                    <i className="fas fa-university text-3xl mb-2 opacity-30 block"></i>
                                    No bank transactions received for <strong>{shop.name}</strong> since shift opened.
                                </div>
                            ) : (
                                <div className="overflow-x-auto max-h-[42vh]">
                                    <table className="min-w-full divide-y divide-slate-700 text-xs">
                                        <thead className="bg-slate-950/80 text-slate-400 uppercase text-[10px] sticky top-0">
                                            <tr>
                                                <th className="px-3 py-2.5 text-left">Time</th>
                                                <th className="px-3 py-2.5 text-left">Payer / Bank</th>
                                                <th className="px-3 py-2.5 text-right">Amount</th>
                                                <th className="px-3 py-2.5 text-left">APV / Trx</th>
                                                <th className="px-3 py-2.5 text-center">POS Status</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-800">
                                            {payments.map(p => (
                                                <tr key={p.id} className="hover:bg-slate-800/50">
                                                    <td className="px-3 py-2.5 font-mono text-slate-300 whitespace-nowrap">
                                                        {safeFormatDateTime(p.receivedAt || p.paidTimestamp, '-')}
                                                    </td>
                                                    <td className="px-3 py-2.5">
                                                        <div className="font-bold text-white">{p.payerName || 'ABA Customer'} <span className="text-slate-400 font-normal">{p.maskedAccount || ''}</span></div>
                                                        <div className="text-[10px] text-sky-400">{p.sourceBank || p.paymentChannel || 'ABA Bank'}</div>
                                                    </td>
                                                    <td className="px-3 py-2.5 text-right font-mono font-black whitespace-nowrap">
                                                        <span className={p.currency === 'USD' ? 'text-sky-400' : 'text-emerald-400'}>
                                                            {p.currency === 'USD' ? `$${Number(p.amount).toFixed(2)}` : `៛${khrFormatter.format(p.amount)}`}
                                                        </span>
                                                    </td>
                                                    <td className="px-3 py-2.5 font-mono">
                                                        <div className="text-amber-300 font-bold">APV: {p.apv || '-'}</div>
                                                        <div className="text-[10px] text-slate-500">{p.trxId || '-'}</div>
                                                    </td>
                                                    <td className="px-3 py-2.5 text-center whitespace-nowrap">
                                                        {p.claimedByOrderId ? (
                                                            <span className="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 font-bold text-[10px]">
                                                                {p.claimedByInvoiceNo || 'Claimed'}
                                                            </span>
                                                        ) : (
                                                            <span className="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/40 font-bold text-[10px]">
                                                                Unclaimed
                                                            </span>
                                                        )}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                    </div>
                </ModalBody>

                <ModalFooter>
                    <button
                        type="button"
                        disabled={loading}
                        onClick={() => setRefreshTick(t => t + 1)}
                        className="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 px-4 rounded-xl text-sm flex items-center justify-center gap-1.5 disabled:opacity-50"
                        title="Refresh live feed & backfill history since shift opened"
                    >
                        <i className={`fas fa-sync-alt ${loading ? 'fa-spin' : ''}`}></i>
                        <span>{loading ? 'Syncing...' : 'Refresh'}</span>
                    </button>
                    <button type="button" onClick={onClose} className="bg-slate-600 text-white font-bold py-2.5 px-6 rounded-xl hover:bg-slate-500 w-full sm:w-auto shadow-sm transition text-sm">
                        Close AutoSum
                    </button>
                </ModalFooter>
            </Modal>
        );
    };

    // --- PIN-Protected Live Dynamic KHQR Simulator Modal for POS Terminal (100% Copycat) ---
    const LiveDynamicKhqrSimulatorModal = ({ show, onClose, shop, systemConfig }) => {
        const [isUnlocked, setIsUnlocked] = useState(false);
        const [pinInput, setPinInput] = useState('');
        const [showPin, setShowPin] = useState(false);
        const [pinError, setPinError] = useState('');

        // Live Dynamic Simulator State (KHR Default / USD)
        const [simCurrency, setSimCurrency] = useState('KHR');
        const [simAmountKHR, setSimAmountKHR] = useState(10000);
        const [simAmountUSD, setSimAmountUSD] = useState('2.50');
        const [simInvoiceNo, setSimInvoiceNo] = useState('');
        const [pushedToDisplay, setPushedToDisplay] = useState(false);

        const cfg = shop?.khqrConfig || {};
        const exchangeRate = Math.max(100, Number(cfg.exchangeRate) || 4000);
        const requiredPin = useMemo(() => {
            const clean = String(shop?.discountPin || '').replace(/\D/g, '');
            return clean.length === 6 ? clean : '';
        }, [shop?.discountPin]);

        // Reset PIN lock & initialize reference every time the modal opens/closes
        useEffect(() => {
            if (show) {
                setIsUnlocked(false);
                setPinInput('');
                setShowPin(false);
                setPinError('');
                setPushedToDisplay(false);
                setSimInvoiceNo(`QR-${Date.now().toString().slice(-6)}`);
            }
        }, [show]);

        const handleCloseModal = () => {
            if (pushedToDisplay && shop?.id && window.SolarisPayWayVerifier) {
                window.SolarisPayWayVerifier.broadcastCustomerDisplaySession(shop.id, {
                    status: 'IDLE',
                    shopId: shop.id,
                    shopName: shop.brandingName || shop.name || systemConfig?.appName || 'POS Terminal',
                    exchangeRate
                });
            }
            onClose();
        };

        const verifyPinValue = (val) => {
            const digits = String(val || '').replace(/\D/g, '').slice(0, 6);
            setPinInput(digits);
            setPinError('');
            if (requiredPin && digits.length === 6) {
                if (digits === requiredPin) {
                    setIsUnlocked(true);
                    setPinError('');
                } else {
                    setPinError('Incorrect 6-digit Shop PIN. Please try again.');
                }
            }
        };

        const handlePinPadDigit = (d) => {
            if (pinInput.length >= 6) return;
            verifyPinValue(pinInput + String(d));
        };

        const handlePinPadBackspace = () => {
            setPinInput(prev => prev.slice(0, -1));
            setPinError('');
        };

        const handlePinPadClear = () => {
            setPinInput('');
            setPinError('');
        };

        const simulatedUsd = useMemo(() => {
            if (simCurrency === 'USD') {
                return (Number(simAmountUSD) || 0).toFixed(2);
            }
            return (Number(simAmountKHR || 0) / exchangeRate).toFixed(2);
        }, [simCurrency, simAmountKHR, simAmountUSD, exchangeRate]);

        const simulatedKhr = useMemo(() => {
            if (simCurrency === 'USD') {
                return Math.round((Number(simAmountUSD) || 0) * exchangeRate);
            }
            return Math.round(Number(simAmountKHR) || 0);
        }, [simCurrency, simAmountKHR, simAmountUSD, exchangeRate]);

        const extractedMeta = useMemo(() => {
            if (!cfg.baseEmvPayload || !window.SolarisKHQREngine) return { merchantName: null, mid: null };
            return window.SolarisKHQREngine.extractMerchantInfoFromEMV(cfg.baseEmvPayload);
        }, [cfg.baseEmvPayload]);

        const displayMerchantName = (
            cfg.accountName ||
            extractedMeta.merchantName ||
            shop?.brandingName ||
            shop?.name ||
            'MERCHANT NAME'
        ).toUpperCase();
        const displayMid = extractedMeta.mid || 'N/A';

        const simulatedDynamicPayload = useMemo(() => {
            if (!cfg.baseEmvPayload || !window.SolarisKHQREngine) return null;
            const targetAmt = simCurrency === 'USD' ? Number(simulatedUsd) : Number(simulatedKhr);
            const expMins = Math.max(5, Number(cfg.qrValidMinutes) || 15);
            return window.SolarisKHQREngine.generateDynamicKHQR(
                cfg.baseEmvPayload,
                targetAmt,
                simInvoiceNo,
                simCurrency,
                expMins
            );
        }, [cfg.baseEmvPayload, cfg.qrValidMinutes, simCurrency, simulatedUsd, simulatedKhr, simInvoiceNo]);

        const handlePushToCustomerDisplay = () => {
            if (!shop?.id || !window.SolarisPayWayVerifier) return;
            const nowMs = Date.now();
            const expMs = nowMs + Math.max(5, Number(cfg.qrValidMinutes) || 15) * 60 * 1000;
            window.SolarisPayWayVerifier.broadcastCustomerDisplaySession(shop.id, {
                status: 'ACTIVE',
                sessionId: `SIM_${simInvoiceNo}_${nowMs}`,
                shopId: shop.id,
                shopName: shop.brandingName || shop.name || systemConfig?.appName || 'POS Terminal',
                accountName: displayMerchantName,
                khrAccount: cfg.khrAccount || '',
                usdAccount: cfg.usdAccount || '',
                exchangeRate,
                baseEmvPayload: cfg.baseEmvPayload || '',
                staticQrImage: cfg.staticQrImage || '',
                items: [],
                subtotalKhr: simulatedKhr,
                discountKhr: 0,
                amountKhr: simulatedKhr,
                amountUsd: Number(simulatedUsd),
                selectedCurrency: simCurrency,
                invoiceNo: simInvoiceNo || 'CUSTOM-QR',
                initiatedAt: nowMs,
                expiresAt: expMs
            });
            setPushedToDisplay(true);
        };

        if (!show) return null;

        return (
            <Modal show={show} onClose={handleCloseModal} maxWidth={isUnlocked ? 'max-w-2xl' : 'max-w-sm'}>
                <ModalHeader
                    title={isUnlocked ? 'Live Dynamic KHQR Simulator' : 'PIN Required — Live KHQR Simulator'}
                    onClose={handleCloseModal}
                />
                <ModalBody>
                    {!isUnlocked ? (
                        /* PIN SECURITY GATE */
                        <div className="space-y-4">
                            <div className="text-center space-y-1.5">
                                <div className="w-14 h-14 rounded-2xl bg-rose-500/15 border border-rose-500/40 text-rose-400 flex items-center justify-center mx-auto shadow-inner">
                                    <i className="fas fa-lock text-2xl"></i>
                                </div>
                                <h4 className="text-base font-bold text-white">Authorize Dynamic KHQR Access</h4>
                                <p className="text-xs text-slate-400">
                                    Enter the 6-digit Shop PIN for <strong className="text-slate-200">{shop?.name || 'this shop'}</strong> to open the Live Dynamic KHQR Simulator.
                                </p>
                            </div>

                            {!requiredPin ? (
                                <div className="p-4 rounded-xl bg-amber-500/15 border border-amber-500/40 text-amber-200 text-xs space-y-2 text-center">
                                    <i className="fas fa-exclamation-triangle text-amber-400 text-xl block"></i>
                                    <p className="font-bold">No 6-Digit Shop PIN Configured</p>
                                    <p className="text-amber-200/80">
                                        Please configure a 6-digit PIN in <strong>Settings &rarr; Shop Property &rarr; Shop &amp; Location</strong> for this branch before using the Live Dynamic KHQR Simulator.
                                    </p>
                                </div>
                            ) : (
                                <>
                                    <div>
                                        <div className="relative flex items-center">
                                            <input
                                                type={showPin ? 'text' : 'password'}
                                                inputMode="numeric"
                                                maxLength={6}
                                                value={pinInput}
                                                onChange={(e) => verifyPinValue(e.target.value)}
                                                placeholder="• • • • • •"
                                                autoFocus
                                                className={`w-full bg-slate-900 text-center font-mono text-2xl font-black tracking-[0.45em] py-3 pl-4 pr-12 rounded-xl border outline-none transition ${
                                                    pinError
                                                        ? 'border-rose-500 text-rose-300'
                                                        : 'border-slate-600 text-white focus:border-rose-500'
                                                }`}
                                            />
                                            <button
                                                type="button"
                                                onClick={() => setShowPin(prev => !prev)}
                                                className="absolute right-3 text-slate-400 hover:text-white p-1.5"
                                                title={showPin ? 'Hide PIN' : 'Show PIN'}
                                            >
                                                <i className={`fas ${showPin ? 'fa-eye-slash text-amber-400' : 'fa-eye'}`}></i>
                                            </button>
                                        </div>
                                        {pinError && (
                                            <p className="text-xs text-rose-400 font-bold text-center mt-2">
                                                <i className="fas fa-times-circle mr-1"></i>{pinError}
                                            </p>
                                        )}
                                    </div>

                                    {/* Touch-Friendly PIN Keypad */}
                                    <div className="grid grid-cols-3 gap-2 bg-slate-900/60 p-2.5 rounded-xl border border-slate-700">
                                        {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                                            <button
                                                key={num}
                                                type="button"
                                                onClick={() => handlePinPadDigit(num)}
                                                className="h-12 bg-slate-800 hover:bg-slate-700 active:bg-rose-600 text-white font-bold text-xl rounded-lg border border-slate-700 transition shadow-sm select-none"
                                            >
                                                {num}
                                            </button>
                                        ))}
                                        <button
                                            type="button"
                                            onClick={handlePinPadClear}
                                            className="h-12 bg-red-900/30 hover:bg-red-900/50 text-red-300 font-bold text-sm rounded-lg border border-red-800/40 transition select-none"
                                        >
                                            CLR
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => handlePinPadDigit(0)}
                                            className="h-12 bg-slate-800 hover:bg-slate-700 active:bg-rose-600 text-white font-bold text-xl rounded-lg border border-slate-700 transition shadow-sm select-none"
                                        >
                                            0
                                        </button>
                                        <button
                                            type="button"
                                            onClick={handlePinPadBackspace}
                                            className="h-12 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-lg rounded-lg border border-slate-700 transition select-none"
                                        >
                                            <i className="fas fa-backspace"></i>
                                        </button>
                                    </div>
                                </>
                            )}
                        </div>
                    ) : (
                        /* UNLOCKED: LIVE DYNAMIC KHQR SIMULATOR */
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-5 items-start">
                            {/* Left Column: Official ABA PAY Standee Preview */}
                            <div className="flex flex-col items-center">
                                <div className="w-full max-w-[300px] flex items-center justify-between mb-2.5">
                                    <span className="text-[11px] font-black uppercase tracking-wider text-slate-300 flex items-center gap-1.5">
                                        <i className="fas fa-qrcode text-rose-400"></i>
                                        <span>Live Dynamic QR</span>
                                    </span>
                                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${simulatedDynamicPayload ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'bg-amber-500/20 text-amber-300 border border-amber-500/40'}`}>
                                        {simulatedDynamicPayload ? `Dynamic ${simCurrency} Active` : 'Static / Awaiting QR'}
                                    </span>
                                </div>

                                <div className="w-full max-w-[300px] rounded-[22px] overflow-hidden shadow-2xl bg-[#004459] p-[7px] relative select-none border border-[#003647]">
                                    <div
                                        className="bg-white w-full h-full relative pt-5 pb-4 px-4 flex flex-col items-center overflow-hidden rounded-[16px]"
                                        style={{ clipPath: 'polygon(18px 0, 100% 0, 100% 100%, 0 100%, 0 18px)' }}
                                    >
                                        <div className="flex items-center justify-center tracking-tight leading-none mt-1">
                                            <span className="text-[28px] font-black text-[#004861] tracking-[0.04em]">ABA</span>
                                            <span className="inline-block w-[5px] h-[12px] bg-[#D9232E] -mt-3.5 mx-[3px] rounded-[1px]"></span>
                                            <span className="text-[28px] font-black text-[#26A9C8] tracking-[0.06em] ml-1">PAY</span>
                                        </div>

                                        <div className="text-[12.5px] italic font-medium text-stone-800 mt-1.5 mb-2.5 tracking-wide">
                                            Scan. Pay. Done.
                                        </div>

                                        <div className="mb-2.5 px-3 py-1 rounded-full bg-stone-100/95 border border-stone-200/90 flex items-center gap-1.5 shadow-inner flex-wrap justify-center">
                                            {simCurrency === 'KHR' ? (
                                                <>
                                                    <span className="text-sm font-black text-[#004861]">{simulatedKhr.toLocaleString()} ៛</span>
                                                    <span className="text-stone-300">•</span>
                                                    <span className="text-[11px] font-bold text-[#26A9C8]">≈ ${simulatedUsd}</span>
                                                </>

    const buildDynamicKHQRPayload = ({
        bakongAccountId = 'merchant@aba',
        merchantName = 'PO SYSTEM POS',
        merchantCity = 'Phnom Penh',
        currency = 'KHR',
        amount = 0,
        billNumber = ''
    }) => {
        const formatTag = (id, val) => window.SolarisKHQREngine.formatTLV(id, val);
        const cleanAccount = (bakongAccountId || 'merchant@aba').trim();
        const cleanName = (merchantName || 'PO SYSTEM POS').replace(/[^a-zA-Z0-9 .-]/g, '').slice(0, 25).trim() || 'MERCHANT';
        const cleanCity = (merchantCity || 'Phnom Penh').replace(/[^a-zA-Z0-9 .-]/g, '').slice(0, 15).trim() || 'Phnom Penh';

        const tag00 = formatTag('00', '01');
        const tag01 = formatTag('01', '12');
        const tag29 = formatTag('29', formatTag('00', cleanAccount));
        const tag52 = formatTag('52', '5999');
        const isUSD = currency === 'USD';
        const tag53 = formatTag('53', isUSD ? '840' : '116');
        const formattedAmt = isUSD ? Number(amount || 0).toFixed(2) : String(Math.round(Number(amount || 0)));
        const tag54 = formatTag('54', formattedAmt);
        const tag58 = formatTag('58', 'KH');
        const tag59 = formatTag('59', cleanName);
        const tag60 = formatTag('60', cleanCity);

        const refBill = (billNumber || `POS${Date.now().toString().slice(-6)}`).slice(0, 20);
        const tag62 = formatTag('62', formatTag('01', refBill));

        const nowMs = Date.now();
        const expMs = nowMs + 10 * 60 * 1000;
        const tag99 = formatTag('99', formatTag('00', String(nowMs)) + formatTag('01', String(expMs)));

        const payloadWithoutCRC = `${tag00}${tag01}${tag29}${tag52}${tag53}${tag54}${tag58}${tag59}${tag60}${tag62}${tag99}6304`;
        const crcHex = window.SolarisKHQREngine.crc16(payloadWithoutCRC);
        return `${payloadWithoutCRC}${crcHex}`;
    };

    const PaymentModal = ({ total, cart = [], products = [], loyaltyRule = null, customer, shop, systemConfig, onConfirm, onCancel, isProcessing }) => {

        const [tenderedUSD, setTenderedUSD] = useState('');
        const [exchangeRate, setExchangeRate] = useState(() => Number(shop?.khqrConfig?.exchangeRate) || 4000);
        const [redeemPoints, setRedeemPoints] = useState('');
        const [claimFreeProduct, setClaimFreeProduct] = useState(false);
        const [selectedRewardKey, setSelectedRewardKey] = useState('');
        const [manualDiscount, setManualDiscount] = useState('');
        const [changeMode, setChangeMode] = useState('khr');
        const [khqrCurrency, setKhqrCurrency] = useState('KHR');

        // Solaris KHQR & ABA PayWay Live Verification States
        const [freshKhqrConfig, setFreshKhqrConfig] = useState(shop?.khqrConfig || null);
        const [apvRefInput, setApvRefInput] = useState('');
        const [localToast, setLocalToast] = useState('');
        const [isCheckingLiveAba, setIsCheckingLiveAba] = useState(false);
        const [verifiedAbaPayload, setVerifiedAbaPayload] = useState(null);
        const [collisionCandidateAba, setCollisionCandidateAba] = useState(null);
        const [unmatchedLiveAbaList, setUnmatchedLiveAbaList] = useState([]);
        const [liveDiagTelemetry, setLiveDiagTelemetry] = useState({
            pollCount: 0,
            lastLatencyMs: 0,
            source: 'Ready',
            lastCheckedTime: '',
            lastSeenTrx: null
        });
        const hasAutoConfirmedRef = useRef(false);
        const pollCounterRef = useRef(0);

        // Manual Discount 6-Digit PIN Authorization States (Per-Branch via shop.discountPin)
        const requiredDiscountPin = useMemo(() => {
            const rawPin = String(shop?.discountPin || '').replace(/\D/g, '');
            return rawPin.length === 6 ? rawPin : '';
        }, [shop?.discountPin]);
        const [discountPinInput, setDiscountPinInput] = useState('');
        const isDiscountUnlocked = !requiredDiscountPin || discountPinInput === requiredDiscountPin;

        const [billRef] = useState(() => {
            if (window.SolarisInvoiceEngine) {
                return window.SolarisInvoiceEngine.peekNextInvoiceNumber(shop);
            }
            const fallbackPrefix = String(shop?.name || 'POS').replace(/[^a-zA-Z0-9]/g, '').toUpperCase().slice(-3).padStart(3, 'X');
            return `${fallbackPrefix}-000000001`;
        });
        const [khqrInitiatedAt] = useState(() => Date.now());
        const validDurationSec = Math.max(60, (Number(shop?.khqrConfig?.qrValidMinutes) || 2) * 60);
        const [khqrExpiresAt, setKhqrExpiresAt] = useState(() => Date.now() + validDurationSec * 1000);
        const [remainingValidSec, setRemainingValidSec] = useState(validDurationSec);

        useEffect(() => {
            if (shop?.khqrConfig) {
                setFreshKhqrConfig(shop.khqrConfig);
                if (Number(shop.khqrConfig.exchangeRate) >= 100) {
                    setExchangeRate(Number(shop.khqrConfig.exchangeRate));
                }
            }
            if (shop?.id && window.SolarisKHQREngine?.getStaffPaywaySecrets) {
                window.SolarisKHQREngine.getStaffPaywaySecrets(shop.id).then(sec => {
                    if (sec?.khqrConfigBackup) {
                        const backup = sec.khqrConfigBackup;
                        setFreshKhqrConfig(prev => ({ ...backup, ...(prev || {}) }));
                        if (Number(backup.exchangeRate) >= 100 && !shop?.khqrConfig?.exchangeRate) {
                            setExchangeRate(Number(backup.exchangeRate));
                        }
                    }
                }).catch(() => {});
            }
        }, [shop?.id, shop?.khqrConfig]);

        const cfg = freshKhqrConfig || shop?.khqrConfig || {};
        const effectiveShop = useMemo(() => ({ ...(shop || {}), khqrConfig: cfg }), [shop, cfg]);

        // Evaluate Customer Points & Expiration Status against Branch Rule
        const loyaltyStatus = useMemo(() => evaluateCustomerLoyaltyStatus(customer, loyaltyRule), [customer, loyaltyRule]);
        const availablePoints = loyaltyStatus.effectivePoints;
        const requiredRedeemPts = loyaltyRule ? (Number(loyaltyRule.redeemPointsRequired) || 0) : 0;
        const canClaimFreeReward = !!(customer && loyaltyRule && requiredRedeemPts > 0 && availablePoints >= requiredRedeemPts);

        const eligibleCartRewardItems = useMemo(() => {
            if (!loyaltyRule || !customer || !Array.isArray(cart) || cart.length === 0) return [];
            const maxPrice = Number(loyaltyRule.maxRewardPriceKhr) || Infinity;
            const eligibleIds = Array.isArray(loyaltyRule.eligibleProductIds) ? loyaltyRule.eligibleProductIds : [];
            return cart
                .filter(item => {
                    const price = Number(item.price) || 0;
                    return price > 0 && price <= maxPrice && (eligibleIds.length === 0 || eligibleIds.includes(item.productId));
                })
                .sort((a, b) => (Number(b.price) || 0) - (Number(a.price) || 0));
        }, [loyaltyRule, customer, cart]);

        const eligibleCatalogRewardProducts = useMemo(() => {
            if (!loyaltyRule || !customer || !Array.isArray(products) || products.length === 0) return [];
            const maxPrice = Number(loyaltyRule.maxRewardPriceKhr) || Infinity;
            const eligibleIds = Array.isArray(loyaltyRule.eligibleProductIds) ? loyaltyRule.eligibleProductIds : [];
            const inCartIds = new Set((cart || []).map(i => i.productId));
            return products
                .filter(p => !inCartIds.has(p.id))
                .filter(p => {
                    const price = getEffectiveShopPrice(p, shop?.id);
                    return price > 0 && price <= maxPrice && (eligibleIds.length === 0 || eligibleIds.includes(p.id));
                })
                .sort((a, b) => getEffectiveShopPrice(b, shop?.id) - getEffectiveShopPrice(a, shop?.id))
                .slice(0, 40);
        }, [loyaltyRule, customer, products, cart, shop?.id]);

        useEffect(() => {
            if (eligibleCartRewardItems.length > 0) {
                if (!eligibleCartRewardItems.some(i => `cart:${i.productId}` === selectedRewardKey)) {
                    setSelectedRewardKey(`cart:${eligibleCartRewardItems[0].productId}`);
                }
            } else if (eligibleCatalogRewardProducts.length > 0) {
                if (!eligibleCatalogRewardProducts.some(p => `catalog:${p.id}` === selectedRewardKey)) {
                    setSelectedRewardKey(`catalog:${eligibleCatalogRewardProducts[0].id}`);
                }
            } else {
                setSelectedRewardKey('');
                if (claimFreeProduct) setClaimFreeProduct(false);
            }
        }, [eligibleCartRewardItems, eligibleCatalogRewardProducts]);

        const resolvedRewardSelection = useMemo(() => {
            if (!selectedRewardKey) return null;
            if (selectedRewardKey.startsWith('cart:')) {
                const id = selectedRewardKey.replace('cart:', '');
                const found = eligibleCartRewardItems.find(i => i.productId === id);
                return found ? { source: 'cart', item: found, price: Number(found.price) || 0, name: found.name } : null;
            }
            if (selectedRewardKey.startsWith('catalog:')) {
                const id = selectedRewardKey.replace('catalog:', '');
                const found = eligibleCatalogRewardProducts.find(p => p.id === id);
                return found ? { source: 'catalog', product: found, price: getEffectiveShopPrice(found, shop?.id), name: found.name } : null;
            }
            return null;
        }, [selectedRewardKey, eligibleCartRewardItems, eligibleCatalogRewardProducts, shop?.id]);

        const extraCatalogRewardPrice = (claimFreeProduct && resolvedRewardSelection?.source === 'catalog') ? resolvedRewardSelection.price : 0;
        const effectiveGrossTotal = total + extraCatalogRewardPrice;

        const parsedManualDiscountPct = Math.max(0, Math.min(100, parseFloat(manualDiscount) || 0));
        const parsedManualDiscount = Math.min(total, Math.round(total * (parsedManualDiscountPct / 100)));
        const maxRedeemable = Math.max(0, Math.min(availablePoints, total - parsedManualDiscount));

        const parsedRedemption = (claimFreeProduct && canClaimFreeReward && resolvedRewardSelection)
            ? Math.min(effectiveGrossTotal - parsedManualDiscount, resolvedRewardSelection.price)
            : Math.max(0, Math.min(maxRedeemable, parseInt(redeemPoints) || 0));

        const effectivePointsUsed = (claimFreeProduct && canClaimFreeReward && resolvedRewardSelection) ? requiredRedeemPts : parsedRedemption;
        const totalDiscount = parsedRedemption + parsedManualDiscount;
        const netTotal = Math.max(0, effectiveGrossTotal - totalDiscount);

        const [autoExact, setAutoExact] = useState(true);
        useEffect(() => {
            if (autoExact && method === 'Cash') {
                setTenderedKHR(String(netTotal));
                setTenderedUSD('');
            }
        }, [netTotal, autoExact, method]);

        const formatNumber = useCallback((value) => {
            if (!value && value !== 0 && value !== '0') return '';
            const raw = String(value).replace(/[^0-9.]/g, '');
            if (!raw) return '';
            const parts = raw.split('.');
            parts[0] = parseInt(parts[0], 10).toLocaleString('en-US');
            return parts.length > 1 ? `${parts[0]}.${parts[1]}` : parts[0];
        }, []);

        const handleTenderedKHRChange = (e) => {
            if (autoExact) setTenderedUSD('');
            setAutoExact(false);
            setTenderedKHR(e.target.value.replace(/,/g, ''));
        };

        const handleTenderedUSDChange = (e) => {
            if (autoExact) setTenderedKHR('');
            setAutoExact(false);
            setTenderedUSD(e.target.value.replace(/,/g, ''));
        };

        const previewPointsEarned = useMemo(() => {
            if (!customer || netTotal <= 0) return 0;
            if (loyaltyRule && Number(loyaltyRule.spendAmountKhr) > 0 && Number(loyaltyRule.earnPoints) > 0) {
                return Math.floor(netTotal / Number(loyaltyRule.spendAmountKhr)) * Number(loyaltyRule.earnPoints);
            }
            const legacyRate = parseFloat(systemConfig?.loyaltyRate) || 0;
            return legacyRate > 0 ? Math.floor(netTotal * (legacyRate / 100)) : 0;
        }, [customer, netTotal, loyaltyRule, systemConfig?.loyaltyRate]);

        const previewEndingPoints = Math.max(0, availablePoints - effectivePointsUsed + previewPointsEarned);

        const validRate = Math.max(100, Number(exchangeRate) || 4000);
        const usdAmount = parseFloat(tenderedUSD) || 0;
        const khrAmount = parseFloat(tenderedKHR) || 0;
        const totalTendered = khrAmount + (usdAmount * validRate);
        const change = Math.max(0, totalTendered - netTotal);
        const shortage = Math.max(0, netTotal - totalTendered);
        const canPay = method === 'KHQR' ? true : totalTendered >= netTotal;

        const isBranchKhqrEnabled = !!(cfg?.enabled || cfg?.baseEmvPayload || cfg?.staticQrImage);
        const isPaywayAutoVerifyEnabled = cfg?.paywayVerifyEnabled !== false;
        const usdEquivalent = (netTotal / validRate).toFixed(2);

        const extractedEmvMeta = useMemo(() => {
            if (!cfg?.baseEmvPayload || !window.SolarisKHQREngine) return { merchantName: null, mid: null };
            return window.SolarisKHQREngine.extractMerchantInfoFromEMV(cfg.baseEmvPayload);
        }, [cfg?.baseEmvPayload]);

        const accountName = cfg?.accountName || extractedEmvMeta.merchantName || shop?.brandingName || shop?.name || 'POS TERMINAL';
        const khrAccount = cfg?.khrAccount || '';
        const usdAccount = cfg?.usdAccount || '';
        const displayMid = extractedEmvMeta.mid || cfg?.mid || '';

        const dynamicKhqrPayload = useMemo(() => {
            const targetAmt = khqrCurrency === 'USD' ? Number(usdEquivalent) : Number(netTotal || 0);
            const expMins = Math.max(2, Number(cfg?.qrValidMinutes) || 15);
            if (cfg?.baseEmvPayload && window.SolarisKHQREngine) {
                const generated = window.SolarisKHQREngine.generateDynamicKHQR(
                    cfg.baseEmvPayload,
                    targetAmt,
                    billRef,
                    khqrCurrency,
                    expMins,
                    { createdAtMs: khqrInitiatedAt, expiresAtMs: khqrExpiresAt }
                );
                if (generated) return generated;
            }
            return buildDynamicKHQRPayload({
                bakongAccountId: cfg?.bakongId || 'merchant@aba',
                merchantName: accountName,
                merchantCity: extractedEmvMeta.merchantCity || 'Phnom Penh',
                currency: khqrCurrency,
                amount: targetAmt,
                billNumber: billRef
            });
        }, [cfg?.baseEmvPayload, cfg?.qrValidMinutes, cfg?.bakongId, khqrCurrency, usdEquivalent, netTotal, billRef, khqrInitiatedAt, khqrExpiresAt, accountName, extractedEmvMeta.merchantCity]);

        const qrImageDataUrl = useMemo(() => {
            if (cfg?.baseEmvPayload && dynamicKhqrPayload && window.SolarisKHQREngine) {
                return window.SolarisKHQREngine.renderInstantQRDataURL(dynamicKhqrPayload, 440, 1, 'H');
            }
            if (cfg?.staticQrImage) return cfg.staticQrImage;
            if (dynamicKhqrPayload && window.SolarisKHQREngine) {
                return window.SolarisKHQREngine.renderInstantQRDataURL(dynamicKhqrPayload, 440, 1, 'H');
            }
            return '';
        }, [cfg?.baseEmvPayload, cfg?.staticQrImage, dynamicKhqrPayload]);

        const triggerToast = (msg) => {
            setLocalToast(msg);
            setTimeout(() => setLocalToast(''), 3500);
        };

        const playVerifiedChime = () => {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const playTone = (freq, start, dur) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
                    gain.gain.setValueAtTime(0.18, ctx.currentTime + start);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + start);
                    osc.stop(ctx.currentTime + start + dur);
                };
                playTone(880, 0, 0.18);
                playTone(1174.66, 0.14, 0.35);
            } catch (e) {}
        };

        useEffect(() => {
            if (method !== 'KHQR') return;
            const tick = () => setRemainingValidSec(Math.max(0, Math.ceil((khqrExpiresAt - Date.now()) / 1000)));
            tick();
            const timerId = setInterval(tick, 1000);
            return () => clearInterval(timerId);
        }, [method, khqrExpiresAt]);

        const handleExtendValidTimer = () => {
            const newExp = Date.now() + 120 * 1000;
            setKhqrExpiresAt(newExp);
            setRemainingValidSec(120);
            triggerToast("Extended KHQR valid window by +2 minutes!");
        };

        // Register KHQR Intent & Broadcast to Customer-Facing Display
        useEffect(() => {
            if (!effectiveShop?.id || !window.SolarisPayWayVerifier) return;
            const displayItems = (cart || []).map(item => ({
                productId: item.productId,
                code: item.code || '',
                name: item.name || 'Item',
                price: Number(item.price) || 0,
                originalPrice: Number(item.originalPrice ?? item.price) || 0,
                quantity: Math.max(1, parseInt(item.quantity, 10) || 1),
                note: item.note || ''
            }));
            if (claimFreeProduct && resolvedRewardSelection?.source === 'catalog' && resolvedRewardSelection.product) {
                displayItems.push({
                    productId: resolvedRewardSelection.product.id,
                    code: resolvedRewardSelection.product.code || '',
                    name: `${resolvedRewardSelection.product.name} (Free Reward)`,
                    price: 0,
                    originalPrice: Number(resolvedRewardSelection.product.price) || 0,
                    quantity: 1,
                    note: 'Loyalty Free Reward Claim'
                });
            }

            if (method === 'KHQR') {
                window.SolarisPayWayVerifier.registerKhqrIntent(billRef, {
                    shopId: effectiveShop?.id || '',
                    tempInvoiceNo: billRef,
                    expectedKhr: Number(netTotal || 0),
                    expectedUsd: Number(usdEquivalent),
                    preferredCurrency: khqrCurrency,
                    initiatedAt: khqrInitiatedAt,
                    expiresAt: khqrExpiresAt
                });

                window.SolarisPayWayVerifier.broadcastCustomerDisplaySession(effectiveShop.id, {
                    status: 'ACTIVE',
                    sessionId: `${billRef}_${khqrInitiatedAt}`,
                    shopId: effectiveShop.id,
                    shopName: effectiveShop.brandingName || effectiveShop.name || 'POS Terminal',
                    accountName,
                    khrAccount,
                    usdAccount,
                    exchangeRate: validRate,
                    baseEmvPayload: cfg.baseEmvPayload || '',
                    staticQrImage: cfg.staticQrImage || '',
                    items: displayItems,
                    subtotalKhr: Number(effectiveGrossTotal || total || 0),
                    discountKhr: Number(totalDiscount || 0),
                    manualDiscountPct: Number(parsedManualDiscountPct || 0),
                    redemptionKhr: Number(parsedRedemption || 0),
                    pointsRedeemed: Number(effectivePointsUsed || 0),
                    rewardProductClaimed: (claimFreeProduct && resolvedRewardSelection) ? resolvedRewardSelection.name : null,
                    customerName: customer?.name || null,
                    customerPoints: availablePoints,
                    pointsEarnedPreview: previewPointsEarned,
                    amountKhr: Number(netTotal || 0),
                    amountUsd: Number(usdEquivalent),
                    selectedCurrency: khqrCurrency,
                    invoiceNo: billRef,
                    initiatedAt: khqrInitiatedAt,
                    expiresAt: khqrExpiresAt
                });
            } else {
                window.SolarisPayWayVerifier.unregisterKhqrIntent(billRef);
                window.SolarisPayWayVerifier.broadcastCustomerDisplaySession(effectiveShop.id, {
                    status: 'CART',
                    checkoutStage: 'CASH_PAYMENT',
                    shopId: effectiveShop.id,
                    shopName: effectiveShop.brandingName || effectiveShop.name || 'POS Terminal',
                    exchangeRate: validRate,
                    items: displayItems,
                    itemCount: displayItems.reduce((sum, i) => sum + (Number(i.quantity) || 1), 0),
                    subtotalKhr: Number(effectiveGrossTotal || total || 0),
                    discountKhr: Number(totalDiscount || 0),
                    manualDiscountPct: Number(parsedManualDiscountPct || 0),
                    redemptionKhr: Number(parsedRedemption || 0),
                    pointsRedeemed: Number(effectivePointsUsed || 0),
                    rewardProductClaimed: (claimFreeProduct && resolvedRewardSelection) ? resolvedRewardSelection.name : null,
                    customerName: customer?.name || null,
                    customerPoints: availablePoints,
                    estimatedPointsEarned: previewPointsEarned,
                    amountKhr: Number(netTotal || 0),
                    amountUsd: Number(usdEquivalent),
                    invoiceNo: billRef
                });
            }

            return () => window.SolarisPayWayVerifier.unregisterKhqrIntent(billRef);
        }, [
            method, billRef, effectiveShop?.id, effectiveShop?.brandingName, effectiveShop?.name,
            cart, total, effectiveGrossTotal, totalDiscount, parsedManualDiscountPct, parsedRedemption,
            effectivePointsUsed, claimFreeProduct, resolvedRewardSelection, customer?.name, availablePoints,
            previewPointsEarned, netTotal, usdEquivalent, khqrCurrency, khqrInitiatedAt, khqrExpiresAt,
            accountName, khrAccount, usdAccount, validRate, cfg.baseEmvPayload, cfg.staticQrImage
        ]);

        const checkCandidateAbaMatch = (parsedAba) => {
            if (!parsedAba || !parsedAba.isValid || !parsedAba.trxId || !window.SolarisPayWayVerifier) return false;
            if (remainingValidSec <= 0 && !apvRefInput.trim()) return false;
            const trxId = String(parsedAba.trxId).trim();
            if (window.SolarisPayWayVerifier.processedTrxIdsMemory.has(trxId)) return false;

            const mockOrder = {
                id: billRef,
                queueNo: billRef,
                paymentStatus: 'Unpaid',
                status: 'New',
                paymentMethod: 'KHQR (ABA)',
                totalAmount: Number(netTotal || 0),
                khqrExpectedKhr: Number(netTotal || 0),
                khqrExpectedUsd: Number(usdEquivalent),
                khqrCustomerRef: apvRefInput.trim(),
                khqrInitiatedAt: khqrInitiatedAt,
                khqrExpiresAt: khqrExpiresAt
            };
            return window.SolarisPayWayVerifier.doesMessageMatchOrder(parsedAba, mockOrder, effectiveShop);
        };

        const handleAutoVerifiedMatch = (parsedAba, forceConfirm = false) => {
            if (hasAutoConfirmedRef.current) return;
            if (!forceConfirm && (!apvRefInput || apvRefInput.trim().length < 3)) {
                const hasCollision = window.SolarisPayWayVerifier.hasSimultaneousAmountCollision(netTotal, billRef, effectiveShop?.id || '');
                if (hasCollision) {
                    setCollisionCandidateAba(parsedAba);
                    playVerifiedChime();
                    return;
                }
            }

            hasAutoConfirmedRef.current = true;
            setCollisionCandidateAba(null);
            setVerifiedAbaPayload(parsedAba);
            playVerifiedChime();
            triggerToast("Payment Verified! Completing Sale...");

            if (effectiveShop?.id) {
                window.SolarisPayWayVerifier.broadcastCustomerDisplaySession(effectiveShop.id, {
                    status: 'PAID',
                    invoiceNo: billRef,
                    amountKhr: Number(netTotal || 0),
                    amountUsd: Number(usdEquivalent),
                    payerDisplay: `${parsedAba.payerName || 'ABA Customer'} (${parsedAba.maskedAccount || '*ABA'})`,
                    amountDisplay: parsedAba.currency === 'KHR'
                        ? `៛${Number(parsedAba.amount).toLocaleString()}`
                        : `$${Number(parsedAba.amount).toFixed(2)}`,
                    apv: String(parsedAba.apv || 'VERIFIED'),
                    trxId: String(parsedAba.trxId || ''),
                    verifiedAbaPayload: parsedAba,
                    paidAt: Date.now()
                });
            }

            onConfirm({
                method: 'KHQR',
                invoiceNo: billRef,
                tendered: netTotal,
                tenderedUSD: 0,
                tenderedKHR: 0,
                exchangeRate: validRate,
                change: 0,
                changeBreakdown: null,
                discount: totalDiscount,
                redemptionAmount: parsedRedemption,
                pointsRedeemed: effectivePointsUsed,
                rewardProductClaimed: claimFreeProduct && resolvedRewardSelection ? resolvedRewardSelection.name : null,
                addedRewardProduct: (claimFreeProduct && resolvedRewardSelection?.source === 'catalog') ? resolvedRewardSelection.product : null,
                manualDiscount: parsedManualDiscount,
                manualDiscountPct: parsedManualDiscountPct,
                apvRef: parsedAba.apv || apvRefInput.trim(),
                verifiedAba: parsedAba,
                khqrCurrency
            });
        };

        const checkLivePaymentNow = async (includeClipboard = false) => {
            if (method !== 'KHQR' || hasAutoConfirmedRef.current || isProcessing) return;
            if (includeClipboard) setIsCheckingLiveAba(true);
            const checkStartMs = performance.now();
            try {
                if (window.SolarisPayWayVerifier?.inMemoryAbaPayments?.size > 0) {
                    const memEntries = Array.from(window.SolarisPayWayVerifier.inMemoryAbaPayments.values())
                        .filter(e => !e.claimedByOrderId && e.parsedAba?.isValid && !window.SolarisPayWayVerifier.processedTrxIdsMemory.has(String(e.parsedAba.trxId).trim()))
                        .sort((a, b) => (Number(b.date) || 0) - (Number(a.date) || 0));
                    for (const entry of memEntries) {
                        if (checkCandidateAbaMatch(entry.parsedAba)) {
                            handleAutoVerifiedMatch(entry.parsedAba, false);
                            return;
                        }
                    }
                }

                if (includeClipboard && navigator.clipboard && navigator.clipboard.readText) {
                    try {
                        const clipText = await navigator.clipboard.readText();
                        if (clipText && clipText.trim().length > 15) {
                            const parsedClip = window.SolarisKHQREngine.parseABAPayWayMessage(clipText);
                            if (checkCandidateAbaMatch(parsedClip)) {
                                handleAutoVerifiedMatch(parsedClip, true);
                                return;
                            }
                        }
                    } catch (clipErr) {}
                }

                const chatId = (cfg?.paywayChatId || '').trim();
                const updatesRes = await window.SolarisKHQREngine.fetchRecentAbaPaymentsFromFirestore(
                    chatId,
                    effectiveShop?.id,
                    false,
                    includeClipboard,
                    true
                );

                pollCounterRef.current += 1;
                const elapsedMs = Math.round(performance.now() - checkStartMs);

                if (updatesRes.ok) {
                    const candidates = (updatesRes.messages || []).filter(m => m.parsedAba?.isValid);
                    const matchedMsg = candidates.find(m => checkCandidateAbaMatch(m.parsedAba));
                    if (matchedMsg) {
                        handleAutoVerifiedMatch(matchedMsg.parsedAba, false);
                        return;
                    }

                    const targetChatId = (cfg?.paywayChatId || '').trim();
                    const allowedIds = targetChatId
                        ? targetChatId.split(',').map(s => s.trim().replace(/^-100/, '').replace(/^-/, '')).filter(Boolean)
                        : [];
                    const maxAgeMs = Math.max(1, Number(cfg?.autoVerifyWindowMinutes) || 5) * 60 * 1000;
                    const now = Date.now();

                    const recentUnclaimedAfterQr = (updatesRes.allAbaMessages || candidates)
                        .filter(m => {
                            if (!m.parsedAba?.isValid) return false;
                            const trxId = String(m.parsedAba.trxId).trim();
                            if (window.SolarisPayWayVerifier.processedTrxIdsMemory.has(trxId)) return false;
                            if (allowedIds.length > 0 && m.chatId) {
                                const strippedMsgId = String(m.chatId).replace(/^-100/, '').replace(/^-/, '').trim();
                                if (!allowedIds.includes(strippedMsgId)) {
                                    const cfgMerch = String(cfg?.accountName || '').trim().toUpperCase();
                                    const msgMerch = String(m.parsedAba?.merchantName || '').trim().toUpperCase();
                                    if (!cfgMerch || !msgMerch || (!msgMerch.includes(cfgMerch) && !cfgMerch.includes(msgMerch))) return false;
                                }
                            }
                            const msgMs = Number(m.date || m.parsedAba.receivedAt || m.parsedAba.paidTimestamp || 0);
                            return (now - msgMs) <= maxAgeMs;
                        })
                        .slice(0, 5);
                    setUnmatchedLiveAbaList(recentUnclaimedAfterQr);

                    const latestSeen = candidates[0]?.parsedAba || null;
                    const activeTransport = window.SolarisBrowserMTProto?.isConnected
                        ? 'MTProto Direct'
                        : (window.SolarisRenderBridge?.isConnected
                            ? 'Render Live SSE'
                            : (window.SolarisPayWayVerifier?.lastPollTelemetry?.source || 'Bot+Cloud Stream'));

                    setLiveDiagTelemetry({
                        pollCount: pollCounterRef.current,
                        lastLatencyMs: window.SolarisPayWayVerifier?.lastPollTelemetry?.latencyMs || elapsedMs,
                        source: activeTransport,
                        lastCheckedTime: new Date().toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                        lastSeenTrx: latestSeen ? `${latestSeen.currency === 'KHR' ? '៛' : '$'}${latestSeen.amount} (APV:${latestSeen.apv})` : null
                    });
                }

                if (includeClipboard) {
                    triggerToast(`No matching payment (${Number(netTotal || 0).toLocaleString()} ៛) after ${new Date(khqrInitiatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })} yet.`);
                }
            } catch (err) {
                console.warn("Live ABA check warning:", err);
            } finally {
                if (includeClipboard) setIsCheckingLiveAba(false);
            }
        };

        const checkMatchRef = useRef(checkCandidateAbaMatch);
        const handleMatchRef = useRef(handleAutoVerifiedMatch);
        const checkLiveNowRef = useRef(checkLivePaymentNow);
        useEffect(() => {
            checkMatchRef.current = checkCandidateAbaMatch;
            handleMatchRef.current = handleAutoVerifiedMatch;
            checkLiveNowRef.current = checkLivePaymentNow;
        });

        useEffect(() => {
            if (method !== 'KHQR' || !isPaywayAutoVerifyEnabled || hasAutoConfirmedRef.current || !window.SolarisPayWayVerifier) return;
            const entries = Array.from(window.SolarisPayWayVerifier.inMemoryAbaPayments.values())
                .filter(e => !e.claimedByOrderId && e.parsedAba?.isValid)
                .sort((a, b) => (Number(b.date) || 0) - (Number(a.date) || 0));
            for (const entry of entries) {
                if (checkMatchRef.current(entry.parsedAba)) {
                    handleMatchRef.current(entry.parsedAba);
                    return;
                }
            }
        }, [method, isPaywayAutoVerifyEnabled, netTotal, khqrCurrency, apvRefInput]);

        useEffect(() => {
            if (method !== 'KHQR' || !isPaywayAutoVerifyEnabled || !window.SolarisPayWayVerifier) return;
            const targetChatId = (cfg?.paywayChatId || '').trim();
            checkLiveNowRef.current(false);

            const pollInterval = setInterval(() => {
                if (!hasAutoConfirmedRef.current) {
                    checkLiveNowRef.current(false);
                }
            }, 650);

            const unsubShared = window.SolarisPayWayVerifier.subscribe((incomingEntry) => {
                if (hasAutoConfirmedRef.current) return;
                if (incomingEntry?.parsedAba?.isValid && !incomingEntry.claimedByOrderId) {
                    if (checkMatchRef.current(incomingEntry.parsedAba)) {
                        handleMatchRef.current(incomingEntry.parsedAba);
                        return;
                    }
                }
                const entries = Array.from(window.SolarisPayWayVerifier.inMemoryAbaPayments.values())
                    .filter(e => !e.claimedByOrderId && e.parsedAba?.isValid)
                    .sort((a, b) => (Number(b.date) || 0) - (Number(a.date) || 0));
                for (const entry of entries) {
                    if (checkMatchRef.current(entry.parsedAba)) {
                        handleMatchRef.current(entry.parsedAba);
                        return;
                    }
                }
            });

            return () => {
                clearInterval(pollInterval);
                unsubShared();
            };
        }, [method, isPaywayAutoVerifyEnabled, effectiveShop?.id, cfg?.paywayChatId, netTotal]);

        useEffect(() => {
            if (method !== 'KHQR' || !effectiveShop?.id) return;
            const unsubDisplay = db.collection('system_settings').doc(`khqr_display_${effectiveShop.id}`).onSnapshot((snap) => {
                if (!snap.exists || hasAutoConfirmedRef.current) return;
                const d = snap.data();
                if (d && d.status === 'PAID' && d.invoiceNo === billRef && d.verifiedAbaPayload) {
                    handleMatchRef.current(d.verifiedAbaPayload, true);
                }
            }, () => {});
            return () => unsubDisplay();
        }, [method, effectiveShop?.id, billRef]);

        const smartChange = useMemo(() => {
            if (change <= 0) {
                return { usdBills: 0, khrRemainder: 0, roundedKhrRemainder: 0, usdNotesHint: [], khrNotesHint: [] };
            }
            const usdBills = Math.floor(change / validRate);
            const khrRemainder = Math.round(change - (usdBills * validRate));
            const roundedKhrRemainder = Math.round(khrRemainder / 100) * 100;

            let remUsd = usdBills;
            [50, 20, 10, 5, 1].forEach(denom => {
                if (remUsd >= denom) {
                    const count = Math.floor(remUsd / denom);
                    usdNotesHint.push(`${count}×$${denom}`);
                    remUsd %= denom;
                }

            const khrNotesHint = [];
            let remKhr = changeMode === 'dual' ? roundedKhrRemainder : (Math.round(change / 100) * 100);
            [50000, 20000, 10000, 5000, 2000, 1000, 500, 100].forEach(denom => {
                if (remKhr >= denom) {
                    const count = Math.floor(remKhr / denom);
                    khrNotesHint.push(`${count}×៛${denom >= 1000 ? (denom / 1000) + 'k' : denom}`);
                    remKhr %= denom;
                }
            });

            return { usdBills, khrRemainder, roundedKhrRemainder, usdNotesHint, khrNotesHint };

        const handleRedeemChange = (val) => {

            const pct = Math.max(0, Math.min(100, parseFloat(val) || 0));
            setManualDiscount(String(pct));

            const newMaxRedeem = Math.max(0, Math.min(availablePoints, total - discountKhr));

                                        >
                                            Clear
                                        </button>
                                    </div>
                                </div>

                                    {unmatchedLiveAbaList.length > 0 && (

                                            {unmatchedLiveAbaList.map((entry, idx) => {

                            </div>
