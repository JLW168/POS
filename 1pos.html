                                                    </td>
                                                    <td className="px-4 py-3 text-right font-bold text-emerald-400 whitespace-nowrap">៛{new Intl.NumberFormat('en-US').format(sale.grandTotal)}</td>
                                                    <td className="px-4 py-3 text-center">
                                                        {sale.status === 'void' ? (
                                                            <span className="px-2 py-0.5 bg-red-500/20 text-red-400 text-xs rounded-full no-underline">VOID</span>

                                                    <td className="px-4 py-3 text-center space-x-3 whitespace-nowrap" onClick={(e) => e.stopPropagation()}>

                                                        {sale.status !== 'void' && (

    // --- NEW: Shift Management Modal (100% Copycat from index.html) ---
    const ShiftManagementModal = ({ currentShift, shopId, userProfile, onClose, deviceId, todaySales = [], onShiftStateChange }) => {
        const { shops, devices } = useData();
        const shopObj = useMemo(() => shops.find(s => s.id === shopId), [shops, shopId]);
        const shopName = shopObj?.name || 'Unknown Shop';
        const currentDeviceName = currentShift?.deviceName || devices.find(d => d.id === deviceId)?.name || 'Current Terminal';
        const currentRate = Math.max(100, Number(shopObj?.khqrConfig?.exchangeRate) || 4000);

        // Open Shift State
        const [startCash, setStartCash] = useState('');
        const [shiftName, setShiftName] = useState('AM');

        // Close Shift / Cash Drop State
        const [actualCashKHR, setActualCashKHR] = useState('');
        const [actualCashUSD, setActualCashUSD] = useState('');
        const [actualBankKHR, setActualBankKHR] = useState('');
        const [actualBankUSD, setActualBankUSD] = useState('');
        const [closingFloatCash, setClosingFloatCash] = useState('');
        const [note, setNote] = useState('');
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState('');
        const [showBillCounter, setShowBillCounter] = useState(null); // 'KHR' | 'USD' | null
        const [closedShiftData, setClosedShiftData] = useState(null);
        const [isSavingImage, setIsSavingImage] = useState(false);
        const shiftSummaryRef = useRef(null);

        const formatNumber = useCallback((val) => {
            if (val === null || val === undefined || val === '') return '';
            const clean = String(val).replace(/[^0-9.]/g, '');
            if (!clean) return '';
            const parts = clean.split('.');
            parts[0] = (parseInt(parts[0], 10) || 0).toLocaleString('en-US');
            return parts.length > 1 ? `${parts[0]}.${parts[1].slice(0, 2)}` : parts[0];
        }, []);

        const parseNumber = useCallback((val) => {
            if (val === null || val === undefined || val === '') return 0;
            const num = parseFloat(String(val).replace(/,/g, ''));
            return isNaN(num) ? 0 : num;
        }, []);

        const handleCurrencyInput = useCallback((setter) => (e) => {
            setter(formatNumber(e.target.value));
        }, [formatNumber]);

        // Unified Shift Sales Statistics (Computed directly from todaySales + Local Ledger + fallback cloud fetch)
        const [cloudShiftSales, setCloudShiftSales] = useState(null);
        useEffect(() => {
            if (!currentShift?.id) return;
            if (!window.SolarisPayWayVerifier?.isQuotaExceeded) {
                db.collection('sales').where('shiftId', '==', currentShift.id).get()
                    .then(snap => {
                        if (!snap.empty) {
                            setCloudShiftSales(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                        }
                    })
                    .catch(() => {});
            }
        }, [currentShift?.id, todaySales]);

        const shiftSalesStats = useMemo(() => {
            if (!currentShift?.id) {
                return {
                    gross: 0, discount: 0, net: 0, cost: 0, margin: 0,
                    voidCount: 0, voidAmount: 0, voidCashAmount: 0, voidBankAmount: 0,
                    liveCashSales: 0, liveBankSales: 0, activeCount: 0
                };
            }
            const mergedSalesMap = new Map();
            if (window.SolarisLocalSalesStore) {
                window.SolarisLocalSalesStore.getSales().forEach(s => {
                    if (s && s.id && s.shiftId === currentShift.id) mergedSalesMap.set(s.id, s);
                });
            }
            (todaySales || []).forEach(s => {
                if (s && s.id && s.shiftId === currentShift.id) {
                    mergedSalesMap.set(s.id, { ...(mergedSalesMap.get(s.id) || {}), ...s });
                }
            });
            (cloudShiftSales || []).forEach((s, idx) => {
                const key = s.id || s.receiptNo || `cloud_${idx}`;
                if (s && s.shiftId === currentShift.id) {
                    mergedSalesMap.set(key, { ...(mergedSalesMap.get(key) || {}), ...s });
                }
            });

            const sourceSales = Array.from(mergedSalesMap.values());

            let gross = 0, discount = 0, net = 0, cost = 0;
            let voidCount = 0, voidAmount = 0, voidCashAmount = 0, voidBankAmount = 0;
            let liveCashSales = 0, liveBankSales = 0, activeCount = 0;

            sourceSales.forEach(d => {
                const rev = Number(d.grandTotal) || 0;
                const isCash = d.paymentMethod === 'Cash';
                if (d.status === 'void') {
                    voidCount++;
                    voidAmount += rev;
                    if (isCash) voidCashAmount += rev;
                    else voidBankAmount += rev;
                    return;
                }
                activeCount++;
                const disc = Number(d.discount) || (Number(d.manualDiscount || 0) + Number(d.redemptionAmount || 0));
                const sub = Number(d.subtotal) || (rev + disc);
                const c = Number(d.totalCost) || 0;

                gross += sub;
                discount += disc;
                net += rev;
                cost += c;
                if (isCash) liveCashSales += rev;
                else liveBankSales += rev;
            });

            const margin = net > 0 ? ((net - cost) / net) * 100 : 0;
            return {
                gross,
                discount,
                net,
                cost,
                margin,
                voidCount,
                voidAmount,
                voidCashAmount,
                voidBankAmount,
                liveCashSales,
                liveBankSales,
                activeCount
            };
        }, [currentShift?.id, todaySales, cloudShiftSales]);

        // Single Source of Truth for Live & Submitted Reconciliation Math (Supports Voided Bank/KHQR & Cash Verification)
        const reconciliation = useMemo(() => {
            const expectedFloat = parseFloat(currentShift?.startCash) || 0;
            const enteredFloat = parseNumber(closingFloatCash);
            const isFloatMatched = closingFloatCash !== '' && enteredFloat === expectedFloat;

            const cashKHR = parseNumber(actualCashKHR);
            const cashUSD = parseNumber(actualCashUSD);
            const bankKHR = parseNumber(actualBankKHR);
            const bankUSD = parseNumber(actualBankUSD);

            const actualCashTotal = cashKHR + (cashUSD * currentRate);
            const actualBankTotal = bankKHR + (bankUSD * currentRate);
            const actualCombinedTotal = actualCashTotal + actualBankTotal;

            const hasLiveSalesRecords = (shiftSalesStats.activeCount + shiftSalesStats.voidCount) > 0;
            const rawExpectedCashTotal = hasLiveSalesRecords
                ? shiftSalesStats.liveCashSales
                : (parseFloat(currentShift?.totalCashSales) || 0);
            const rawExpectedBankTotal = hasLiveSalesRecords
                ? shiftSalesStats.liveBankSales
                : (parseFloat(currentShift?.totalKHQRSales) || 0);
            const rawSysGrandTotal = rawExpectedCashTotal + rawExpectedBankTotal;

            const voidCashAmount = shiftSalesStats.voidCashAmount || 0;
            const voidBankAmount = shiftSalesStats.voidBankAmount || 0;
            // POS No-Refund Policy: Voided Cash and Bank/KHQR funds remain collected and are always included in expected totals
            const accountedVoidCash = voidCashAmount;
            const accountedVoidBank = voidBankAmount;
            const accountedVoidTotal = accountedVoidCash + accountedVoidBank;

            const expectedCashTotal = rawExpectedCashTotal + accountedVoidCash;
            const expectedBankTotal = rawExpectedBankTotal + accountedVoidBank;
            const sysGrandTotal = expectedCashTotal + expectedBankTotal;

            const cashVariance = actualCashTotal - expectedCashTotal;
            const bankVariance = actualBankTotal - expectedBankTotal;
            const totalVariance = cashVariance + bankVariance;

            return {
                expectedFloat,
                enteredFloat,
                isFloatMatched,
                cashKHR,
                cashUSD,
                bankKHR,
                bankUSD,
                actualCashTotal,
                actualBankTotal,
                actualCombinedTotal,
                rawExpectedCashTotal,
                rawExpectedBankTotal,
                rawSysGrandTotal,
                accountedVoidCash,
                accountedVoidBank,
                accountedVoidTotal,
                expectedCashTotal,
                expectedBankTotal,
                sysGrandTotal,
                cashVariance,
                bankVariance,
                totalVariance
            };
        }, [currentShift, shiftSalesStats, closingFloatCash, actualCashKHR, actualCashUSD, actualBankKHR, actualBankUSD, currentRate, parseNumber]);

        const handleApplyBillCount = (total) => {
            if (showBillCounter === 'KHR') {
                setActualCashKHR(formatNumber(total));
            } else if (showBillCounter === 'USD') {
                setActualCashUSD(formatNumber(total));
            }
            setShowBillCounter(null);
        };

        const handleSavePng = () => {
            if (!shiftSummaryRef.current || isSavingImage) return;
            setIsSavingImage(true);
            setTimeout(() => {
                html2canvas(shiftSummaryRef.current, { scale: 3, backgroundColor: '#0f172a', useCORS: true })
                    .then(canvas => {
                        const link = document.createElement('a');
                        const safeDate = new Date(closedShiftData.endTimeMs).toLocaleDateString('en-GB').replace(/\//g, '-');
                        link.download = `Shift-Closed-${safeDate}.png`;
                        link.href = canvas.toDataURL('image/png');
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    })
                    .catch(err => console.error('Failed to save shift PNG:', err))
                    .finally(() => setIsSavingImage(false));
            }, 80);
        };

        const handleOpenShift = async () => {
            if (!startCash && startCash !== '0') {
                setError("Please enter starting cash (enter 0 if empty).");
                return;
            }
            setLoading(true);
            setError('');

            const shiftRef = db.collection('shifts').doc();
            const nowIso = new Date().toISOString();
            const parsedStartCash = parseNumber(startCash);

            const optimisticShift = {
                id: shiftRef.id,
                shopId,
                cashierId: userProfile.uid,
                cashierName: userProfile.name || 'Staff',
                shiftName,
                deviceId,
                deviceName: currentDeviceName,
                startTime: nowIso,
                startCash: parsedStartCash,
                totalSales: 0,
                totalCashSales: 0,
                totalKHQRSales: 0,
                transactionCount: 0,
                status: 'open',
                createdAt: nowIso
            };

            if (typeof onShiftStateChange === 'function') {
                onShiftStateChange(optimisticShift);
            }
            try {
                const cachedShifts = JSON.parse(localStorage.getItem('solaris_shifts_report_cache_v1') || '[]');
                const nextCached = [optimisticShift, ...(Array.isArray(cachedShifts) ? cachedShifts.filter(s => s.id !== optimisticShift.id) : [])].slice(0, 200);
                localStorage.setItem('solaris_shifts_report_cache_v1', JSON.stringify(nextCached));
            } catch (e) {}

            shiftRef.set({
                ...optimisticShift,
                startTime: firebase.firestore.FieldValue.serverTimestamp(),
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).catch(err => {
                console.warn("Open shift write queued in IndexedDB:", err?.code || err?.message);
            });

            setLoading(false);
            onClose();
        };

        const handleCloseShift = async () => {
            setError('');
            if (!currentShift) {
                setError("No active shift found.");
                return;
            }

            if (reconciliation.enteredFloat !== reconciliation.expectedFloat) {
                setError(`Closing floating cash (៛${khrFormatter.format(reconciliation.enteredFloat)}) must match starting float (៛${khrFormatter.format(reconciliation.expectedFloat)}).`);
                return;
            }

            setLoading(true);
            try {
                const endTimeMs = Date.now();
                const endTimeIso = new Date(endTimeMs).toISOString();

                const shiftUpdate = {
                    endTime: firebase.firestore.FieldValue.serverTimestamp(),
                    closeInputCashKHR: reconciliation.cashKHR,
                    closeInputCashUSD: reconciliation.cashUSD,
                    closeInputBankKHR: reconciliation.bankKHR,
                    closeInputBankUSD: reconciliation.bankUSD,
                    closeExchangeRate: currentRate,
                    closeFloatingCash: reconciliation.enteredFloat,
                    closeNote: note.trim(),
                    actualCash: reconciliation.actualCashTotal,
                    expectedCash: reconciliation.expectedCashTotal,
                    differenceCash: reconciliation.cashVariance,
                    actualKHQR: reconciliation.actualBankTotal,
                    expectedKHQR: reconciliation.expectedBankTotal,
                    differenceKHQR: reconciliation.bankVariance,
                    difference: reconciliation.totalVariance,
                    status: 'closed',
                    closedBy: userProfile?.name || 'Staff',
                    totalSales: reconciliation.rawSysGrandTotal,
                    totalCashSales: reconciliation.rawExpectedCashTotal,
                    totalKHQRSales: reconciliation.rawExpectedBankTotal,
                    transactionCount: shiftSalesStats.activeCount || currentShift.transactionCount || 0,
                    accountedVoidCash: reconciliation.accountedVoidCash,
                    accountedVoidBank: reconciliation.accountedVoidBank,
                    accountedVoidTotal: reconciliation.accountedVoidTotal,
                    statsGross: shiftSalesStats.gross || 0,
                    statsDiscount: shiftSalesStats.discount || 0,
                    statsNet: shiftSalesStats.net || reconciliation.rawSysGrandTotal || 0,
                    statsCost: shiftSalesStats.cost || 0,
                    statsMargin: shiftSalesStats.margin || 0,
                    statsVoidCount: shiftSalesStats.voidCount || 0,
                    statsVoidAmount: shiftSalesStats.voidAmount || 0,
                    statsVoidCashAmount: shiftSalesStats.voidCashAmount || 0,
                    statsVoidBankAmount: shiftSalesStats.voidBankAmount || 0
                };

                try {
                    const cleanStartTimeIso = safeToDate(currentShift.startTime)?.toISOString() || endTimeIso;
                    const localClosedShift = { ...currentShift, ...shiftUpdate, startTime: cleanStartTimeIso, endTime: endTimeIso };
                    const cachedShifts = JSON.parse(localStorage.getItem('solaris_shifts_report_cache_v1') || '[]');
                    const nextCached = [
                        localClosedShift,
                        ...(Array.isArray(cachedShifts) ? cachedShifts.filter(s => s.id !== currentShift.id) : [])
                    ].slice(0, 200);
                    localStorage.setItem('solaris_shifts_report_cache_v1', JSON.stringify(nextCached));

                    const existingEdits = JSON.parse(localStorage.getItem('solaris_edited_shifts_v1') || '{}');
                    existingEdits[currentShift.id] = { ...shiftUpdate, startTime: cleanStartTimeIso, endTime: endTimeIso };
                    localStorage.setItem('solaris_edited_shifts_v1', JSON.stringify(existingEdits));
                } catch (e) {}

                db.collection('shifts').doc(currentShift.id).set(shiftUpdate, { merge: true }).catch(err => {
                    console.warn("Close shift write queued in IndexedDB:", err?.code || err?.message);
                });

                setClosedShiftData({
                    ...currentShift,
                    ...shiftUpdate,
                    endTimeMs,
                    stats: shiftSalesStats
                });

                if (typeof onShiftStateChange === 'function') {
                    onShiftStateChange(null);
                }
            } catch (err) {
                console.error("Close Shift Error:", err);
                setError("System Error: " + err.message);
            } finally {
                setLoading(false);
            }
        };

        const formattedStartTime = currentShift ? safeFormatDateTime(currentShift.startTime || currentShift.createdAt, 'Just now') : '-';
        const getVarColor = (val) => (val === 0 ? 'text-slate-300' : val > 0 ? 'text-emerald-400' : 'text-rose-400');

        // 1. COMPLETED SHIFT SUMMARY VIEW
        if (closedShiftData) {
            const closeTimeStr = safeFormatDateTime(closedShiftData.endTimeMs);
            const openTimeStr = safeFormatDateTime(closedShiftData.startTime || closedShiftData.createdAt, 'Unknown');
            return (
                <Modal show={true} onClose={onClose} maxWidth="max-w-md">
                    <ModalHeader title="Shift Closed Successfully" onClose={onClose} />
                    <ModalBody>
                        <div ref={shiftSummaryRef} className="space-y-4 p-5 bg-[#0f172a] rounded-xl relative">
                            <div className="text-center mb-4">
                                <div className="w-14 h-14 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-2.5 border border-emerald-500/30">
                                    <i className="fas fa-check-double text-2xl"></i>
                                </div>
                                <h2 className="text-lg font-bold text-white">Shift Handover Complete</h2>
                                <p className="text-slate-400 text-xs mt-0.5">{shopName} • {currentDeviceName}</p>
                            </div>

                            <div className="bg-[#1e293b] rounded-xl p-4 border border-slate-700 space-y-2.5 text-xs sm:text-sm shadow-inner">
                                <div className="flex justify-between items-center"><span className="text-slate-400">Cashier:</span> <span className="font-bold text-white">{closedShiftData.closedBy}</span></div>
                                <div className="flex justify-between items-center"><span className="text-slate-400">Shift:</span> <span className="font-bold text-blue-400">{closedShiftData.shiftName || 'AM'} Shift</span></div>
                                <div className="flex justify-between items-center"><span className="text-slate-400">Opened:</span> <span className="font-mono text-slate-200">{openTimeStr}</span></div>
                                <div className="flex justify-between items-center"><span className="text-slate-400">Closed:</span> <span className="font-mono text-slate-200">{closeTimeStr}</span></div>
                                <div className="border-b border-slate-700/60 my-1.5"></div>
                                <div className="flex justify-between items-center"><span className="text-slate-400">Total Net Sale:</span> <span className="font-black text-emerald-400 text-base">៛{khrFormatter.format(closedShiftData.stats.net)}</span></div>
                                <div className="flex justify-between items-center"><span className="text-slate-400">Sale Margin:</span> <span className="font-bold text-cyan-400">{closedShiftData.stats.margin.toFixed(2)}%</span></div>
                                <div className="flex justify-between items-center"><span className="text-slate-400">Voided Receipts:</span> <span className="font-bold text-rose-400">{closedShiftData.stats.voidCount || 0} (៛{khrFormatter.format(closedShiftData.stats.voidAmount || 0)})</span></div>
                                <div className="border-b border-slate-700/60 my-1.5"></div>
                                <div className="flex justify-between items-center"><span className="text-slate-400">Cash Drop (KHR / USD):</span> <span className="font-bold text-white">៛{khrFormatter.format(closedShiftData.closeInputCashKHR)} / ${Number(closedShiftData.closeInputCashUSD).toFixed(2)}</span></div>
                                <div className="flex justify-between items-center"><span className="text-slate-400">Bank Drop (KHR / USD):</span> <span className="font-bold text-white">៛{khrFormatter.format(closedShiftData.closeInputBankKHR)} / ${Number(closedShiftData.closeInputBankUSD).toFixed(2)}</span></div>
                                <div className="flex justify-between items-center pt-1 border-t border-slate-700/60">
                                    <span className="text-slate-400 font-bold">Net Variance:</span>
                                    <span className={`font-black ${getVarColor(closedShiftData.difference)}`}>
                                        {closedShiftData.difference > 0 ? '+' : ''}៛{khrFormatter.format(closedShiftData.difference || 0)}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </ModalBody>
                    <ModalFooter>
                        <div className="w-full flex gap-3">
                            <button onClick={handleSavePng} disabled={isSavingImage} className="flex-1 bg-slate-700 text-white font-bold py-2.5 rounded-xl hover:bg-slate-600 transition flex items-center justify-center gap-2 text-sm">
                                {isSavingImage ? <div className="loader w-4 h-4 border-white/30 border-t-white"></div> : <i className="fas fa-image"></i>} Save PNG
                            </button>
                            <button onClick={onClose} className="flex-1 bg-blue-600 text-white font-bold py-2.5 rounded-xl hover:bg-blue-500 transition shadow-lg text-sm">
                                Done
                            </button>
                        </div>
                    </ModalFooter>
                </Modal>
            );
        }

        // 2. OPEN NEW SHIFT VIEW
        if (!currentShift) {
            return (
                <Modal show={true} onClose={onClose} maxWidth="max-w-md">
                    <ModalHeader title="Open New Shift" onClose={onClose} />
                    <ModalBody>
                        {error && (
                            <div className="mb-4 p-3 bg-red-500/20 border border-red-500/50 rounded-xl flex items-center gap-2.5 text-red-200 text-xs">
                                <i className="fas fa-exclamation-circle text-base shrink-0"></i>
                                <span>{error}</span>
                            </div>
                        )}
                        <div className="space-y-4">
                            <div className="bg-slate-900/70 p-3.5 rounded-xl border border-slate-700 grid grid-cols-2 gap-2 text-xs">
                                <div>
                                    <span className="text-slate-400 block">Shop Location</span>
                                    <span className="text-white font-bold">{shopName}</span>
                                </div>
                                <div>
                                    <span className="text-slate-400 block">Terminal</span>
                                    <span className="text-white font-bold">{currentDeviceName}</span>
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Shift Session</label>
                                <div className="grid grid-cols-2 gap-2.5">
                                    {['AM', 'PM'].map(s => (
                                        <button
                                            key={s}
                                            type="button"
                                            onClick={() => setShiftName(s)}
                                            className={`py-2.5 rounded-xl font-bold text-sm border transition ${
                                                shiftName === s
                                                    ? 'bg-blue-600 text-white border-blue-400 shadow-md shadow-blue-900/30'
                                                    : 'bg-slate-900/60 text-slate-400 border-slate-700 hover:text-white'
                                            }`}
                                        >
                                            <i className={`fas ${s === 'AM' ? 'fa-sun text-amber-400' : 'fa-moon text-indigo-300'} mr-1.5`}></i>
                                            {s} Shift
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">
                                    Starting Float Cash in Drawer (KHR)
                                </label>
                                <div className="relative">
                                    <span className="absolute left-4 top-1/2 -translate-y-1/2 text-xl font-bold text-emerald-400">៛</span>
                                    <input
                                        type="text"
                                        inputMode="numeric"
                                        value={startCash}
                                        onChange={(e) => setStartCash(formatNumber(e.target.value))}
                                        className="w-full bg-slate-900 text-white text-2xl font-black pl-10 pr-4 py-3.5 rounded-xl border border-slate-600 focus:border-emerald-500 outline-none text-right font-mono"
                                        placeholder="0"
                                        autoFocus
                                    />
                                </div>
                            </div>
                        </div>
                    </ModalBody>
                    <ModalFooter>
                        <button type="button" onClick={onClose} className="w-full sm:w-auto bg-slate-600 text-white font-bold py-2.5 px-5 rounded-xl hover:bg-slate-500 transition text-sm">
                            Cancel
                        </button>
                        <button
                            type="button"
                            onClick={handleOpenShift}
                            disabled={loading}
                            className="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-500 text-white font-black py-2.5 px-6 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-emerald-900/30 transition text-sm disabled:opacity-50"
                        >
                            {loading ? <div className="loader w-4 h-4"></div> : <i className="fas fa-play"></i>}
                            <span>Start Shift</span>
                        </button>
                    </ModalFooter>
                </Modal>
            );
        }

        // 3. REDESIGNED CLEAN & PROFESSIONAL CLOSE SHIFT / RECONCILIATION VIEW
        return (
            <Modal show={true} onClose={onClose} maxWidth="max-w-5xl">
                {showBillCounter && (
                    <BillCounterModal
                        currency={showBillCounter}
                        onClose={() => setShowBillCounter(null)}
                        onApply={handleApplyBillCount}
                    />
                )}

                <ModalHeader
                    title={`Close Shift & Cash Reconciliation — ${currentShift?.shiftName || 'AM'} Shift`}
                    onClose={onClose}
                />

                <ModalBody>
                    {error && (
                        <div className="mb-4 p-3 bg-rose-500/15 border border-rose-500/40 rounded-xl flex items-center gap-3 text-rose-200 text-xs sm:text-sm animate-fade-in-up">
                            <i className="fas fa-exclamation-triangle text-rose-400 text-lg shrink-0"></i>
                            <span className="font-medium">{error}</span>
                        </div>
                    )}

                    <div className="space-y-4">
                        {/* Top Shift Metadata & Performance KPI Bar */}
                        <div className="bg-slate-900/90 border border-slate-700/80 rounded-2xl p-3.5 sm:p-4 space-y-3">
                            <div className="flex flex-wrap items-center justify-between gap-2 pb-2.5 border-b border-slate-800 text-xs">
                                <div className="flex flex-wrap items-center gap-2 sm:gap-3">
                                    <span className="inline-flex items-center gap-1.5 font-bold text-white bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-700">
                                        <i className="fas fa-store text-orange-400"></i> {shopName}
                                    </span>
                                    <span className="inline-flex items-center gap-1.5 font-semibold text-slate-300 bg-slate-800/70 px-2.5 py-1 rounded-lg border border-slate-700/70">
                                        <i className="fas fa-desktop text-cyan-400"></i> {currentDeviceName}
                                    </span>
                                    <span className="inline-flex items-center gap-1.5 font-semibold text-slate-300">
                                        <i className="fas fa-user-check text-blue-400"></i> {userProfile.name}
                                    </span>
                                </div>
                                <div className="text-slate-400 font-mono text-[11px]">
                                    <i className="far fa-clock mr-1 text-slate-500"></i>
                                    Opened: <strong className="text-slate-200">{formattedStartTime}</strong>
                                </div>
                            </div>

                            {/* 5-Column Shift Sales KPI Strip */}
                            <div className="grid grid-cols-2 sm:grid-cols-5 gap-2.5">
                                <div className="bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/60">
                                    <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Gross Sale</span>
                                    <span className="text-sm sm:text-base font-black text-white mt-0.5 block">៛{khrFormatter.format(shiftSalesStats.gross)}</span>
                                </div>
                                <div className="bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/60">
                                    <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Discounts</span>
                                    <span className="text-sm sm:text-base font-bold text-rose-400 mt-0.5 block">-៛{khrFormatter.format(shiftSalesStats.discount)}</span>
                                </div>
                                <div className="bg-emerald-950/25 p-2.5 rounded-xl border border-emerald-500/30">
                                    <span className="text-[10px] font-bold uppercase tracking-wider text-emerald-300 block">Net Sale ({currentShift.transactionCount || 0} Trx)</span>
                                    <span className="text-sm sm:text-base font-black text-emerald-400 mt-0.5 block">៛{khrFormatter.format(shiftSalesStats.net)}</span>
                                </div>
                                <div className="bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/60">
                                    <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Sale Margin</span>
                                    <span className="text-sm sm:text-base font-bold text-cyan-400 mt-0.5 block">{shiftSalesStats.margin.toFixed(2)}%</span>
                                </div>
                                <div className="col-span-2 sm:col-span-1 bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/60">
                                    <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Voided ({shiftSalesStats.voidCount})</span>
                                    <span className="text-sm sm:text-base font-bold text-rose-400 mt-0.5 block">៛{khrFormatter.format(shiftSalesStats.voidAmount)}</span>
                                </div>
                            </div>
                        </div>

                        {/* Main 2-Column Workspace: Left = Inputs | Right = Live Reconciliation Ledger */}
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
                            {/* LEFT COLUMN: Step-by-Step Cash & Bank Inputs (7 cols) */}
                            <div className="lg:col-span-7 space-y-4">
                                {/* Step 1: Closing Floating Cash Verification */}
                                <div className={`p-4 rounded-2xl border transition-colors ${
                                    closingFloatCash
                                        ? (reconciliation.isFloatMatched ? 'bg-emerald-950/15 border-emerald-500/40' : 'bg-rose-950/15 border-rose-500/40')
                                        : 'bg-slate-900/80 border-slate-700/80'
                                }`}>
                                    <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                                        <label className="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
                                            <span className="w-5 h-5 rounded-full bg-blue-600 text-white text-[10px] font-black flex items-center justify-center">1</span>
                                            <span>Verify Drawer Floating Cash (Must Match: ៛{khrFormatter.format(reconciliation.expectedFloat)})</span>
                                        </label>
                                        <button
                                            type="button"
                                            onClick={() => setClosingFloatCash(formatNumber(reconciliation.expectedFloat))}
                                            className="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-blue-600 text-blue-300 hover:text-white border border-slate-600 text-[11px] font-bold transition"
                                            title="Fill exact starting float cash"
                                        >
                                            <i className="fas fa-check-double mr-1"></i>Auto-Match Float
                                        </button>
                                    </div>
                                    <div className="relative flex items-center">
                                        <span className="absolute left-3.5 text-slate-400 font-bold">៛</span>
                                        <input
                                            type="text"
                                            inputMode="numeric"
                                            value={closingFloatCash}
                                            onChange={handleCurrencyInput(setClosingFloatCash)}
                                            className="w-full bg-slate-800 text-white text-lg font-bold pl-8 pr-10 py-2.5 rounded-xl border border-slate-600 focus:border-blue-500 outline-none font-mono"
                                            placeholder="Enter closing float cash..."
                                        />
                                        {closingFloatCash && (
                                            <i className={`fas ${reconciliation.isFloatMatched ? 'fa-check-circle text-emerald-400' : 'fa-times-circle text-rose-400'} absolute right-3.5 text-lg`}></i>
                                        )}
                                    </div>
                                </div>

                                {/* Step 2: Physical Cash & Bank/KHQR Drop Cards */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    {/* Physical Cash Drop */}
                                    <div className="bg-slate-900/80 border border-slate-700/80 rounded-2xl p-4 space-y-3">
                                        <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                                            <h4 className="text-emerald-400 font-bold text-xs uppercase tracking-wider flex items-center gap-1.5">
                                                <i className="fas fa-money-bill-wave"></i> 2. Physical Cash Drop
                                            </h4>
                                            <span className="text-[11px] font-mono text-slate-400">
                                                = ៛{khrFormatter.format(reconciliation.actualCashTotal)}
                                            </span>
