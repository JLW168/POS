                    auditedBy: '', // Missing auditor -> should trigger MISSING_AUDITOR_NAME flag
                    items: [
                        { name: 'Item KHR', quantity: 5, auditedQty: 5, cost: 10000, auditedTotalKHR: 48000, auditedTotalUSD: null },
                        { name: 'Item USD', quantity: 2, auditedQty: 2, cost: 40000, auditedTotalKHR: null, auditedTotalUSD: 19.50 }
                    ]
                });
                results.push({
                    name: 'Phase 5: PO Audit Queue Mapping, Currency Separation & Integrity Flags',
                    passed:
                        samplePendingPO.auditQueueStatus === 'PENDING' &&
                        sampleAuditedPO.auditQueueStatus === 'COMPLETED' &&
                        sampleAuditedPO.auditedAmountKHR === 48000 &&
                        sampleAuditedPO.auditedAmountUSD === 19.50 &&
                        sampleAuditedPO.hasMissingAuditFields === true &&
                        sampleAuditedPO.integrityFlags.includes('MISSING_AUDITOR_NAME'),
                    detail: 'Maps submitted->PENDING & audited->COMPLETED, keeps KHR (៛48,000) and USD ($19.50) strictly separate, and flags MISSING_AUDITOR_NAME without guessing values.'
                });

                // Test 8 (Phase 6): Internal Transfer Operational Status Isolation, Discrepancy Detection & Zero Payment Fabrication
                const sampleTransferDone = DataNormalizer.normalizeTransfer({
                    id: 'tr_101',
                    transferNo: 'TR-2026-001',
                    fromShopId: 'shop_a',
                    fromShopName: 'Shop A',
                    toShopId: 'shop_b',
                    toShopName: 'Shop B',
                    status: 'done',
                    items: [
                        { name: 'Coffee Beans 1kg', code: 'CF01', requestedQty: 10, receivedQty: 8, quantity: 8, cost: 25000 },
                        { name: 'Paper Cups', code: 'PC02', requestedQty: 5, receivedQty: 5, quantity: 5, cost: 10000 }
                    ]
                });
                results.push({
                    name: 'Phase 6: Transfer Operational Status, Discrepancy & Non-Fabrication Guard',
                    passed:
                        sampleTransferDone.operationalStatus === 'done' &&
                        typeof sampleTransferDone.auditQueueStatus === 'undefined' &&
                        sampleTransferDone.totalReqQty === 15 &&
                        sampleTransferDone.totalRecQty === 13 &&
                        sampleTransferDone.discrepancyCount === 1 &&
                        sampleTransferDone.totalAmountKHR === 250000,
                    detail: 'Keeps operationalStatus="done" separate from PO audit queues, detects 1 item discrepancy (Req 15 vs Rec 13), values received stock at ៛250,000, and fabricates 0 internal payment records.'
                });

                // Test 9 (Phase 7): Executive KPI to Underlying Report & Shop Comparison Reconciliation
                const matrixSalesSumKHR = shopComparisonMatrix.reduce((s, r) => s + r.netSalesKHR, 0);
                const matrixSalesSumUSD = Number(shopComparisonMatrix.reduce((s, r) => s + r.cashTenderedUSD, 0).toFixed(2));
                const matrixKhqrSumKHR = shopComparisonMatrix.reduce((s, r) => s + r.khqrKHR, 0);
                const matrixKhqrSumUSD = Number(shopComparisonMatrix.reduce((s, r) => s + r.khqrUSD, 0).toFixed(2));
                const kpiMatchesMatrix =
                    matrixSalesSumKHR === metricsSummary.netSalesKHR &&
                    matrixSalesSumUSD === Number(metricsSummary.cashTenderedUSD.toFixed(2)) &&
                    matrixKhqrSumKHR === metricsSummary.khqrTotalKHR &&
                    matrixKhqrSumUSD === Number(metricsSummary.khqrTotalUSD.toFixed(2));
                results.push({
                    name: 'Phase 7: Executive KPI <-> Shop Comparison <-> Export Reconciliation',
                    passed: kpiMatchesMatrix,
                    detail: `Executive Net Sales (${formatKHR(metricsSummary.netSalesKHR)} / ${formatUSD(metricsSummary.cashTenderedUSD)}) and KHQR (${formatKHR(metricsSummary.khqrTotalKHR)} / ${formatUSD(metricsSummary.khqrTotalUSD)}) reconcile 100% with Shop Comparison.`
                });

                setTestSuiteResults(results);
            }, [shopComparisonMatrix, metricsSummary]);

            // ============================================================================
            // PHASE 4: SALES & KHQR RECONCILIATION ENGINE (Double-Count Prevention)
            // ============================================================================
            const scopedSales = useMemo(() => {
                return salesList.filter(s => {
                    if (! activeShopIdSet.has(s.shopId)) return false;
                    if (!includeVoidSales && s.status === 'void') return false;
                    if (paymentTypeFilter === 'Cash' && s.isKhqr) return false;
                    if (paymentTypeFilter === 'KHQR / Bank' && !s.isKhqr) return false;
                    if (searchTerm.trim()) {
                        const q = searchTerm.toLowerCase();
                        const match =
                            s.receiptNo.toLowerCase().includes(q) ||
                            s.shopName.toLowerCase().includes(q) ||
                            s.cashierName.toLowerCase().includes(q) ||
                            s.abaApv.toLowerCase().includes(q) ||
                            s.abaTrxId.toLowerCase().includes(q);
                        if (!match) return false;
                    }
                    return true;
                });
            }, [salesList, activeShopIdSet, includeVoidSales, paymentTypeFilter, searchTerm]);

            const voidedSalesInScope = useMemo(() => {
                return salesList.filter(s => activeShopIdSet.has(s.shopId) && s.status === 'void');
            }, [salesList, activeShopIdSet]);

            // Reconcile KHQR / ABA Payments with Sales (Prevent Double Counting!)
            const reconciledKhqrReport = useMemo(() => {
                // Index all valid KHQR sales in active scope by Trx ID, APV, and Sale ID
                const khqrSales = salesList.filter(s => activeShopIdSet.has(s.shopId) && s.status !== 'void' && s.isKhqr);
                const saleByTrx = new Map();
                const saleByApv = new Map();
                const saleById = new Map();

                khqrSales.forEach(s => {
                    saleById.set(s.id, s);
                    if (s.abaTrxId) saleByTrx.set(s.abaTrxId, s);
                    if (s.abaApv) saleByApv.set(s.abaApv.toUpperCase(), s);
                });

                // Map shop chatId -> shop object for scoping raw aba_payments
                const chatToShopMap = new Map();
                authorizedShops.forEach(sh => {
                    const rawChat = sh?.khqrConfig?.paywayChatId || '';
                    rawChat.split(/[\s,|;]+/).forEach(cid => {
                        const norm = cid.replace(/^-100/, '').replace(/^-/, '').trim();
                        if (norm) chatToShopMap.set(norm, sh);
                    });
                });

                const unifiedRecords = [];
                const matchedSaleIds = new Set();

                abaPaymentsList.forEach(aba => {
                    const normChat = aba.chatId.replace(/^-100/, '').replace(/^-/, '').trim();
                    const matchedSale =
                        (aba.trxId && saleByTrx.get(aba.trxId)) ||
                        (aba.claimedByOrderId && saleById.get(aba.claimedByOrderId)) ||
                        (aba.apv && saleByApv.get(aba.apv.toUpperCase())) ||
                        null;

                    const resolvedShop = matchedSale
                        ? { id: matchedSale.shopId, name: matchedSale.shopName }
                        : (chatToShopMap.get(normChat) || null);

                    // Enforce authorized & selected shop scope
                    if (!resolvedShop || !activeShopIdSet.has(resolvedShop.id)) return;

                    if (matchedSale) {
                        matchedSaleIds.add(matchedSale.id);
                    }

                    unifiedRecords.push({
                        uniqueId: `aba_${aba.id}`,
                        trxId: aba.trxId || '-',
                        apv: aba.apv || '-',
                        shopId: resolvedShop.id,
                        shopName: resolvedShop.name,
                        dateObj: aba.dateObj,
                        payerName: aba.payerName,
                        maskedAccount: aba.maskedAccount,
                        paymentCategory: aba.paymentCategory, // 'INDOOR_ABA' | 'OUTDOOR_KHQR'
                        sourceBank: aba.sourceBank,
                        currency: aba.currency,
                        amountKHR: aba.amountKHR,
                        amountUSD: aba.amountUSD,
                        reconciliationStatus: matchedSale ? 'RECONCILED_WITH_SALE' : 'UNLINKED_FEED_PAYMENT',
                        linkedReceiptNo: matchedSale ? matchedSale.receiptNo : (aba.claimedByInvoiceNo || '-')
                    });
                });

                // Include KHQR sales that were recorded in `sales` (e.g. Bypass DB mode) but not in `aba_payments`
                // Because we skip `matchedSaleIds`, the same KHQR transaction is NEVER counted twice!
                khqrSales.forEach(s => {
                    if (matchedSaleIds.has(s.id)) return;
                    const isOutdoor = /KHQR\s*\(/i.test(s.abaPaymentChannel || '');
                    unifiedRecords.push({
                        uniqueId: `sale_${s.id}`,
                        trxId: s.abaTrxId || '-',
                        apv: s.abaApv || '-',
                        shopId: s.shopId,
                        shopName: s.shopName,
                        dateObj: s.dateObj,
                        payerName: s.abaPayer || s.customerName || 'KHQR Customer',
                        maskedAccount: '*KHQR',
                        paymentCategory: isOutdoor ? 'OUTDOOR_KHQR' : 'INDOOR_ABA',
                        sourceBank: s.abaSourceBank || 'ABA Bank',
                        currency: s.abaCurrency,
                        amountKHR: s.abaCurrency === 'KHR' ? s.grandTotalKHR : 0,
                        amountUSD: s.abaCurrency === 'USD' ? s.abaPaidUSD : 0,
                        reconciliationStatus: s.abaVerified ? 'RECONCILED_WITH_SALE' : 'POS_MANUAL_KHQR',
                        linkedReceiptNo: s.receiptNo
                    });
                });

                const filtered = unifiedRecords.filter(r => {
                    if (paymentTypeFilter === 'INDOOR_ABA' && r.paymentCategory !== 'INDOOR_ABA') return false;
                    if (paymentTypeFilter === 'OUTDOOR_KHQR' && r.paymentCategory !== 'OUTDOOR_KHQR') return false;
                    if (khqrReconcileFilter !== 'ALL' && r.reconciliationStatus !== khqrReconcileFilter) return false;
                    if (searchTerm.trim()) {
                        const q = searchTerm.toLowerCase();
                        return (
                            r.trxId.toLowerCase().includes(q) ||
                            r.apv.toLowerCase().includes(q) ||
                            r.payerName.toLowerCase().includes(q) ||
                            r.linkedReceiptNo.toLowerCase().includes(q) ||
                            r.shopName.toLowerCase().includes(q)
                        );
                    }
                    return true;
                });

                return filtered.sort((a, b) => (b.dateObj?.getTime() || 0) - (a.dateObj?.getTime() || 0));
            }, [salesList, abaPaymentsList, authorizedShops, activeShopIdSet, paymentTypeFilter, khqrReconcileFilter, searchTerm]);

            // Phase 4: Daily / Weekly / Monthly Sales Trend Aggregation (Strictly Currency-Separated)
            const salesTrendSeries = useMemo(() => {
                const validSales = scopedSales.filter(s => s.status !== 'void' && s.dateObj);
                const buckets = new Map();

                validSales.forEach(s => {
                    const d = s.dateObj;
                    let key = '';
                    let label = '';
                    let sortMs = 0;

                    if (salesTrendGranularity === 'monthly') {
                        key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                        label = d.toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
                        sortMs = new Date(d.getFullYear(), d.getMonth(), 1).getTime();
                    } else if (salesTrendGranularity === 'weekly') {
                        const temp = new Date(d.getFullYear(), d.getMonth(), d.getDate());
                        const day = temp.getDay();
                        const diff = temp.getDate() - day + (day === 0 ? -6 : 1);
                        const weekStart = new Date(temp.setDate(diff));
                        key = weekStart.toISOString().slice(0, 10);
                        label = `Wk ${String(weekStart.getDate()).padStart(2, '0')}/${String(weekStart.getMonth() + 1).padStart(2, '0')}`;
                        sortMs = weekStart.getTime();
                    } else {
                        key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                        label = `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                        sortMs = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
                    }

                    if (!buckets.has(key)) {
                        buckets.set(key, {
                            key,
                            label,
                            sortMs,
                            salesCount: 0,
                            grossKHR: 0,
                            discountKHR: 0,
                            netKHR: 0,
                            profitKHR: 0,
                            tenderedUSD: 0
                        });
                    }
                    const b = buckets.get(key);
                    b.salesCount += 1;
                    b.grossKHR += s.subtotalKHR;
                    b.discountKHR += s.discountKHR;
                    b.netKHR += s.grandTotalKHR;
                    b.profitKHR += s.netProfitKHR;
                    b.tenderedUSD = Number((b.tenderedUSD + s.tenderedUSD).toFixed(2));
                });

                const list = Array.from(buckets.values()).sort((a, b) => a.sortMs - b.sortMs);
                const maxNetKHR = list.reduce((m, item) => Math.max(m, item.netKHR), 0) || 1;
                return { list, maxNetKHR };
            }, [scopedSales, salesTrendGranularity]);

            // Phase 4: Payment Method & Category Breakdowns (USD & KHR Separated)
            const salesByPaymentMethodBreakdown = useMemo(() => {
                const validSales = scopedSales.filter(s => s.status !== 'void');
                const map = {
                    'Cash': { method: 'Cash', count: 0, grossKHR: 0, discountKHR: 0, netKHR: 0, profitKHR: 0, tenderedUSD: 0 },
                    'KHQR / Bank': { method: 'KHQR / Bank', count: 0, grossKHR: 0, discountKHR: 0, netKHR: 0, profitKHR: 0, tenderedUSD: 0 }
                };
                validSales.forEach(s => {
                    const key = s.isKhqr ? 'KHQR / Bank' : 'Cash';
                    map[key].count += 1;
                    map[key].grossKHR += s.subtotalKHR;
                    map[key].discountKHR += s.discountKHR;
                    map[key].netKHR += s.grandTotalKHR;
                    map[key].profitKHR += s.netProfitKHR;
                    map[key].tenderedUSD = Number((map[key].tenderedUSD + (s.isKhqr ? s.abaPaidUSD : s.tenderedUSD)).toFixed(2));
                });
                return Object.values(map);
            }, [scopedSales]);

            const khqrBreakdownStats = useMemo(() => {
                const stats = {
                    indoor: { count: 0, khr: 0, usd: 0 },
                    outdoor: { count: 0, khr: 0, usd: 0 },
                    reconciledCount: 0,
                    unlinkedCount: 0,
                    manualPosCount: 0
                };
                reconciledKhqrReport.forEach(r => {
                    if (r.paymentCategory === 'OUTDOOR_KHQR') {
                        stats.outdoor.count += 1;
                        stats.outdoor.khr += r.amountKHR;
                        stats.outdoor.usd = Number((stats.outdoor.usd + r.amountUSD).toFixed(2));
                    } else {
                        stats.indoor.count += 1;
                        stats.indoor.khr += r.amountKHR;
                        stats.indoor.usd = Number((stats.indoor.usd + r.amountUSD).toFixed(2));
                    }
                    if (r.reconciliationStatus === 'RECONCILED_WITH_SALE') stats.reconciledCount += 1;
                    else if (r.reconciliationStatus === 'UNLINKED_FEED_PAYMENT') stats.unlinkedCount += 1;
                    else stats.manualPosCount += 1;
                });
                return stats;
            }, [reconciledKhqrReport]);

            // ============================================================================
            // PHASE 5: PURCHASE ANALYTICS & AUDIT WORKFLOW QUEUES
            // ============================================================================
            const availablePoVendors = useMemo(() => {
                const set = new Set();
                posList.forEach(po => {
                    if (activeShopIdSet.has(po.shopId) && po.vendorName) {
                        set.add(po.vendorName);
                    }
                });
                return Array.from(set).sort();
            }, [posList, activeShopIdSet]);

            const scopedPOs = useMemo(() => {
                return posList.filter(po => {
                    if (!activeShopIdSet.has(po.shopId)) return false;
                    if (auditStatusFilter !== 'ALL' && po.auditQueueStatus !== auditStatusFilter) return false;
                    if (poVendorFilter !== 'ALL' && po.vendorName !== poVendorFilter) return false;
                    if (poIntegrityFilter === 'FLAGGED_ONLY' && !po.hasMissingAuditFields) return false;
                    if (poIntegrityFilter === 'CLEAN_ONLY' && po.hasMissingAuditFields) return false;
                    if (searchTerm.trim()) {
                        const q = searchTerm.toLowerCase();
                        return (
                            po.poNumber.toLowerCase().includes(q) ||
                            po.vendorName.toLowerCase().includes(q) ||
                            po.shopName.toLowerCase().includes(q) ||
                            (po.auditedBy || '').toLowerCase().includes(q)
                        );
                    }
                    return true;
                }).sort((a, b) => (b.primaryDateObj?.getTime() || 0) - (a.primaryDateObj?.getTime() || 0));
            }, [posList, activeShopIdSet, auditStatusFilter, poVendorFilter, poIntegrityFilter, searchTerm]);

            // Phase 5: Purchase Breakdown by Vendor / Supplier & by Shop (Currency-Separated)
            const purchaseAnalyticsBreakdown = useMemo(() => {
                const byVendorMap = new Map();
                const byShopMap = new Map();
                let totalReqQty = 0;
                let totalAudQty = 0;
                let flaggedCount = 0;
                let overduePendingCount = 0;

                scopedPOs.forEach(po => {
                    totalReqQty += po.totalRequestedQty;
                    totalAudQty += po.totalAuditedQty;
                    if (po.hasMissingAuditFields) flaggedCount += 1;
                    if ((po.auditQueueStatus === 'PENDING' || po.auditQueueStatus === 'ACTIVE') && po.ageHours >= 24) {
                        overduePendingCount += 1;
                    }

                    const vKey = po.vendorName || 'Unknown Vendor';
                    if (!byVendorMap.has(vKey)) {
                        byVendorMap.set(vKey, {
                            vendorName: vKey,
                            poCount: 0,
                            auditedCount: 0,
                            pendingCount: 0,
                            reqQty: 0,
                            audQty: 0,
                            requestedKHR: 0,
                            auditedKHR: 0,
                            auditedUSD: 0
                        });
                    }
                    const vRow = byVendorMap.get(vKey);
                    vRow.poCount += 1;
                    if (po.auditQueueStatus === 'COMPLETED') vRow.auditedCount += 1;
                    if (po.auditQueueStatus === 'PENDING' || po.auditQueueStatus === 'ACTIVE') vRow.pendingCount += 1;
                    vRow.reqQty += po.totalRequestedQty;
                    vRow.audQty += po.totalAuditedQty;
                    vRow.requestedKHR += po.requestedAmountKHR;
                    vRow.auditedKHR += po.auditedAmountKHR;
                    vRow.auditedUSD = Number((vRow.auditedUSD + po.auditedAmountUSD).toFixed(2));

                    const sKey = po.shopId || po.shopName;
                    if (!byShopMap.has(sKey)) {
                        byShopMap.set(sKey, {
                            shopName: po.shopName,
                            poCount: 0,
                            pendingQueue: 0,
                            activeQueue: 0,
                            completedQueue: 0,
                            requestedKHR: 0,
                            auditedKHR: 0,
                            auditedUSD: 0
                        });
                    }
                    const sRow = byShopMap.get(sKey);
                    sRow.poCount += 1;
                    if (po.auditQueueStatus === 'PENDING') sRow.pendingQueue += 1;
                    else if (po.auditQueueStatus === 'ACTIVE') sRow.activeQueue += 1;
                    else if (po.auditQueueStatus === 'COMPLETED') sRow.completedQueue += 1;
                    sRow.requestedKHR += po.requestedAmountKHR;
                    sRow.auditedKHR += po.auditedAmountKHR;
                    sRow.auditedUSD = Number((sRow.auditedUSD + po.auditedAmountUSD).toFixed(2));
                });

                return {
                    byVendor: Array.from(byVendorMap.values()).sort((a, b) => b.auditedKHR - a.auditedKHR || b.requestedKHR - a.requestedKHR),
                    byShop: Array.from(byShopMap.values()).sort((a, b) => b.auditedKHR - a.auditedKHR || b.requestedKHR - a.requestedKHR),
                    totalReqQty,
                    totalAudQty,
                    flaggedCount,
                    overduePendingCount
                };
            }, [scopedPOs]);

            // ============================================================================
            // PHASE 6: INTERNAL TRANSFERS (Operational Status Strictly Separated)
            // ============================================================================
            const scopedTransfers = useMemo(() => {
                return transfersList.filter(tr => {
                    // User must be authorized for at least the source or destination shop
                    const fromAllowed = activeShopIdSet.has(tr.fromShopId);
                    const toAllowed = activeShopIdSet.has(tr.toShopId);
                    if (!fromAllowed && !toAllowed) return false;
                    if (transferStatusFilter !== 'ALL' && tr.operationalStatus !== transferStatusFilter) return false;
                    if (transferSourceFilter !== 'ALL' && tr.fromShopId !== transferSourceFilter) return false;
                    if (transferDestFilter !== 'ALL' && tr.toShopId !== transferDestFilter) return false;
                    if (transferDirectionFilter === 'OUTBOUND' && !fromAllowed) return false;
                    if (transferDirectionFilter === 'INBOUND' && !toAllowed) return false;
                    if (transferDiscrepancyFilter === 'DISCREPANCY_ONLY' && tr.discrepancyCount === 0) return false;
                    if (transferDiscrepancyFilter === 'MATCHED_ONLY' && tr.discrepancyCount > 0) return false;
                    if (searchTerm.trim()) {
                        const q = searchTerm.toLowerCase();
                        return (
                            tr.transferNo.toLowerCase().includes(q) ||
                            tr.fromShopName.toLowerCase().includes(q) ||
                            tr.toShopName.toLowerCase().includes(q)
                        );
                    }
                    return true;
                }).sort((a, b) => (b.dateObj?.getTime() || 0) - (a.dateObj?.getTime() || 0));
            }, [transfersList, activeShopIdSet, transferStatusFilter, transferSourceFilter, transferDestFilter, transferDirectionFilter, transferDiscrepancyFilter, searchTerm]);

            // Phase 6: Source -> Destination Route Matrix & Operational Breakdown
            const transferAnalyticsBreakdown = useMemo(() => {
                const routeMap = new Map();
                const statusSummary = {
                    done: { count: 0, reqQty: 0, recQty: 0, valueKHR: 0, discrepancies: 0 },
                    active: { count: 0, reqQty: 0, recQty: 0, valueKHR: 0, discrepancies: 0 },
                    draft: { count: 0, reqQty: 0, recQty: 0, valueKHR: 0, discrepancies: 0 }
                };
                let totalReqQty = 0;
                let totalRecQty = 0;
                let totalDiscrepancyTransfers = 0;
                let totalDiscrepancyItems = 0;

                scopedTransfers.forEach(tr => {
                    const stKey = statusSummary[tr.operationalStatus] ? tr.operationalStatus : 'draft';
                    statusSummary[stKey].count += 1;
                    statusSummary[stKey].reqQty += tr.totalReqQty;
                    statusSummary[stKey].recQty += tr.totalRecQty;
                    statusSummary[stKey].valueKHR += tr.totalAmountKHR;
                    statusSummary[stKey].discrepancies += tr.discrepancyCount;

                    totalReqQty += tr.totalReqQty;
                    totalRecQty += tr.totalRecQty;
                    if (tr.discrepancyCount > 0) {
                        totalDiscrepancyTransfers += 1;
                        totalDiscrepancyItems += tr.discrepancyCount;
                    }

                    const routeKey = `${tr.fromShopId || tr.fromShopName}__${tr.toShopId || tr.toShopName}`;
                    if (!routeMap.has(routeKey)) {
                        routeMap.set(routeKey, {
                            routeKey,
                            fromShopId: tr.fromShopId,
                            fromShopName: tr.fromShopName,
                            toShopId: tr.toShopId,
                            toShopName: tr.toShopName,
                            transferCount: 0,
                            doneCount: 0,
                            activeCount: 0,
                            draftCount: 0,
                            reqQty: 0,
                            recQty: 0,
                            discrepancyCount: 0,
                            totalValueKHR: 0,
                            doneValueKHR: 0
                        });
                    }
                    const r = routeMap.get(routeKey);
                    r.transferCount += 1;
                    if (tr.operationalStatus === 'done') {
                        r.doneCount += 1;
                        r.doneValueKHR += tr.totalAmountKHR;
                    } else if (tr.operationalStatus === 'active') {
                        r.activeCount += 1;
                    } else {
                        r.draftCount += 1;
                    }
                    r.reqQty += tr.totalReqQty;
                    r.recQty += tr.totalRecQty;
                    r.discrepancyCount += tr.discrepancyCount;
                    r.totalValueKHR += tr.totalAmountKHR;
                });

                return {
                    routes: Array.from(routeMap.values()).sort((a, b) => b.totalValueKHR - a.totalValueKHR),
                    statusSummary,
                    totalReqQty,
                    totalRecQty,
                    totalDiscrepancyTransfers,
                    totalDiscrepancyItems
                };
            }, [scopedTransfers]);

            // ============================================================================
            // PHASE 7: AGGREGATED METRICS & SHOP COMPARISON TABLE (USD & KHR SEPARATE)
            // ============================================================================
            const metricsSummary = useMemo(() => {
                const validSales = scopedSales.filter(s => s.status !== 'void');
                let salesCount = validSales.length;
                let grossSalesKHR = 0;
                let discountKHR = 0;
                let netSalesKHR = 0;
                let costKHR = 0;
                let profitKHR = 0;
                let cashTenderedUSD = 0;

                validSales.forEach(s => {
                    grossSalesKHR += s.subtotalKHR;
                    discountKHR += s.discountKHR;
                    netSalesKHR += s.grandTotalKHR;
                    costKHR += s.totalCostKHR;
                    profitKHR += s.netProfitKHR;
                    cashTenderedUSD += s.tenderedUSD;
                });

                let khqrTotalKHR = 0;
                let khqrTotalUSD = 0;
                let indoorCount = 0;
                let outdoorCount = 0;

                reconciledKhqrReport.forEach(r => {
                    khqrTotalKHR += r.amountKHR;
                    khqrTotalUSD += r.amountUSD;
                    if (r.paymentCategory === 'OUTDOOR_KHQR') outdoorCount++;
                    else indoorCount++;
                });

                let poRequestedKHR = 0;
                let poAuditedKHR = 0;
                let poAuditedUSD = 0;
                let pendingAuditCount = 0;
                let activeAuditCount = 0;
                let completedAuditCount = 0;

                scopedPOs.forEach(po => {
                    poRequestedKHR += po.requestedAmountKHR;
                    poAuditedKHR += po.auditedAmountKHR;
                    poAuditedUSD += po.auditedAmountUSD;
                    if (po.auditQueueStatus === 'PENDING') pendingAuditCount++;
                    else if (po.auditQueueStatus === 'ACTIVE') activeAuditCount++;
                    else if (po.auditQueueStatus === 'COMPLETED') completedAuditCount++;
                });

                let transferValueKHR = 0;
                let transferDoneCount = 0;
                let transferActiveCount = 0;
                let transferDraftCount = 0;

                scopedTransfers.forEach(tr => {
                    transferValueKHR += tr.totalAmountKHR;
                    if (tr.operationalStatus === 'done') transferDoneCount++;
                    else if (tr.operationalStatus === 'active') transferActiveCount++;
                    else transferDraftCount++;
                });

                return {
                    salesCount,
                    grossSalesKHR,
                    discountKHR,
                    netSalesKHR,
                    costKHR,
                    profitKHR,
                    cashTenderedUSD,
                    khqrCount: reconciledKhqrReport.length,
                    khqrTotalKHR,
                    khqrTotalUSD,
                    indoorCount,
                    outdoorCount,
                    poCount: scopedPOs.length,
                    poRequestedKHR,
                    poAuditedKHR,
                    poAuditedUSD,
                    pendingAuditCount,
                    activeAuditCount,
                    completedAuditCount,
                    transferCount: scopedTransfers.length,
                    transferValueKHR,
                    transferDoneCount,
                    transferActiveCount,
                    transferDraftCount
                };
            }, [scopedSales, reconciledKhqrReport, scopedPOs, scopedTransfers]);

            // Phase 7: Period-over-Period (PoP) Comparison Metrics (Strictly Currency-Separated)
            const periodComparisonSummary = useMemo(() => {
                const validPrevSales = prevPeriodSalesList.filter(s => activeShopIdSet.has(s.shopId) && s.status !== 'void');
                let prevSalesCount = validPrevSales.length;
                let prevNetSalesKHR = 0;
                let prevProfitKHR = 0;
                let prevCashTenderedUSD = 0;

                validPrevSales.forEach(s => {
                    prevNetSalesKHR += s.grandTotalKHR;
                    prevProfitKHR += s.netProfitKHR;
                    prevCashTenderedUSD = Number((prevCashTenderedUSD + s.tenderedUSD).toFixed(2));
                });

                const calcPctDelta = (curr, prev) => {
                    if (prev <= 0) return curr > 0 ? 100 : 0;
                    return Number((((curr - prev) / prev) * 100).toFixed(1));
                };

                return {
                    daysCount: comparablePrevBounds.daysCount,
                    prevStart: comparablePrevBounds.start,
                    prevEnd: comparablePrevBounds.end,
                    prevSalesCount,
                    prevNetSalesKHR,
                    prevProfitKHR,
                    prevCashTenderedUSD,
                    salesCountDeltaPct: calcPctDelta(metricsSummary.salesCount, prevSalesCount),
                    netSalesKHRDeltaPct: calcPctDelta(metricsSummary.netSalesKHR, prevNetSalesKHR),
                    profitKHRDeltaPct: calcPctDelta(metricsSummary.profitKHR, prevProfitKHR),
                    cashUSDDeltaPct: calcPctDelta(metricsSummary.cashTenderedUSD, prevCashTenderedUSD)
                };
            }, [prevPeriodSalesList, activeShopIdSet, comparablePrevBounds, metricsSummary]);

            // Shop-by-Shop Comparison Matrix
            const shopComparisonMatrix = useMemo(() => {
                const map = new Map();
                authorizedShops.filter(s => activeShopIdSet.has(s.id)).forEach(sh => {
                    map.set(sh.id, {
                        shopId: sh.id,
                        shopName: sh.name,
                        salesCount: 0,
                        netSalesKHR: 0,
                        profitKHR: 0,
                        cashTenderedUSD: 0,
                        khqrCount: 0,
                        khqrKHR: 0,
                        khqrUSD: 0,
                        poCount: 0,
                        poAuditedKHR: 0,
                        poAuditedUSD: 0,
                        pendingAudits: 0,
                        outboundTransferKHR: 0,
                        inboundTransferKHR: 0
                    });
                });

                scopedSales.filter(s => s.status !== 'void').forEach(s => {
                    if (!map.has(s.shopId)) return;
                    const row = map.get(s.shopId);
                    row.salesCount += 1;
                    row.netSalesKHR += s.grandTotalKHR;
                    row.profitKHR += s.netProfitKHR;
                    row.cashTenderedUSD += s.tenderedUSD;
                });

                reconciledKhqrReport.forEach(r => {
                    if (!map.has(r.shopId)) return;
                    const row = map.get(r.shopId);
                    row.khqrCount += 1;
                    row.khqrKHR += r.amountKHR;
                    row.khqrUSD += r.amountUSD;
                });

                scopedPOs.forEach(po => {
                    if (!map.has(po.shopId)) return;
                    const row = map.get(po.shopId);
                    row.poCount += 1;
                    row.poAuditedKHR += po.auditedAmountKHR;
                    row.poAuditedUSD += po.auditedAmountUSD;
                    if (po.auditQueueStatus === 'PENDING' || po.auditQueueStatus === 'ACTIVE') {
                        row.pendingAudits += 1;
                    }
                });

                scopedTransfers.filter(t => t.operationalStatus === 'done').forEach(tr => {
                    if (map.has(tr.fromShopId)) {
                        map.get(tr.fromShopId).outboundTransferKHR += tr.totalAmountKHR;
                    }
                    if (map.has(tr.toShopId)) {
                        map.get(tr.toShopId).inboundTransferKHR += tr.totalAmountKHR;
                    }
                });

                return Array.from(map.values()).sort((a, b) => b.netSalesKHR - a.netSalesKHR);
            }, [authorizedShops, activeShopIdSet, scopedSales, reconciledKhqrReport, scopedPOs, scopedTransfers]);

            // ============================================================================
            // PHASE 7: CONTROLLED EXCEL / CSV EXPORT ENGINE (Inherits Scope & Currency Rules)
            // ============================================================================
            const handleExportWorkbook = (targetModule = activeNav) => {
                if (typeof XLSX === 'undefined') return;
                const wb = XLSX.utils.book_new();
                const scopeNames = selectedShopIds.includes('ALL')
                    ? `All Authorized Shops (${authorizedShops.length})`
                    : authorizedShops.filter(s => activeShopIdSet.has(s.id)).map(s => s.name).join(', ');

                const metaRows = [
                    ['POS Business Intelligence Dashboard — Official Read-Only Export'],
                    ['Generated At:', formatDateTime(new Date())],
                    ['Signed-In User:', `${userProfile.name || userProfile.email} (${userProfile.role})`],
                    ['Authorized Shop Scope:', scopeNames],
                    ['Date Window:', `${formatDateTime(dateBounds.start)} to ${formatDateTime(dateBounds.end)}`],
                    ['Currency Mode:', `${currencyMode} (USD and KHR are strictly separated; never auto-combined)`],
                    ['Exclusions:', includeVoidSales ? 'Void sales included' : `Void sales excluded (${voidedSalesInScope.length} voided receipts omitted)`],
                    []
                ];

                const appendSheetWithMeta = (sheetName, headers, rows) => {
                    const sheetData = [...metaRows, headers, ...rows];
                    const ws = XLSX.utils.aoa_to_sheet(sheetData);
                    XLSX.utils.book_append_sheet(wb, ws, sheetName.slice(0, 31));
                };

                if (targetModule === 'sales' || targetModule === 'executive' || targetModule === 'exports') {
                    appendSheetWithMeta(
                        'Sales_Analytics',
                        ['Date & Time', 'Receipt No', 'Shop', 'Cashier', 'Payment Method', 'Status', 'Gross Sales (KHR)', 'Discount (KHR)', 'Net Sales (KHR)', 'Cost (KHR)', 'Net Profit (KHR)', 'Cash Tendered (USD)', 'ABA APV', 'ABA Trx ID'],
                        scopedSales.map(s => [
                            formatDateTime(s.dateObj),
                            s.receiptNo,
                            s.shopName,
                            s.cashierName,
                            s.paymentMethod,
                            s.status.toUpperCase(),
                            s.subtotalKHR,
                            s.discountKHR,
                            s.grandTotalKHR,
                            s.totalCostKHR,
                            s.netProfitKHR,
                            s.tenderedUSD,
                            s.abaApv || '-',
                            s.abaTrxId || '-'
                        ])
                    );
                }

                if (targetModule === 'khqr' || targetModule === 'executive' || targetModule === 'exports') {
                    appendSheetWithMeta(
                        'KHQR_Payments',
                        ['Date & Time', 'Shop', 'Category', 'Source Bank', 'Payer Name', 'Masked Account', 'Currency', 'Amount (KHR)', 'Amount (USD)', 'APV', 'Trx ID', 'Reconciliation Status', 'Linked Receipt No'],
                        reconciledKhqrReport.map(r => [
                            formatDateTime(r.dateObj),
                            r.shopName,
                            r.paymentCategory,
                            r.sourceBank,
                            r.payerName,
                            r.maskedAccount,
                            r.currency,
                            r.amountKHR,
                            r.amountUSD,
                            r.apv,
                            r.trxId,
                            r.reconciliationStatus,
                            r.linkedReceiptNo
                        ])
                    );
                }

                if (targetModule === 'purchases' || targetModule === 'audits' || targetModule === 'executive' || targetModule === 'exports') {
                    appendSheetWithMeta(
                        'Purchases_And_Audits',
                        ['Date & Time', 'PO Number', 'Shop', 'Vendor', 'PO Status', 'Audit Queue', 'Requested Qty', 'Audited Qty', 'Requested Amount (KHR)', 'Audited Amount (KHR)', 'Audited Amount (USD)', 'Auditor', 'Data Integrity Flag'],
                        scopedPOs.map(po => [
                            formatDateTime(po.primaryDateObj),
                            po.poNumber,
                            po.shopName,
                            po.vendorName,
                            po.status.toUpperCase(),
                            po.auditQueueStatus,
                            po.totalRequestedQty,
                            po.totalAuditedQty,
                            po.requestedAmountKHR,
                            po.auditedAmountKHR,
                            po.auditedAmountUSD,
                            po.auditedBy || '-',
                            po.hasMissingAuditFields ? 'INCOMPLETE_AUDIT_TOTAL' : 'OK'
                        ])
                    );
                }

                if (targetModule === 'transfers' || targetModule === 'executive' || targetModule === 'exports') {
                    appendSheetWithMeta(
                        'Internal_Transfers',
                        ['Date & Time', 'Transfer No', 'Source Shop', 'Destination Shop', 'Operational Status', 'Sent/Req Qty', 'Received Qty', 'Discrepancies', 'Transfer Value (KHR)'],
                        scopedTransfers.map(tr => [
                            formatDateTime(tr.dateObj),
                            tr.transferNo,
                            tr.fromShopName,
                            tr.toShopName,
                            tr.operationalStatus.toUpperCase(),
                            tr.totalReqQty,
                            tr.totalRecQty,
                            tr.discrepancyCount,
                            tr.totalAmountKHR
                        ])
                    );
                }

                if (targetModule === 'comparison' || targetModule === 'executive' || targetModule === 'exports') {
                    appendSheetWithMeta(
                        'Shop_Comparison',
                        ['Shop Name', 'Sales Count', 'Net Sales (KHR)', 'Net Profit (KHR)', 'Cash Tendered (USD)', 'KHQR Count', 'KHQR Received (KHR)', 'KHQR Received (USD)', 'PO Count', 'PO Audited (KHR)', 'PO Audited (USD)', 'Pending/Active Audits', 'Outbound Transfers (KHR)', 'Inbound Transfers (KHR)'],
                        shopComparisonMatrix.map(sh => [
                            sh.shopName,
                            sh.salesCount,
                            sh.netSalesKHR,
                            sh.profitKHR,
                            sh.cashTenderedUSD,
                            sh.khqrCount,
                            sh.khqrKHR,
                            sh.khqrUSD,
                            sh.poCount,
                            sh.poAuditedKHR,
                            sh.poAuditedUSD,
                            sh.pendingAudits,
                            sh.outboundTransferKHR,
                            sh.inboundTransferKHR
                        ])
                    );
                }

                XLSX.writeFile(wb, `POS_BI_${targetModule.toUpperCase()}_${new Date().toISOString().slice(0, 10)}.xlsx`);
            };

            // Phase 7: Controlled CSV Export Engine (Inherits Scope, Filters & Currency Rules)
            const handleExportCSV = (targetModule = activeNav) => {
                const scopeNames = selectedShopIds.includes('ALL')
                    ? `All Authorized Shops (${authorizedShops.length})`
                    : authorizedShops.filter(s => activeShopIdSet.has(s.id)).map(s => s.name).join('; ');

                const metaHeaderLines = [
                    `"POS Business Intelligence Dashboard — Official Read-Only CSV Export (${targetModule.toUpperCase()})"`,
                    `"Generated At","${formatDateTime(new Date())}"`,
                    `"Signed-In User","${(userProfile.name || userProfile.email || '').replace(/"/g, '""')} (${userProfile.role})"`,
                    `"Authorized Shop Scope","${scopeNames.replace(/"/g, '""')}"`,
                    `"Date Window","${formatDateTime(dateBounds.start)} to ${formatDateTime(dateBounds.end)}"`,
                    `"Currency Rule","${currencyMode} — USD and KHR are strictly separated and never combined"`,
                    `"Calculation & Exclusion Notes","${includeVoidSales ? 'Void sales included' : `Void sales excluded (${voidedSalesInScope.length} voided receipts omitted)`}"`,
                    ``
                ];

                let headers = [];
                let rows = [];

                if (targetModule === 'sales') {
                    headers = ['Date & Time', 'Receipt No', 'Shop', 'Cashier', 'Payment Method', 'Status', 'Gross Sales (KHR)', 'Discount (KHR)', 'Net Sales (KHR)', 'Cost (KHR)', 'Net Profit (KHR)', 'Cash Tendered (USD)', 'ABA APV', 'ABA Trx ID'];
                    rows = scopedSales.map(s => [formatDateTime(s.dateObj), s.receiptNo, s.shopName, s.cashierName, s.paymentMethod, s.status.toUpperCase(), s.subtotalKHR, s.discountKHR, s.grandTotalKHR, s.totalCostKHR, s.netProfitKHR, s.tenderedUSD, s.abaApv || '-', s.abaTrxId || '-']);
                } else if (targetModule === 'khqr') {
                    headers = ['Date & Time', 'Shop', 'Category', 'Source Bank', 'Payer Name', 'Masked Account', 'Currency', 'Amount (KHR)', 'Amount (USD)', 'APV', 'Trx ID', 'Reconciliation Status', 'Linked Receipt No'];
                    rows = reconciledKhqrReport.map(r => [formatDateTime(r.dateObj), r.shopName, r.paymentCategory, r.sourceBank, r.payerName, r.maskedAccount, r.currency, r.amountKHR, r.amountUSD, r.apv, r.trxId, r.reconciliationStatus, r.linkedReceiptNo]);
                } else if (targetModule === 'purchases' || targetModule === 'audits') {
                    headers = ['Date & Time', 'PO Number', 'Shop', 'Vendor', 'PO Status', 'Audit Queue', 'Requested Qty', 'Audited Qty', 'Requested Amount (KHR)', 'Audited Amount (KHR)', 'Audited Amount (USD)', 'Auditor', 'Data Integrity Flag'];
                    rows = scopedPOs.map(po => [formatDateTime(po.primaryDateObj), po.poNumber, po.shopName, po.vendorName, po.status.toUpperCase(), po.auditQueueStatus, po.totalRequestedQty, po.totalAuditedQty, po.requestedAmountKHR, po.auditedAmountKHR, po.auditedAmountUSD, po.auditedBy || '-', po.hasMissingAuditFields ? po.integrityFlags.join('|') : 'OK']);
                } else if (targetModule === 'transfers') {
                    headers = ['Date & Time', 'Transfer No', 'Source Shop', 'Destination Shop', 'Operational Status', 'Sent/Req Qty', 'Received Qty', 'Discrepancies', 'Transfer Value (KHR)'];
                    rows = scopedTransfers.map(tr => [formatDateTime(tr.dateObj), tr.transferNo, tr.fromShopName, tr.toShopName, tr.operationalStatus.toUpperCase(), tr.totalReqQty, tr.totalRecQty, tr.discrepancyCount, tr.totalAmountKHR]);
                } else {
                    headers = ['Shop Name', 'Sales Count', 'Net Sales (KHR)', 'Net Profit (KHR)', 'Cash Tendered (USD)', 'KHQR Count', 'KHQR Received (KHR)', 'KHQR Received (USD)', 'PO Count', 'PO Audited (KHR)', 'PO Audited (USD)', 'Pending/Active Audits', 'Outbound Transfers (KHR)', 'Inbound Transfers (KHR)'];
                    rows = shopComparisonMatrix.map(sh => [sh.shopName, sh.salesCount, sh.netSalesKHR, sh.profitKHR, sh.cashTenderedUSD, sh.khqrCount, sh.khqrKHR, sh.khqrUSD, sh.poCount, sh.poAuditedKHR, sh.poAuditedUSD, sh.pendingAudits, sh.outboundTransferKHR, sh.inboundTransferKHR]);
                }

                const escapeCsvCell = (val) => `"${String(val ?? '').replace(/"/g, '""')}"`;
                const csvContent = [
                    ...metaHeaderLines,
                    headers.map(escapeCsvCell).join(','),
                    ...rows.map(r => r.map(escapeCsvCell).join(','))
                ].join('\r\n');

                const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `POS_BI_${targetModule.toUpperCase()}_${new Date().toISOString().slice(0, 10)}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            // Phase 7: Management Printable PDF / Report Snapshot Generator
            const handlePrintManagementPDF = (targetModule = activeNav) => {
                const scopeNames = selectedShopIds.includes('ALL')
                    ? `All Authorized Shops (${authorizedShops.length})`
                    : authorizedShops.filter(s => activeShopIdSet.has(s.id)).map(s => s.name).join(', ');

                const printWin = window.open('', '_blank', 'width=1100,height=800');
                if (!printWin) return;

                const shopRowsHtml = shopComparisonMatrix.map(sh => `
                    <tr>
                        <td><strong>${sh.shopName}</strong></td>
                        <td style="text-align:center">${sh.salesCount}</td>
                        <td style="text-align:right">${formatKHR(sh.netSalesKHR)}</td>
                        <td style="text-align:right">${formatKHR(sh.profitKHR)}</td>
                        <td style="text-align:right">${formatUSD(sh.cashTenderedUSD)}</td>
                        <td style="text-align:right">${formatKHR(sh.khqrKHR)}</td>
                        <td style="text-align:right">${formatUSD(sh.khqrUSD)}</td>
                        <td style="text-align:right">${formatKHR(sh.poAuditedKHR)}</td>
                        <td style="text-align:right">${formatUSD(sh.poAuditedUSD)}</td>
                    </tr>
                `).join('');

                printWin.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>POS BI Management Report — ${targetModule.toUpperCase()}</title>
                        <style>
                            body { font-family: 'Inter', Arial, sans-serif; color: #0f172a; padding: 24px; font-size: 12px; }
                            h1 { font-size: 18px; margin: 0 0 4px 0; }
                            .meta { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; margin: 12px 0 18px 0; line-height: 1.6; }
                            .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
                            .kpi { border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; }
                            .kpi-title { font-size: 10px; text-transform: uppercase; color: #475569; font-weight: bold; }
                            .kpi-val { font-size: 15px; font-weight: bold; margin-top: 4px; }
                            table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11px; }
                            th, td { border: 1px solid #cbd5e1; padding: 6px 8px; }
                            th { background: #f1f5f9; text-transform: uppercase; font-size: 10px; }
                        </style>
                    </head>
                    <body>
                        <h1>POS Business Intelligence Dashboard — Official Read-Only Management Report</h1>
                        <div class="meta">
                            <div><strong>Report Module:</strong> ${targetModule.toUpperCase()} &nbsp;|&nbsp; <strong>Generated:</strong> ${formatDateTime(new Date())}</div>
                            <div><strong>Signed-In User:</strong> ${userProfile.name || userProfile.email} (${userProfile.role}) &nbsp;|&nbsp; <strong>Authorized Shop Scope:</strong> ${scopeNames}</div>
                            <div><strong>Date Range:</strong> ${formatDateTime(dateBounds.start)} to ${formatDateTime(dateBounds.end)} (${comparablePrevBounds.daysCount} Day Window)</div>
                            <div><strong>Currency &amp; Calculation Rules:</strong> Currency Mode = ${currencyMode}. USD and KHR are strictly separated and never combined. Void sales (${voidedSalesInScope.length}) are excluded from standard sales totals. KHQR payments are de-duplicated across aba_payments and sales.</div>
                        </div>
                        <div class="kpi-grid">
                            <div class="kpi">
                                <div class="kpi-title">Valid Sales (${metricsSummary.salesCount})</div>
                                <div class="kpi-val">KHR: ${formatKHR(metricsSummary.netSalesKHR)} | Cash USD: ${formatUSD(metricsSummary.cashTenderedUSD)}</div>
                            </div>
                            <div class="kpi">
                                <div class="kpi-title">Reconciled KHQR / ABA (${metricsSummary.khqrCount})</div>
                                <div class="kpi-val">KHR: ${formatKHR(metricsSummary.khqrTotalKHR)} | USD: ${formatUSD(metricsSummary.khqrTotalUSD)}</div>
                            </div>
                            <div class="kpi">
                                <div class="kpi-title">Audited Purchases (${metricsSummary.poCount} POs)</div>
                                <div class="kpi-val">KHR: ${formatKHR(metricsSummary.poAuditedKHR)} | USD: ${formatUSD(metricsSummary.poAuditedUSD)}</div>
                            </div>
                        </div>
                        <h3>Consolidated Shop Comparison (Currency-Separated)</h3>
                        <table>
                            <thead>
                                <tr>
                                    <th style="text-align:left">Shop Name</th>
                                    <th>Sales</th>
                                    <th style="text-align:right">Net Sales (KHR)</th>
                                    <th style="text-align:right">Profit (KHR)</th>
                                    <th style="text-align:right">Cash USD</th>
                                    <th style="text-align:right">KHQR (KHR)</th>
                                    <th style="text-align:right">KHQR (USD)</th>
                                    <th style="text-align:right">Audited PO (KHR)</th>
                                    <th style="text-align:right">Audited PO (USD)</th>
                                </tr>
                            </thead>
                            <tbody>${shopRowsHtml}</tbody>
                        </table>
                    </body>
                    </html>
                `);
                printWin.document.close();
                printWin.focus();
                setTimeout(() => {
                    printWin.print();
                }, 350);
            };

            return (
                <div className="min-h-screen flex bg-[#090d16] text-slate-100">
                    {/* Left Navigation Sidebar */}
                    <aside className={`fixed inset-y-0 left-0 z-40 w-64 bg-slate-900/95 border-r border-slate-800 flex flex-col transition-transform duration-300 lg:static lg:translate-x-0 ${sidebarOpen ? 'translate-x-0 shadow-2xl' : '-translate-x-full'}`}>
                        <div className="p-4 border-b border-slate-800 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-sky-500 to-blue-600 flex items-center justify-center text-white font-black text-sm shadow">
                                    BI
                                </div>
                                <div>
                                    <h1 className="text-sm font-black text-white leading-tight">POS Intelligence</h1>
                                    <span className="text-[10px] font-bold text-emerald-400 uppercase tracking-wider flex items-center gap-1">
                                        <i className="fas fa-shield-halved text-[9px]"></i> Read-Only Mode
                                    </span>
                                </div>
                            </div>
                            <button onClick={() => setSidebarOpen(false)} className="lg:hidden text-slate-400 hover:text-white">
                                <i className="fas fa-times"></i>
                            </button>
                        </div>

                        <nav className="flex-1 overflow-y-auto p-3 space-y-1">
                            {NAV_ITEMS.map(item => {
                                const isActive = activeNav === item.id;
                                return (
                                    <button
                                        key={item.id}
                                        type="button"
                                        onClick={() => { setActiveNav(item.id); setSidebarOpen(false); }}
                                        className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${
                                            isActive
                                                ? 'bg-gradient-to-r from-sky-600 to-blue-600 text-white shadow-lg shadow-blue-950/50'
                                                : 'text-slate-400 hover:text-slate-100 hover:bg-slate-800/70'
                                        }`}
                                    >
                                        <i className={`fas ${item.icon} w-4 text-center ${isActive ? 'text-white' : 'text-sky-400'}`}></i>
                                        <span className="truncate">{item.label}</span>
                                    </button>
                                );
                            })}
                        </nav>

                        <div className="p-3.5 border-t border-slate-800 bg-slate-950/60 space-y-2">
                            <div className="flex items-center justify-between text-xs">
                                <span className="font-bold text-slate-200 truncate">{userProfile.name || userProfile.email}</span>
                                <span className="px-2 py-0.5 rounded bg-sky-500/15 text-sky-300 border border-sky-500/30 text-[10px] font-black uppercase">
                                    {userProfile.role}
                                </span>
                            </div>
                            <div className="text-[10px] text-slate-400">
                                Authorized Scope: <strong className="text-slate-200">{authorizedShops.length} Shop(s)</strong>
                            </div>
                            <button
                                type="button"
                                onClick={onSignOut}
                                className="w-full py-2 rounded-xl bg-rose-500/15 hover:bg-rose-600 text-rose-300 hover:text-white border border-rose-500/30 text-xs font-bold transition flex items-center justify-center gap-1.5"
                            >
                                <i className="fas fa-sign-out-alt"></i> Sign Out
                            </button>
                        </div>
                    </aside>

                    {sidebarOpen && (
                        <div onClick={() => setSidebarOpen(false)} className="fixed inset-0 bg-black/60 z-30 lg:hidden"></div>
                    )}

                    {/* Main Content Area */}

                                            <tr>
                                                <th className="px-3 py-2 text-left">Item</th>
                                                <th className="px-3 py-2 text-center">Qty</th>
                                                {drilldownModal.type === 'PO' && (
                                                    <>
                                                        <th className="px-3 py-2 text-right">Orig Cost (KHR)</th>
                                                        <th className="px-3 py-2 text-right">Audited (KHR)</th>
                                                        <th className="px-3 py-2 text-right">Audited (USD)</th>
                                                        <th className="px-3 py-2 text-right">CheckUp / Note</th>
                                                    </>
                                                )}
                                                {drilldownModal.type === 'TRANSFER' && (
                                                    <>
                                                        <th className="px-3 py-2 text-center">Qty Diff</th>
                                                        <th className="px-3 py-2 text-right">Unit Cost (KHR)</th>
                                                        <th className="px-3 py-2 text-right">Line Value (KHR)</th>
                                                    </>
                                                )}
                                                {drilldownModal.type === 'SALE' && (
                                                    <th className="px-3 py-2 text-right">Amount (KHR)</th>
                                                )}
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-800/60">
                                            {(drilldownModal.data.items || []).map((it, idx) => (
                                                <tr key={idx}>
                                                    <td className="px-3 py-2 font-semibold text-white">{it.name} <span className="text-slate-500 font-mono">({it.code || '-'})</span></td>
                                                    <td className="px-3 py-2 text-center font-mono">
                                                        {drilldownModal.type === 'PO'
                                                            ? `Req: ${it.quantity || 0} / Aud: ${it.auditedQty ?? '-'}`
                                                            : drilldownModal.type === 'TRANSFER'
                                                                ? `Req: ${it.requestedQty ?? it.quantity} / Rec: ${it.receivedQty ?? it.quantity}`
                                                                : it.quantity}
                                                    </td>
                                                    {drilldownModal.type === 'PO' ? (
                                                        <>
                                                            <td className="px-3 py-2 text-right font-mono text-slate-300">{formatKHR(it.cost || 0)}</td>
                                                            <td className="px-3 py-2 text-right font-mono font-bold text-emerald-400">{it.auditedTotalKHR ? formatKHR(it.auditedTotalKHR) : '—'}</td>
                                                            <td className="px-3 py-2 text-right font-mono font-bold text-sky-400">{it.auditedTotalUSD ? formatUSD(it.auditedTotalUSD) : '—'}</td>
                                                            <td className="px-3 py-2 text-right font-mono text-[11px]">
                                                                {it.checkUp !== undefined && it.checkUp !== null ? (
                                                                    <span className={Number(it.checkUp) < 0 ? 'text-rose-400' : 'text-emerald-400'}>{it.checkUp}</span>
                                                                ) : '—'}
                                                                {(it.auditNote || it.note) && (
                                                                    <div className="text-[10px] text-amber-300 italic">{it.auditNote || it.note}</div>
                                                                )}
                                                            </td>
                                                        </>
                                                    ) : drilldownModal.type === 'TRANSFER' ? (
                                                        <>
                                                            <td className="px-3 py-2 text-center font-mono">
                                                                {(() => {
                                                                    const reqQ = Number(it.requestedQty ?? it.quantity) || 0;
                                                                    const recQ = Number(it.receivedQty ?? it.quantity) || 0;
                                                                    const diff = recQ - reqQ;
                                                                    if (diff === 0) return <span className="text-emerald-400">0</span>;
                                                                    return <span className="text-rose-400 font-bold">{diff > 0 ? `+${diff}` : diff}</span>;
                                                                })()}
                                                            </td>
                                                            <td className="px-3 py-2 text-right font-mono text-slate-300">{formatKHR(it.cost || 0)}</td>
                                                            <td className="px-3 py-2 text-right font-mono font-bold text-emerald-400">
                                                                {formatKHR((Number(it.cost) || 0) * (Number(it.receivedQty ?? it.quantity) || 0))}
                                                            </td>
                                                        </>
                                                    ) : (
                                                        <td className="px-3 py-2 text-right font-mono text-emerald-400">
                                                            {formatKHR((it.price ?? it.cost ?? 0) * (it.quantity || 1))}
                                                        </td>
                                                    )}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ============================================================================
        // ROOT APPLICATION CONTROLLER (Role & Shop Scope Resolver)
        // ============================================================================
        const RootBIApp = () => {
            const [authState, setAuthState] = useState({ loading: true, profile: null, deniedReason: '' });

            useEffect(() => {
                const unsub = auth.onAuthStateChanged(async (user) => {
                    if (!user) {
                        setAuthState({ loading: false, profile: null, deniedReason: '' });
                        return;
                    }
                    try {
                        const data = await ReadOnlyPOSRepository.fetchUserProfile(user);
                        if (data) {
                            const role = data.role || 'Staff';
                            // Master Plan Section 2 & Phase 2: Enforce RoleScopeGuard
                            if (!RoleScopeGuard.isRolePermitted(role)) {
                                setAuthState({
                                    loading: false,
                                    profile: null,
                                    deniedReason: `Access Denied: Your role (${role}) is not authorized to view the Management BI Dashboard.`
                                });
                                return;
                            }
                            setAuthState({ loading: false, profile: data, deniedReason: '' });
                        } else {
                            // Default Admin fallback if signed-in owner is not yet in users collection
                            setAuthState({
                                loading: false,
                                profile: {
                                    uid: user.uid,
                                    name: user.displayName || (user.email ? user.email.split('@')[0] : 'Admin'),
                                    email: user.email || '',
                                    role: 'Admin',
                                    assignedShops: []
                                },
                                deniedReason: ''
                            });
                        }
                    } catch (err) {
                        setAuthState({
                            loading: false,
                            profile: {
                                uid: user.uid,
                                name: user.email || 'Manager',
                                email: user.email || '',
                                role: 'Admin',
                                assignedShops: []
                            },
                            deniedReason: ''
                        });
                    }
                });
                return () => unsub();
            }, []);

            if (authState.loading) {
                return (
                    <div className="min-h-screen bg-[#090d16] flex items-center justify-center text-slate-300 text-sm font-bold">
                        <i className="fas fa-circle-notch fa-spin text-sky-400 mr-2"></i> Verifying BI Authorization...
                    </div>
                );
            }

            if (authState.deniedReason) {
                return (
                    <div className="min-h-screen bg-[#090d16] flex items-center justify-center p-4">
                        <div className="bg-slate-900 border border-rose-500/40 rounded-3xl p-8 max-w-md text-center space-y-4">
                            <i className="fas fa-ban text-4xl text-rose-500"></i>
                            <h2 className="text-lg font-black text-white">Unauthorized Role</h2>
                            <p className="text-xs text-slate-300">{authState.deniedReason}</p>
                            <button
                                onClick={() => auth.signOut()}
                                className="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold"
                            >
                                Sign Out
                            </button>
                        </div>
                    </div>
                );
            }

            if (!authState.profile) {
                return <LoginScreen />;
            }

            return (
                <BIDashboardWorkspace
                    userProfile={authState.profile}
                    onSignOut={() => auth.signOut()}
                />
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RootBIApp />);
    </script>
</body>
</html>
