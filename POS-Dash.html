<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POS Business Intelligence Dashboard</title>
    <meta name="theme-color" content="#090d16">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="POS BI Dashboard">

    <!-- Preconnect Hints -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Khmer:wght@400;700&display=swap" rel="stylesheet">

    <!-- React 18 & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

    <!-- Firebase v9 Compat SDK (Read-Only Consumer) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <!-- Export Libraries (SheetJS XLSX) -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: 'Inter', 'Noto Sans Khmer', system-ui, -apple-system, sans-serif;
            background-color: #090d16;
            color: #f1f5f9;
            overflow-x: hidden;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes pulse-bar {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }
        .boot-shimmer {
            animation: pulse-bar 1.4s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div id="root">
        <!-- 0ms Instant Boot Splash -->
        <div style="min-height: 100dvh; background: radial-gradient(circle at 50% 20%, #1e293b 0%, #090d16 75%); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; color: #f8fafc;">
            <div style="width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, #0284c7 0%, #2563eb 55%, #0f172a 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 20px 45px rgba(37, 99, 235, 0.35); border: 1px solid rgba(56, 189, 248, 0.4); margin-bottom: 1.25rem;">
                <span style="font-size: 20px; font-weight: 900; letter-spacing: 0.05em; color: #fff; line-height: 1;">BI</span>
                <span style="margin-top: 4px; padding: 2px 7px; border-radius: 999px; background: #10b981; color: #052e16; font-size: 7.5px; font-weight: 900; letter-spacing: 0.08em;">READ-ONLY</span>
            </div>
            <h1 style="font-size: 1.35rem; font-weight: 800; margin: 0 0 0.35rem 0;">POS Business Intelligence</h1>
            <p style="font-size: 0.8rem; color: #94a3b8; margin: 0 0 1.25rem 0;">Initializing strictly read-only analytics engine...</p>
            <div style="width: 200px; height: 4px; background: rgba(51, 65, 85, 0.7); border-radius: 999px; overflow: hidden;">
                <div class="boot-shimmer" style="width: 55%; height: 100%; background: linear-gradient(90deg, #38bdf8, #10b981); border-radius: 999px;"></div>
            </div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        // ============================================================================
        // PHASE 1 & 2: ENVIRONMENT CONFIG & STRICTLY READ-ONLY REPOSITORY LAYER
        // Connected to the existing POS Firebase project (pos-inv-141126).
        // Supports external environment injection via window.__POS_BI_ENV__ or
        // localStorage ('pos_bi_firebase_env_v1') without hardcoding secrets in logic.
        // HARD NON-NEGOTIABLE GUARD: All write/update/delete methods on Firestore are
        // omitted and actively blocked at the repository boundary.
        // ============================================================================
        const resolveFirebaseEnvConfig = () => {
            try {
                if (window.__POS_BI_ENV__ && window.__POS_BI_ENV__.projectId) {
                    return window.__POS_BI_ENV__;
                }
                const storedEnv = localStorage.getItem('pos_bi_firebase_env_v1');
                if (storedEnv) {
                    const parsed = JSON.parse(storedEnv);
                    if (parsed && parsed.projectId && parsed.apiKey) return parsed;
                }
            } catch (e) {}
            return {
                apiKey: "AIzaSyByG5K8qZnNNvEOes5mSOHfM6WqhuoZQM4",
                authDomain: "pos-inv-141126.firebaseapp.com",
                projectId: "pos-inv-141126",
                storageBucket: "pos-inv-141126.firebasestorage.app",
                messagingSenderId: "255649906447",
                appId: "1:255649906447:web:4994fab6b2639ed1ce087a",
                measurementId: "G-L6JEP3RLQW"
            };
        };

        const firebaseConfig = resolveFirebaseEnvConfig();

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const rawDb = firebase.firestore();

        try {
            if (typeof firebase.firestore.setLogLevel === 'function') {
                firebase.firestore.setLogLevel('silent');
            }
        } catch (e) {}

        // ============================================================================
        // PHASE 2 DELIVERABLE: ROLE & SHOP-SCOPE AUTHORIZATION GUARD
        // Enforces role access (Admin, Management, Shop Manager) and blocks any
        // unauthorized shop IDs or restricted routes at the data & routing boundary.
        // ============================================================================
        const ALLOWED_BI_ROLES = Object.freeze(['Admin', 'Management', 'Shop Manager']);

        const ROUTE_PERMISSIONS = Object.freeze({
            'executive': ['Admin', 'Management', 'Shop Manager'],
            'sales': ['Admin', 'Management', 'Shop Manager'],
            'khqr': ['Admin', 'Management', 'Shop Manager'],
            'purchases': ['Admin', 'Management', 'Shop Manager'],
            'audits': ['Admin', 'Management', 'Shop Manager'],
            'transfers': ['Admin', 'Management', 'Shop Manager'],
            'internal-payments': ['Admin', 'Management', 'Shop Manager'],
            'comparison': ['Admin', 'Management', 'Shop Manager'],
            'exports': ['Admin', 'Management', 'Shop Manager'],
            'settings': ['Admin', 'Management', 'Shop Manager']
        });

        const RoleScopeGuard = Object.freeze({
            isRolePermitted(role) {
                return ALLOWED_BI_ROLES.includes(String(role || '').trim());
            },
            canAccessRoute(role, routeId) {
                if (!this.isRolePermitted(role)) return false;
                const allowed = ROUTE_PERMISSIONS[routeId];
                return Array.isArray(allowed) ? allowed.includes(role) : false;
            },
            resolveAuthorizedShops(userProfile, allShops = []) {
                if (!userProfile || !this.isRolePermitted(userProfile.role)) return [];
                if (userProfile.role === 'Admin' || userProfile.role === 'Management') {
                    return allShops;
                }
                // Shop Manager is strictly constrained to assignedShops
                const assigned = Array.isArray(userProfile.assignedShops) ? userProfile.assignedShops : [];
                return allShops.filter(s => assigned.includes(s.id));
            },
            enforceShopScope(requestedShopIds = [], authorizedShopIdSet = new Set()) {
                if (!authorizedShopIdSet || authorizedShopIdSet.size === 0) return new Set();
                if (!Array.isArray(requestedShopIds) || requestedShopIds.includes('ALL') || requestedShopIds.length === 0) {
                    return new Set(authorizedShopIdSet);
                }
                // Block any shop ID not present in authorizedShopIdSet
                const verifiedIds = requestedShopIds.filter(id => authorizedShopIdSet.has(id));
                return new Set(verifiedIds);
            }
        });

        // ============================================================================
        // PHASE 2 DELIVERABLE: STRICTLY READ-ONLY FIRESTORE REPOSITORY LAYER
        // Exposes ONLY read methods. Any attempt to call write/update/delete throws
        // an immediate security violation error.
        // ============================================================================
        const ReadOnlyPOSRepository = Object.freeze({
            isReadOnly: true,
            blockedWriteMethods: Object.freeze(['add', 'set', 'update', 'delete', 'batch', 'runTransaction']),

            assertNoMutation(operationName = 'write') {
                throw new Error(`SECURITY_VIOLATION: Operation "${operationName}" is strictly prohibited in the Read-Only POS BI Dashboard.`);
            },

            async fetchUserProfile(firebaseUser) {
                if (!firebaseUser) return null;
                let snap = await rawDb.collection('users').where('uid', '==', firebaseUser.uid).get();
                if (snap.empty && firebaseUser.email) {
                    snap = await rawDb.collection('users').where('email', '==', firebaseUser.email).get();
                }
                if (!snap.empty) {
                    return { id: snap.docs[0].id, ...snap.docs[0].data() };
                }
                return null;
            },

            async fetchShops() {
                const snap = await rawDb.collection('shops').get();
                return snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            },

            async fetchSalesByDateRange(startDate, endDate) {
                const snap = await rawDb.collection('sales')
                    .where('timestamp', '>=', startDate)
                    .where('timestamp', '<=', endDate)
                    .get();
                return snap.docs.map(doc => DataNormalizer.normalizeSale(doc));
            },

            async fetchAbaPaymentsByDateRange(startMs, endMs) {
                const snap = await rawDb.collection('aba_payments')
                    .where('receivedAt', '>=', startMs)
                    .where('receivedAt', '<=', endMs)
                    .get();
                return snap.docs.map(doc => DataNormalizer.normalizeAbaPayment(doc));
            },

            async fetchPurchaseOrders() {
                const snap = await rawDb.collection('purchaseOrders').get();
                return snap.docs.map(doc => DataNormalizer.normalizePO(doc));
            },

            async fetchInternalTransfers() {
                const snap = await rawDb.collection('internalTransfers').get();
                return snap.docs.map(doc => DataNormalizer.normalizeTransfer(doc));
            }
        });

        // ============================================================================
        // PHASE 3 DELIVERABLE: CURRENCY-SAFE AGGREGATION & QUERY BUILDER ENGINE
        // Never sums or converts KHR and USD into a single combined financial total.
        // ============================================================================
        const CurrencySafeAggregator = Object.freeze({
            createDualBucket() {
                return { khr: 0, usd: 0, count: 0 };
            },
            addKHR(bucket, amount) {
                const val = Number(amount) || 0;
                return { ...bucket, khr: bucket.khr + val, count: bucket.count + 1 };
            },
            addUSD(bucket, amount) {
                const val = Number(amount) || 0;
                return { ...bucket, usd: Number((bucket.usd + val).toFixed(2)), count: bucket.count + 1 };
            },
            addRecordByCurrency(bucket, currency, amount) {
                const cur = String(currency || 'KHR').toUpperCase();
                if (cur === 'USD') return this.addUSD(bucket, amount);
                if (cur === 'KHR') return this.addKHR(bucket, amount);
                throw new Error(`CURRENCY_VIOLATION: Unsupported currency "${cur}".`);
            },
            assertNeverCombined() {
                return true;
            }
        });

        // Standardized Date & Time Formatter: DD-MM-YY | HH:MM:SS AM/PM
        const safeToDate = (ts) => {
            if (!ts) return null;
            if (ts instanceof Date) return isNaN(ts.getTime()) ? null : ts;
            if (typeof ts.toDate === 'function') return ts.toDate();
            if (typeof ts === 'number') {
                const d = new Date(ts);
                return isNaN(d.getTime()) ? null : d;
            }
            if (typeof ts === 'string') {
                const d = new Date(ts);
                return isNaN(d.getTime()) ? null : d;
            }
            if (typeof ts.seconds === 'number') return new Date(ts.seconds * 1000);
            if (typeof ts._seconds === 'number') return new Date(ts._seconds * 1000);
            return null;
        };

        const formatDateTime = (ts, fallback = '-') => {
            const d = safeToDate(ts);
            if (!d) return fallback;
            const pad = (n) => String(n).padStart(2, '0');
            const day = pad(d.getDate());
            const month = pad(d.getMonth() + 1);
            const year = String(d.getFullYear()).slice(-2);
            let hours = d.getHours();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            const mins = pad(d.getMinutes());
            const secs = pad(d.getSeconds());
            return `${day}-${month}-${year} | ${pad(hours)}:${mins}:${secs} ${ampm}`;
        };

        const khrFmt = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
        const usdFmt = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        const formatKHR = (val) => `៛${khrFmt.format(Math.round(Number(val) || 0))}`;
        const formatUSD = (val) => `$${usdFmt.format(Number(val) || 0)}`;

        // Mask sensitive account or customer phone numbers
        const maskAccount = (str) => {
            if (!str) return '*ABA';
            const clean = String(str).trim();
            if (clean.startsWith('*')) return clean;
            if (clean.length <= 4) return `*${clean}`;
            return `***${clean.slice(-4)}`;
        };

        // ============================================================================
        // PHASE 1 VERIFIED DATA DICTIONARY & NORMALIZATION LAYER
        // Converts raw POS documents into stable, currency-separated reporting models
        // ============================================================================
        const DataNormalizer = {
            normalizeSale(doc) {
                const d = doc.data ? { id: doc.id, ...doc.data() } : doc;
                const dateObj = safeToDate(d.timestamp || d.createdAt);
                const status = String(d.status || 'paid').toLowerCase() === 'void' ? 'void' : 'paid';
                const rawMethod = String(d.paymentMethod || 'Cash').trim();
                const isKhqr = /khqr|aba|bank/i.test(rawMethod) || !!d.abaVerified || !!d.abaApv || !!d.abaTrxId;

                const discountKHR = Number(d.discount) || (Number(d.manualDiscount || 0) + Number(d.redemptionAmount || 0));
                const grandTotalKHR = Number(d.grandTotal) || 0;
                const subtotalKHR = Number(d.subtotal) || (grandTotalKHR + discountKHR);
                const totalCostKHR = Number(d.totalCost) || 0;
                const netProfitKHR = grandTotalKHR - totalCostKHR;

                // Cash tendered breakdown (separate USD & KHR tendered on Cash sales)
                const tenderedUSD = Number(d.tenderedUSD) || 0;
                const tenderedKHR = Number(d.tenderedKHR) || 0;

                // KHQR currency & paid amount from ABA PayWay verification
                const abaCurrency = String(d.abaCurrency || 'KHR').toUpperCase() === 'USD' ? 'USD' : 'KHR';
                let abaPaidUSD = 0;
                let abaPaidKHR = 0;
                if (isKhqr) {
                    if (abaCurrency === 'USD' && d.abaPaidAmountStr) {
                        const parsedUsd = parseFloat(String(d.abaPaidAmountStr).replace(/[^0-9.]/g, '')) || 0;
                        abaPaidUSD = parsedUsd;
                    } else {
                        abaPaidKHR = grandTotalKHR;
                    }
                }

                return {
                    id: d.id,
                    receiptNo: d.receiptNo || d.id,
                    shopId: d.shopId || '',
                    shopName: d.shopName || 'Unknown Shop',
                    cashierId: d.cashierId || '',
                    cashierName: d.cashierName || 'Staff',
                    deviceName: d.deviceName || 'POS Terminal',
                    customerName: d.customerName || 'Walk-in',
                    dateObj,
                    dateMs: dateObj ? dateObj.getTime() : 0,
                    status, // 'paid' | 'void'
                    voidReason: d.voidReason || '',
                    paymentMethod: isKhqr ? 'KHQR / Bank' : 'Cash',
                    rawPaymentMethod: rawMethod,
                    isKhqr,
                    // Authoritative KHR Sale Figures (POS catalog & receipts are denominated in KHR)
                    subtotalKHR,
                    discountKHR,
                    grandTotalKHR,
                    totalCostKHR,
                    netProfitKHR,
                    // Separate physical tendered / verified currency records (Never auto-combined)
                    tenderedUSD,
                    tenderedKHR,
                    abaVerified: !!(d.abaVerified || d.abaApv || d.abaTrxId),
                    abaTrxId: String(d.abaTrxId || '').trim(),
                    abaApv: String(d.abaApv || '').trim(),
                    abaPayer: d.abaPayer || '',
                    abaPaymentChannel: d.abaPaymentChannel || (isKhqr ? 'ABA PAY' : ''),
                    abaSourceBank: d.abaSourceBank || (isKhqr ? 'ABA Bank' : ''),
                    abaCurrency,
                    abaPaidUSD,
                    abaPaidKHR,
                    items: Array.isArray(d.items) ? d.items : []
                };
            },

            normalizeAbaPayment(doc) {
                const d = doc.data ? { id: doc.id, ...doc.data() } : doc;
                const trxId = String(d.trxId || d.id || '').trim();
                const dateObj = safeToDate(d.receivedAt || d.paidTimestamp || d.date);
                const currency = String(d.currency || 'KHR').toUpperCase() === 'USD' ? 'USD' : 'KHR';
                const amount = Number(d.amount) || 0;
                const channel = String(d.paymentChannel || 'ABA PAY').trim();
                const isOutdoor = d.paymentCategory === 'OUTDOOR_KHQR' || /ABA\s*KHQR/i.test(channel);

                return {
                    id: trxId || d.id,
                    trxId,
                    apv: String(d.apv || '').trim(),
                    currency,
                    amountKHR: currency === 'KHR' ? amount : 0,
                    amountUSD: currency === 'USD' ? amount : 0,
                    payerName: d.payerName || 'ABA Customer',
                    maskedAccount: maskAccount(d.maskedAccount || '*ABA'),
                    paymentChannel: channel,
                    paymentCategory: isOutdoor ? 'OUTDOOR_KHQR' : 'INDOOR_ABA',
                    sourceBank: d.sourceBank || (isOutdoor ? 'External Bank (KHQR)' : 'ABA Bank'),
                    merchantName: d.merchantName || '',
                    chatId: String(d.chatId || '').trim(),
                    dateObj,
                    dateMs: dateObj ? dateObj.getTime() : 0,
                    claimedByOrderId: d.claimedByOrderId || null,
                    claimedByInvoiceNo: d.claimedByInvoiceNo || null
                };
            },

            normalizePO(doc) {
                const d = doc.data ? { id: doc.id, ...doc.data() } : doc;
                // Verified PO statuses from POS_App.html: 'draft' | 'submitted' | 'auditing' | 'audited'
                const rawStatus = String(d.status || 'draft').toLowerCase();
                const reqDateObj = safeToDate(d.requestDate || d.createdAt);
                const auditedDateObj = safeToDate(d.auditedAt || d.updatedAt);
                const items = Array.isArray(d.items) ? d.items : [];

                // Requested amount in KHR (item.cost * item.quantity)
                const requestedAmountKHR = Number(d.totalAmount) || items.reduce((s, i) => s + ((Number(i.cost) || 0) * (Number(i.quantity) || 0)), 0);

                // Audited amounts separated strictly by currency (auditedTotalKHR vs auditedTotalUSD)
                let auditedAmountKHR = 0;
                let auditedAmountUSD = 0;
                let totalRequestedQty = 0;
                let totalAuditedQty = 0;
                let hasMissingAuditFields = false;

                items.forEach(item => {
                    const reqQ = Number(item.quantity) || 0;
                    const audQ = item.auditedQty !== undefined && item.auditedQty !== null ? Number(item.auditedQty) : 0;
                    totalRequestedQty += reqQ;
                    totalAuditedQty += audQ;

                    const khrVal = parseFloat(item.auditedTotalKHR);
                    const usdVal = parseFloat(item.auditedTotalUSD);
                    if (!isNaN(khrVal) && khrVal > 0) auditedAmountKHR += khrVal;
                    if (!isNaN(usdVal) && usdVal > 0) auditedAmountUSD += usdVal;

                    if (rawStatus === 'audited' && audQ > 0 && (isNaN(khrVal) || khrVal <= 0) && (isNaN(usdVal) || usdVal <= 0)) {
                        hasMissingAuditFields = true;
                    }
                });

                const integrityFlags = [];
                if (hasMissingAuditFields) integrityFlags.push('MISSING_ITEM_AUDIT_TOTAL');
                if (rawStatus === 'audited' && !String(d.auditedBy || '').trim()) integrityFlags.push('MISSING_AUDITOR_NAME');
                if (rawStatus === 'audited' && !auditedDateObj) integrityFlags.push('MISSING_AUDITED_TIMESTAMP');
                if ((rawStatus === 'auditing' || rawStatus === 'audited') && items.length === 0) integrityFlags.push('EMPTY_PO_ITEMS');

                // Map verified PO status to Audit Management Queue:
                // 'submitted' -> 'PENDING_AUDIT'
                // 'auditing'  -> 'ACTIVE_AUDIT'
                // 'audited'   -> 'COMPLETED_AUDIT'
                // 'draft'     -> 'DRAFT_NOT_SUBMITTED'
                let auditQueueStatus = 'DRAFT';
                if (rawStatus === 'submitted') auditQueueStatus = 'PENDING';
                else if (rawStatus === 'auditing') auditQueueStatus = 'ACTIVE';
                else if (rawStatus === 'audited') auditQueueStatus = 'COMPLETED';

                const ageHours = reqDateObj ? Math.max(0, Math.round((Date.now() - reqDateObj.getTime()) / (1000 * 60 * 60))) : 0;

                return {
                    id: d.id,
                    poNumber: d.poNumber || d.id,
                    shopId: d.shopId || '',
                    shopName: d.shopName || 'Unknown Shop',
                    vendorId: d.vendorId || '',
                    vendorName: d.vendorName || 'Unknown Vendor',
                    status: rawStatus, // 'draft' | 'submitted' | 'auditing' | 'audited'
                    auditQueueStatus,  // 'DRAFT' | 'PENDING' | 'ACTIVE' | 'COMPLETED'
                    reqDateObj,
                    auditedDateObj,
                    primaryDateObj: rawStatus === 'audited' ? (auditedDateObj || reqDateObj) : reqDateObj,
                    createdByName: d.createdByName || 'Staff',
                    auditedBy: d.auditedBy || '',
                    exchangeRateNote: d.exchangeRate || null,
                    requestedAmountKHR,
                    auditedAmountKHR,
                    auditedAmountUSD,
                    totalRequestedQty,
                    totalAuditedQty,
                    hasMissingAuditFields: integrityFlags.length > 0,
                    integrityFlags,
                    ageHours,
                    items
                };
            },

            normalizeTransfer(doc) {
                const d = doc.data ? { id: doc.id, ...doc.data() } : doc;
                // Verified operational statuses from POS_App.html: 'draft' | 'active' | 'done'
                const status = String(d.status || 'draft').toLowerCase();
                const dateObj = safeToDate(d.transferDate || d.createdAt);
                const completedDateObj = safeToDate(d.completedAt || d.updatedAt);
                const items = Array.isArray(d.items) ? d.items : [];

                let totalReqQty = 0;
                let totalRecQty = 0;
                let discrepancyCount = 0;

                items.forEach(item => {
                    const reqQ = Number(item.requestedQty ?? item.quantity) || 0;
                    const recQ = Number(item.receivedQty ?? item.quantity) || 0;
                    totalReqQty += reqQ;
                    totalRecQty += recQ;
                    if (status === 'done' && reqQ !== recQ) {
                        discrepancyCount += 1;
                    }
                });

                const totalAmountKHR = Number(d.totalAmount) || items.reduce((s, i) => s + ((Number(i.cost) || 0) * (Number(i.receivedQty ?? i.quantity) || 0)), 0);

                return {
                    id: d.id,
                    transferNo: d.transferNo || d.id,
                    fromShopId: d.fromShopId || '',
                    fromShopName: d.fromShopName || 'Unknown Source',
                    toShopId: d.toShopId || '',
                    toShopName: d.toShopName || 'Unknown Destination',
                    operationalStatus: status, // 'draft' | 'active' | 'done' (Never conflated with PO audit status)
                    dateObj,
                    completedDateObj,
                    createdBy: d.createdBy || 'Staff',
                    totalAmountKHR,
                    totalReqQty,
                    totalRecQty,
                    discrepancyCount,
                    items
                };
            }
        };

        // ============================================================================
        // PHASE 3: DATE PRESET BOUNDARY ENGINE
        // ============================================================================
        const computeDateBounds = (preset, customStartStr, customEndStr) => {
            const now = new Date();
            let start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
            let end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);

            switch (preset) {
                case 'today':
                    break;
                case 'yesterday':
                    start.setDate(start.getDate() - 1);
                    end.setDate(end.getDate() - 1);
                    break;
                case 'last7days':
                    start.setDate(start.getDate() - 6);
                    break;
                case 'last30days':
                    start.setDate(start.getDate() - 29);
                    break;
                case 'thisWeek': {
                    const day = now.getDay();
                    const diff = now.getDate() - day + (day === 0 ? -6 : 1);
                    start = new Date(now.getFullYear(), now.getMonth(), diff, 0, 0, 0, 0);
                    break;
                }
                case 'lastWeek': {
                    const day = now.getDay();
                    const diff = now.getDate() - day + (day === 0 ? -6 : 1) - 7;
                    start = new Date(now.getFullYear(), now.getMonth(), diff, 0, 0, 0, 0);
                    end = new Date(start);
                    end.setDate(start.getDate() + 6);
                    end.setHours(23, 59, 59, 999);
                    break;
                }
                case 'thisMonth':
                    start = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0, 0);
                    break;
                case 'lastMonth':
                    start = new Date(now.getFullYear(), now.getMonth() - 1, 1, 0, 0, 0, 0);
                    end = new Date(now.getFullYear(), now.getMonth(), 0, 23, 59, 59, 999);
                    break;
                case 'custom':
                    if (customStartStr) {
                        const [sy, sm, sd] = customStartStr.split('-').map(Number);
                        start = new Date(sy, sm - 1, sd, 0, 0, 0, 0);
                    }
                    if (customEndStr) {
                        const [ey, em, ed] = customEndStr.split('-').map(Number);
                        end = new Date(ey, em - 1, ed, 23, 59, 59, 999);
                    }
                    break;
                default:
                    break;
            }
            return { start, end };
        };
