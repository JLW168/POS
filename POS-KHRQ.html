    <!-- Dynamic PWA Manifest & Native App Icon Generator -->
    <script>
        window.SolarisPWAManager = {
            deferredPrompt: null,
            isInstalled: false,
            listeners: new Set(),
            subscribe(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
            notify() { this.listeners.forEach(fn => { try { fn(this.getState()); } catch (e) {} }); },
            getState() {
                const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone || document.referrer.includes('android-app://');
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent || '') || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
                return { canInstallPrompt: !!this.deferredPrompt, isInstalled: isStandalone || this.isInstalled, isIOS };
            },
            generateAppIcon(size = 512) {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = size; canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    const grad = ctx.createLinearGradient(0, 0, size, size);
                    grad.addColorStop(0, '#004459'); grad.addColorStop(1, '#020617');
                    ctx.fillStyle = grad; ctx.fillRect(0, 0, size, size);
                    ctx.fillStyle = '#ffffff'; ctx.font = `900 ${Math.round(size * 0.2)}px Arial, sans-serif`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('KHQR', size / 2, size * 0.4);
                    ctx.fillStyle = '#26A9C8'; ctx.font = `900 ${Math.round(size * 0.14)}px Arial, sans-serif`;
                    ctx.fillText('DISPLAY', size / 2, size * 0.65);
                    return canvas.toDataURL('image/png');
                } catch (e) { return ''; }
            },
            enterKioskFullscreen() {
                try {
                    const docEl = document.documentElement;
                    if (document.fullscreenElement || document.webkitFullscreenElement) return true;
                    const req = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen;
                    if (req) { req.call(docEl).catch(() => {}); return true; }
                } catch (e) {}
                return false;
            },
            exitKioskFullscreen() {
                try {
                    if (document.fullscreenElement || document.webkitFullscreenElement) {
                        const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
                        if (exit) exit.call(document).catch(() => {});
                    }
                } catch (e) {}
            },
            init(appName = 'KHQR Display') {
                const icon192 = this.generateAppIcon(192);
                const icon512 = this.generateAppIcon(512);
                if (icon192) {
                    let appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
                    if (!appleIcon) { appleIcon = document.createElement('link'); appleIcon.rel = 'apple-touch-icon'; document.head.appendChild(appleIcon); }
                    appleIcon.href = icon192;
                }
                const manifestObj = {
                    name: appName, short_name: 'KHQR Display', display: 'standalone',
                    background_color: '#020617', theme_color: '#0f172a',
                    icons: [
                        { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
                        { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
                    ]
                };
                try {
                    const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
                    let manifestLink = document.querySelector('link[rel="manifest"]');
                    if (!manifestLink) { manifestLink = document.createElement('link'); manifestLink.rel = 'manifest'; document.head.appendChild(manifestLink); }
                    manifestLink.href = URL.createObjectURL(blob);
                } catch (e) {}
            }
        };
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); window.SolarisPWAManager.deferredPrompt = e; window.SolarisPWAManager.notify(); });
        window.addEventListener('appinstalled', () => { window.SolarisPWAManager.deferredPrompt = null; window.SolarisPWAManager.isInstalled = true; window.SolarisPWAManager.notify(); });
        window.addEventListener('DOMContentLoaded', () => window.SolarisPWAManager.init());
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        // ====================================================================
        // 1. FIREBASE INITIALIZATION (EXACT MATCH WITH POS WORKSPACE pos2027-0101)
        // ====================================================================
        const _k1 = "AIzaSyBamL7vk";
        const _k2 = "9oq4_lxIFgtTH";
        const _k3 = "tLrLMabne3b4A";

        const firebaseConfig = {
            apiKey: _k1 + _k2 + _k3,
            authDomain: "pos2027-0101.firebaseapp.com",
            projectId: "pos2027-0101",
            storageBucket: "pos2027-0101.firebasestorage.app",
            messagingSenderId: "11803390205",
            appId: "1:11803390205:web:40960c7af1ab4574434e94",
            measurementId: "G-8EMQCKQLEJ"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        try {
            if (typeof firebase.firestore.setLogLevel === 'function') {
                firebase.firestore.setLogLevel('silent');
            }
        } catch (e) {}

        // Use auto-detect long polling (avoids latency & stream-write errors in v9.22.2)
        db.settings({
            experimentalAutoDetectLongPolling: true,
            merge: true
        });

        // ====================================================================
        // 2. EMVCo DYNAMIC KHQR & 0ms INSTANT QR RENDERER ENGINE
        // ====================================================================
        const DisplayKHQREngine = {
            _qrCache: new Map(),

            crc16(str) {
                let crc = 0xFFFF;
                for (let i = 0; i < str.length; i++) {
                    crc ^= (str.charCodeAt(i) & 0xFF) << 8;
                    for (let j = 0; j < 8; j++) {
                        if ((crc & 0x8000) !== 0) crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
                        else crc = (crc << 1) & 0xFFFF;
                    }
                }
                return crc.toString(16).toUpperCase().padStart(4, '0');
            },

            parseTLV(payload) {
                const result = [];
                if (!payload || typeof payload !== 'string') return result;
                let idx = 0;
                while (idx + 4 <= payload.length) {
                    const tag = payload.slice(idx, idx + 2);
                    const len = parseInt(payload.slice(idx + 2, idx + 4), 10);
                    if (isNaN(len) || len < 0 || idx + 4 + len > payload.length) break;
                    const value = payload.slice(idx + 4, idx + 4 + len);
                    result.push({ tag, length: len, value });
                    idx += 4 + len;
                }
                return result;
            },

            formatTLV(tag, value) {
                const valStr = String(value ?? '');
                return `${tag}${String(valStr.length).padStart(2, '0')}${valStr}`;
            },

            extractMerchantInfoFromEMV(emvPayload) {
                if (!emvPayload || typeof emvPayload !== 'string' || !emvPayload.startsWith('000201')) {
                    return { merchantName: null, merchantCity: null, mid: null };
                }
                const parsed = this.parseTLV(emvPayload);
                const tag29Or30 = parsed.find(t => t.tag === '30' || t.tag === '29');
                const tag59 = parsed.find(t => t.tag === '59');
                const tag60 = parsed.find(t => t.tag === '60');
                let mid = null;
                if (tag29Or30 && tag29Or30.value) {
                    const subTags = this.parseTLV(tag29Or30.value);
                    const midSub02 = subTags.find(st => st.tag === '02');
                    const midSub01 = subTags.find(st => st.tag === '01');
                    const rawMid = (midSub02 && midSub02.value) ? midSub02.value : (midSub01 ? midSub01.value : null);
                    if (rawMid) {
                        const digits = String(rawMid).replace(/\D/g, '');
                        mid = digits.length >= 9 ? digits : String(rawMid).trim();
                    }
                }
                return {
                    merchantName: tag59?.value ? String(tag59.value).trim() : null,
                    merchantCity: tag60?.value ? String(tag60.value).trim() : null,
                    mid
                };
            },

            generateDynamicKHQR(basePayload, amountValue, invoiceNo = '', currency = 'KHR', customTimestamps = null) {
                if (!basePayload || typeof basePayload !== 'string' || !basePayload.startsWith('000201')) {
                    return null;
                }
                const parsed = this.parseTLV(basePayload);
                if (parsed.length < 4) return null;

                const isUsd = String(currency || 'KHR').toUpperCase() === 'USD';
                const targetCurrencyCode = isUsd ? '840' : '116';
                const rawNum = Number(amountValue) || 0;
                const formattedAmountStr = isUsd
                    ? (rawNum > 0 ? rawNum.toFixed(2) : '')
                    : (Math.round(rawNum) > 0 ? String(Math.round(rawNum)) : '');
                const hasPositiveAmount = rawNum > 0 && formattedAmountStr.length > 0;
                const cleanInvoice = String(invoiceNo || '').replace(/[^a-zA-Z0-9\-_]/g, '').slice(0, 25);

                const nowMs = (customTimestamps && Number(customTimestamps.createdAtMs) > 0)
                    ? Math.floor(Number(customTimestamps.createdAtMs))
                    : Date.now();
                const expMs = (customTimestamps && Number(customTimestamps.expiresAtMs) > nowMs)
                    ? Math.floor(Number(customTimestamps.expiresAtMs))
                    : (nowMs + 15 * 60 * 1000);

                const tag99Value = this.formatTLV('00', String(nowMs)) + this.formatTLV('01', String(expMs));
                const filtered = parsed.filter(t => t.tag !== '63' && t.tag !== '99');

                const resultTags = [];
                let hasTag01 = false, hasTag53 = false, hasTag54 = false, hasTag62 = false;

                filtered.forEach(item => {
                    if (item.tag === '01') {
                        hasTag01 = true;
                        resultTags.push({ tag: '01', value: hasPositiveAmount ? '12' : item.value });
                    } else if (item.tag === '53') {
                        hasTag53 = true;
                        resultTags.push({ tag: '53', value: targetCurrencyCode });
                    } else if (item.tag === '54') {
                        hasTag54 = true;
                        if (hasPositiveAmount) resultTags.push({ tag: '54', value: formattedAmountStr });
                    } else if (item.tag === '62') {
                        hasTag62 = true;
                        if (cleanInvoice) {
                            const subTags = this.parseTLV(item.value).filter(st => st.tag !== '01');
                            subTags.unshift({ tag: '01', value: cleanInvoice });
                            resultTags.push({ tag: '62', value: subTags.map(st => this.formatTLV(st.tag, st.value)).join('') });
                        } else {
                            resultTags.push({ tag: '62', value: item.value });
                        }
                    } else {
                        resultTags.push({ tag: item.tag, value: item.value });
                    }
                });

                if (!hasTag01) resultTags.splice(1, 0, { tag: '01', value: hasPositiveAmount ? '12' : '11' });
                if (!hasTag53) {
                    const idx52 = resultTags.findIndex(t => t.tag === '52');
                    resultTags.splice(idx52 !== -1 ? idx52 + 1 : resultTags.length, 0, { tag: '53', value: targetCurrencyCode });
                }
                if (!hasTag54 && hasPositiveAmount) {
                    const idx53 = resultTags.findIndex(t => t.tag === '53');
                    resultTags.splice(idx53 !== -1 ? idx53 + 1 : resultTags.length, 0, { tag: '54', value: formattedAmountStr });
                }
                if (!hasTag62 && cleanInvoice) {
                    resultTags.push({ tag: '62', value: this.formatTLV('01', cleanInvoice) });
                }
                if (hasPositiveAmount) {
                    resultTags.push({ tag: '99', value: tag99Value });
                }

                const bodyWithoutCrc = resultTags.map(t => this.formatTLV(t.tag, t.value)).join('') + '6304';
                return bodyWithoutCrc + this.crc16(bodyWithoutCrc);
            },

            renderInstantQRDataURL(payloadText, sizePx = 420, marginModules = 1, ecLevel = 'H') {
                const clean = String(payloadText || '').trim();
                if (!clean) return '';
                const key = `${clean}__${sizePx}__${marginModules}__${ecLevel}`;
                if (this._qrCache.has(key)) return this._qrCache.get(key);

                try {
                    if (typeof window.qrcode === 'function') {
                        const qr = window.qrcode(0, ecLevel);
                        qr.addData(clean);
                        qr.make();
                        const count = qr.getModuleCount();
                        const total = count + marginModules * 2;
                        const canvas = document.createElement('canvas');
                        canvas.width = sizePx;
                        canvas.height = sizePx;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(0, 0, sizePx, sizePx);
                        const scale = sizePx / total;
                        ctx.fillStyle = '#000000';
                        for (let r = 0; r < count; r++) {
                            for (let c = 0; c < count; c++) {
                                if (qr.isDark(r, c)) {
                                    const x = Math.floor((c + marginModules) * scale);
                                    const y = Math.floor((r + marginModules) * scale);
                                    const w = Math.ceil((c + marginModules + 1) * scale) - x;
                                    const h = Math.ceil((r + marginModules + 1) * scale) - y;
                                    ctx.fillRect(x, y, w, h);
                                }
                            }
                        }
                        const dataUrl = canvas.toDataURL('image/png');
                        if (this._qrCache.size > 100) {
                            this._qrCache.delete(this._qrCache.keys().next().value);
                        }
                        this._qrCache.set(key, dataUrl);
                        return dataUrl;
                    }
                } catch (e) {}
                return '';
            }
        };

        // ====================================================================
        // 3. HARDWARE IDENTITY (SUPPORTS ?deviceId=... URL ASSIGNMENT), GPS & SOUND
        // ====================================================================
        const getOrCreateDisplayDeviceId = () => {
            const storageKey = 'solaris_khqr_display_device_id';
            try {
                // 1. Prioritize Admin-Assigned ?deviceId=... from URL & persist it locally
                const params = new URLSearchParams(window.location.search);
                const rawUrlDeviceId = (params.get('deviceId') || '').trim().toUpperCase();
                if (rawUrlDeviceId) {
                    const sanitizedUrlId = rawUrlDeviceId.replace(/[^A-Z0-9\-_]/g, '').slice(0, 40);
                    if (sanitizedUrlId) {
                        try { localStorage.setItem(storageKey, sanitizedUrlId); } catch (e) {}
                        return sanitizedUrlId;
                    }
                }

                // 2. Fallback to previously assigned / generated device ID in localStorage
                const existing = (localStorage.getItem(storageKey) || '').trim().toUpperCase();
                if (existing) return existing;

                // 3. Generate a fresh unique SLR-DEV-XXXXXX ID if none exists
                const randomHex = Array.from({ length: 6 }, () => '0123456789ABCDEF'[Math.floor(Math.random() * 16)]).join('');
                const created = `SLR-DEV-${randomHex}`;
                localStorage.setItem(storageKey, created);
                return created;
            } catch (e) {
                return 'SLR-DEV-TEMP01';
            }
        };

        const detectDeviceModelSummary = () => {
            const ua = navigator.userAgent || '';
            const w = window.screen?.width || window.innerWidth;
            const h = window.screen?.height || window.innerHeight;
            let platform = 'Counter Display';
            if (/iPad/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) platform = 'iPad Display';
            else if (/iPhone/i.test(ua)) platform = 'iPhone Display';
            else if (/Android/i.test(ua)) platform = 'Android Display';
            else if (/Windows/i.test(ua)) platform = 'Windows Display';
            else if (/Macintosh/i.test(ua)) platform = 'Mac Display';
            return `${platform} (${w}×${h})`;
        };

        const calculateHaversineDistance = (lat1, lon1, lat2, lon2) => {
            const R = 6371;
            const dLat = (lat2 - lat1) * (Math.PI / 180);
            const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        };

        let sharedAudioCtx = null;
        const warmUpAudioContext = () => {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                if (!sharedAudioCtx) sharedAudioCtx = new AudioCtx();
                if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume().catch(() => {});
            } catch (e) {}
        };
        window.addEventListener('pointerdown', warmUpAudioContext, { once: true, passive: true });

        const playDisplaySound = (type = 'item', isMuted = false) => {
            if (isMuted) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                if (!sharedAudioCtx) {
                    sharedAudioCtx = new AudioCtx();
                }
                if (sharedAudioCtx.state === 'suspended') {
                    sharedAudioCtx.resume().catch(() => {});
                }
                const ctx = sharedAudioCtx;
                const now = ctx.currentTime;
                const playTone = (freq, start, dur, gainVal = 0.1) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + start);
                    gain.gain.setValueAtTime(gainVal, now + start);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + start + dur);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + start);
                    osc.stop(now + start + dur);
                };
                if (type === 'paid') {
                    playTone(880, 0, 0.16, 0.16);
                    playTone(1174.66, 0.13, 0.35, 0.18);
                } else if (type === 'qr') {
                    playTone(659.25, 0, 0.11, 0.12);
                    playTone(880, 0.09, 0.2, 0.12);
                } else {
                    playTone(1046.5, 0, 0.06, 0.05);
                }
            } catch (e) {}
        };

        // ====================================================================
        // 3B. BILL PAYMENT VOICE ANNOUNCEMENT ENGINE (KHMER DEFAULT / ENGLISH)
        // ====================================================================
        const PaymentVoiceAnnouncer = {
            _audioEl: null,
            _voicesReady: false,
            _audioUnlocked: false,
            _playbackToken: 0,
            _onAutoplayBlocked: null,

            _ensureAudioEl() {
                if (!this._audioEl) {
                    const el = new Audio();
                    el.preload = 'auto';
                    // NOTE: Do NOT set el.crossOrigin = 'anonymous' — Google TTS does not send CORS headers
                    this._audioEl = el;
                }
                return this._audioEl;
            },

            unlockAudio() {
                if (this._audioUnlocked) return;
                this._audioUnlocked = true;
                try {
                    const el = this._ensureAudioEl();
                    el.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
                    const p = el.play();
                    if (p && typeof p.then === 'function') {
                        p.then(() => {
                            el.pause();
                            el.currentTime = 0;
                        }).catch(() => {
                            this._audioUnlocked = false;
                        });
                    }
                } catch (e) {}
            },

            initVoices() {
                try {
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.getVoices();
                        if (!this._voicesReady) {
                            this._voicesReady = true;
                            window.speechSynthesis.onvoiceschanged = () => {
                                try { window.speechSynthesis.getVoices(); } catch (e) {}
                            };
                        }
                    }
                } catch (e) {}
            },

            stop() {
                this._playbackToken += 1;
                try {
                    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                } catch (e) {}
                try {
                    if (this._audioEl) {
                        this._audioEl.onended = null;
                        this._audioEl.onerror = null;
                        this._audioEl.pause();
                        this._audioEl.currentTime = 0;
                    }
                } catch (e) {}
            },

            resolvePaidAmount(session) {
                if (!session) return { currency: 'KHR', amount: 0 };

                const aba = session.verifiedAbaPayload;
                if (aba && Number(aba.amount) > 0) {
                    return {
                        currency: String(aba.currency || 'KHR').toUpperCase() === 'USD' ? 'USD' : 'KHR',
                        amount: Number(aba.amount)
                    };
                }

                const disp = String(session.amountDisplay || '').trim();
                if (disp) {
                    const isUsdDisp = disp.includes('$') || /USD/i.test(disp);
                    const numeric = parseFloat(disp.replace(/[^0-9.]/g, ''));
                    if (!isNaN(numeric) && numeric > 0) {
                        return { currency: isUsdDisp ? 'USD' : 'KHR', amount: numeric };
                    }
                }

                if (String(session.selectedCurrency || '').toUpperCase() === 'USD' && Number(session.amountUsd) > 0) {
                    return { currency: 'USD', amount: Number(session.amountUsd) };
                }
                return { currency: 'KHR', amount: Math.round(Number(session.amountKhr) || 0) };
            },

            buildAnnouncementText({ currency = 'KHR', amount = 0 }, lang = 'km') {
                const isUsd = String(currency).toUpperCase() === 'USD';
                const num = Number(amount) || 0;

                if (lang === 'en') {
                    if (isUsd) {
                        const fixed = num.toFixed(2);
                        const [dollarsStr, centsStr] = fixed.split('.');
                        const dollars = parseInt(dollarsStr, 10) || 0;
                        const cents = parseInt(centsStr, 10) || 0;
                        let usdText = '';
                        if (dollars > 0 && cents > 0) {
                            usdText = `${dollars} ${dollars === 1 ? 'dollar' : 'dollars'} and ${cents} ${cents === 1 ? 'cent' : 'cents'}`;
                        } else if (dollars > 0) {
                            usdText = `${dollars} ${dollars === 1 ? 'dollar' : 'dollars'}`;
                        } else {
                            usdText = `${cents} ${cents === 1 ? 'cent' : 'cents'}`;
                        }
                        return `Payment received successfully, ${usdText}. Thank you!`;
                    }
                    const khrVal = Math.round(num);
                    return `Payment received successfully, ${khrVal.toLocaleString('en-US')} Riel. Thank you!`;
                }

                if (isUsd) {
                    const fixed = num.toFixed(2);
                    const [dollarsStr, centsStr] = fixed.split('.');
                    const dollars = parseInt(dollarsStr, 10) || 0;
                    const cents = parseInt(centsStr, 10) || 0;
                    let usdTextKm = '';
                    if (dollars > 0 && cents > 0) {
                        usdTextKm = `${dollars} ដុល្លារ ${cents} សេន`;
                    } else if (dollars > 0) {
                        usdTextKm = `${dollars} ដុល្លារ`;
                    } else {
                        usdTextKm = `${cents} សេន`;
                    }
                    return `បានទទួលប្រាក់ចំនួន ${usdTextKm} ដោយជោគជ័យ។ សូមអរគុណ!`;
                }
                const khrVal = Math.round(num);
                return `បានទទួលប្រាក់ចំនួន ${khrVal.toLocaleString('en-US')} រៀល ដោយជោគជ័យ។ សូមអរគុណ!`;
            },

            playCloudTTS(text, langCode = 'km', fallbackAmountObj = null) {
                const token = this._playbackToken;
                const tl = langCode === 'en' ? 'en' : 'km';
                const q = encodeURIComponent(text);

                const urls = [
                    `https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=${tl}&q=${q}`,
                    `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${tl}&q=${q}`
                ];

                const tryUrl = (idx) => {
                    if (token !== this._playbackToken) return;
                    if (idx >= urls.length) {
                        if (langCode !== 'en' && fallbackAmountObj) {
                            const enText = this.buildAnnouncementText(fallbackAmountObj, 'en');
                            this.speakNative(enText, 'en');
                        }
                        return;
                    }

                    try {
                        const audio = this._ensureAudioEl();
                        audio.onended = null;
                        audio.onerror = () => {
                            if (token !== this._playbackToken) return;
                            tryUrl(idx + 1);
                        };
                        audio.src = urls[idx];
                        audio.volume = 1.0;
                        const playPromise = audio.play();
                        if (playPromise && typeof playPromise.catch === 'function') {
                            playPromise.catch((err) => {
                                if (token !== this._playbackToken) return;
                                if (err && err.name === 'NotAllowedError') {
                                    if (typeof this._onAutoplayBlocked === 'function') {
                                        this._onAutoplayBlocked();
                                    }
                                    return;
                                }
                                tryUrl(idx + 1);
                            });
                        }
                    } catch (e) {
                        tryUrl(idx + 1);
                    }
                };

                tryUrl(0);
                return true;
            },

            speakNative(text, lang = 'en') {
                try {
                    if (!('speechSynthesis' in window)) return false;
                    const voices = window.speechSynthesis.getVoices() || [];
                    const isKhmer = lang !== 'en';
                    const matchingVoice = isKhmer
                        ? voices.find(v => /^km/i.test(v.lang) || /khmer|cambodia/i.test(v.name || ''))
                        : (voices.find(v => /^en-US/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang)));

                    if (isKhmer && !matchingVoice) return false;

                    const utter = new SpeechSynthesisUtterance(text);
                    utter.lang = matchingVoice?.lang || (isKhmer ? 'km-KH' : 'en-US');
                    if (matchingVoice) utter.voice = matchingVoice;
                    utter.rate = isKhmer ? 0.96 : 0.98;
                    utter.pitch = 1.0;
                    utter.volume = 1.0;
                    window.speechSynthesis.speak(utter);
                    return true;
                } catch (e) {
                    return false;
                }
            },

            speakText(text, lang = 'km', amountObj = null) {
                if (!text) return;
                this.stop();
                const isKhmer = lang !== 'en';

                if (this.speakNative(text, isKhmer ? 'km' : 'en')) {
                    return;
                }
                this.playCloudTTS(text, isKhmer ? 'km' : 'en', amountObj);
            },

            announcePayment(session, lang = 'km', isMuted = false) {
                if (isMuted) return;
                const amountObj = this.resolvePaidAmount(session);
                if (!amountObj.amount || amountObj.amount <= 0) return;
                const text = this.buildAnnouncementText(amountObj, lang);
                this.speakText(text, lang, amountObj);
            },

            testVoice(lang = 'km') {
                this.unlockAudio();
                const sample = { currency: 'KHR', amount: 10000 };
                const text = this.buildAnnouncementText(sample, lang);
                this.speakText(text, lang, sample);
            }
        };

        // ====================================================================
        // 3C. ALWAYS-ON KEEP-AWAKE ENGINE (NEVER SLEEP / NEVER LOCK SCREEN)
        // ====================================================================
        window.SolarisKeepAwakeManager = {
            wakeLock: null,
            noSleepVideo: null,
            noSleepCanvas: null,
            noSleepDrawTimer: null,
            watchdogTimer: null,
            isActive: false,
            started: false,
            listeners: new Set(),

            subscribe(fn) {
                this.listeners.add(fn);
                try { fn(this.getState()); } catch (e) {}
                return () => this.listeners.delete(fn);
            },

            notify() {
                const state = this.getState();
                this.listeners.forEach(fn => { try { fn(state); } catch (e) {} });
            },

            getState() {
                const hasNativeLock = !!(this.wakeLock && !this.wakeLock.released);
                const hasVideoLock = !!(this.noSleepVideo && !this.noSleepVideo.paused);
                return {
                    isActive: hasNativeLock || hasVideoLock || this.isActive,
                    mode: hasNativeLock ? 'WakeLock' : (hasVideoLock ? 'NoSleep' : 'Standby')
                };
            },

            async requestNativeWakeLock() {
                if (typeof navigator === 'undefined' || !('wakeLock' in navigator)) return false;
                if (document.visibilityState !== 'visible') return false;
                if (this.wakeLock && !this.wakeLock.released) {
                    this.isActive = true;
                    return true;
                }
                try {
                    const sentinel = await navigator.wakeLock.request('screen');
                    this.wakeLock = sentinel;
                    this.isActive = true;
                    sentinel.addEventListener('release', () => {
                        this.wakeLock = null;
                        this.notify();
                        if (document.visibilityState === 'visible') {
                            setTimeout(() => this.requestNativeWakeLock(), 500);
                        }
                    });
                    this.notify();
                    return true;
                } catch (e) {
                    this.notify();
                    return false;
                }
            },

            startNoSleepVideoFallback() {
                try {
                    if (this.noSleepVideo && !this.noSleepVideo.paused) {
                        this.isActive = true;
                        this.notify();
                        return true;
                    }
                    if (!this.noSleepCanvas) {
                        const canvas = document.createElement('canvas');
                        canvas.width = 2;
                        canvas.height = 2;
                        const ctx = canvas.getContext('2d');
                        if (ctx) {
                            ctx.fillStyle = '#020617';
                            ctx.fillRect(0, 0, 2, 2);
                        }
                        this.noSleepCanvas = canvas;
                    }
                    if (!this.noSleepDrawTimer && this.noSleepCanvas) {
                        let toggle = false;
                        this.noSleepDrawTimer = setInterval(() => {
                            const ctx = this.noSleepCanvas.getContext('2d');
                            if (ctx) {
                                toggle = !toggle;
                                ctx.fillStyle = toggle ? '#020617' : '#030712';
                                ctx.fillRect(0, 0, 2, 2);
                            }
                        }, 10000);
                    }
                    if (typeof this.noSleepCanvas.captureStream !== 'function') return false;
                    if (!this.noSleepVideo) {
                        const video = document.createElement('video');
                        video.muted = true;
                        video.loop = true;
                        video.playsInline = true;
                        video.setAttribute('muted', '');
                        video.setAttribute('playsinline', '');
                        video.setAttribute('webkit-playsinline', '');
                        video.style.cssText = 'position:fixed;bottom:0;left:0;width:1px;height:1px;opacity:0.001;pointer-events:none;z-index:-1;';
                        video.srcObject = this.noSleepCanvas.captureStream(1);
                        document.body.appendChild(video);
                        this.noSleepVideo = video;
                    }
                    const playPromise = this.noSleepVideo.play();
                    if (playPromise && typeof playPromise.then === 'function') {
                        playPromise.then(() => {
                            this.isActive = true;
                            this.notify();
                        }).catch(() => {});
                    }
                    return true;
                } catch (e) {
                    return false;
                }
            },

            async engage(fromUserGesture = false) {
                const nativeOk = await this.requestNativeWakeLock();
                if (!nativeOk || fromUserGesture) {
                    this.startNoSleepVideoFallback();
                }
                this.notify();
            },

            start() {
                if (this.started) {
                    this.engage(false);
                    return;
                }
                this.started = true;
                this.engage(false);

                const onGesture = () => this.engage(true);
                const onVisibleOrFocus = () => {
                    if (document.visibilityState === 'visible') {
                        this.engage(false);
                    }
                };

                window.addEventListener('pointerdown', onGesture, { passive: true });
                window.addEventListener('touchstart', onGesture, { passive: true });
                window.addEventListener('keydown', onGesture, { passive: true });
                document.addEventListener('visibilitychange', onVisibleOrFocus);
                window.addEventListener('focus', onVisibleOrFocus);
                window.addEventListener('pageshow', onVisibleOrFocus);

                this.watchdogTimer = setInterval(() => {
                    if (document.visibilityState === 'visible') {
                        const state = this.getState();
                        if (!state.isActive) {
                            this.engage(false);
                        }
                    }
                }, 30000);
            }
        };

                    const hasCoords = shops.some(s => s.latitude && s.longitude);
                    if (hasCoords && navigator.geolocation) {
                        gpsAttemptedRef.current = true;
                        setIsDetectingLocation(true);
                        navigator.geolocation.getCurrentPosition(
                            (pos) => {
                                const { latitude, longitude } = pos.coords;
                                let nearest = null, minDist = Infinity;
                                shops.forEach(s => {
                                    if (s.latitude && s.longitude) {
                                        const d = calculateHaversineDistance(latitude, longitude, parseFloat(s.latitude), parseFloat(s.longitude));
                                        if (d < minDist) { minDist = d; nearest = s; }
                                    }
                                });
                                if (nearest) {
                                    if (minDist <= 1.0) {
                                        setSelectedShopId(nearest.id);
                                        try { localStorage.setItem('solaris_display_shop_id', nearest.id); } catch (e) {}
                                    } else {
                                        setNearestShopOutsideRadius({ shop: nearest, distance: minDist });
                                    }
                                }
                                setIsDetectingLocation(false);
                            },
                            () => setIsDetectingLocation(false),
                            { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
                        );
                    }
                }
            }, [shops, selectedShopId, shopsLoading]);

            const handleDisplayStaffLogin = async (e) => {
                e.preventDefault();
                if (!loginEmail.trim() || !loginPassword) return;
                setLoginLoading(true);
                setLoginError('');
                try {
                    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
                    const cred = await auth.signInWithEmailAndPassword(loginEmail.trim(), loginPassword);
                    setAuthUser(cred.user);
                    setFirestoreAuthError('');
                    setLoginPassword('');
                } catch (err) {
                    setLoginError('Invalid email or password. Please use a valid POS staff/admin login.');
                } finally {
                    setLoginLoading(false);
                }
            };

            const handleSelectBranch = (shopId) => {
                lastAcceptedUpdatedAtRef.current = 0;
                setSelectedShopId(shopId);
                try { localStorage.setItem('solaris_display_shop_id', shopId); } catch (e) {}
            };

            const currentShopObj = useMemo(() => shops.find(s => s.id === selectedShopId) || null, [shops, selectedShopId]);

            // ================================================================
            // CHANNEL 0 & A: 0ms DIRECT WINDOW POSTMESSAGE + BROADCASTCHANNEL + LOCALSTORAGE
            // ================================================================
            useEffect(() => {
                const handleWindowMessage = (ev) => {
                    const msg = ev?.data;
                    if (!msg) return;
                    if (msg.type === 'POS_SHOPS_SYNC' && Array.isArray(msg.shops) && msg.shops.length > 0) {
                        setShops(msg.shops);
                        setShopsLoading(false);
                        try { localStorage.setItem('solaris_cached_shops_list', JSON.stringify(msg.shops)); } catch (e) {}
                    }
                    if (msg.type === 'POS_DISPLAY_SESSION' && msg.payload) {
                        const incomingShopId = msg.payload.shopId;
                        if (!selectedShopId && incomingShopId) {
                            setSelectedShopId(incomingShopId);
                            try { localStorage.setItem('solaris_display_shop_id', incomingShopId); } catch (e) {}
                        }
                        if (!selectedShopId || incomingShopId === selectedShopId) {
                            acceptIncomingSession(msg.payload, '0ms Direct', true);
                        }
                    }
                };
                window.addEventListener('message', handleWindowMessage);

                try {
                    if (window.opener && !window.opener.closed) {
                        window.opener.postMessage({ type: 'REQUEST_POS_SYNC', deviceId, shopId: selectedShopId || '' }, '*');
                    }
                } catch (e) {}

                let displayBus = null;
                if (typeof BroadcastChannel !== 'undefined') {
                    try {
                        displayBus = new BroadcastChannel('solaris_khqr_display_bus');
                        displayBus.onmessage = (ev) => {
                            const msg = ev?.data;
                            if (!msg) return;
                            if (msg.type === 'POS_SHOPS_SYNC' && Array.isArray(msg.shops) && msg.shops.length > 0) {
                                setShops(msg.shops);
                                setShopsLoading(false);
                                try { localStorage.setItem('solaris_cached_shops_list', JSON.stringify(msg.shops)); } catch (e) {}
                            }
                            if (msg.type === 'POS_DISPLAY_SESSION' && msg.payload) {
                                const incomingShopId = msg.payload.shopId;
                                if (!selectedShopId && incomingShopId) {
                                    setSelectedShopId(incomingShopId);
                                    try { localStorage.setItem('solaris_display_shop_id', incomingShopId); } catch (e) {}
                                }
                                if (!selectedShopId || incomingShopId === selectedShopId) {
                                    acceptIncomingSession(msg.payload, '0ms Local Bus', true);
                                }
                            }
                        };
                        displayBus.postMessage({ type: 'REQUEST_POS_SYNC', deviceId, shopId: selectedShopId || '' });
                    } catch (e) {}
                }

                const handleStorageEvent = (e) => {
                    if (e.key === 'solaris_cached_shops_list' && e.newValue) {
                        try {
                            const parsed = JSON.parse(e.newValue);
                            if (Array.isArray(parsed) && parsed.length > 0) {
                                setShops(parsed);
                                setShopsLoading(false);
                            }
                        } catch (err) {}
                    }
                    if (selectedShopId && e.key === `solaris_khqr_display_session_${selectedShopId}` && e.newValue) {
                        try {
                            const parsed = JSON.parse(e.newValue);
                            if (parsed) acceptIncomingSession(parsed, '0ms Local Bus', true);
                        } catch (err) {}
                    }
                };
                window.addEventListener('storage', handleStorageEvent);

                return () => {
                    window.removeEventListener('message', handleWindowMessage);
                    if (displayBus) displayBus.close();
                    window.removeEventListener('storage', handleStorageEvent);
                };
            }, [selectedShopId, deviceId, acceptIncomingSession]);

            // ================================================================
            // CHANNEL B: REAL-TIME CLOUD FIRESTORE SYNC (CROSS-DEVICE TABLETS)
            // ================================================================
            useEffect(() => {
                if (!selectedShopId || !authReady) return;
                const unsub = db.collection('system_settings').doc(`khqr_display_${selectedShopId}`).onSnapshot(snap => {
                    if (snap.exists) {
                        const data = snap.data() || {};
                        acceptIncomingSession(data, 'Cloud Live');
                        if (data.shopId && data.shopName) {
                            setShops(prev => {
                                if (prev.some(s => s.id === data.shopId)) return prev;
                                const updated = [...prev, { id: data.shopId, name: data.shopName }];
                                try { localStorage.setItem('solaris_cached_shops_list', JSON.stringify(updated)); } catch (e) {}
                                return updated;
                            });
                        }
                    } else {
                        setSessionData(prev => prev || { status: 'IDLE', shopId: selectedShopId, shopName: urlShopName || undefined });
                    }
                }, err => {
                    if (err?.code === 'permission-denied') {
                        setFirestoreAuthError('PERMISSION_DENIED');
                    }
                });
                return () => unsub();
            }, [selectedShopId, authReady, authUser?.uid, urlShopName, acceptIncomingSession]);

            // ================================================================
            // SECURITY REGISTRY SUBSCRIPTION + 60-SECOND DEVICE HEARTBEAT
            // ================================================================
            useEffect(() => {
                if (!authReady) return;
                const unsub = db.collection('system_settings').doc('khqr_devices_registry').onSnapshot(snap => {
                    if (snap.exists) {
                        const d = snap.data() || {};
                        setRegistryState({
                            devices: d.devices || {},
                            blockedDeviceIds: Array.isArray(d.blockedDeviceIds) ? d.blockedDeviceIds : [],
                            revokedDevices: d.revokedDevices || {}
                        });
                    }
                }, () => {});
                return () => unsub();
            }, [authReady, authUser?.uid]);

            useEffect(() => {
                if (!selectedShopId || !authReady || !authUser) return;
                const sendHeartbeat = () => {
                    const devEntry = registryState.devices?.[deviceId] || {};
                    const isBlocked = (registryState.blockedDeviceIds || []).includes(deviceId) || !!registryState.revokedDevices?.[deviceId];
                    if (devEntry.status === 'REVOKED' || devEntry.remoteLock || isBlocked) return;
                    const shopName = currentShopObj?.name || sessionData?.shopName || urlShopName || 'Paired Branch';
                    db.collection('system_settings').doc('khqr_devices_registry').set({
                        devices: {
                            [deviceId]: {
                                deviceId,
                                shopId: selectedShopId,
                                shopName,
                                deviceModel: detectDeviceModelSummary(),
                                status: 'ONLINE',
                                lastSeenAt: Date.now()
                            }
                        },
                        updatedAt: Date.now()
                    }, { merge: true }).catch(() => {});
                };
                sendHeartbeat();
                const hbTimer = setInterval(sendHeartbeat, 60 * 1000);
                return () => clearInterval(hbTimer);
            }, [selectedShopId, authReady, authUser?.uid, deviceId, currentShopObj?.name]);

            // Evaluate Anti-Theft Lock / Revocation State (Full parity with KHQRDisplaySecurityManager)
            const isDeviceLockedOrRevoked = useMemo(() => {
                const blockedIds = Array.isArray(registryState.blockedDeviceIds) ? registryState.blockedDeviceIds : [];
                const myDev = registryState.devices?.[deviceId];
                const myRevoked = registryState.revokedDevices?.[deviceId];
                const branchRevokedList = Array.isArray(sessionData?.revokedDevices) ? sessionData.revokedDevices : [];
                return !!(
                    blockedIds.includes(deviceId) ||
                    blockedIds.includes('ALL') ||
                    myDev?.status === 'REVOKED' ||
                    myDev?.remoteLock === true ||
                    !!myRevoked ||
                    branchRevokedList.includes(deviceId) ||
                    sessionData?.status === 'REVOKED' ||
                    sessionData?.remoteLock === true
                );
            }, [registryState, deviceId, sessionData]);

            const lockReasonText = useMemo(() => {
                return registryState.devices?.[deviceId]?.lockReason ||
                       registryState.revokedDevices?.[deviceId]?.reason ||
                       sessionData?.lockReason ||
                       'This Customer Display has been remotely locked by an Administrator.';
            }, [registryState, deviceId, sessionData]);

            // Auto-return from PAID Thank You Screen to IDLE after 5.5s (with Voice) or 4.0s (without Voice)
            useEffect(() => {
                if (sessionData?.status === 'PAID') {
                    setPaidDismissedToIdle(false);
                    const dismissMs = (voiceEnabled && !isMuted) ? 5500 : 4000;
                    const timer = setTimeout(() => setPaidDismissedToIdle(true), dismissMs);
                    return () => clearTimeout(timer);
                } else {
                    setPaidDismissedToIdle(false);
                }
            }, [sessionData?.status, sessionData?.paidAt, sessionData?.updatedAt, voiceEnabled, isMuted]);

            const currentStatus = isDeviceLockedOrRevoked
                ? 'REVOKED'
                : (paidDismissedToIdle && sessionData?.status === 'PAID')
                    ? 'IDLE'
                    : (sessionData?.status || 'IDLE');
            const isIdle = currentStatus === 'IDLE';

            // Derived Cart & Shop KHQR Config
            const shopKhqrCfg = currentShopObj?.khqrConfig || {};
            const resolvedShopName = sessionData?.shopName || currentShopObj?.brandingName || currentShopObj?.name || urlShopName || 'POS Terminal';
            const resolvedExchangeRate = Math.max(100, Number(sessionData?.exchangeRate || shopKhqrCfg.exchangeRate || 4000));

            const cartItems = isIdle ? [] : (Array.isArray(sessionData?.items) ? sessionData.items : []);
            const totalItemQty = isIdle ? 0 : (Number(sessionData?.itemCount) || cartItems.reduce((sum, item) => sum + (Number(item.quantity) || 1), 0));
            const subtotalKhr = isIdle ? 0 : (Number(sessionData?.subtotalKhr) || cartItems.reduce((sum, item) => sum + ((Number(item.price) || 0) * (Number(item.quantity) || 1)), 0));
            const discountKhr = isIdle ? 0 : (Number(sessionData?.discountKhr) || 0);
            const amountKhr = isIdle
                ? 0
                : (sessionData?.amountKhr !== undefined && sessionData?.amountKhr !== null
                    ? (Number(sessionData.amountKhr) || 0)
                    : Math.max(0, subtotalKhr - discountKhr));
            const amountUsd = isIdle
                ? '0.00'
                : (Number(sessionData?.amountUsd) > 0
                    ? Number(sessionData.amountUsd).toFixed(2)
                    : (amountKhr / resolvedExchangeRate).toFixed(2));

            const baseEmvPayload = sessionData?.baseEmvPayload || shopKhqrCfg.baseEmvPayload || '';
            const staticQrImage = sessionData?.staticQrImage || shopKhqrCfg.staticQrImage || '';
            const accountName = sessionData?.accountName || shopKhqrCfg.accountName || resolvedShopName || 'MERCHANT';
            const khrAccount = sessionData?.khrAccount || shopKhqrCfg.khrAccount || '';
            const usdAccount = sessionData?.usdAccount || shopKhqrCfg.usdAccount || '';

            const emvInfo = useMemo(() => DisplayKHQREngine.extractMerchantInfoFromEMV(baseEmvPayload), [baseEmvPayload]);
            const displayMid = emvInfo.mid || 'N/A';

            // Audio Chime, Payment Voice Announcement & Instant Auto-Scroll
            useEffect(() => {
                let voiceTimer = null;
                if (currentStatus === 'PAID') {
                    const paidKey = `${sessionData?.paidAt || sessionData?.updatedAt || ''}_${sessionData?.invoiceNo || ''}_${sessionData?.trxId || ''}`;
                    if (prevStatusRef.current !== 'PAID') {
                        playDisplaySound('paid', isMuted);
                    }
                    if (voiceEnabled && !isMuted && paidKey && lastAnnouncedKeyRef.current !== paidKey) {
                        lastAnnouncedKeyRef.current = paidKey;
                        voiceTimer = setTimeout(() => {
                            PaymentVoiceAnnouncer.announcePayment(sessionData, voiceLang, isMuted);
                        }, 260);
                    }
                } else if (currentStatus === 'ACTIVE' && prevStatusRef.current !== 'ACTIVE') {
                    playDisplaySound('qr', isMuted);
                } else if (currentStatus === 'CART' && totalItemQty > prevItemCountRef.current) {
                    playDisplaySound('item', isMuted);
                    cartListEndRef.current?.scrollIntoView({ behavior: 'auto', block: 'end' });
                }
                prevStatusRef.current = currentStatus;
                prevItemCountRef.current = totalItemQty;
                return () => {
                    if (voiceTimer) clearTimeout(voiceTimer);
                };
            }, [currentStatus, totalItemQty, isMuted, voiceEnabled, voiceLang, sessionData]);

            // Dynamic KHQR Image (0ms Client-Side Canvas Render)
            const activeQrImageUrl = useMemo(() => {
                if (currentStatus !== 'ACTIVE') return '';
                const targetAmt = displayCurrency === 'USD' ? Number(amountUsd) : Number(amountKhr);
                const dynamicPayload = DisplayKHQREngine.generateDynamicKHQR(
                    baseEmvPayload,
                    targetAmt,
                    sessionData?.invoiceNo || '',
                    displayCurrency,
                    { createdAtMs: sessionData?.initiatedAt, expiresAtMs: sessionData?.expiresAt }
                );
                if (dynamicPayload) {
                    return DisplayKHQREngine.renderInstantQRDataURL(dynamicPayload, 440, 1, 'H');
                }
                return staticQrImage;
            }, [currentStatus, displayCurrency, amountUsd, amountKhr, baseEmvPayload, staticQrImage, sessionData?.invoiceNo, sessionData?.initiatedAt, sessionData?.expiresAt]);

            // Live KHQR Countdown Timer
            useEffect(() => {
                if (currentStatus !== 'ACTIVE' || !sessionData?.expiresAt) {
                    setRemainingSec(120);
                    return;
                }
                const tick = () => setRemainingSec(Math.max(0, Math.ceil((sessionData.expiresAt - Date.now()) / 1000)));
                tick();
                const timer = setInterval(tick, 1000);
                return () => clearInterval(timer);
            }, [currentStatus, sessionData?.expiresAt]);

            const toggleFullScreen = () => {
                if (!document.fullscreenElement) window.SolarisPWAManager?.enterKioskFullscreen();
                else window.SolarisPWAManager?.exitKioskFullscreen();
            };

            // ================================================================
            // LOCKED / REVOKED ANTI-THEFT SCREEN
            // ================================================================
            if (currentStatus === 'REVOKED') {
                return (
                    <div className="h-screen w-screen bg-red-950 flex items-center justify-center p-6 text-center select-none">
                        <div className="max-w-md w-full bg-slate-950/90 border-2 border-red-500 rounded-3xl p-8 shadow-2xl space-y-4 animate-fade-scale">
                            <div className="w-20 h-20 rounded-full bg-red-600/20 border-2 border-red-500 text-red-400 flex items-center justify-center mx-auto">
                                <i className="fas fa-shield-halved text-4xl"></i>
                            </div>
                            <h1 className="text-2xl font-black text-white uppercase tracking-wide">Display Locked</h1>
                            <p className="text-sm text-red-200 leading-relaxed">{lockReasonText}</p>
                            <div className="bg-slate-900 border border-slate-800 rounded-xl p-3 font-mono text-xs text-slate-400">
                                Device ID: <strong className="text-red-400">{deviceId}</strong>
                            </div>
                            <p className="text-[11px] text-slate-500">
                                Contact an administrator to restore this device from Settings &rarr; KHR Display Security.
                            </p>
                        </div>
                    </div>
                );
            }

            // ================================================================
            // INITIAL BRANCH PAIRING SETUP SCREEN
            // ================================================================
            if (!selectedShopId || showSetupModal || (firestoreAuthError === 'PERMISSION_DENIED' && !sessionData)) {
                return (
                    <div className="h-screen w-screen bg-slate-950 flex items-center justify-center p-4 overflow-y-auto">
                        <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-md w-full p-6 sm:p-7 shadow-2xl space-y-5 animate-fade-scale my-auto">
                            <div className="text-center">
                                <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-600 to-emerald-500 text-white flex items-center justify-center mx-auto mb-3 shadow-lg">
                                    <i className="fas fa-tv text-2xl"></i>
                                </div>
                                <h1 className="text-xl sm:text-2xl font-black text-white">Customer Display Setup</h1>
                                <p className="text-xs text-slate-400 mt-1">Pair this screen with your POS Terminal branch.</p>
                            </div>

                            <div className="bg-slate-950/80 border border-slate-800 rounded-2xl p-3 flex items-center justify-between gap-2 text-xs">
                                <div className="min-w-0">
                                    <span className="text-slate-400 font-semibold block">Hardware Device ID:</span>
                                    {urlDeviceId && (
                                        <span className="text-[10px] text-sky-400 font-bold">
                                            <i className="fas fa-link mr-1"></i>Assigned via Admin Link
                                        </span>
                                    )}
                                </div>
                                <span className="font-mono font-black text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-lg border border-emerald-500/30 shrink-0">
                                    {deviceId}
                                </span>
                            </div>

                            {/* Payment Voice Announcement Settings Card */}
                            <div className="bg-slate-950/80 border border-slate-800 rounded-2xl p-3.5 space-y-2.5">
                                <div className="flex items-center justify-between gap-2">
                                    <div className="flex items-center gap-2">
                                        <span className="w-7 h-7 rounded-lg bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 flex items-center justify-center">
                                            <i className="fas fa-bullhorn text-xs"></i>
                                        </span>
                                        <div>
                                            <div className="text-xs font-black text-white">Payment Voice Announcement</div>
                                            <div className="text-[10px] text-slate-400">Announces received bill amount automatically</div>
                                        </div>
                                    </div>
                                    <button
                                        type="button"
                                        onClick={() => handleToggleVoiceEnabled()}
                                        className={`px-2.5 py-1 rounded-lg text-[10px] font-black uppercase border transition ${
                                            voiceEnabled
                                                ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40'
                                                : 'bg-slate-800 text-slate-400 border-slate-700'
                                        }`}
                                    >
                                        {voiceEnabled ? 'ON' : 'OFF'}
                                    </button>
                                </div>

                                <div className="flex items-center gap-2">
                                    <div className="grid grid-cols-2 gap-1.5 flex-1 bg-slate-900 p-1 rounded-xl border border-slate-800">
                                        <button
                                            type="button"
                                            onClick={() => handleSetVoiceLang('km', false)}
                                            className={`py-1.5 rounded-lg text-[11px] font-black transition ${
                                                voiceLang === 'km'
                                                    ? 'bg-blue-600 text-white shadow'
                                                    : 'text-slate-400 hover:text-white'
                                            }`}
                                        >
                                            🇰🇭 ខ្មែរ (Default)
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => handleSetVoiceLang('en', false)}
                                            className={`py-1.5 rounded-lg text-[11px] font-black transition ${
                                                voiceLang === 'en'
                                                    ? 'bg-blue-600 text-white shadow'
                                                    : 'text-slate-400 hover:text-white'
                                            }`}
                                        >
                                            🇺🇸 English
                                        </button>
                                    </div>
                                    <button
                                        type="button"
                                        onClick={() => handleSetVoiceLang(voiceLang, true)}
                                        className="px-3 py-2 rounded-xl bg-emerald-600/20 hover:bg-emerald-600 text-emerald-300 hover:text-white border border-emerald-500/40 text-[11px] font-black transition flex items-center gap-1.5 shrink-0"
                                        title="Play a test voice announcement"
                                    >
                                        <i className="fas fa-play text-[10px]"></i>
                                        <span>Test</span>
                                    </button>
                                </div>
                            </div>

                            {(firestoreAuthError === 'PERMISSION_DENIED' || (shops.length === 0 && !shopsLoading)) && (
                                <form onSubmit={handleDisplayStaffLogin} className="bg-slate-950/90 border border-amber-500/40 rounded-2xl p-4 space-y-3">
                                    <div className="flex items-start gap-2.5">
                                        <i className="fas fa-shield-halved text-amber-400 mt-0.5"></i>
                                        <div>
                                            <div className="text-xs font-black text-amber-300 uppercase tracking-wider">1-Time Cloud Authorization</div>
                                            <p className="text-[11px] text-slate-400 mt-0.5">Sign in once with your POS account to unlock live cross-device sync.</p>
                                        </div>
                                    </div>
                                    {loginError && (
                                        <div className="p-2 rounded-xl bg-red-500/15 border border-red-500/40 text-red-300 text-[11px] font-bold">
                                            <i className="fas fa-exclamation-circle mr-1"></i>{loginError}
                                        </div>
                                    )}
                                    <div className="space-y-2">
                                        <input type="email" required value={loginEmail} onChange={e => setLoginEmail(e.target.value)} placeholder="POS Staff / Admin Email" className="w-full bg-slate-900 text-white px-3.5 py-2.5 rounded-xl border border-slate-700 focus:border-blue-500 outline-none text-xs font-semibold" />
                                        <input type="password" required value={loginPassword} onChange={e => setLoginPassword(e.target.value)} placeholder="Password" className="w-full bg-slate-900 text-white px-3.5 py-2.5 rounded-xl border border-slate-700 focus:border-blue-500 outline-none text-xs font-semibold" />
                                    </div>
                                    <button type="submit" disabled={loginLoading} className="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs shadow-lg transition flex items-center justify-center gap-2 disabled:opacity-50">
                                        {loginLoading ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-unlock-keyhole"></i>}
                                        <span>{loginLoading ? 'Authorizing...' : 'Sign In & Load Branches'}</span>
                                    </button>
                                </form>
                            )}

                            <div className="space-y-2 max-h-56 overflow-y-auto pr-1">
                                <div className="flex items-center justify-between">
                                    <label className="block text-[11px] font-bold uppercase tracking-wider text-slate-400">
                                        Select Branch ({shops.length})
                                    </label>
                                    {authUser && !authUser.isAnonymous && (
                                        <span className="text-[10px] text-emerald-400 font-semibold truncate max-w-[170px]">
                                            <i className="fas fa-check-circle mr-1"></i>{authUser.email}
                                        </span>
                                    )}
                                </div>

                                {isDetectingLocation ? (
                                    <div className="text-center py-6 text-slate-400 text-xs bg-slate-950/50 rounded-2xl border border-slate-800">
                                        <i className="fas fa-location-crosshairs fa-spin mr-2 text-emerald-400"></i> Detecting nearest branch...
                                    </div>
                                ) : shopsLoading && shops.length === 0 ? (
                                    <div className="text-center py-6 text-slate-400 text-xs bg-slate-950/50 rounded-2xl border border-slate-800">
                                        <i className="fas fa-spinner fa-spin mr-2 text-blue-400"></i> Connecting to cloud branches...
                                    </div>
                                ) : shops.length > 0 ? (
                                    <>
                                        {nearestShopOutsideRadius && (
                                            <div className="bg-emerald-500/10 border border-emerald-500/40 rounded-2xl p-3 space-y-2 mb-2">
                                                <div className="text-xs text-emerald-200">
                                                    Nearest branch: <strong>{nearestShopOutsideRadius.shop.name}</strong> ({nearestShopOutsideRadius.distance.toFixed(1)} km away)
                                                </div>
                                                <button type="button" onClick={() => handleSelectBranch(nearestShopOutsideRadius.shop.id)} className="w-full py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs">
                                                    Pair with {nearestShopOutsideRadius.shop.name}
                                                </button>
                                            </div>
