                                                    <span className="text-sm font-black text-[#004861]">{amountKhr.toLocaleString()} ៛</span>
                                                    <span className="text-stone-300">•</span>
                                                    <span className="text-xs font-bold text-[#26A9C8]">≈ ${amountUsd}</span>
                                                </>
                                            ) : (
                                                <>
                                                    <span className="text-sm font-black text-[#26A9C8]">${amountUsd}</span>
                                                    <span className="text-stone-300">•</span>
                                                    <span className="text-xs font-bold text-[#004861]">≈ {amountKhr.toLocaleString()} ៛</span>
                                                </>
                                            )}
                                        </div>

                                        <div className="relative p-3.5 my-0.5 flex items-center justify-center">
                                            <div className="w-7 h-7 border-t-[3px] border-l-[3px] border-stone-300 rounded-tl-xl absolute top-0 left-0 pointer-events-none"></div>
                                            <div className="w-7 h-7 border-t-[3px] border-r-[3px] border-stone-300 rounded-tr-xl absolute top-0 right-0 pointer-events-none"></div>
                                            <div className="w-7 h-7 border-b-[3px] border-l-[3px] border-stone-300 rounded-bl-xl absolute bottom-0 left-0 pointer-events-none"></div>
                                            <div className="w-7 h-7 border-b-[3px] border-r-[3px] border-stone-300 rounded-br-xl absolute bottom-0 right-0 pointer-events-none"></div>

                                            <div className="relative w-48 h-48 sm:w-56 sm:h-56 flex items-center justify-center bg-white">
                                                {activeQrImageUrl ? (
                                                    <>
                                                        <img src={activeQrImageUrl} alt="ABA KHQR Code" className="w-48 h-48 sm:w-56 sm:h-56 object-contain" />
                                                        {baseEmvPayload && (
                                                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                                                <div className="w-10 h-10 rounded-full bg-white p-[2.5px] shadow-md flex items-center justify-center">
                                                                    <div className="w-full h-full rounded-full bg-[#E1232E] flex items-center justify-center">
                                                                        <svg viewBox="0 0 36 36" className="w-5 h-5 text-white">
                                                                            <rect x="9.5" y="9.5" width="17" height="17" rx="1.5" fill="none" stroke="currentColor" strokeWidth="2.2" />
                                                                            <rect x="9.5" y="9.5" width="17" height="17" rx="1.5" fill="none" stroke="currentColor" strokeWidth="2.2" transform="rotate(45 18 18)" />
                                                                            <path d="M20.5 14.8 A 4.2 4.2 0 1 0 20.5 21.2" fill="none" stroke="currentColor" strokeWidth="2.3" strokeLinecap="round" />
                                                                        </svg>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        )}
                                                    </>
                                                ) : (
                                                    <div className="w-48 h-48 rounded-xl border-2 border-dashed border-stone-300 flex flex-col items-center justify-center text-stone-400 p-4 text-center text-xs">
                                                        <i className="fas fa-qrcode text-3xl mb-2 opacity-40"></i>
                                                        <span>KHQR Not Configured for Branch</span>
                                                    </div>
                                                )}
                                            </div>
                                        </div>

                                        <div className="mt-2 text-center z-10">
                                            <div className="text-[15px] font-extrabold text-stone-800 tracking-wide uppercase leading-snug">
                                                {String(accountName).toUpperCase()}
                                            </div>
                                            <div className="text-[10.5px] font-bold text-stone-500 mt-0.5 tracking-wider">MID: {displayMid}</div>
                                            {(khrAccount || usdAccount) && (
                                                <div className="text-[10px] font-mono font-bold text-stone-400 mt-0.5">
                                                    {displayCurrency === 'USD' ? `USD: ${usdAccount || 'N/A'}` : `KHR: ${khrAccount || 'N/A'}`}
                                                </div>
                                            )}
                                        </div>

                                        <div className="w-full mt-4 pt-2.5 flex items-end justify-start gap-3 z-10 pr-10 border-t border-stone-100">
                                            <div className="flex flex-col items-start pr-3 border-r border-stone-300">
                                                <span className="text-[7.5px] italic text-stone-500 leading-none mb-0.5">Member of</span>
                                                <span className="text-[13px] font-black tracking-wider text-[#E1232E] leading-none">KHQR</span>
                                            </div>
                                            <div className="flex flex-col items-start">
                                                <span className="text-[7.5px] italic text-stone-500 leading-none mb-0.5">Accepted here</span>
                                                <div className="flex items-center gap-1">
                                                    <div className="h-[17px] px-1.5 rounded-[3px] bg-[#26A9C8] text-white flex items-center justify-center text-[6.5px] font-black tracking-wider">ABA PAY</div>
                                                    <div className="h-[17px] px-1.5 rounded-[3px] bg-white border border-stone-200 flex items-center justify-center text-[6.5px] font-black italic text-[#1A1F71]">all banks</div>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="absolute -bottom-8 -right-8 w-24 h-24 pointer-events-none z-0">
                                            <div className="w-full h-full rounded-[22px] border-[12px] border-[#D9232E] transform rotate-[18deg] flex items-center justify-center">
                                                <div className="w-10 h-10 rounded-[10px] bg-[#D9232E]"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* STATE 3: CELEBRATORY PAID / THANK YOU SCREEN */}
                        {currentStatus === 'PAID' && (
                            <div className="flex-1 flex items-center justify-center p-4 sm:p-6 animate-fade-scale">
                                <div className="bg-white text-slate-900 rounded-[2.2rem] max-w-md w-full p-6 sm:p-8 shadow-[0_25px_80px_rgba(16,185,129,0.45)] border-4 border-emerald-400 text-center relative overflow-hidden">
                                    <div className="relative w-24 h-24 mx-auto mb-4 flex items-center justify-center">
                                        <div className="absolute inset-0 rounded-full bg-emerald-400/25 animate-ping"></div>
                                        <div className="relative w-20 h-20 rounded-full bg-gradient-to-br from-emerald-400 to-emerald-600 text-white flex items-center justify-center shadow-lg border-4 border-white">
                                            <i className="fas fa-check text-4xl"></i>
                                        </div>
                                    </div>
                                    <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-black uppercase tracking-widest mb-2">
                                        <i className="fas fa-shield-check"></i>
                                        <span>Payment Verified</span>
                                    </div>
                                    <h2 className="text-3xl sm:text-4xl font-black text-slate-900 tracking-tight">Thank You! 🙏✨</h2>
                                    <p className="text-sm font-black text-amber-600 mt-1">សូមអរគុណចំពោះការគាំទ្រ!</p>

                                    <div className="mt-5 bg-slate-50 rounded-2xl p-4 border border-slate-200 text-left space-y-2.5 text-xs sm:text-sm">
                                        <div className="flex justify-between items-center border-b border-slate-200 pb-2.5">
                                            <span className="font-bold text-slate-400 uppercase text-[11px]">Amount Paid</span>
                                            <span className="text-2xl font-black text-emerald-600 font-mono">
                                                {sessionData?.amountDisplay || `៛${amountKhr.toLocaleString()}`}
                                            </span>
                                        </div>
                                        {sessionData?.payerDisplay && (
                                            <div className="flex justify-between items-center">
                                                <span className="text-slate-500 font-semibold">Paid By</span>
                                                <span className="font-black text-slate-900 truncate max-w-[210px]">{sessionData.payerDisplay}</span>
                                            </div>
                                        )}
                                        {sessionData?.invoiceNo && (
                                            <div className="flex justify-between items-center">
                                                <span className="text-slate-500 font-semibold">Invoice No.</span>
                                                <span className="font-mono font-bold text-slate-800">{sessionData.invoiceNo}</span>
                                            </div>
                                        )}
                                        {sessionData?.apv && (
                                            <div className="flex justify-between items-center">
                                                <span className="text-slate-500 font-semibold">ABA APV</span>
                                                <span className="font-mono font-black text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded">{sessionData.apv}</span>
                                            </div>
                                        )}
                                    </div>

                                    <button
                                        type="button"
                                        onClick={() => PaymentVoiceAnnouncer.announcePayment(sessionData, voiceLang, false)}
                                        className="mt-4 inline-flex items-center gap-2 px-4 py-2 rounded-full bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 text-xs font-black transition active:scale-95"
                                        title="Replay spoken payment announcement"
                                    >
                                        <i className="fas fa-volume-high text-emerald-600"></i>
                                        <span>{voiceLang === 'km' ? 'ស្តាប់ម្តងទៀត (ខ្មែរ)' : 'Replay Voice (EN)'}</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* STATE 4: IDLE / WELCOME SCREEN */}
                        {currentStatus === 'IDLE' && (
                            <div className="flex-1 flex flex-col items-center justify-center p-6 text-center relative overflow-hidden animate-fade-scale">
                                <div className="absolute -top-32 -left-32 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
                                <div className="absolute -bottom-32 -right-32 w-96 h-96 bg-emerald-600/10 rounded-full blur-3xl pointer-events-none"></div>

                                <div className="w-24 h-24 sm:w-28 sm:h-28 rounded-[2rem] bg-gradient-to-br from-blue-600 via-indigo-700 to-slate-900 border-2 border-blue-400/40 shadow-2xl flex flex-col items-center justify-center mb-6">
                                    <i className="fas fa-store text-3xl sm:text-4xl text-white mb-1"></i>
                                    <span className="text-[9px] font-black uppercase tracking-widest text-emerald-300">WELCOME</span>
                                </div>

                                <h2 className="text-3xl sm:text-5xl font-black text-white tracking-tight mb-2">{resolvedShopName}</h2>
                                <p className="text-base sm:text-xl font-bold text-amber-400 mb-2">សូមស្វាគមន៍មកកាន់ហាងយើងខ្ញុំ 🙏</p>
                                <p className="text-xs sm:text-sm text-slate-400 max-w-md leading-relaxed">
                                    Your order items and dynamic ABA KHQR payment code will appear on this screen automatically as the cashier rings up your ticket.
                                </p>

                                <div className="mt-8 flex flex-wrap items-center justify-center gap-3">
                                    <div className="px-4 py-2.5 rounded-2xl bg-slate-900/90 border border-slate-800 flex items-center gap-2.5 text-xs font-bold text-slate-300">
                                        <i className="fas fa-shopping-basket text-blue-400"></i>
                                        <span>Live Order Itemization</span>
                                    </div>
                                    <div className="px-4 py-2.5 rounded-2xl bg-slate-900/90 border border-slate-800 flex items-center gap-2.5 text-xs font-bold text-slate-300">
                                        <i className="fas fa-qrcode text-red-400"></i>
                                        <span>Instant ABA KHQR Checkout</span>
                                    </div>
                                    <div className="px-4 py-2.5 rounded-2xl bg-slate-900/90 border border-slate-800 flex items-center gap-2.5 text-xs font-bold text-slate-300">
                                        <i className="fas fa-crown text-amber-400"></i>
                                        <span>Loyalty Points Rewards</span>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CustomerDisplayApp />);
    </script>
</body>
</html>
